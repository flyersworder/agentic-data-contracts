name: CI and Publish to PyPI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      run_publish:
        description: 'Set to true to run the publish job'
        required: false
        default: 'false'

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      # Not a lint step: `--frozen` fails if uv.lock has drifted from pyproject.
      - run: uv sync --all-extras --dev --frozen
      # Run the hooks themselves instead of re-invoking ruff and ty, so the revs
      # in .pre-commit-config.yaml are the single source of truth for which tool
      # versions run. A version named here too would be a copy Dependabot cannot
      # see, and it would silently drift from the hook on the next bump.
      - run: uvx prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev --frozen
      - run: uv run pytest --cov=agentic_data_contracts --cov-report=term-missing

  examples:
    # The examples are executable documentation, and until now nothing ran them:
    # a rename that compiles and keeps the suite green can still leave every
    # example broken. The v0.39.0 renderer rename touched
    # examples/revenue_agent/agent.py and no test would have caught a miss.
    # They run offline in demo mode — no API key, no network, ~30s total.
    #
    # Exiting zero proves nothing: a broken example can exit zero while
    # printing nothing. Marker greps were the first answer and they under-fit —
    # the three examples print 27 sections and the greps asserted 5, so the
    # v0.46.0 walk re-orientation left growth_agent's identity section printing
    # `{"edges": []}` under a heading promising a decomposition, and this job
    # stayed green. Per-section markers do not scale: 27 strings to choose and
    # maintain, one forgotten marker per new section.
    #
    # So the whole stdout is diffed against a committed golden file instead.
    # That is O(1) to maintain — a new section is covered the moment the file
    # is regenerated — and the diff lands in the PR, where a section that
    # stopped printing is visible to a reviewer rather than only to CI.
    # Regenerate with scripts/regen_examples.sh and commit the result.
    #
    # The bargain is that examples must print deterministically. A demo query
    # that returns rows needs an ORDER BY — GROUP BY alone guarantees no row
    # order, and all three examples were relying on it before this job started
    # diffing them. Two lines are scrubbed because they move on their own: the
    # sample-database creation notice (printed only when the gitignored .duckdb
    # is absent, as on a fresh checkout, and carrying a machine path) and
    # `age_days` (measured against today's date). Scrub nothing else — anything
    # else that moves is a real diff.
    #
    # Output is redirected to a file rather than piped: a pipeline would mask
    # the interpreter's exit status behind the next command's.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      - run: uv sync --all-extras --dev --frozen
      - name: examples print their documented output
        run: |
          for d in revenue_agent growth_agent ops_agent; do
            uv run python "examples/$d/agent.py" > out.txt
            sed -E -e '/^Sample database created at /d' \
                   -e 's/age_days=[0-9]+/age_days=N/' out.txt > got.txt
            diff -u "examples/$d/expected_output.txt" got.txt
          done
      - name: schema-drift preflight prints its documented report
        # Diffed, not grepped, for the same reason as the examples above: a
        # report that quietly stopped naming a finding would keep every marker
        # satisfied. Exits non-zero on drift, and this contract is clean, so a
        # failure here is either real drift in the sample database or a
        # regression in the check.
        run: |
          uv run python examples/revenue_agent/check_drift.py > drift.txt
          diff -u examples/revenue_agent/expected_drift_output.txt drift.txt
      - name: verified-examples corpus validation + answer checks
        run: |
          uv run python examples/revenue_agent/verify_examples.py > out.txt
          grep -q 'Example validation:' out.txt
          # The second pass is the half that executes SQL, so assert it ran AND
          # that both failure statuses still surface — a silently-empty answer
          # report would otherwise leave this job green.
          grep -q 'Answer checks:' out.txt
          # All three statuses, not just the failures: without the MATCH check a
          # certified answer that silently went stale would flip its row from
          # match to mismatch and this job would stay green, since 'MISMATCH' is
          # still present. The trailing space anchors the status column, because
          # 'MATCH' is a substring of 'MISMATCH'.
          grep -q '\[MATCH ' out.txt
          grep -q 'MISMATCH' out.txt
          grep -q 'UNASSERTABLE' out.txt
          # The corpus's first entry, revenue-by-region, is a breakdown — the
          # shape v0.47.0 made assertable. Its label is printed unconditionally
          # in pass 1 (the validation listing), so a plain grep for the label
          # would pass whether or not the breakdown was ever certified or
          # still matches. Anchor on the ANSWER-CHECK line instead — '[MATCH'
          # with the trailing padding, same 'MATCH is a substring of MISMATCH'
          # discipline as above — so the gate actually states that this row's
          # certified breakdown still matches, not just that its label exists
          # somewhere in the output.
          grep -qE '\[MATCH +\] revenue-by-region' out.txt

  test-pydantic-ai-latest:
    # Early-warning job. pyproject allows pydantic-ai-slim >=2.0 (unbounded), and
    # Pydantic AI's version policy only guarantees ~3 months between breaking majors.
    # The `test` job above runs against the locked v2.0; this runs the adapter suite
    # against the newest release allowed by the floor (the next 2.x, and the next
    # major once it ships) so an upstream break surfaces here rather than in a user's
    # install. Intentionally NOT a release gate (omitted from publish.needs).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      # --isolated forces a fresh resolve (ignoring the locked v2.0); --with pins
      # only the floor, so uv resolves the newest compatible release. Only the
      # extras the adapter suite needs are installed.
      - run: >-
          uv run --isolated --python 3.13
          --with 'pydantic-ai-slim[anthropic]>=2.0'
          --extra pydantic-ai --extra duckdb --extra dev
          pytest tests/test_tools/test_pydantic_ai.py -v

  test-lowest-floors:
    # The `test` jobs run `--frozen`, so they only exercise the *locked*
    # versions -- a dependency floor in pyproject can be wrong for months with no
    # job noticing. This resolves every direct dependency to its declared
    # minimum and runs the full suite against that. It exists because
    # `sqlglot>=23.0` was untrue: the operation blocklist maps AST nodes
    # (`exp.Revoke` and friends) that only appear in 27.10+, and because the map
    # is built at import time the wrong floor did not degrade a feature, it
    # raised AttributeError on import.
    #
    # Matrixed over BOTH supported Pythons, not just 3.12. A floor can be
    # satisfiable on one interpreter and not the other: duckdb 1.1.0 ships no
    # cp313 wheel (1.1.1 is the first), so a 3.12-only job would have certified
    # a floor that falls back to a from-source C++ build on 3.13 -- the same
    # class of bug this job exists to catch, hidden by the job's own scope.
    #
    # Extras included are the ones the suite exercises. bigquery, snowflake and
    # postgres are omitted on purpose: there is no adapter code for them (grep
    # finds no import of those drivers anywhere in src/) -- they are install
    # conveniences for users writing their own DatabaseAdapter, so their floors
    # cannot break this package and there is nothing to assert.
    #
    # Not a release gate (omitted from publish.needs), matching
    # test-pydantic-ai-latest: a floor break should be loud, but it should not
    # block shipping a fix for something else.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      # Import first: the failure this job guards happens at import time, and a
      # bare ImportError reads far more clearly here than inside a pytest
      # collection stack trace.
      - run: >-
          uv run --isolated --resolution lowest-direct
          --python ${{ matrix.python-version }}
          python -c "import agentic_data_contracts"
      # Resolution alone is not enough: uv resolves the project *universally*,
      # so a transitive requirement can float a package above its own declared
      # floor and the floor is never exercised. `pydantic>=2.0` sat untrue for
      # the life of the project that way. This pins each declared floor to `==`
      # and asks whether it resolves with wheels only -- catching floors that
      # would force a source build (duckdb 1.1.0 had no cp313 wheel;
      # google-cloud-bigquery 3.0.0 drags in a pyarrow with none).
      - run: >-
          uv run --isolated --no-project
          --python ${{ matrix.python-version }}
          python scripts/check_floor_wheels.py
      # `--extra dev` rather than `--with pytest --with pytest-asyncio`: those
      # are unbounded, so uv warns on every run, and the runner version is then
      # decided by the dev extra's floors participating in the universal resolve
      # -- governed by an extra the job never installed. Using it directly also
      # floor-tests `dev` itself.
      - run: >-
          uv run --isolated --resolution lowest-direct
          --python ${{ matrix.python-version }}
          --extra duckdb --extra agent-sdk --extra agent-contracts
          --extra langchain --extra pydantic-ai --extra dev
          pytest -q

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx uv-secure uv.lock

  publish:
    needs: [lint, test, examples, security]
    # Data-only releases (e.g. `dabstep-eval-*`) must not publish the package.
    if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build --no-sources
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
