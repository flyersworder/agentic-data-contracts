          - paragraph [ref=f3e572]:
            - text: All submissions are initially added to the
            - strong [ref=f3e573]: Unvalidated Leaderboard
            - text: . The Adyen/Hugging Face team will attempt, with the participation of the respective submission team, to validate any entries that rank within the top 10.
          - paragraph [ref=f3e574]:
            - strong [ref=f3e575]: Validation
            - text: confirms that a submission's results were achieved using a novel approach involving data analysis agents.
          - heading "Notice Regarding Validations" [level=2] [ref=f3e576]
          - paragraph [ref=f3e577]:
            - strong [ref=f3e578]: Validation requests are closed.
            - text: With DABStep-v2 launching in the coming weeks, we are no longer accepting new validation requests. The Validated Leaderboard is now closed to new entries; previously validated submissions remain as-is.
          - paragraph [ref=f3e579]: The Unvalidated Leaderboard remains open — you can still submit and receive a score.
          - paragraph [ref=f3e580]: Thank you to everyone who has contributed to DABStep so far. We're excited for the next phase of this benchmark and will share more details on v2 soon.
