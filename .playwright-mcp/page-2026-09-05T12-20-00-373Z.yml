            - generic [ref=f3e596]:
              - heading "Submissions" [level=2] [ref=f3e597]
              - paragraph [ref=f3e598]: Scores are expressed as the percentage of correct answers.
              - paragraph [ref=f3e599]: Each question calls for an answer that is either a string (one or a few words), a number, or a comma separated list of strings or floats, unless specified otherwise. There is only one correct answer. Hence, evaluation is done via quasi exact match between a model’s answer and the ground truth (up to some normalization that is tied to the “type” of the ground truth).
              - paragraph [ref=f3e600]:
                - text: "We expect submissions to be json-line files with the following format. Mandatory fields are:"
                - code [ref=f3e601]: task_id
                - text: and
                - code [ref=f3e602]: agent_answer
                - text: . However,
                - code [ref=f3e603]: reasoning_trace
                - text: "is optional:"
              - code [ref=f3e606]: "{\"task_id\": \"task_id_1\", \"agent_answer\": \"Answer 1 from your agent\", \"reasoning_trace\": \"The different steps by which your model reached answer 1\"} {\"task_id\": \"task_id_2\", \"agent_answer\": \"Answer 2 from your agent\", \"reasoning_trace\": \"The different steps by which your model reached answer 2\"}"
              - paragraph [ref=f3e607]:
                - text: Our scoring function can be found
                - link "here" [ref=f3e608] [cursor=pointer]:
                  - /url: https://huggingface.co/spaces/adyen/data-agents-benchmark/blob/main/dabstep_benchmark/evaluation/scorer.py
