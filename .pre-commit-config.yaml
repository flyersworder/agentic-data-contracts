repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The rev pins both the ty version and a compatible uv version. The hook runs
  # `uv check` under the hood, so this project's own dependencies resolve for ty
  # -- a `language: system` hook calling `ty check` cannot see them, and needs
  # `unresolved-import = "ignore"` to stay quiet.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.73
    hooks:
      - id: ty

  # `file.py:NNN` references in comments go stale silently and, unlike a vague
  # comment, still read as precise -- a reader who follows one lands on
  # unrelated code and has to work out whether the comment or the code is
  # wrong. A 2026-07 sweep found 7 of 11 such references pointing somewhere
  # else entirely (`run_query` had drifted ~630 -> ~790). Name the symbol
  # instead: it either resolves or visibly doesn't.
  #
  # `language: pygrep` inverts the usual logic -- the hook FAILS when `entry`
  # matches. It is built into pre-commit, so there is no version to pin and no
  # dependency added. There is no inline escape (no `# noqa` equivalent); if a
  # legitimate match ever appears -- a test asserting a traceback string, say
  # -- add a narrow `exclude:` glob here rather than deleting the hook.
  - repo: local
    hooks:
      - id: no-file-line-refs
        name: no file.py:NNN references (they drift; name the symbol)
        language: pygrep
        entry: '[A-Za-z_][A-Za-z0-9_]*\.py:[0-9]+'
        types: [python]
