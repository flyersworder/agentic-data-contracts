relationships:
  - from: main.payments.merchant
    to: main.merchant_data.merchant
    type: many_to_one
    description: >
      A transaction's merchant characteristics — account type, merchant category
      code and capture delay — live on `merchant_data`. Fee rules select on all
      three (manual 5), so matching a transaction to a fee rule needs this join.

  # No edge is declared from `merchant_data.merchant_category_code` into
  # `merchant_category_codes`. The manual says only that the annex holds "a
  # complete list of MCC" (manual 3); it names no join column, and the loaded
  # table's columns are positional, so any edge would rest on an empirical read
  # of the data rather than on the source documents. The `merchants` domain
  # says where the list lives; finding the column is left to the agent, the
  # same way arms A and B must find it.
  #
  # No relationship is declared between `payments` and `fees`: a transaction is
  # matched to a fee rule by a multi-field predicate with null-means-any
  # semantics, not by an equality edge. See `fee_rule_matches_transaction`.
