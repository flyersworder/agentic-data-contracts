      \ H = Enterprise - Hospitality, F = Platform - Franchise, S = Platform - SaaS,\
      \ O = Other. The categorization is used to provide more targeted support and\
      \ services to merchants. Fee rules select on it through their `account_type`\
      \ list.\nMERCHANT CATEGORY CODE (manual 3). The MCC is a four-digit code assigned\
      \ to a merchant by the card networks (schemes, e.g. Visa, Mastercard) to categorize\
      \ their business type, used for risk assessment, fraud detection and accounting.\
      \ It is typically assigned by the merchant's bank or payment processor and classifies\
      \ merchants into one of over 400 categories, each corresponding to a specific\
      \ industry or business type such as retail, restaurant, hotel or healthcare.\
      \ Examples given by the manual: 5451 (Automated Fuel Dispensers), 5812 (Automotive\
      \ Parts and Accessories Stores), 5521 (Motor Vehicle Dealers - New and Used\
      \ Cars). The first two digits indicate the category and the last two the subcategory.\
      \ The complete list is the annexed `merchant_category_codes` table. The MCC\
      \ can affect a merchant's payment processing rates and fees.\nCAPTURE DELAY.\
      \ `merchant_data.capture_delay` records a merchant's own capture delay; `fees.capture_delay`\
      \ states the band a rule covers, using the vocabulary defined in the `fees`\
