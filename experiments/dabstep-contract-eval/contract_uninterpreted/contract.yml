  - name: cost_optimization
    summary: Manual best practices for minimizing transaction costs (manual 5.1)
    description: "LOCAL ACQUIRING (5.1.1). Route transactions through local acquirers\
      \ \u2014 issuer country equal to acquirer country \u2014 to reduce friction,\
      \ raise conversion and lower cross-border fees.\nCHOOSING THE RIGHT TRANSACTION\
      \ TYPE (5.1.2). Different ACIs carry different fees, and the cheaper option\
      \ may add friction (for example prompting the cardholder for a PIN or signature).\
      \ Consider the type of transaction (POS vs e-commerce), the level of authentication\
      \ required (authentication vs tokenization) and the fees associated with the\
      \ ACI, and balance them.\nPROCESSING WITH HIGHER VOLUMES (5.1.3). The cost per\
      \ unit decreases as volume grows and the pricing curve flattens at higher volumes.\
      \ There is no minimum volume requirement, so economies of scale accrue as volume\
      \ increases. (Qualitative: the manual gives no formula for this curve, and the\
      \ fee rules express volume only as the `monthly_volume` band.)\nMINIMIZING FRAUD-RELATED\
      \ COSTS (5.1.4). Costs rise in direct proportion to the level of fraud detected;\
      \ maintain fraud at the lowest possible level.\nAVOIDING TRANSACTION DOWNGRADES\
      \ (5.1.5). Downgrades push a transaction into a less favourable interchange\
      \ rate tier and so raise processing cost. Common causes: missing or incomplete\
      \ data elements; late settlement; non-qualified transaction types; failure to\
      \ use AVS or 3D Secure for card-not-present transactions; excessive transaction\
      \ size or volume; excessive retrying. Best practices: submit complete data;\
      \ settle within 24 hours; use retry strategies that consider cost and penalties;\
      \ use AVS and 3D Secure for card-not-present transactions; leverage Level 2\
      \ and Level 3 data for B2B transactions; review and update systems regularly;\
