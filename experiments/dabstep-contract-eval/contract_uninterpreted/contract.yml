    summary: Scheme fee rules and how a transaction is matched to a fee (manual 5)
    description: "Payment processing fees depend on characteristics of the merchant\
      \ and of the transaction. Each row of `fees` is one fee rule, with these fields\
      \ (manual 5): ID, the identifier of the rule within the fee ruleset; card_scheme,\
      \ the card scheme or network the fee applies to; account_type, a list of merchant\
      \ account types (manual 2); capture_delay, the number of days allowed between\
      \ authorization and settlement, one of '3-5' (between 3 and 5 days), '>5' (more\
      \ than 5 days is possible), '<3' (before 3 days), 'immediate' or 'manual' \u2014\
      \ the faster the capture to settlement happens, the more expensive it is; monthly_fraud_level,\
      \ the merchant's ratio of monthly volume notified as fraud over monthly total\
      \ volume, expressed as a band such as '7.7%-8.3%' (the ratio should be between\
      \ 7.7 and 8.3 percent) \u2014 processors generally become more expensive as\
      \ the fraud rate increases; monthly_volume, the merchant's monthly total volume\
      \ in euros as a band such as '100k-1m' (between 100,000 and 1,000,000) \u2014\
      \ merchants with higher volume are normally able to get cheaper fees; merchant_category_code,\
      \ a list of the merchant category codes the rule covers (manual 3); is_credit,\
      \ true if the rule applies to credit transactions, which are typically more\
      \ expensive; aci, a list of Authorization Characteristics Indicator values the\
      \ rule covers (manual 4); fixed_amount, a fixed fee in euros per transaction;\
      \ rate, a variable rate to be multiplied by the transaction value and divided\
      \ by 10000; and intracountry, true if the transaction is domestic \u2014 that\
      \ is, the issuer country and the acquiring country are the same \u2014 where\
      \ false marks international transactions, which are typically more expensive.\n\
      The fee is `fee = fixed_amount + rate * transaction_value / 10000`.\nMATCHING\
      \ RULE (manual 5, Notes): if a field of a fee rule is set to null it means the\
      \ rule applies to all possible values of that field \u2014 e.g. a null `aci`\
      \ means the rule applies for every ACI. A fee rule therefore matches a transaction\
      \ when *every* non-null field of the rule agrees with the transaction (or with\
      \ its merchant, or with that merchant's month). The metric `fee_rule_matches_transaction`\
      \ names this predicate; `fee_rule_matches_merchant_month` states the two fields\
      \ (monthly_volume, monthly_fraud_level) that depend on the merchant's month\
      \ rather than on the single transaction.\nMonthly volumes and rates are computed\
      \ always in natural months (e.g. January, February), starting always on day\
      \ 1 and ending on the last natural day of the month (28 for February, 30 or\
      \ 31 otherwise).\nFixed amount and transaction values are given in the same\
      \ currency, typically euros.\nThe manual states the *format* of `capture_delay`,\
      \ `monthly_volume` and `monthly_fraud_level` bands but never says whether a\
      \ value sitting exactly on a shared band boundary belongs to the lower or the\
      \ upper band; it says only \"between A and B\". That gap is in the source material,\
      \ not a decision the manual makes, and the contract answers it in two different\
      \ places because the two do different jobs:\n* `fee_rule_matches_merchant_month`\
      \ \u2014 the AUTHORITY on whether a rule\n  applies \u2014 reads \"between\"\
      \ as inclusive at both ends and does not\n  choose between adjacent bands. A\
      \ monthly volume of exactly 1,000,000\n  satisfies both a '100k-1m' rule and\
      \ a '1m-5m' rule, and both rules\n  match. Nothing forces a choice: a rule either\
      \ matches or it does not,\n  independently of every other rule.\n* `monthly_volume_band`\
      \ and `monthly_fraud_level_band` \u2014 which label a\n  merchant-month with\
      \ a single band \u2014 must return one value, so they\n  break the tie downward,\
      \ toward the lower band: exactly 1,000,000\n  yields '100k-1m', exactly 7.7%\
      \ yields '7.2%-7.7%'. That tie-break is\n  the metric's, not the manual's.\n\
      \nWhere the label and the predicate disagree, the predicate is right. Use the\
      \ label to describe a merchant, never to decide which fee applies.\n"
