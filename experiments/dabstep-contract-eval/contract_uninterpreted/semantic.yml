  - name: description
    type: VARCHAR
    description: Not documented in manual.md or payments-readme.md.
- schema: main
  table: acquirer_countries
  columns:
  - name: column0
    type: BIGINT
    description: Unnamed leading column; not documented in manual.md or payments-readme.md.
  - name: acquirer
    type: VARCHAR
    description: "Not documented in manual.md or payments-readme.md \u2014 schema\
      \ only."
  - name: country_code
