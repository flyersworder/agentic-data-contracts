relationships:
- from: main.payments.merchant
  to: main.merchant_data.merchant
  type: many_to_one
  description: "A transaction's merchant characteristics \u2014 account type, merchant\
    \ category code and capture delay \u2014 live on `merchant_data`. Fee rules select\
    \ on all three (manual 5), so matching a transaction to a fee rule needs this\
    \ join.\n"
