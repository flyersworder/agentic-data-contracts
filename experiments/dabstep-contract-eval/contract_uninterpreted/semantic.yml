# GENERATED by dce/uninterpreted.py from ../contract/ -- do not edit.
# Arm C with its INTERPRETATION clauses removed and the empty-list
# wildcard reverted to the manual's null-only reading.
metrics:
- name: transaction_fee
  description: 'The fee charged for one transaction under one fee rule. The manual
    states it exactly: "The fee then is provided by fee = fixed_amount + rate * transaction_value
    / 10000". `fixed_amount` is in euros per transaction and `rate` is a variable
    rate to be multiplied by the transaction value and divided by 10000. Fixed amount
    and transaction values are given in the same currency, typically euros. The transaction
    value is `payments.eur_amount`. Which rule applies is decided by `fee_rule_matches_transaction`
    together with `fee_rule_matches_merchant_month`.

    '
  sql_expression: f.fixed_amount + f.rate * p.eur_amount / 10000
  source_model: main.fees
  domains:
  - fees
- name: total_transaction_fees
  description: 'Total fees over a set of transactions: the per-transaction fee summed
    after each transaction has been joined to the fee rule that matches it. Use the
    same matching predicates as `transaction_fee`; sum only over matched (transaction,
    rule) pairs.

    '
  sql_expression: SUM(f.fixed_amount + f.rate * p.eur_amount / 10000)
  source_model: main.fees
  domains:
  - fees
- name: fee_rule_matches_transaction
  description: 'True when fee rule `f` applies to transaction `p` of merchant `m`,
    on every field that a single transaction (and its merchant''s static attributes)
    can decide. The manual''s rule is that "if a field is set to null it means that
    it applies to all possible values of that field", so each clause below is satisfied
    either by the field being null or by the field agreeing with the transaction.
    Pair this with `fee_rule_matches_merchant_month`, which covers the two fields
    (monthly_volume, monthly_fraud_level) that depend on the merchant''s natural month
    rather than on the single transaction. A rule applies only when both predicates
    hold.

    '
  sql_expression: "(f.card_scheme IS NULL OR f.card_scheme = p.card_scheme) AND (f.is_credit\
    \ IS NULL OR f.is_credit = p.is_credit) AND (f.aci IS NULL OR list_contains(f.aci,\
    \ p.aci)) AND (f.intracountry IS NULL\n     OR (f.intracountry = 1) = (p.issuing_country\
    \ = p.acquirer_country))\nAND (f.account_type IS NULL\n     OR list_contains(f.account_type,\
    \ m.account_type))\nAND (f.merchant_category_code IS NULL\n     OR list_contains(f.merchant_category_code,\
    \ m.merchant_category_code))\nAND (f.capture_delay IS NULL\n     OR f.capture_delay\
    \ = CASE\n          WHEN m.capture_delay IN ('immediate', 'manual') THEN m.capture_delay\n\
    \          WHEN TRY_CAST(m.capture_delay AS INTEGER) < 3 THEN '<3'\n         \
    \ WHEN TRY_CAST(m.capture_delay AS INTEGER) BETWEEN 3 AND 5 THEN '3-5'\n     \
    \     WHEN TRY_CAST(m.capture_delay AS INTEGER) > 5 THEN '>5'\n        END)\n"
  source_model: main.fees
  domains:
  - fees
- name: fee_rule_matches_merchant_month
  description: "NOT RUNNABLE AS WRITTEN: `:volume` and `:fraud_ratio` are placeholders\
    \ you must textually substitute before executing this SQL \u2014 nothing in the\
    \ contract or the tools binds them, so pasting the expression unchanged into `run_query`\
    \ raises a prepared-statement error. Substitute `:volume` with the merchant's\
    \ `merchant_monthly_volume` for the month in question (a number of euros, or that\
    \ metric's SQL) and `:fraud_ratio` with its `merchant_monthly_fraud_level` (a\
    \ fraction, not a percentage).\nTrue when fee rule `f` applies to a merchant in\
    \ a given natural month, on the two fields that are properties of the month rather\
    \ than of a single transaction: `monthly_volume` and `monthly_fraud_level`. Null\
    \ in either field means the rule applies to all values of it.\nThis is the authority\
    \ on band membership. It reads the manual's \"between A and B\" as inclusive at\
    \ both ends, so a value sitting exactly on a shared boundary \u2014 a volume of\
    \ exactly 1,000,000, a fraud ratio of exactly 7.7% \u2014 satisfies both adjacent\
    \ bands and both rules match. The manual does not resolve that tie, and this predicate\
    \ does not have to: a rule either matches or it does not, independently of every\
    \ other rule. The companion metrics `monthly_volume_band` and `monthly_fraud_level_band`\
    \ must return a single band and therefore do break the tie; where the two disagree,\
    \ this one is correct.\n"
  sql_expression: "(f.monthly_volume IS NULL OR CASE f.monthly_volume\n   WHEN '<100k'\
    \   THEN :volume <  100000\n   WHEN '100k-1m' THEN :volume >= 100000   AND :volume\
    \ <= 1000000\n   WHEN '1m-5m'   THEN :volume >= 1000000  AND :volume <= 5000000\n\
    \   WHEN '>5m'     THEN :volume >  5000000\n END)\nAND (f.monthly_fraud_level\
    \ IS NULL OR CASE f.monthly_fraud_level\n   WHEN '<7.2%'     THEN 100 * :fraud_ratio\
    \ <  7.2\n   WHEN '7.2%-7.7%' THEN 100 * :fraud_ratio >= 7.2 AND 100 * :fraud_ratio\
    \ <= 7.7\n   WHEN '7.7%-8.3%' THEN 100 * :fraud_ratio >= 7.7 AND 100 * :fraud_ratio\
    \ <= 8.3\n   WHEN '>8.3%'     THEN 100 * :fraud_ratio >  8.3\n END)\n"
  source_model: main.fees
  domains:
  - fees
- name: monthly_volume_band
  description: 'NOT RUNNABLE AS WRITTEN: `:volume` is a placeholder you must textually
    substitute with the merchant''s monthly volume in euros before executing this
    SQL; nothing binds it, and running it unchanged raises a prepared-statement error.

    The single `fees.monthly_volume` band a merchant''s monthly total volume falls
    in. The manual defines the band format: "''100k-1m'' is between 100.000 (100k)
    and 1.000.000 (1m). All volumes are specified in euros. Normally merchants with
    higher volume are able to get cheaper fees from payments processors."

    '
  sql_expression: "CASE\n  WHEN :volume <  100000  THEN '<100k'\n  WHEN :volume <=\
    \ 1000000 THEN '100k-1m'\n  WHEN :volume <= 5000000 THEN '1m-5m'\n  ELSE '>5m'\n\
    END\n"
  source_model: main.fees
  domains:
  - fees
- name: monthly_fraud_level_band
  description: "NOT RUNNABLE AS WRITTEN: `:fraud_ratio` is a placeholder you must\
    \ textually substitute with the merchant's monthly fraud ratio \u2014 a fraction,\
    \ not a percentage \u2014 before executing this SQL; nothing binds it, and running\
    \ it unchanged raises a prepared-statement error. It is scaled by 100 below to\
    \ compare against the percentage band.\nThe single `fees.monthly_fraud_level`\
    \ band a merchant's monthly fraud ratio falls in. The manual defines the band\
    \ as a \"ratio between monthly total volume and monthly volume notified as fraud.\
    \ For example '7.7%-8.3%' means that the ratio should be between 7.7 and 8.3 percent.\
    \ Generally, the payment processors will become more expensive as fraud rate increases.\"\
    \n"
  sql_expression: "CASE\n  WHEN 100 * :fraud_ratio <  7.2 THEN '<7.2%'\n  WHEN 100\
    \ * :fraud_ratio <= 7.7 THEN '7.2%-7.7%'\n  WHEN 100 * :fraud_ratio <= 8.3 THEN\
    \ '7.7%-8.3%'\n  ELSE '>8.3%'\nEND\n"
  source_model: main.fees
  domains:
  - fees
- name: capture_delay_band
  description: 'The `fees.capture_delay` band a merchant''s own capture delay falls
    in. The manual defines capture_delay as "rule that specifies the number of days
    in which the capture from authorization to settlement needs to happen. Possible
    values are ''3-5'' (between 3 and 5 days), ''>5'' (more than 5 days is possible),
    ''<3'' (before 3 days), ''immediate'', or ''manual''. The faster the capture to
    settlement happens, the more expensive it is."

    '
  sql_expression: "CASE\n  WHEN m.capture_delay IN ('immediate', 'manual') THEN m.capture_delay\n\
    \  WHEN TRY_CAST(m.capture_delay AS INTEGER) < 3 THEN '<3'\n  WHEN TRY_CAST(m.capture_delay\
    \ AS INTEGER) BETWEEN 3 AND 5 THEN '3-5'\n  WHEN TRY_CAST(m.capture_delay AS INTEGER)\
    \ > 5 THEN '>5'\nEND\n"
  source_model: main.merchant_data
  domains:
  - fees
  - merchants
- name: transaction_natural_month
  description: 'The natural month a transaction belongs to. The manual requires that
    "monthly volumes and rates are computed always in natural months (e.g. January,
    February), starting always in day 1 and ending in the last natural day of the
    month (i.e. 28 for February, 30 or 31)". `payments` dates a transaction by `year`
    and `day_of_year`, so the calendar date is reconstructed before truncating to
    the month; the expression below yields the first day of that month.

    '
  sql_expression: date_trunc('month', make_date(p.year, 1, 1) + CAST(p.day_of_year
    - 1 AS INTEGER))
  source_model: main.payments
  domains:
  - fees
  - transactions
- name: merchant_monthly_volume
  description: "A merchant's monthly total volume in euros \u2014 the quantity the\
    \ `fees.monthly_volume` band is measured against. Summed over all of that merchant's\
    \ transactions in one natural month.\n"
  sql_expression: "SUM(p.eur_amount) GROUP BY p.merchant,\n         date_trunc('month',\
    \ make_date(p.year, 1, 1) + CAST(p.day_of_year - 1 AS INTEGER))\n"
  source_model: main.payments
  domains:
  - fees
  - merchants
- name: merchant_monthly_fraud_level
  description: "A merchant's monthly fraud level \u2014 the quantity the `fees.monthly_fraud_level`\
    \ band is measured against \u2014 as a fraction (multiply by 100 for the percentage\
    \ the band uses). The manual defines it as the \"ratio between monthly total volume\
    \ and monthly volume notified as fraud\", and manual 7 restates it as \"the ratio\
    \ of fraudulent volume over total volume\", both over one natural month.\n"
  sql_expression: "SUM(p.eur_amount) FILTER (WHERE p.has_fraudulent_dispute) / NULLIF(SUM(p.eur_amount),\
    \ 0) GROUP BY p.merchant,\n         date_trunc('month', make_date(p.year, 1, 1)\
    \ + CAST(p.day_of_year - 1 AS INTEGER))\n"
  source_model: main.payments
  domains:
  - fees
  - fraud
- name: intracountry_transaction
  description: "True when a transaction is domestic \u2014 \"local acquiring\", in\
    \ the manual's words, which \"occurs when a transaction is processed through an\
    \ acquirer that is located in the same country as the issuer of the card\". This\
    \ is the same condition the fee rules call `intracountry`: \"True if the transaction\
    \ is domestic, defined by the fact that the issuer country and the acquiring country\
    \ are the same. False are for international transactions where the issuer country\
    \ and acquirer country are different and typically are more expensive.\"\n"
  sql_expression: p.issuing_country = p.acquirer_country
  source_model: main.payments
  domains:
  - transactions
  - cost_optimization
- name: fraud_rate
  description: "\"Fraud is defined as the ratio of fraudulent volume over total volume\"\
    \ (manual 7), over whatever population is under analysis \u2014 unlike `merchant_monthly_fraud_level`,\
    \ this one carries no fixed grouping. The manual lists it as a KPI to \"strive\
    \ for the lowest possible level\" (manual 8.2).\n"
  sql_expression: 'SUM(p.eur_amount) FILTER (WHERE p.has_fraudulent_dispute) / NULLIF(SUM(p.eur_amount),
    0)

    '
  source_model: main.payments
  domains:
  - fraud
  - reporting
- name: authorization_rate
  description: "The share of transactions that were not refused. The manual lists\
    \ the authorization rate as a KPI \u2014 \"aim for the maximum possible level\
    \ to maximize successful transactions and minimize rejected transactions\" (manual\
    \ 8.2) \u2014 but never gives a formula.\n"
  sql_expression: 'COUNT(*) FILTER (WHERE NOT p.is_refused_by_adyen) / NULLIF(COUNT(*),
    0)

    '
  source_model: main.payments
  domains:
  - reporting
- name: three_d_secure_share
  description: 'The share of card-not-present transactions that were authenticated
    with 3-D Secure. The manual asks merchants to "implement 3D Secure, a payment
    security protocol that adds an additional layer of authentication for online transactions"
    (manual 7.1) and warns that "failure to use AVS or 3D Secure for card-not-present
    transactions" is a common cause of transaction downgrades (manual 5.1.5). Manual
    4 makes it measurable: ACI F is "Card Not Present - 3-D Secure" and ACI G is "Card
    Not Present - Non-3-D Secure", so F over (F + G) is the adoption rate among exactly
    the traffic the two sections are about. The denominator is deliberately F + G
    rather than all transactions: ACIs A, B and C are card-present or tokenized flows
    where 3-D Secure does not apply, and D and E are card-not-present flows the manual''s
    own ACI table does not classify either way.

    '
  sql_expression: 'COUNT(*) FILTER (WHERE p.aci = ''F'') / NULLIF(COUNT(*) FILTER
    (WHERE p.aci IN (''F'', ''G'')), 0)

    '
  source_model: main.payments
  domains:
  - fraud
  - transactions
  - cost_optimization
tables:
- schema: main
  table: payments
  columns:
  - name: psp_reference
    type: BIGINT
    description: Unique payment identifier (ID).
  - name: merchant
    type: VARCHAR
    description: Merchant name (categorical), e.g. Starbucks or Netflix.
  - name: card_scheme
    type: VARCHAR
    description: 'Card scheme used (categorical): MasterCard, Visa, Amex, Other.'
  - name: year
    type: BIGINT
    description: Payment initiation year (numeric).
  - name: hour_of_day
    type: BIGINT
    description: Payment initiation hour (numeric).
  - name: minute_of_hour
    type: BIGINT
    description: Payment initiation minute (numeric).
  - name: day_of_year
    type: BIGINT
    description: "Day of the year of payment initiation (numeric). Combine with `year`\
      \ to get the calendar date \u2014 see the metric `transaction_natural_month`."
  - name: is_credit
    type: BOOLEAN
    description: Credit or debit card indicator. Fee rules select on it via `fees.is_credit`;
      credit transactions are typically more expensive.
  - name: eur_amount
    type: DOUBLE
    description: Payment amount in euro (numeric). This is the transaction_value in
      fee = fixed_amount + rate * transaction_value / 10000.
  - name: ip_country
    type: VARCHAR
    description: 'The country the shopper was in at time of transaction, determined
      by IP address (categorical): SE, NL, LU, IT, BE, FR, GR, ES.'
  - name: issuing_country
    type: VARCHAR
    description: 'Card-issuing country (categorical): SE, NL, LU, IT, BE, FR, GR,
      ES. Equal to `acquirer_country` means the transaction is domestic (intracountry).'
  - name: device_type
    type: VARCHAR
    description: 'Device type used (categorical): Windows, Linux, MacOS, iOS, Android,
      Other.'
  - name: ip_address
    type: VARCHAR
    description: Hashed shopper's IP (ID).
  - name: email_address
    type: VARCHAR
    description: Hashed shopper's email (ID).
  - name: card_number
    type: VARCHAR
    description: Hashed card number (ID).
  - name: shopper_interaction
    type: VARCHAR
    description: 'Payment method (categorical): Ecommerce, POS. POS means an in-person
      or in-store transaction.'
  - name: card_bin
    type: BIGINT
    description: Bank Identification Number (ID).
  - name: has_fraudulent_dispute
    type: BOOLEAN
    description: Indicator of fraudulent dispute from issuing bank (boolean). The
      only fraud signal in the data; used by `fraud_rate` and `merchant_monthly_fraud_level`.
  - name: is_refused_by_adyen
    type: BOOLEAN
    description: Adyen refusal indicator (boolean). Used by `authorization_rate`.
  - name: aci
    type: VARCHAR
    description: Authorization Characteristics Indicator (categorical). A = card present
      non-authenticated; B = card present authenticated; C = tokenized card with mobile
      device; D = card not present, card on file; E = card not present, recurring
      bill payment; F = card not present, 3-D Secure; G = card not present, non-3-D
      Secure.
  - name: acquirer_country
    type: VARCHAR
    description: 'The location (country) of the acquiring bank (categorical): SE,
      NL, LU, IT, BE, FR, GR, ES.'
- schema: main
  table: fees
  columns:
  - name: ID
    type: BIGINT
    description: Identifier of the fee rule within the rule fee dataset.
  - name: card_scheme
    type: VARCHAR
    description: Name of the card scheme or network that the fee applies to.
  - name: account_type
    type: VARCHAR[]
    description: List of account types the rule applies to (R Enterprise-Retail, D
      Enterprise-Digital, H Enterprise-Hospitality, F Platform-Franchise, S Platform-SaaS,
      O Other). Null means all account types.
  - name: capture_delay
    type: VARCHAR
    description: 'Days allowed between authorization and settlement: ''<3'' (before
      3 days), ''3-5'' (between 3 and 5 days), ''>5'' (more than 5 days is possible),
      ''immediate'', ''manual''. Faster capture to settlement is more expensive. Null
      means all values.'
  - name: monthly_fraud_level
    type: VARCHAR
    description: Band for the merchant's ratio of monthly volume notified as fraud
      over monthly total volume, e.g. '7.7%-8.3%' means the ratio should be between
      7.7 and 8.3 percent. Processors generally become more expensive as the fraud
      rate increases. Null means all values.
  - name: monthly_volume
    type: VARCHAR
    description: Band for the merchant's monthly total volume in euros, e.g. '100k-1m'
      is between 100,000 and 1,000,000. Higher-volume merchants normally get cheaper
      fees. Null means all values.
  - name: merchant_category_code
    type: BIGINT[]
    description: List of merchant category codes the rule covers (manual 3), e.g.
      [8062, 8011, 8021]. Null means all MCCs.
  - name: is_credit
    type: BOOLEAN
    description: True if the rule applies for credit transactions; credit is typically
      more expensive. Null means both credit and debit.
  - name: aci
    type: VARCHAR[]
    description: List of Authorization Characteristics Indicator values the rule covers
      (manual 4). Null means all ACIs.
  - name: fixed_amount
    type: DOUBLE
    description: Fixed amount of the fee in euros per transaction, for the given rule.
  - name: rate
    type: BIGINT
    description: Variable rate, multiplied by the transaction value and divided by
      10000.
  - name: intracountry
    type: DOUBLE
    description: "True (1) if the transaction is domestic \u2014 issuer country and\
      \ acquiring country are the same. False (0) marks international transactions,\
      \ which are typically more expensive. Null means both."
- schema: main
  table: merchant_data
  columns:
  - name: merchant
    type: VARCHAR
    description: Merchant name; joins to `payments.merchant`.
  - name: capture_delay
