      \ only."
  - name: merchant_category_code
    type: BIGINT
    description: This merchant's MCC (manual 3), matched against the `fees.merchant_category_code`
      list.
  - name: account_type
    type: VARCHAR
    description: 'This merchant''s account type (manual 2): R Enterprise-Retail, D
      Enterprise-Digital, H Enterprise-Hospitality, F Platform-Franchise, S Platform-SaaS,
      O Other. Matched against the `fees.account_type` list.'
