  description: Elevated Regulatory Scrutiny AND High-Volume Wash Trading Concern.
  sql_expression: COALESCE(rc.alert_lvl IN ('High', 'Critical') AND rc.invest_prior = 'High' AND rc.mon_inten
    = 'Intensive', FALSE) AND COALESCE((ms.manip_signals->>'wash_flag') = 'High', FALSE) AND COALESCE(t.vol_day
    > 1000000, FALSE)
  source_model: main.reg_compliance
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - compliance
  - manipulation
- name: volatile_event_speculator
  description: 'Aggressive Event Speculator AND associated with a high Sentiment Divergence Factor (>
    1.0) on at least one of their transactions. Aggregate: GROUP BY t.tr_anchor.'
  sql_expression: AVG(CASE WHEN ce.evt_near IS NOT NULL THEN 1.0 ELSE 0.0 END) > 0.3 AND bool_or(COALESCE((tr.trader_fin_data->>'risk_lvl')
    = 'Aggressive', FALSE)) AND bool_or(COALESCE(abs(CAST((sa.sentiment_data->>'news_score') AS DOUBLE)
    - CAST((sa.sentiment_data->>'soc_sent') AS DOUBLE)) > 1.0, FALSE))
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - insider_events
  - sentiment_market
- name: confirmed_evasive_layering_spoofing
  description: 'High Cancellation/Modification Trader AND confirmed layering/spoofing where layer_idx
    is ''Confirmed'' or spoof_prob > 0.75 (this entry''s own criterion, without the OMI condition), on
    at least one transaction. Aggregate: GROUP BY t.tr_anchor.'
  sql_expression: COALESCE(AVG(CAST((ob.order_metrics->>'cancel_pct') AS DOUBLE)) > 0.5 OR AVG(CAST((ob.order_metrics->>'mod_freq')
    AS DOUBLE) / NULLIF(1 - CAST((ob.order_metrics->>'cancel_pct') AS DOUBLE), 0)) > 1.5, FALSE) AND bool_or(COALESCE(ms.layer_idx
    = 'Confirmed' OR TRY_CAST(replace((ms.manip_signals->>'spoof_prob'), '%', '') AS DOUBLE) > 0.75, FALSE))
  source_model: main.manipulation_signals
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
- name: high_velocity_suspicion_trader
  description: Risk-Adjusted Turnover > 1.0 AND Suspicious Activity Index > 0.6.
  sql_expression: COALESCE((t.vol_day / NULLIF(CAST(replace(replace(trim((tr.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0)) * CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) > 1.0 AND (0.25
    * COALESCE(TRY_CAST(replace((ms.manip_signals->>'spoof_prob'), '%', '') AS DOUBLE), 0) + 0.25 * COALESCE(CAST((ms.manip_signals->>'front_run')
    AS DOUBLE) / 100.0, 0) + 0.25 * CASE (ms.manip_signals->>'wash_flag') WHEN 'High' THEN 1.0 WHEN 'Medium'
    THEN 0.5 ELSE 0.0 END + 0.25 * CASE WHEN ms.layer_idx = 'Confirmed' THEN 1.0 ELSE 0.0 END) > 0.6,
    FALSE)
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
  - trading_activity
- name: high_intensity_insider_investigation
  description: Potential Insider Trading Flag AND Investigation Intensity Index > 70.
  sql_expression: COALESCE(ce.leak_score > 50.0 AND ce.evt_near IS NOT NULL AND (ce.announce_time LIKE
    'Pre-market%' OR ce.announce_time LIKE 'Intraday%'), FALSE) AND COALESCE(0.6 * rc.behav_score + 0.4
    * rc.net_score > 70, FALSE)
  source_model: main.corporate_events
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - insider_events
  - compliance
- name: severe_chronic_violator_case
  description: Elevated Regulatory Scrutiny AND the trader is a Chronic Compliance Violator.
  sql_expression: COALESCE(rc.alert_lvl IN ('High', 'Critical') AND rc.invest_prior = 'High' AND rc.mon_inten
    = 'Intensive', FALSE) AND COALESCE(CAST((rc.compliance_data->>'prev_viol') AS DOUBLE) > 3 OR (rc.compliance_data->>'comp_rate')
    IN ('C', 'D') OR CAST((rc.compliance_data->>'prev_viol') AS DOUBLE) / GREATEST(1, CAST((tr.trader_fin_data->>'age_days')
    AS DOUBLE) / 365.0) > 1.0, FALSE) AND COALESCE(CAST((rc.compliance_data->>'prev_viol') AS DOUBLE)
    / GREATEST(1, CAST((tr.trader_fin_data->>'age_days') AS DOUBLE) / 365.0) > 1.5, FALSE)
  source_model: main.reg_compliance
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - compliance
- name: costly_high_frequency_risk_enforcement
  description: Financially Impactful Enforcement Case targeting a trader flagged as High-Frequency High-Risk
    (evaluated on the same record here; for "previously flagged on any record" use bool_or of high_frequency_high_risk_trader
    grouped by t.tr_anchor).
  sql_expression: COALESCE((ea.enf_actions->>'pen_flag') IN ('Fine', 'Ban') OR ea.act_taken = 'Suspension'
    OR ea.biz_restrict = 'Full', FALSE) AND COALESCE(CAST((ea.enf_actions->>'pen_amt') AS DOUBLE) / NULLIF(CAST(replace(replace(trim((tr.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.1, FALSE) AND COALESCE((CAST((t.trade_perf->>'lev_ratio') AS
    DOUBLE) > 5.0 AND (tr.trader_fin_data->>'risk_lvl') = 'Aggressive') OR t.vol_day / NULLIF(CAST(replace(replace(trim((tr.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5, FALSE) AND COALESCE(t.freq_tag = 'High', FALSE)
  source_model: main.enforcement_actions
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - enforcement
  - trading_activity
- name: high_sdlr_transaction
  description: Transaction whose Sentiment-Driven Leakage Risk > 1000.
  sql_expression: COALESCE(sa.opt_vol * (1 + abs(CAST((sa.sentiment_data->>'news_score') AS DOUBLE) -
    CAST((sa.sentiment_data->>'soc_sent') AS DOUBLE))) * ce.leak_score > 1000, FALSE)
  source_model: main.sentiment_analytics
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - sentiment_market
  - insider_events
- name: premature_resolution_block
  description: 'Business rule: an enforcement action must be blocked from being marked ''Resolved'' if
    its linked Investigation Intensity Index is greater than 75. TRUE = resolution is blocked.'
  sql_expression: COALESCE(0.6 * rc.behav_score + 0.4 * rc.net_score > 75, FALSE)
  source_model: main.enforcement_actions
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - enforcement
- name: premature_resolution_violation
  description: Enforcement action already marked 'Resolved' (enf_actions->>'res_state') although its III
    > 75 (violates the Premature Resolution Block).
  sql_expression: COALESCE((ea.enf_actions->>'res_state') = 'Resolved' AND 0.6 * rc.behav_score + 0.4
    * rc.net_score > 75, FALSE)
  source_model: main.enforcement_actions
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - enforcement
- name: peer_correlation_z_score
  description: '(record peer_corr - average peer_corr over all records of traders in the same trader category
    (traders.typeFlag)) / standard deviation (sample) of peer_corr in that category; 0 if the standard
    deviation is zero or not applicable (including NULL peer_corr). Window expression: row-level, cannot
    be nested inside an aggregate (compute in a subquery first).'
  sql_expression: COALESCE((CAST((mc.market_metrics->>'peer_corr') AS DOUBLE) - AVG(CAST((mc.market_metrics->>'peer_corr')
    AS DOUBLE)) OVER (PARTITION BY tr.typeFlag)) / NULLIF(STDDEV_SAMP(CAST((mc.market_metrics->>'peer_corr')
    AS DOUBLE)) OVER (PARTITION BY tr.typeFlag), 0), 0)
  source_model: main.market_conditions
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
tables:
- schema: main
  table: traders
  columns:
  - name: TR_KEY
    type: VARCHAR
    description: Trader account id (PK), e.g. TR73442.
  - name: typeFlag
    type: VARCHAR
    description: 'Trader category: Broker, Individual, Institution, Market Maker. Partition for peer_correlation_z_score.'
  - name: trader_fin_data
    type: JSON
    description: 'usd_bal text ''$4,692,991 '' (parse: strip $, commas, trim); age_days integer; risk_lvl
      Aggressive/Conservative/Moderate (risk appetite). No NULLs observed.'
- schema: main
  table: instruments
  columns:
  - name: SYM_KEY
    type: VARCHAR
    description: 'Instrument symbol: AAPL, AMZN, GOOGL, META, MSFT.'
  - name: inst_info
    type: JSON
    description: cap (market cap, NULL = not reported), sector, stream.
- schema: main
  table: trader_relationships
  columns:
  - name: rel_root
    type: VARCHAR
    description: Trader key (= traders.TR_KEY = trade_records.tr_anchor).
  - name: circ_size
    type: BIGINT
    description: Trader circle size (1-50); collusion needs > 5.
  - name: commPath
    type: VARCHAR
    description: Regular/Irregular; NULL = not mapped. Collusion requires 'Regular'.
  - name: trader_links
    type: JSON
    description: grp_score = group behavior score, stored 0-100 (collusion threshold > 0.6 applied literally);
      link_count, contact_share, fin_link.
- schema: main
  table: trade_records
  columns:
  - name: REC_KEY
    type: VARCHAR
    description: Trade record key; equals the key of every 1:1 side table (REC_PIN, REC_NODE, REC_TAG,
      REC_SA, REC_EVT, REC_COMP, REC_ENF).
  - name: snap_ts
    type: VARCHAR
    description: Garbled time fragment like '12:24.1', not a parseable timestamp; NULL = not captured.
  - name: freq_tag
    type: VARCHAR
    description: Trading frequency scope High/Medium/Low; 'High' for High-Frequency High-Risk.
  - name: vol_day
    type: FLOAT
    description: Daily trading volume; numerator of daily_turnover_rate; > 1,000,000 for high-volume wash
      concern.
  - name: hold_span
    type: VARCHAR
    description: 'Holding style: ''Intraday'' same-day trades; ''Swing'' a few days to weeks; ''Position''
      weeks to months; ''Long-term'' months or years.'
  - name: bal_turnover
    type: VARCHAR
    description: Text 'x times/day'. Does not equal vol_day/usd_bal in the data; DTR uses the documented
      formula (metric daily_turnover_rate).
  - name: trade_perf
    type: JSON
    description: lev_ratio = Trader Leverage Exposure (NULL = not available); win_pct = historical win
      percentage (0-100, NULL = not calculated); pl_ratio.
- schema: main
  table: market_conditions
  columns:
  - name: REC_PIN
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: mkt_corr
    type: FLOAT
    description: Market correlation, used in MAPA as (1 - mkt_corr).
  - name: market_metrics
    type: JSON
    description: peer_corr = peer correlation score (-1..1, NULL = not computed); px_vol; liq_ratio.
- schema: main
  table: order_status_types
  columns:
  - name: STAT_TOKEN
    type: VARCHAR
    description: 'Order-status token (never referenced: order_behaviour.OST_ref is all NULL).'
  - name: order_status
    type: JSON
    description: 'spread_type = order type: ''Market'' prioritizes speed; ''Limit'' prioritizes price;
      ''Mixed'' a combination of strategies. tick_type Regular/Irregular/Suspicious.'
- schema: main
  table: sentiment_analytics
  columns:
  - name: REC_SA
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: short_rt
    type: FLOAT
    description: Short interest ratio (RSI numerator); NULL = not provided.
  - name: inst_own
    type: FLOAT
    description: Institutional ownership % (RSI denominator); NULL in 400 rows; RSI undefined if 0.
  - name: opt_vol
    type: FLOAT
    description: Option volume ratio used in SWOV.
  - name: uo_act
    type: VARCHAR
    description: 'Unusual options activity: ''High'' significant deviations, a potential flag for insider
      information; ''Moderate'' some unusual activity, less pronounced; NULL none recorded.'
  - name: sentiment_data
    type: JSON
    description: news_score, soc_sent (sentiment scores), analyst_cnt.
- schema: main
  table: order_behaviour
  columns:
  - name: REC_NODE
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: OST_ref
    type: VARCHAR
    description: Order-status token reference; NULL in every row.
  - name: dark_use
    type: FLOAT
    description: Dark pool usage share (0-0.4; NULL = not collected). Dark pools are private exchanges
      (e.g. Alternative Trading Systems) used for large orders to reduce market impact; usage patterns
      can be analysed for regulatory compliance or signs of avoiding market transparency.
  - name: off_mkt
    type: FLOAT
    description: Off-market (not on lit exchanges) execution fraction; includes 'internal crosses' where
      a broker matches its own clients' buy/sell orders internally, which requires monitoring for fairness.
  - name: x_freq
    type: FLOAT
    description: Cross-trade frequency (CMR numerator).
  - name: order_metrics
    type: JSON
    description: mod_freq = order modification frequency; cancel_pct = cancellation percentage as fraction
      0-1 (NULL = not computed); size_var.
- schema: main
  table: manipulation_signals
  columns:
  - name: REC_TAG
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: layer_idx
    type: VARCHAR
    description: Layering indicator Confirmed/Suspected; NULL = not assigned.
  - name: ignite_sig
    type: VARCHAR
    description: 'Momentum ignition (attempts to create false price movement): ''Strong'' clear patterns
      of manipulative intent; ''Weak'' less evident; NULL not detected.'
  - name: close_mark
    type: VARCHAR
    description: 'Marking the close (trading near close to manipulate the closing price, a prohibited
      practice): ''Frequent'' repeated activity; ''Occasional'' infrequent; NULL not set.'
  - name: manip_signals
    type: JSON
    description: spoof_prob text like '0.88%' whose number is already a 0-1 probability; front_run score
      0-100; wash_flag High/Medium/Low (NULL = not determined).
- schema: main
  table: corporate_events
  columns:
  - name: REC_EVT
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: evt_near
    type: VARCHAR
    description: Earnings/M&A/Restructuring; NULL = no event, i.e. transaction not linked to a corporate
      event.
  - name: announce_time
    type: VARCHAR
    description: '''Pre-market hrs before'', ''Intraday hrs before'', ''Post-market hrs before''.'
  - name: leak_score
    type: FLOAT
    description: 'Information leakage score 0-100: < 20 little evidence of informed trading; 20-50 moderate,
      warrants attention; > 50 strongly suggests trading on non-public information and requires investigation.'
- schema: main
  table: reg_compliance
  columns:
  - name: REC_COMP
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: restrict_win
    type: VARCHAR
    description: 'Trading restriction: ''Blackout'' complete prohibition on trading; ''Special'' other
      case-specific restrictions such as position size limits or pre-trade approvals; NULL not defined.'
  - name: alert_lvl
    type: VARCHAR
    description: Low/Medium/High/Critical; WIS multiplier 1/2/3/4.
  - name: invest_prior
    type: VARCHAR
    description: Investigation priority Low/Medium/High.
  - name: mon_inten
    type: VARCHAR
    description: Monitoring intensity Standard/Enhanced/Intensive.
  - name: pat_rec
    type: FLOAT
    description: Pattern similarity score stored 0-100; documented as 0-1 (near 1 = high similarity to
      known illicit patterns, near 0 = no strong match), so metrics use pat_rec/100.
  - name: behav_score
    type: FLOAT
    description: Behavioral analysis score (III weight 0.6).
  - name: net_score
    type: FLOAT
    description: Network analysis score (III weight 0.4).
  - name: compliance_data
    type: JSON
    description: 'prev_viol = previous violations (0-5); comp_rate grade: ''A'' excellent compliance;
      ''B'' good with minor issues; ''C'' significant deficiencies; ''D'' serious or repeated failures;
      risk_val.'
- schema: main
  table: enforcement_actions
  columns:
  - name: REC_ENF
    type: VARCHAR
    description: Record key = trade_records.REC_KEY.
  - name: act_taken
    type: VARCHAR
    description: Warning/Restriction/Suspension; NULL = none recorded.
  - name: biz_restrict
    type: VARCHAR
    description: Full/Partial; NULL = not documented.
  - name: enf_actions
    type: JSON
    description: pen_amt penalty amount; pen_flag = penalty impact Ban/Fine/Warning (NULL = not decided);
      res_state In Progress/Pending/Resolved (Resolved blocked when III > 75).
