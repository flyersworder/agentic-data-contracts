# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: insider_trading, author: claudeopus5.5
metrics:
- name: daily_turnover_rate
  description: 'DTR: ratio of a trader''s daily trading volume to their account balance, indicating capital
    velocity. DTR = trade_records.vol_day / account balance (traders.trader_fin_data usd_bal, stored as
    text ''$4,692,991 '' and parsed). Not the same as the stored text bal_turnover, which does not match
    this ratio in the data.'
  sql_expression: t.vol_day / NULLIF(CAST(replace(replace(trim((tr.trader_fin_data->>'usd_bal')), '$',
    ''), ',', '') AS DOUBLE), 0)
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - trading_activity
- name: order_modification_intensity
  description: OMI = order modification frequency (order_metrics mod_freq) / (1 - order cancellation percentage
    (cancel_pct)); undefined (NULL) if cancel_pct is 1 or either input is NULL. cancel_pct is stored as
    a fraction (observed 0-0.299).
  sql_expression: CAST((ob.order_metrics->>'mod_freq') AS DOUBLE) / NULLIF(1 - CAST((ob.order_metrics->>'cancel_pct')
    AS DOUBLE), 0)
  source_model: main.order_behaviour
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - trading_activity
  - manipulation
- name: trader_leverage_exposure
  description: 'TLE: the trader''s leverage ratio from performance data, trade_records.trade_perf->>''lev_ratio''
    (NULL = not available; observed 1.0-9.98).'
  sql_expression: CAST((t.trade_perf->>'lev_ratio') AS DOUBLE)
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - trading_activity
- name: suspicious_activity_index
  description: 'SAI: composite index quantifying overall suspicious behavior as a weighted sum of normalized
    risk indicators: spoofing probability, front-running, wash trading and confirmed layering. INTERPRETATION
    (weights not documented): equal weights 0.25 each; spoof_prob as its 0-1 number (the ''%'' sign is
    stripped, values already 0-1); front_run/100 (stored 0-100); wash_flag High=1, Medium=0.5, Low/NULL=0;
    layer_idx ''Confirmed''=1 else 0. Missing inputs count 0. Result is 0-1.'
  sql_expression: (0.25 * COALESCE(TRY_CAST(replace((ms.manip_signals->>'spoof_prob'), '%', '') AS DOUBLE),
    0) + 0.25 * COALESCE(CAST((ms.manip_signals->>'front_run') AS DOUBLE) / 100.0, 0) + 0.25 * CASE (ms.manip_signals->>'wash_flag')
    WHEN 'High' THEN 1.0 WHEN 'Medium' THEN 0.5 ELSE 0.0 END + 0.25 * CASE WHEN ms.layer_idx = 'Confirmed'
    THEN 1.0 ELSE 0.0 END)
  source_model: main.manipulation_signals
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
- name: pattern_similarity_score
  description: 'Pattern similarity to known illicit behaviors, 0-1: near 1 = high similarity to known
    illicit trading patterns, near 0 = patterns do not strongly match known manipulative techniques. Stored
    as reg_compliance.pat_rec on a 0-100 scale (observed 0.03-99.99), hence /100.'
  sql_expression: rc.pat_rec / 100.0
  source_model: main.reg_compliance
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
- name: pattern_anomaly_score
  description: 'PAS = |Pattern Similarity Score - Peer Correlation Score|: deviation of a trader''s pattern
    similarity (pat_rec/100) from their peer correlation (market_metrics->>''peer_corr'').'
  sql_expression: abs(rc.pat_rec / 100.0 - CAST((mc.market_metrics->>'peer_corr') AS DOUBLE))
  source_model: main.reg_compliance
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
- name: compliance_recidivism_score
  description: CRS = number of previous violations (compliance_data->>'prev_viol') / Max(1, account age
    in days (trader_fin_data->>'age_days') / 365). Uses 365.0 to avoid integer division.
  sql_expression: CAST((rc.compliance_data->>'prev_viol') AS DOUBLE) / GREATEST(1, CAST((tr.trader_fin_data->>'age_days')
    AS DOUBLE) / 365.0)
  source_model: main.reg_compliance
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - compliance
- name: investigation_intensity_index
  description: III = 0.6 * behavioral analysis score (behav_score) + 0.4 * network analysis score (net_score).
  sql_expression: 0.6 * rc.behav_score + 0.4 * rc.net_score
  source_model: main.reg_compliance
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - compliance
- name: sentiment_divergence_factor
  description: SDF = |news sentiment score (news_score) - social sentiment score (soc_sent)|.
  sql_expression: abs(CAST((sa.sentiment_data->>'news_score') AS DOUBLE) - CAST((sa.sentiment_data->>'soc_sent')
    AS DOUBLE))
  source_model: main.sentiment_analytics
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
