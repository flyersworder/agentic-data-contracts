- name: aggressive_suspicion_score
  description: ASS = Suspicious Activity Index x Aggressive Trading Intensity.
  sql_expression: (0.25 * COALESCE(TRY_CAST(replace((ms.manip_signals->>'spoof_prob'), '%', '') AS DOUBLE),
    0) + 0.25 * COALESCE(CAST((ms.manip_signals->>'front_run') AS DOUBLE) / 100.0, 0) + 0.25 * CASE (ms.manip_signals->>'wash_flag')
    WHEN 'High' THEN 1.0 WHEN 'Medium' THEN 0.5 ELSE 0.0 END + 0.25 * CASE WHEN ms.layer_idx = 'Confirmed'
    THEN 1.0 ELSE 0.0 END) * (t.vol_day / NULLIF(CAST(replace(replace(trim((tr.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0)) * CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) * (CAST((ob.order_metrics->>'mod_freq')
    AS DOUBLE) / NULLIF(1 - CAST((ob.order_metrics->>'cancel_pct') AS DOUBLE), 0))
