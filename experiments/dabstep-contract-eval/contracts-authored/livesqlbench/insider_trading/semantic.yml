- name: event_linked_share
  description: 'Share of a trader''s transactions linked to a corporate event (evt_near IS NOT NULL; records
    without a corporate_events row count as not linked). Aggregate: use with GROUP BY t.tr_anchor.'
  sql_expression: AVG(CASE WHEN ce.evt_near IS NOT NULL THEN 1.0 ELSE 0.0 END)
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
