- name: high_risk_trader_profile
  description: 'High-Risk if TLE > 5.0 AND risk level ''Aggressive'' OR DTR > 0.5 (SQL precedence: (TLE
    > 5.0 AND Aggressive) OR DTR > 0.5). NULL inputs -> FALSE. Evaluated per trade record; a trader is
    High-Risk if any record qualifies (bool_or grouped by t.tr_anchor) unless asked otherwise.'
  sql_expression: COALESCE((CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) > 5.0 AND (tr.trader_fin_data->>'risk_lvl')
    = 'Aggressive') OR t.vol_day / NULLIF(CAST(replace(replace(trim((tr.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5, FALSE)
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
