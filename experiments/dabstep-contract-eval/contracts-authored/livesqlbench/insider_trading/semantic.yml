- name: potential_insider_trading_flag
  description: Transaction flagged if information leakage score > 50.0 AND it is linked to a corporate
    event (evt_near IS NOT NULL) AND the announcement timing is 'Pre-market' or 'Intraday' (announce_time
    'Pre-market hrs before' / 'Intraday hrs before').
  sql_expression: COALESCE(ce.leak_score > 50.0 AND ce.evt_near IS NOT NULL AND (ce.announce_time LIKE
    'Pre-market%' OR ce.announce_time LIKE 'Intraday%'), FALSE)
  source_model: main.corporate_events
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - insider_events
- name: layering_spoofing_pattern
  description: 'Market Manipulation Pattern: Layering/Spoofing. layer_idx = ''Confirmed'' OR (spoof_prob
    > 0.75 AND OMI > 1.0). spoof_prob is the numeric part of text like ''0.88%'' (already 0-1).'
  sql_expression: COALESCE(ms.layer_idx = 'Confirmed' OR (TRY_CAST(replace((ms.manip_signals->>'spoof_prob'),
    '%', '') AS DOUBLE) > 0.75 AND CAST((ob.order_metrics->>'mod_freq') AS DOUBLE) / NULLIF(1 - CAST((ob.order_metrics->>'cancel_pct')
    AS DOUBLE), 0) > 1.0), FALSE)
  source_model: main.manipulation_signals
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
    JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN main.manipulation_signals ms ON
    ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA = t.REC_KEY LEFT JOIN main.corporate_events
    ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN
    main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY
  grain: one trade record (trade_records.REC_KEY) with its trader, relationship map and 1:1 side tables
  domains:
  - manipulation
- name: collusion_network_indicator
  description: Potential collusion if trader circle size (circ_size) > 5 AND group behavior score (trader_links->>'grp_score')
    > 0.6 AND communication path (commPath) = 'Regular'. grp_score is stored 0-100; threshold applied
    literally as documented.
  sql_expression: COALESCE(rl.circ_size > 5 AND CAST((rl.trader_links->>'grp_score') AS DOUBLE) > 0.6
    AND rl.commPath = 'Regular', FALSE)
  source_model: main.trader_relationships
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
