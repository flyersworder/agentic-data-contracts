- name: event_driven_trader
  description: 'Trader is Event-Driven if a significant portion (> 30%) of their transactions are linked
    to a corporate event. Aggregate: GROUP BY t.tr_anchor.'
  sql_expression: AVG(CASE WHEN ce.evt_near IS NOT NULL THEN 1.0 ELSE 0.0 END) > 0.3
  source_model: main.trade_records
  from_sql: main.trade_records t LEFT JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.trader_relationships
    rl ON rl.rel_root = t.tr_anchor LEFT JOIN main.market_conditions mc ON mc.REC_PIN = t.REC_KEY LEFT
