    1 WHEN 'Medium' THEN 3 WHEN 'High' THEN 5 END * CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_dwell_minutes'
    AS DOUBLE) / 1000.0) / 10.0
  source_model: main.ArtifactSecurityAccess
  from_sql: main.ArtifactSecurityAccess sa CROSS JOIN main.ExhibitionHalls h
  grain: one security record x one exhibition hall
  domains:
