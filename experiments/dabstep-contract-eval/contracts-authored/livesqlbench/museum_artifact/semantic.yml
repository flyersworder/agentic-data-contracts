    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS poll_w,\n  list_avg([light_w,\
    \ temp_w, hum_w, vib_w, poll_w]) AS erf,\n  CASE WHEN s.\"ART_link\" IS NOT NULL THEN (CASE WHEN light_w\
    \ = 10 THEN 1 ELSE 0 END) + (CASE WHEN temp_w = 10 THEN 1 ELSE 0 END) + (CASE WHEN hum_w = 10 THEN\
    \ 1 ELSE 0 END) + (CASE WHEN vib_w = 10 THEN 1 ELSE 0 END) + (CASE WHEN poll_w = 10 THEN 1 ELSE 0\
    \ END) END AS high_sens_count,\n  e.monitor_code, e.\"readTS\" AS read_ts, e.case_link AS case_id,\
    \ sc.hall_ref AS hall_id,\n  e.\"TEMPc\" AS temp_c, e.\"RH\" AS rh, e.\"tempVar24\" AS temp_var24,\
    \ e.\"RHvar\" AS rh_var,\n  CAST(sc.case_environment_profile->'physical_state'->>'leak_rate_per_day'\
