  source_model: main.ArtifactsCore
  from_sql: "(SELECT c.*,\n  c.cpi * c.erf AS avs,\n  10 - abs(c.erf - c.sesr) AS aec,\n  c.sesr - c.erf\
    \ * 0.5 AS spa,\n  c.erf + c.ler + c.mdr * 2 AS tetl,\n  c.mdr * (1 + tetl / 20.0) AS map,\n  (c.dsd\
