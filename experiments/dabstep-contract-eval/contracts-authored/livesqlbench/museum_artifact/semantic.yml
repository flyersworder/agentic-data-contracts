- name: compliance_level
  description: '''Excellent'' ECI > 7, ''Good'' 4 <= ECI <= 7, ''Poor'' otherwise (ECI exactly 4 is stated
    in both Good and Poor; assigned to Good).'
  sql_expression: CASE WHEN x.eci IS NULL THEN NULL WHEN x.eci > 7 THEN 'Excellent' WHEN x.eci >= 4 THEN
    'Good' ELSE 'Poor' END
  source_model: main.EnvironmentalReadingsCore
  from_sql: "(SELECT c.*,\n  c.cpi * c.erf AS avs,\n  10 - abs(c.erf - c.sesr) AS aec,\n  c.sesr - c.erf\
    \ * 0.5 AS spa,\n  c.erf + c.ler + c.mdr * 2 AS tetl,\n  c.mdr * (1 + tetl / 20.0) AS map,\n  (c.dsd\
    \ - c.display_months) * (c.ler + 1) * (c.cpi + 1) / 100.0 AS erps,\n  10 - (abs(c.temp_c - 20) + abs(c.rh\
    \ - 50) / 5.0 + c.erf / 2.0) AS eci,\n  c.cpi * ((current_date - c.last_clean) - c.clean_days) / 100.0\
    \ AS cbr,\n  c.cbe * (1 - cbr / 10.0) AS crae,\n  c.vir / NULLIF(avs * 0.1, 0) AS vcsf,\n  ((10 -\
    \ avs) + aec + (10 - c.vir)) / 3.0 AS esq,\n  COALESCE(c.hist_prank <= 0.1 AND c.cult_prank <= 0.1,\
    \ false) AS high_value\nFROM (\nSELECT b.*, b.budget_w * 1.0 / SUM(b.budget_w) OVER () AS budget_ratio,\n\
    \  AVG(b.cpi * b.budget_w) OVER () / SUM(b.budget_w) OVER () AS cbe,\n  bool_or(b.conserve_status\
    \ = 'Critical' AND b.budget_alloc = 'Insufficient') OVER () AS any_critical_insufficient\nFROM (SELECT\n\
    \  ca.cond_id, a.\"ARTregID\" AS art_id, a.\"DYNASTY\" AS dynasty, a.\"MatKind\" AS material, a.conserve_status,\
    \ a.\"ageYears\" AS age_years,\n  r.\"HIST_sign\" AS hist_sign,\n  CAST(r.rating_profile->>'research_score'\
    \ AS DOUBLE) AS research_score,\n  CAST(r.rating_profile->>'cultural_score' AS DOUBLE) AS cultural_score,\n\
    \  rk.hist_prank, rk.cult_prank,\n  CASE a.conserve_status WHEN 'Excellent' THEN 1 WHEN 'Good' THEN\
    \ 3 WHEN 'Fair' THEN 5 WHEN 'Poor' THEN 7 WHEN 'Critical' THEN 10 END AS status_value,\n  (hist_sign\
    \ + research_score + cultural_score) * (10 - status_value) / 30.0 AS cpi,\n  s.\"ENVsense\" AS env_sensitivity,\n\
    \  s.env_handling_sensitivity->'environment'->>'light' AS light_sens,\n  s.env_handling_sensitivity->'environment'->>'humidity'\
    \ AS humidity_sens,\n  CASE light_sens WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10\
    \ END AS light_w,\n  CASE s.env_handling_sensitivity->'environment'->>'temperature' WHEN 'Low' THEN\
    \ 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS temp_w,\n  CASE humidity_sens WHEN 'Low' THEN\
    \ 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS hum_w,\n  CASE s.env_handling_sensitivity->'environment'->>'vibration'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS vib_w,\n  CASE s.env_handling_sensitivity->'environment'->>'pollutants'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS poll_w,\n  list_avg([light_w,\
    \ temp_w, hum_w, vib_w, poll_w]) AS erf,\n  CASE WHEN s.\"ART_link\" IS NOT NULL THEN (CASE WHEN light_w\
    \ = 10 THEN 1 ELSE 0 END) + (CASE WHEN temp_w = 10 THEN 1 ELSE 0 END) + (CASE WHEN hum_w = 10 THEN\
    \ 1 ELSE 0 END) + (CASE WHEN vib_w = 10 THEN 1 ELSE 0 END) + (CASE WHEN poll_w = 10 THEN 1 ELSE 0\
    \ END) END AS high_sens_count,\n  e.monitor_code, e.\"readTS\" AS read_ts, e.case_link AS case_id,\
    \ sc.hall_ref AS hall_id,\n  e.\"TEMPc\" AS temp_c, e.\"RH\" AS rh, e.\"tempVar24\" AS temp_var24,\
    \ e.\"RHvar\" AS rh_var,\n  CAST(sc.case_environment_profile->'physical_state'->>'leak_rate_per_day'\
    \ AS DOUBLE) AS leak_rate,\n  10 - ((temp_var24 + rh_var / 5.0 + leak_rate) / 3.0) AS sesr,\n  l.lux\
    \ AS lux_level, l.\"visLxh\" AS vis_lxh,\n  lux_level * light_w * vis_lxh / 1000.0 AS ler,\n  age_years\
    \ * erf * power(rh - 50, 2) * temp_c / 100000.0 AS mdr,\n  36 * (10 - light_w) * (10 - temp_w) * (10\
    \ - hum_w) / 1000.0 AS dsd,\n  u.\"displayMonths\" AS display_months,\n  cm.prio_tag, cm.budget_alloc,\
    \ cm.\"lastClean\" AS last_clean, cm.\"nextClean\" AS next_clean, cm.\"cleanDays\" AS clean_days,\n\
    \  CASE cm.budget_alloc WHEN 'Insufficient' THEN 1 WHEN 'Review Required' THEN 2 WHEN 'Adequate' THEN\
    \ 3 END AS budget_w,\n  CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_daily_visitors'\
    \ AS DOUBLE)\n    * CASE h.security_visitor_overview->'visitor_statistics'->>'visitor_flow' WHEN 'Low'\
    \ THEN 1 WHEN 'Medium' THEN 3 WHEN 'High' THEN 5 END\n    * CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_dwell_minutes'\
    \ AS DOUBLE) / 1000.0 AS vir\n FROM main.ConditionAssessments ca\n JOIN main.ArtifactsCore a ON a.\"\
    ARTregID\" = ca.art_exam\n LEFT JOIN main.ArtifactRatings r ON r.\"ART_link\" = a.\"ARTregID\"\n LEFT\
    \ JOIN (SELECT \"ART_link\",\n              PERCENT_RANK() OVER (ORDER BY \"HIST_sign\" DESC NULLS\
    \ LAST) AS hist_prank,\n              PERCENT_RANK() OVER (ORDER BY CAST(rating_profile->>'cultural_score'\
    \ AS DOUBLE) DESC NULLS LAST) AS cult_prank\n            FROM main.ArtifactRatings) rk ON rk.\"ART_link\"\
    \ = a.\"ARTregID\"\n LEFT JOIN main.SensitivityData s ON s.\"ART_link\" = a.\"ARTregID\"\n LEFT JOIN\
    \ main.LightAndRadiationReadings l ON l.rad_id = ca.light_link\n LEFT JOIN main.EnvironmentalReadingsCore\
    \ e ON e.monitor_code = l.env_link\n LEFT JOIN main.Showcases sc ON sc.\"caseID\" = e.case_link\n\
    \ LEFT JOIN main.ExhibitionHalls h ON h.\"Hall_ID\" = sc.hall_ref\n LEFT JOIN main.UsageRecords u\
    \ ON u.env_link = e.monitor_code\n LEFT JOIN main.ConservationAndMaintenance cm ON cm.monitor_link\
    \ = e.monitor_code) b) c) x\n"
  grain: one condition assessment (artifact x linked environmental reading)
  domains:
  - environmental_sensitivity
- name: overdue_days
  description: CURRENT_DATE - nextClean in days; positive = days overdue. NULL where nextClean is NULL
    (150 rows).
  sql_expression: current_date - cm."nextClean"
  source_model: main.ConservationAndMaintenance
  from_sql: main.ConservationAndMaintenance cm
  grain: one conservation and maintenance record
  domains:
  - budget_and_maintenance
tables:
- schema: main
  table: ArtifactsCore
  description: One row per artifact (995).
  columns:
  - name: ARTregID
    type: VARCHAR
    description: Artifact id, PK.
  - name: DYNASTY
    type: VARCHAR
    description: Han, Ming, Qing, Song, Tang, Yuan. Ming, Han, Tang are the historically significant dynasties
      for Dynasty Value Artifact.
  - name: ageYears
    type: BIGINT
    description: Age in years (used in MDR).
  - name: MatKind
    type: VARCHAR
    description: Bronze, Ceramic, Jade, Paper, Stone, Textile, Wood. Organic = Wood, Textile, Paper.
  - name: conserve_status
    type: VARCHAR
    description: Excellent (recently conserved, no issues)=1, Good (stable with minor issues)=3, Fair
      (stable but noticeable issues)=5, Poor (active deterioration)=7, Critical (severe deterioration
      requiring immediate intervention)=10 in CPI. 150 NULL = no status.
- schema: main
  table: ArtifactRatings
  description: Ratings; only 10 rows.
  columns:
  - name: HIST_sign
    type: BIGINT
    description: 'Historical Significance Rating, 1-10: 1-3 minor, 4-7 moderate, 8-10 exceptional historical
      importance. Used in CPI and the top-10 % high-value test.'
  - name: ART_link
    type: VARCHAR
    description: FK to ArtifactsCore.ARTregID.
  - name: rating_profile
    type: JSON
    description: JSON; research_score (Research Value Rating, 1-10), cultural_score (Cultural Score),
      exhibit_value, educational_value, public_access_rating (may be JSON null), conservation_difficulty,
      treatment_complexity, material_stability, deterioration_rate. Read with rating_profile->>'research_score'
      and CAST.
- schema: main
  table: SensitivityData
  description: Sensitivity profiles; only 3 rows.
  columns:
  - name: ENVsense
    type: VARCHAR
    description: Overall environmental sensitivity rating (High/Low/Medium); 'High' is used by Organic
      Material Vulnerability.
  - name: ART_link
    type: VARCHAR
    description: FK to ArtifactsCore.ARTregID.
  - name: env_handling_sensitivity
    type: JSON
    description: 'JSON: environment.{light,temperature,humidity,vibration,pollutants}, biological.pest,
      handling_transport.{handling,transport}, context.{display,storage}; values Low/Medium/High weighted
      1/5/10; JSON null possible. Light levels: Low tolerates up to 300 lux, Medium limited to 150-200
      lux, High restricted to 50 lux or less. Humidity levels: Low tolerates a wide range, Medium requires
      a controlled range, High requires a very stable and narrow range.'
- schema: main
  table: ExhibitionHalls
  description: 20 halls.
  columns:
  - name: Hall_ID
    type: VARCHAR
    description: Hall id, e.g. Hall-3.
  - name: security_visitor_overview
    type: JSON
    description: 'JSON: security.{cctv_coverage (Full = 100 % space coverage, Partial = 60-90 %, Limited
      = < 60 %), motion_detection, alarm_status, access_control}; visitor_statistics.{avg_daily_visitors,
      visitor_flow (Low=1, Medium=3, High=5 in VIR; may be null), avg_dwell_minutes}; behaviour_notes.'
- schema: main
  table: Showcases
  description: 953 showcases.
  columns:
  - name: caseID
    type: VARCHAR
    description: Showcase id.
  - name: hall_ref
    type: VARCHAR
    description: FK to ExhibitionHalls.Hall_ID.
  - name: case_environment_profile
    type: JSON
    description: 'JSON: physical_state.{airtightness_factor (~90-100 score), seal_state (Excellent/Good/Fair/Poor),
      leak_rate_per_day (0.0-0.5, air changes per day: museum-grade typically below 0.1, up to 5.0 indicates
      poor airtightness; used in SESR), internal_pressure_pa, construction_material}; maintenance.{maint_status,
      filter_status, silica_status, silica_last_replaced}; buffer_capacity; safety_and_power.'
- schema: main
  table: EnvironmentalReadingsCore
  description: 999 readings, one per monitor_code.
  columns:
  - name: monitor_code
    type: VARCHAR
    description: Reading id.
  - name: readTS
    type: TIMESTAMP
    description: Reading time, 2024-02-19 .. 2025-02-19.
  - name: case_link
    type: VARCHAR
    description: FK to Showcases.caseID.
  - name: TEMPc
    type: BIGINT
    description: Temperature C, stored integer 18-22; 150 NULL. Ideal 18-22 C; outside 10-30 C may indicate
      control failure.
  - name: tempVar24
    type: FLOAT
    description: 24h temperature variation C (0-2); > 1 = instability event; > 2 stresses materials. 150
      NULL.
  - name: RH
    type: BIGINT
    description: Relative humidity %, integer 45-55. Ideal 45-55 %; < 30 or > 65 significant risk.
  - name: RHvar
    type: BIGINT
    description: 24h humidity variation %, integer 0-5; > 3 = instability event; > 5 risky. Divide by
      5.0, not 5.
- schema: main
  table: AirQualityReadings
  columns:
  - name: env_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: air_quality_metrics
    type: JSON
    description: JSON. gases_ppm_ppb.co2_ppm is TEXT like '794 ppm' (parse with CAST(regexp_extract(..,
      '\d+') AS INT)); particulates.pm25_ug_m3 (clean < 5, > 15 potential risk, > 30 hazardous), pm10_ug_m3;
      air_flow.*.
- schema: main
  table: LightAndRadiationReadings
  columns:
  - name: rad_id
    type: BIGINT
    description: PK; referenced by ConditionAssessments.light_link.
  - name: env_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: lux
    type: BIGINT
    description: 'Light level in lux (150 NULL). Standards: 50 lux for highly sensitive, 150-200 lux medium,
      up to 300 lux low sensitivity materials.'
  - name: visLxh
    type: BIGINT
    description: Visible light exposure lux-hours (used in LER).
- schema: main
  table: ConditionAssessments
  description: 1000 assessments; the artifact -> reading -> showcase bridge.
  columns:
  - name: art_exam
    type: VARCHAR
    description: FK to ArtifactsCore.
  - name: case_exam
    type: VARCHAR
    description: FK to Showcases (matches the linked reading's case_link in almost all rows).
  - name: light_link
    type: BIGINT
    description: FK to LightAndRadiationReadings.rad_id; path to the artifact's environmental reading.
- schema: main
  table: ConservationAndMaintenance
  columns:
  - name: monitor_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: prio_tag
    type: VARCHAR
    description: 'Treatment priority: High, Low, Medium, Urgent (150 NULL). ''Urgent'' used in Conservation
      Emergency.'
  - name: lastClean
    type: DATE
    description: Last cleaning date.
  - name: nextClean
    type: DATE
    description: Next cleaning due date; Overdue Days = CURRENT_DATE - nextClean.
  - name: cleanDays
    type: BIGINT
    description: Days value used as cleaning interval days in CBR (150 NULL).
  - name: budget_alloc
    type: VARCHAR
    description: Adequate / Insufficient / Review Required; 'Insufficient' used in Conservation Budget
      Crisis; weighted 3/1/2 for the CBE budget ratio.
- schema: main
  table: UsageRecords
  columns:
  - name: env_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: displayMonths
    type: BIGINT
    description: Months on display = current display duration in rotation metrics.
- schema: main
  table: ArtifactSecurityAccess
  description: 3 rows keyed by loan_stat; no artifact or hall key.
  columns:
  - name: loan_stat
    type: VARCHAR
    description: 'PK: Available, Not Available, On Loan.'
  - name: insUSD
    type: FLOAT
    description: Insurance value USD; > 1,000,000 = high-value / high rarity. Max is 968,368.
  - name: SEC_LEVEL
    type: VARCHAR
    description: Level 1..3; 'Level 1' read as the lowest security level. All rows are 'Level 3'.
- schema: main
  table: RiskAssessments
  columns:
  - name: art_concern
    type: VARCHAR
    description: FK to ArtifactsCore.
  - name: hall_concern
    type: VARCHAR
    description: FK to ExhibitionHalls.
- schema: main
  table: SurfaceAndPhysicalReadings
  columns:
  - name: env_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
- schema: main
  table: Monitor_Showcase_Map
  columns:
  - name: mon_ID
    type: VARCHAR
    description: Monitor id (monitor_code).
  - name: case_ID
    type: VARCHAR
    description: Showcase id.
