  from_sql: main.ExhibitionHalls h
  grain: one exhibition hall
  domains:
  - visitors_and_security
- name: organic_material_vulnerability
  description: MatKind in ('Wood', 'Textile', 'Paper') AND overall environmental sensitivity SensitivityData.ENVsense
    = 'High'. These require specialized environmental controls.
  sql_expression: (x.material IN ('Wood', 'Textile', 'Paper') AND x.env_sensitivity = 'High')
  source_model: main.SensitivityData
  from_sql: "(SELECT c.*,\n  c.cpi * c.erf AS avs,\n  10 - abs(c.erf - c.sesr) AS aec,\n  c.sesr - c.erf\
    \ * 0.5 AS spa,\n  c.erf + c.ler + c.mdr * 2 AS tetl,\n  c.mdr * (1 + tetl / 20.0) AS map,\n  (c.dsd\
    \ - c.display_months) * (c.ler + 1) * (c.cpi + 1) / 100.0 AS erps,\n  10 - (abs(c.temp_c - 20) + abs(c.rh\
    \ - 50) / 5.0 + c.erf / 2.0) AS eci,\n  c.cpi * ((current_date - c.last_clean) - c.clean_days) / 100.0\
    \ AS cbr,\n  c.cbe * (1 - cbr / 10.0) AS crae,\n  c.vir / NULLIF(avs * 0.1, 0) AS vcsf,\n  ((10 -\
    \ avs) + aec + (10 - c.vir)) / 3.0 AS esq,\n  COALESCE(c.hist_prank <= 0.1 AND c.cult_prank <= 0.1,\
    \ false) AS high_value\nFROM (\nSELECT b.*, b.budget_w * 1.0 / SUM(b.budget_w) OVER () AS budget_ratio,\n\
    \  AVG(b.cpi * b.budget_w) OVER () / SUM(b.budget_w) OVER () AS cbe,\n  bool_or(b.conserve_status\
    \ = 'Critical' AND b.budget_alloc = 'Insufficient') OVER () AS any_critical_insufficient\nFROM (SELECT\n\
    \  ca.cond_id, a.\"ARTregID\" AS art_id, a.\"DYNASTY\" AS dynasty, a.\"MatKind\" AS material, a.conserve_status,\
    \ a.\"ageYears\" AS age_years,\n  r.\"HIST_sign\" AS hist_sign,\n  CAST(r.rating_profile->>'research_score'\
    \ AS DOUBLE) AS research_score,\n  CAST(r.rating_profile->>'cultural_score' AS DOUBLE) AS cultural_score,\n\
    \  rk.hist_prank, rk.cult_prank,\n  CASE a.conserve_status WHEN 'Excellent' THEN 1 WHEN 'Good' THEN\
    \ 3 WHEN 'Fair' THEN 5 WHEN 'Poor' THEN 7 WHEN 'Critical' THEN 10 END AS status_value,\n  (hist_sign\
    \ + research_score + cultural_score) * (10 - status_value) / 30.0 AS cpi,\n  s.\"ENVsense\" AS env_sensitivity,\n\
    \  s.env_handling_sensitivity->'environment'->>'light' AS light_sens,\n  s.env_handling_sensitivity->'environment'->>'humidity'\
    \ AS humidity_sens,\n  CASE light_sens WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10\
    \ END AS light_w,\n  CASE s.env_handling_sensitivity->'environment'->>'temperature' WHEN 'Low' THEN\
    \ 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS temp_w,\n  CASE humidity_sens WHEN 'Low' THEN\
    \ 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS hum_w,\n  CASE s.env_handling_sensitivity->'environment'->>'vibration'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS vib_w,\n  CASE s.env_handling_sensitivity->'environment'->>'pollutants'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS poll_w,\n  list_avg([light_w,\
    \ temp_w, hum_w, vib_w, poll_w]) AS erf,\n  CASE WHEN s.\"ART_link\" IS NOT NULL THEN (CASE WHEN light_w\
    \ = 10 THEN 1 ELSE 0 END) + (CASE WHEN temp_w = 10 THEN 1 ELSE 0 END) + (CASE WHEN hum_w = 10 THEN\
    \ 1 ELSE 0 END) + (CASE WHEN vib_w = 10 THEN 1 ELSE 0 END) + (CASE WHEN poll_w = 10 THEN 1 ELSE 0\
    \ END) END AS high_sens_count,\n  e.monitor_code, e.\"readTS\" AS read_ts, e.case_link AS case_id,\
    \ sc.hall_ref AS hall_id,\n  e.\"TEMPc\" AS temp_c, e.\"RH\" AS rh, e.\"tempVar24\" AS temp_var24,\
    \ e.\"RHvar\" AS rh_var,\n  CAST(sc.case_environment_profile->'physical_state'->>'leak_rate_per_day'\
    \ AS DOUBLE) AS leak_rate,\n  10 - ((temp_var24 + rh_var / 5.0 + leak_rate) / 3.0) AS sesr,\n  l.lux\
    \ AS lux_level, l.\"visLxh\" AS vis_lxh,\n  lux_level * light_w * vis_lxh / 1000.0 AS ler,\n  age_years\
    \ * erf * power(rh - 50, 2) * temp_c / 100000.0 AS mdr,\n  36 * (10 - light_w) * (10 - temp_w) * (10\
    \ - hum_w) / 1000.0 AS dsd,\n  u.\"displayMonths\" AS display_months,\n  cm.prio_tag, cm.budget_alloc,\
    \ cm.\"lastClean\" AS last_clean, cm.\"nextClean\" AS next_clean, cm.\"cleanDays\" AS clean_days,\n\
    \  CASE cm.budget_alloc WHEN 'Insufficient' THEN 1 WHEN 'Review Required' THEN 2 WHEN 'Adequate' THEN\
    \ 3 END AS budget_w,\n  CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_daily_visitors'\
    \ AS DOUBLE)\n    * CASE h.security_visitor_overview->'visitor_statistics'->>'visitor_flow' WHEN 'Low'\
    \ THEN 1 WHEN 'Medium' THEN 3 WHEN 'High' THEN 5 END\n    * CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_dwell_minutes'\
    \ AS DOUBLE) / 1000.0 AS vir\n FROM main.ConditionAssessments ca\n JOIN main.ArtifactsCore a ON a.\"\
    ARTregID\" = ca.art_exam\n LEFT JOIN main.ArtifactRatings r ON r.\"ART_link\" = a.\"ARTregID\"\n LEFT\
    \ JOIN (SELECT \"ART_link\",\n              PERCENT_RANK() OVER (ORDER BY \"HIST_sign\" DESC NULLS\
    \ LAST) AS hist_prank,\n              PERCENT_RANK() OVER (ORDER BY CAST(rating_profile->>'cultural_score'\
    \ AS DOUBLE) DESC NULLS LAST) AS cult_prank\n            FROM main.ArtifactRatings) rk ON rk.\"ART_link\"\
    \ = a.\"ARTregID\"\n LEFT JOIN main.SensitivityData s ON s.\"ART_link\" = a.\"ARTregID\"\n LEFT JOIN\
    \ main.LightAndRadiationReadings l ON l.rad_id = ca.light_link\n LEFT JOIN main.EnvironmentalReadingsCore\
    \ e ON e.monitor_code = l.env_link\n LEFT JOIN main.Showcases sc ON sc.\"caseID\" = e.case_link\n\
    \ LEFT JOIN main.ExhibitionHalls h ON h.\"Hall_ID\" = sc.hall_ref\n LEFT JOIN main.UsageRecords u\
    \ ON u.env_link = e.monitor_code\n LEFT JOIN main.ConservationAndMaintenance cm ON cm.monitor_link\
    \ = e.monitor_code) b) c) x\n"
  grain: one condition assessment (artifact x linked environmental reading)
  domains:
  - environmental_sensitivity
- name: temperature_implication
  description: 'Temperature Reading Implications: ideal 18-22 C; outside 10-30 C may indicate control
    failure; tempVar24 > 2 C within 24 h stresses materials (checked first).'
  sql_expression: CASE WHEN e."TEMPc" IS NULL THEN NULL WHEN e."TEMPc" < 10 OR e."TEMPc" > 30 THEN 'Possible
    Control Failure' WHEN e."tempVar24" > 2 THEN 'Fluctuation Stress' WHEN e."TEMPc" BETWEEN 18 AND 22
    THEN 'Ideal' ELSE 'Outside Ideal' END
  source_model: main.EnvironmentalReadingsCore
  from_sql: main.EnvironmentalReadingsCore e
  grain: one environmental reading
  domains:
  - environmental_sensitivity
- name: humidity_implication
  description: 'Relative Humidity Implications: ideal 45-55 %; RHvar > 5 % within 24 h risky; below 30
    % or above 65 % significant risk.'
  sql_expression: CASE WHEN e."RH" IS NULL THEN NULL WHEN e."RH" < 30 OR e."RH" > 65 THEN 'Significant
    Risk' WHEN e."RHvar" > 5 THEN 'Risky Fluctuation' WHEN e."RH" BETWEEN 45 AND 55 THEN 'Ideal' ELSE
    'Outside Ideal' END
  source_model: main.EnvironmentalReadingsCore
  from_sql: main.EnvironmentalReadingsCore e
  grain: one environmental reading
  domains:
  - environmental_sensitivity
- name: pm25_implication
  description: 'Fine particulate (PM2.5, air_quality_metrics.particulates.pm25_ug_m3): < 5 clean museum
    air; > 15 potential risk; > 30 hazardous; otherwise acceptable.'
  sql_expression: CASE WHEN CAST(aq.air_quality_metrics->'particulates'->>'pm25_ug_m3' AS DOUBLE) IS NULL
    THEN NULL WHEN CAST(aq.air_quality_metrics->'particulates'->>'pm25_ug_m3' AS DOUBLE) > 30 THEN 'Hazardous'
    WHEN CAST(aq.air_quality_metrics->'particulates'->>'pm25_ug_m3' AS DOUBLE) > 15 THEN 'Potential Risk'
    WHEN CAST(aq.air_quality_metrics->'particulates'->>'pm25_ug_m3' AS DOUBLE) < 5 THEN 'Clean' ELSE 'Acceptable'
    END
  source_model: main.AirQualityReadings
  from_sql: main.AirQualityReadings aq
  grain: one air quality reading
  domains:
  - environmental_sensitivity
