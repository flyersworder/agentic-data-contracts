    \ THEN 1 WHEN 'Medium' THEN 3 WHEN 'High' THEN 5 END\n    * CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_dwell_minutes'\
    \ AS DOUBLE) / 1000.0 AS vir\n FROM main.ConditionAssessments ca\n JOIN main.ArtifactsCore a ON a.\"\
    ARTregID\" = ca.art_exam\n LEFT JOIN main.ArtifactRatings r ON r.\"ART_link\" = a.\"ARTregID\"\n LEFT\
    \ JOIN (SELECT \"ART_link\",\n              PERCENT_RANK() OVER (ORDER BY \"HIST_sign\" DESC NULLS\
    \ LAST) AS hist_prank,\n              PERCENT_RANK() OVER (ORDER BY CAST(rating_profile->>'cultural_score'\
    \ AS DOUBLE) DESC NULLS LAST) AS cult_prank\n            FROM main.ArtifactRatings) rk ON rk.\"ART_link\"\
