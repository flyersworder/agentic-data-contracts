    \  rk.hist_prank, rk.cult_prank,\n  CASE a.conserve_status WHEN 'Excellent' THEN 1 WHEN 'Good' THEN\
    \ 3 WHEN 'Fair' THEN 5 WHEN 'Poor' THEN 7 WHEN 'Critical' THEN 10 END AS status_value,\n  (hist_sign\
    \ + research_score + cultural_score) * (10 - status_value) / 30.0 AS cpi,\n  s.\"ENVsense\" AS env_sensitivity,\n\
    \  s.env_handling_sensitivity->'environment'->>'light' AS light_sens,\n  s.env_handling_sensitivity->'environment'->>'humidity'\
    \ AS humidity_sens,\n  CASE light_sens WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10\
    \ END AS light_w,\n  CASE s.env_handling_sensitivity->'environment'->>'temperature' WHEN 'Low' THEN\
    \ 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS temp_w,\n  CASE humidity_sens WHEN 'Low' THEN\
    \ 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS hum_w,\n  CASE s.env_handling_sensitivity->'environment'->>'vibration'\
