    \ - 50) / 5.0 + c.erf / 2.0) AS eci,\n  c.cpi * ((current_date - c.last_clean) - c.clean_days) / 100.0\
    \ AS cbr,\n  c.cbe * (1 - cbr / 10.0) AS crae,\n  c.vir / NULLIF(avs * 0.1, 0) AS vcsf,\n  ((10 -\
    \ avs) + aec + (10 - c.vir)) / 3.0 AS esq,\n  COALESCE(c.hist_prank <= 0.1 AND c.cult_prank <= 0.1,\
    \ false) AS high_value\nFROM (\nSELECT b.*, b.budget_w * 1.0 / SUM(b.budget_w) OVER () AS budget_ratio,\n\
    \  AVG(b.cpi * b.budget_w) OVER () / SUM(b.budget_w) OVER () AS cbe,\n  bool_or(b.conserve_status\
    \ = 'Critical' AND b.budget_alloc = 'Insufficient') OVER () AS any_critical_insufficient\nFROM (SELECT\n\
    \  ca.cond_id, a.\"ARTregID\" AS art_id, a.\"DYNASTY\" AS dynasty, a.\"MatKind\" AS material, a.conserve_status,\
