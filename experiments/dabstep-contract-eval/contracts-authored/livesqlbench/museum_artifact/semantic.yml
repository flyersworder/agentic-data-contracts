- name: showcase_environmental_stability_rating
  description: 'SESR = 10 - ((tempVar24 + (RHvar / 5) + leak_rate_per_day) / 3), per environmental reading
    joined to its showcase. Higher = more stable. Average per showcase if a showcase-level figure is needed.
    Also available as x.sesr in the artifact context.

    '
  sql_expression: 10 - ((e."tempVar24" + e."RHvar" / 5.0 + CAST(sc.case_environment_profile->'physical_state'->>'leak_rate_per_day'
    AS DOUBLE)) / 3.0)
  source_model: main.Showcases
  from_sql: main.EnvironmentalReadingsCore e JOIN main.Showcases sc ON sc."caseID" = e.case_link
  grain: one environmental reading of a showcase
  domains:
