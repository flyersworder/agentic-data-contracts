  description: 'SRE = (insUSD / 100000) * (10 - VIR) / 10. Higher = greater risk. ArtifactSecurityAccess
    has no artifact/hall key, so this is evaluated for each security record x hall pair; it cannot be
    attributed to a specific artifact.

    '
  sql_expression: (sa."insUSD" / 100000.0) * (10 - CAST(h.security_visitor_overview->'visitor_statistics'->>'avg_daily_visitors'
