# Authored by dce.author -- do not edit; re-author instead.
# benchmark: dataagentbench, database: stockindex, author: claudeopus5.5
version: '1.0'
name: stockindex
semantic:
  source:
    type: yaml
    path: ./semantic.yml
  allowed_tables:
  - schema: indexinfo_database
    description: 'Metadata about stock market indices from major exchanges around the world, including
      the United States, China, Canada, Germany, Japan and more (described as stored in SQLite; queried
      here as a DuckDB schema). One table, index_info: Exchange (full name of the stock exchange) and
      Currency (trading currency of the exchange).'
    tables:
    - index_info
  - schema: indextrade_database
    description: 'Daily price data for indices tracking stock exchanges across various countries and regions
      (DuckDB). One table, index_trade: Index (abbreviated index symbol), Date (trading date, stored as
      text in mixed formats), Open, High, Low, Close, Adj Close, CloseUSD (closing price in USD).'
    preferred: true
    tables:
    - index_trade
  forbidden_operations:
  - DELETE
  - DROP
  - TRUNCATE
  - UPDATE
  - INSERT
  - CREATE
  - ALTER
  - MERGE
  - GRANT
  - REVOKE
  - COPY
  domains:
  - name: index_prices
    summary: Daily OHLC, adjusted close and USD close per index
    description: 'One row of indextrade_database.index_trade is one index on one trading day. Fields:
      Index = abbreviated index symbol; Date = trading date; Open = opening price; High = highest price
      during the day; Low = lowest price during the day; Close = closing price; "Adj Close" = adjusted
      closing price; CloseUSD = closing price in USD.

      DATA FINDINGS (checked with SQL): 104,224 rows, 13 index symbols (000001.SS, 399001.SZ, GDAXI, GSPTSE,
      HSI, IXIC, J203.JO, N100, N225, NSEI, NYA, SSMI, TWII); (Index, Date) is unique; no NULLs in any
      price column. Date is VARCHAR in three mixed formats: ''1987-01-05 00:00:00'' (%Y-%m-%d %H:%M:%S),
      ''31 Dec 1986, 00:00'' (%d %b %Y, %H:%M) and ''January 02, 1987 at 12:00 AM'' (%B %d, %Y at %I:%M
      %p). String comparison/MIN/MAX/ordering on Date is WRONG; always parse with the metric `trade_date`
      (parses 100% of rows). Parsed range 1965-01-05 to 2021-06-03. Prices are in the index''s local currency;
      to compare across indices use CloseUSD. CloseUSD equals Close times a constant per-index conversion
      factor (e.g. 1.0 for NYA and IXIC, ~0.13 for HSI, ~0.01 for N225) — no Open/High/Low in USD exist;
      if needed, scale them by CloseUSD/Close. "Adj Close" differs from Close only for GSPTSE, TWII and
      399001.SZ. Quote "Adj Close" (contains a space).

      '
    tables:
    - indextrade_database.index_trade
  - name: exchanges
    summary: Exchanges and their trading currencies
    description: 'indexinfo_database.index_info lists 14 exchanges with their trading currency: New York
      Stock Exchange USD, NASDAQ USD, Hong Kong Stock Exchange HKD, Shanghai Stock Exchange CNY, Tokyo
      Stock Exchange JPY, Euronext EUR, Shenzhen Stock Exchange CNY, Toronto Stock Exchange CAD, National
      Stock Exchange of India INR, Frankfurt Stock Exchange EUR, Korea Exchange KRW, SIX Swiss Exchange
      CHF, Taiwan Stock Exchange TWD, Johannesburg Stock Exchange ZAR.

      There is NO join key between index_info and index_trade. INTERPRETATION (not in the documentation;
      standard market knowledge of the symbols): NYA = New York Stock Exchange; IXIC = NASDAQ; HSI = Hong
      Kong Stock Exchange; 000001.SS = Shanghai Stock Exchange; N225 = Tokyo Stock Exchange; N100 = Euronext;
      399001.SZ = Shenzhen Stock Exchange; GSPTSE = Toronto Stock Exchange; NSEI = National Stock Exchange
      of India; GDAXI = Frankfurt Stock Exchange; SSMI = SIX Swiss Exchange; TWII = Taiwan Stock Exchange;
      J203.JO = Johannesburg Stock Exchange. Korea Exchange (KS11) has no price rows. The metric `index_exchange`
      encodes this mapping; `index_currency` joins on it.

      '
    tables:
    - indexinfo_database.index_info
    - indextrade_database.index_trade
  rules:
  - name: parse_date_before_use
    description: 'Never filter, order, group or take MIN/MAX on the raw Date string; it mixes three formats.
      Use the `trade_date` expression.

      '
    enforcement: warn
  - name: use_usd_for_cross_index_comparison
    description: 'Prices are in each index''s local currency; compare levels across indices only via CloseUSD
      (or ratios/returns, which are currency-free).

      '
    enforcement: warn
