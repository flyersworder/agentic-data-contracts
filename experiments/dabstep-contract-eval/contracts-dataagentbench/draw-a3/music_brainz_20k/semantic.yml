# benchmark: dataagentbench, database: music_brainz_20k, author: claudeopus5.5
metrics:
- name: total_revenue_usd
  description: 'Total revenue in USD generated by sales: sum of sales.revenue_usd (no NULLs in the data).

    '
  sql_expression: SUM(s.revenue_usd)
  source_model: sales_database.sales
  from_sql: sales_database.sales s
  grain: one row per sale record
  domains:
  - sales
- name: total_units_sold
  description: 'Total number of units sold: sum of sales.units_sold.'
  sql_expression: SUM(s.units_sold)
  source_model: sales_database.sales
  from_sql: sales_database.sales s
  grain: one row per sale record
  domains:
  - sales
- name: sale_count
  description: Number of sale records (transactions), counted by sale_id.
  sql_expression: COUNT(DISTINCT s.sale_id)
  source_model: sales_database.sales
  from_sql: sales_database.sales s
  grain: one row per sale record
  domains:
  - sales
- name: revenue_per_unit_usd
  description: 'Average revenue per unit sold in USD: total revenue divided by total units (a volume-weighted
    price, not an average of per-sale prices).

    '
  sql_expression: SUM(s.revenue_usd) / NULLIF(SUM(s.units_sold), 0)
  source_model: sales_database.sales
  from_sql: sales_database.sales s
  grain: one row per sale record
  domains:
  - sales
- name: track_revenue_usd
  description: 'Revenue in USD per track record, with track attributes available via the join (group by
    t.track_id and any t.* attribute or cleaned-field metric). Join is sales.track_id = tracks.track_id,
    many sales to one track. Every track has at least one sale.

    '
  sql_expression: SUM(s.revenue_usd)
  source_model: sales_database.sales
  from_sql: sales_database.sales s JOIN tracks_database.tracks t ON s.track_id = t.track_id
  grain: one row per sale record, carrying its track's attributes
  domains:
  - sales
  - tracks
- name: track_units_sold
  description: 'Units sold per track record, with track attributes available via the join (sales.track_id
    = tracks.track_id).

    '
  sql_expression: SUM(s.units_sold)
  source_model: sales_database.sales
  from_sql: sales_database.sales s JOIN tracks_database.tracks t ON s.track_id = t.track_id
  grain: one row per sale record, carrying its track's attributes
  domains:
  - sales
  - tracks
- name: track_count
  description: 'Number of track records (distinct track_id). Tracks may include duplicates of the same
    song from different sources; the documentation gives no dedup rule, so this counts records.

    '
  sql_expression: COUNT(DISTINCT t.track_id)
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
- name: track_release_year
  description: 'Year of publication as an INTEGER parsed from the free-form tracks.year string. Spaces
    and apostrophes are stripped first. Four digits are taken as-is; one or two digits are a two-digit
    year: 00-20 -> 2000-2020, 21-99 -> 1921-1999 (cutoff chosen from the data: plausible four-digit years
    top out around 2014, and two-digit values 00-15 are dense while 21+ are sparse and look like 19xx).
    Anything else ('''', ''unk.'', ''n.a.'', ''unknown'', ''null'', stray text) is NULL. Note: some four-digit
    values are typos (e.g. 2090, 9198, 0028, 1007); filter to BETWEEN 1900 AND 2025 when a plausible year
    is needed.

    '
  sql_expression: "CASE\n  WHEN regexp_full_match(regexp_replace(t.year, '[\\s'']', '', 'g'), '[0-9]{4}')\n\
    \    THEN CAST(regexp_replace(t.year, '[\\s'']', '', 'g') AS INTEGER)\n  WHEN regexp_full_match(regexp_replace(t.year,\
    \ '[\\s'']', '', 'g'), '[0-9]{1,2}')\n    THEN CASE WHEN CAST(regexp_replace(t.year, '[\\s'']', '',\
    \ 'g') AS INTEGER) <= 20\n              THEN 2000 + CAST(regexp_replace(t.year, '[\\s'']', '', 'g')\
    \ AS INTEGER)\n              ELSE 1900 + CAST(regexp_replace(t.year, '[\\s'']', '', 'g') AS INTEGER)\
    \ END\nEND\n"
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
- name: track_length_seconds
  description: 'Track length in seconds (DOUBLE), parsed from the free-form tracks.length string ("in
    seconds or formatted string") by source_id, after removing whitespace and lower-casing: source 1 ''mm:ss''
    (letter o read as 0); source 2 plain seconds; source 3 decimal minutes (x 60); source 4 ''Xm Ysec''
    or ''Xm-Ysec''; source 5 milliseconds (/ 1000). Unparseable values ('''', ''unk.'', ''n.a.'', ''unknown'',
    text) are NULL. Verified: median parsed length is 212-222 s in every source.

    '
  sql_expression: "CASE\n  WHEN t.source_id = 1 AND regexp_full_match(replace(regexp_replace(lower(t.length),\
    \ '\\s', '', 'g'), 'o', '0'), '[0-9]+:[0-9]+')\n    THEN CAST(split_part(replace(regexp_replace(lower(t.length),\
    \ '\\s', '', 'g'), 'o', '0'), ':', 1) AS INTEGER) * 60\n       + CAST(split_part(replace(regexp_replace(lower(t.length),\
    \ '\\s', '', 'g'), 'o', '0'), ':', 2) AS INTEGER)\n  WHEN t.source_id = 2 THEN TRY_CAST(regexp_replace(t.length,\
    \ '\\s', '', 'g') AS DOUBLE)\n  WHEN t.source_id = 3 THEN TRY_CAST(regexp_replace(t.length, '\\s',\
    \ '', 'g') AS DOUBLE) * 60\n  WHEN t.source_id = 4 AND regexp_full_match(regexp_replace(lower(t.length),\
    \ '\\s', '', 'g'), '[0-9]+m-?[0-9]+sec')\n    THEN CAST(regexp_extract(regexp_replace(lower(t.length),\
    \ '\\s', '', 'g'), '^([0-9]+)m', 1) AS INTEGER) * 60\n       + CAST(regexp_extract(regexp_replace(lower(t.length),\
    \ '\\s', '', 'g'), '([0-9]+)sec', 1) AS INTEGER)\n  WHEN t.source_id = 5 THEN TRY_CAST(regexp_replace(t.length,\
    \ '\\s', '', 'g') AS DOUBLE) / 1000\nEND\n"
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
- name: track_is_english
  description: 'True when the track''s language is English in any of its stored spellings. The key is
    lower(language) with all non-letters removed; it is English when it is ''e'', is within Damerau-Levenshtein
    distance 2 of ''english'' (''englsih'', ''nenglish'', ''eglish'', ...), or has at most 4 letters and
    is within distance 1 of ''eng'' (''eng'', ''en'', ''eg'', ''neg'', ''eeng'', ...). Checked against
    the full list of distinct values: every match is an English variant, and no other language (polish,
    spanish, ger, ...) matches.

    '
  sql_expression: "(lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'e'\n OR damerau_levenshtein(lower(regexp_replace(t.language,\
    \ '[^A-Za-z]', '', 'g')), 'english') <= 2\n OR (length(lower(regexp_replace(t.language, '[^A-Za-z]',\
    \ '', 'g'))) BETWEEN 1 AND 4\n     AND damerau_levenshtein(lower(regexp_replace(t.language, '[^A-Za-z]',\
    \ '', 'g')), 'eng') <= 1))\n"
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
- name: track_language_normalized
  description: 'Language name normalized: English variants (see track_is_english) -> ''English''; the
    abbreviations Ger./Spa./Fre./Jap./Ita./Por./Fin./Rus./ Swe./Dut. -> German/Spanish/French/Japanese/Italian/Portuguese/Finnish/
    Russian/Swedish/Dutch; '''', ''unknown'', ''unk.'', ''n.a.'', ''null'' -> NULL (unknown); ''[Multiple
    languages]'' kept as ''Multiple languages''; everything else title-cased as stored. Rare misspellings
    of non-English languages (e.g. ''egrman'') remain unmapped.

    '
  sql_expression: "CASE\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) IN ('', 'unknown',\
    \ 'unk', 'na', 'null') OR t.language IS NULL THEN NULL\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]',\
    \ '', 'g')) = 'e'\n    OR damerau_levenshtein(lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')),\
    \ 'english') <= 2\n    OR (length(lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g'))) <= 4\n\
    \        AND damerau_levenshtein(lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')), 'eng') <=\
    \ 1) THEN 'English'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'multiplelanguages'\
    \ THEN 'Multiple languages'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'ger'\
    \ THEN 'German'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'spa' THEN 'Spanish'\n\
    \  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'fre' THEN 'French'\n  WHEN lower(regexp_replace(t.language,\
    \ '[^A-Za-z]', '', 'g')) = 'jap' THEN 'Japanese'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]',\
    \ '', 'g')) = 'ita' THEN 'Italian'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g'))\
    \ = 'por' THEN 'Portuguese'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'fin'\
    \ THEN 'Finnish'\n  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'rus' THEN 'Russian'\n\
    \  WHEN lower(regexp_replace(t.language, '[^A-Za-z]', '', 'g')) = 'swe' THEN 'Swedish'\n  WHEN lower(regexp_replace(t.language,\
    \ '[^A-Za-z]', '', 'g')) = 'dut' THEN 'Dutch'\n  ELSE upper(left(trim(t.language), 1)) || lower(substr(trim(t.language),\
    \ 2))\nEND\n"
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
- name: track_artist_clean
  description: 'Artist name: for source 2, whose artist column is empty and whose title is ''Artist -
    Title'', the part of the title before the first '' - ''; otherwise the trimmed artist column. Empty
    strings and ''[unknown]'' -> NULL.

    '
  sql_expression: "NULLIF(NULLIF(trim(CASE\n  WHEN t.source_id = 2 AND (t.artist IS NULL OR trim(t.artist)\
    \ = '') AND strpos(t.title, ' - ') > 0\n    THEN split_part(t.title, ' - ', 1)\n  ELSE t.artist END),\
    \ ''), '[unknown]')\n"
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
- name: track_title_clean
  description: 'Track title with source-specific decorations removed: source 2 drops the leading ''Artist
    - ''; source 3 drops the trailing '' - Album'' (text after the last '' - ''); source 4 drops a leading
    ''NNN-'' track number; others are trimmed as stored (source 1 titles may still end in '' (Album)'').
    Empty -> NULL. Heuristic: a real title containing '' - '' in sources 2/3 is split too.

    '
  sql_expression: "NULLIF(trim(CASE\n  WHEN t.source_id = 2 AND strpos(t.title, ' - ') > 0 THEN substr(t.title,\
    \ strpos(t.title, ' - ') + 3)\n  WHEN t.source_id = 3 AND strpos(t.title, ' - ') > 0 THEN regexp_replace(t.title,\
    \ ' - [^-]*$', '')\n  WHEN t.source_id = 4 THEN regexp_replace(t.title, '^[0-9]+-', '')\n  ELSE t.title\
    \ END), '')\n"
  source_model: tracks_database.tracks
  from_sql: tracks_database.tracks t
  grain: one row per track record
  domains:
  - tracks
tables:
- schema: tracks_database
  table: tracks
  columns:
  - name: track_id
    type: BIGINT
    description: Unique identifier for the track record in this database (verified unique). Joins to sales.track_id.
  - name: source_id
    type: BIGINT
    description: Identifier of the source from which the track record originates (values 1-5). Field formats
      differ by source; see the tracks domain.
  - name: source_track_id
    type: VARCHAR
    description: Original track identifier from the source; uniqueness is not guaranteed (19,208 distinct
      for 19,375 rows). Do not join on it.
  - name: title
    type: VARCHAR
    description: 'Title of the track. Source 2: ''Artist - Title''; source 3: ''Title - Album''; source
      4: ''NNN-Title''; source 1 may append '' (Album)''. See track_title_clean.'
  - name: artist
    type: VARCHAR
    description: Name of the track's artist or band. Empty for nearly all of source 2 (artist is in title);
      '[unknown]' marks unknown. See track_artist_clean.
  - name: album
    type: VARCHAR
    description: Name of the album in which the track appears. Empty for nearly all of source 3; source
      4 appends ' (year)'.
  - name: year
    type: VARCHAR
    description: Year of publication, free-form string (4-digit, 2-digit, apostrophe 2-digit, empty, 'unk.',
      noise). Use track_release_year.
  - name: length
    type: VARCHAR
    description: 'Length of the track (in seconds or formatted string): mm:ss (source 1), seconds (2),
      decimal minutes (3), ''Xm Ysec'' (4), milliseconds (5). Use track_length_seconds.'
  - name: language
    type: VARCHAR
    description: Language of the track; full names, abbreviations ('Eng.'), misspellings and unknown markers.
      Use track_language_normalized / track_is_english.
- schema: sales_database
  table: sales
  columns:
  - name: sale_id
    type: INTEGER
    description: Unique identifier for the sale record.
  - name: track_id
    type: INTEGER
    description: Identifier linking the sale to a track in tracks_database.tracks (track_id). All values
      match a track.
  - name: country
    type: VARCHAR
    description: 'Country in which the sale occurred: Canada, France, Germany, UK, USA.'
  - name: store
    type: VARCHAR
    description: 'Store or platform where the sale occurred: Amazon Music, Apple Music, Google Play, Spotify,
      iTunes.'
  - name: units_sold
    type: INTEGER
    description: Number of units sold in this transaction (1-499).
  - name: revenue_usd
    type: DOUBLE
    description: Revenue generated in USD from this sale (0.99-641.82, no NULLs).
relationships:
- from: sales_database.sales.track_id
  to: tracks_database.tracks.track_id
  type: many_to_one
  description: Each sale belongs to one track record; every track has at least one sale.
