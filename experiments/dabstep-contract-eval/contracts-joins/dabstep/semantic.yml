metrics:
- name: intracountry_transaction
  description: 'A transaction is intracountry (domestic) if the issuing country equals the acquirer country;
    false (international) otherwise.


    From the manual section "5 Understanding Payment Processing Fees".'
  sql_expression: issuing_country = acquirer_country
  source_model: main.payments
  domains:
  - 5_understanding_payment_processing_fees
- name: is_local_acquiring
  description: 'A transaction is considered local acquiring when the issuing country of the card equals
    the acquirer country.


    From the manual section "5.1.1 Optimizing Transactions through Local Acquiring".'
  sql_expression: issuing_country = acquirer_country
  source_model: main.payments
  domains:
  - 5_1_1_optimizing_transactions_through_local_acquiring
- name: fraud_rate
  description: 'Fraud defined as the ratio of fraudulent volume over total volume: sum of eur_amount of
    transactions with has_fraudulent_dispute=true divided by sum of eur_amount of all transactions.


    From the manual section "7 Reducing Fraud-Related Fees".'
  sql_expression: SUM(CASE WHEN has_fraudulent_dispute THEN eur_amount ELSE 0 END) / SUM(eur_amount)
  source_model: main.payments
  domains:
  - 7_reducing_fraud_related_fees
- name: authorization_rate
  description: 'Authorization Rate KPI: share of transactions not refused by Adyen (i.e. successfully
    authorized), computed as 1 minus the refusal rate over all payments.


    From the manual section "8.2 Leveraging Reporting Tools for Data-Driven Insights".'
  sql_expression: AVG(CASE WHEN is_refused_by_adyen THEN 0.0 ELSE 1.0 END)
  source_model: main.payments
  domains:
  - 8_2_leveraging_reporting_tools_for_data_driven_insights
- name: fraud_rate_kpi_8_2
  description: 'Fraud Rate KPI: ratio of transactions flagged with a fraudulent dispute over total transactions.


    From the manual section "8.2 Leveraging Reporting Tools for Data-Driven Insights".'
  sql_expression: AVG(CASE WHEN has_fraudulent_dispute THEN 1.0 ELSE 0.0 END)
  source_model: main.payments
  domains:
  - 8_2_leveraging_reporting_tools_for_data_driven_insights
