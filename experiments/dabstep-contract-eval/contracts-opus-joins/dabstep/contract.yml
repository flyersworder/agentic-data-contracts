  - name: 2_account_type
    summary: 2 Account Type
    description: '## 2. Account Type


      We categorize merchants into different account types based on their business model and industry
      classification. The following table outlines the various account types:


      | Account Type | Description             |

      |--------------|-------------------------|

      | R            | Enterprise - Retail     |

      | D            | Enterprise - Digital    |

      | H            | Enterprise - Hospitality|

      | F            | Platform - Franchise    |

      | S            | Platform - SaaS         |

      | O            | Other                   |


      This categorization is used to provide more targeted support and services to merchants, and to facilitate
