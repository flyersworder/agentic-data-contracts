  - name: FormatType
    type: VARCHAR
    description: 'TEXT. Data-format type (e.g., CSV, Parquet). Possible values: Mixed, Structured, Unstructured.
      Possible values: Mixed, Structured, Unstructured.'
  - name: qlty_score
    type: FLOAT
    description: 'REAL. Data quality score. Example: 52.45. Example: 52.45.'
  - name: Int_check
    type: VARCHAR
    description: 'TEXT. Data-integrity check result. **NULL means integrity check not performed.**. Possible
      values: Failed, Partial, Passed. Possible values: Failed, Partial, Passed.'
  - name: CSUMVERIFY
    type: VARCHAR
