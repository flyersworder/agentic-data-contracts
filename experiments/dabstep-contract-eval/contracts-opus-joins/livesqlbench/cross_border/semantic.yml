  - name: data_map_state
    type: VARCHAR
    description: 'TEXT. Data-mapping state. Possible values: Complete, Outdated, Partial. Possible values:
      Complete, Outdated, Partial.'
  - name: SYSINTSTATE
    type: VARCHAR
    description: 'TEXT. System-integration state. Possible values: Fully Integrated, Manual, Partial.
      Possible values: Fully Integrated, Manual, Partial.'
  - name: AccReqNum
    type: BIGINT
    description: 'BIGINT. Data-access request count. Example: 959. Example: 959.'
  - name: DEL_REQ_NUM
    type: BIGINT
    description: 'BIGINT. Deletion request count. Example: 409. Example: 409.'
  - name: rect_req_num
    type: BIGINT
    description: 'BIGINT. Rectification request count. Example: 76. Example: 76.'
  - name: PORTREQNUM
    type: BIGINT
    description: 'BIGINT. Portability request count. Example: 53. Example: 53.'
  - name: resp_time_day
    type: FLOAT
    description: 'REAL. Average response time in days. Example: 4.5. Example: 4.5.


      Response Time: Shows how many days it takes to reply to a request.


      Lower means faster response; higher means delays.


      Compiler note: This entry describes the average response time in days for data subject requests.'
- schema: main
  table: Compliance
  columns:
  - name: complianceTrace
    type: BIGINT
    description: BIGINT. Unique compliance record identifier. PK.
  - name: risk_tie
    type: BIGINT
    description: BIGINT. Linked risk-management identifier. FK to RiskManagement.
  - name: vendorTie
    type: BIGINT
    description: BIGINT. Linked vendor-management identifier. FK to VendorManagement.
  - name: recordRegistry
    type: VARCHAR
    description: TEXT. Record registry reference string.
  - name: LEGALBASE
    type: VARCHAR
    description: 'TEXT. Legal basis for processing. **NULL means legal basis not determined.**. Possible
      values: Consent, Contract, Legal Obligation, Legitimate Interest. Possible values: Consent, Contract,
      Legal Obligation, Legitimate Interest.'
  - name: consent_state
    type: VARCHAR
    description: 'TEXT. Consent state descriptor. Possible values: Expired, Not Required, Pending, Valid.
      Possible values: Expired, Not Required, Pending, Valid.'
  - name: ConsentColl
    type: DATE
    description: 'DATE. Date when consent was collected. Example: 13 Sep 2024. Example: 13 Sep 2024.'
  - name: consent_exp
    type: DATE
