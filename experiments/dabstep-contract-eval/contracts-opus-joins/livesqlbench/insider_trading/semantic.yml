# Compiled by dce.compile -- do not edit; recompile instead.
# benchmark: livesqlbench, database: insider_trading, compiler: claudeopus5.5 (joins)
# inputs: insider_trading_kb.jsonl, insider_trading_column_meaning_base.json, insider_trading_schema.txt, insider_trading.duckdb
metrics:
- name: daily_turnover_rate_dtr
  description: 'Calculates the ratio of a trader''s daily trading volume to their account balance, indicating
    capital velocity.


    DTR = \frac{\text{Daily Trading Volume}}{\text{Account Balance}}


    Compiler note: Account balance is stored as text like ''$4,692,991 '' in traders.trader_fin_data->>''usd_bal'';
    strip ''$'', commas and whitespace, then cast (all 995 parse, none are zero). Daily volume = trade_records.vol_day.
    The stored bal_turnover text column does not match vol_day/balance (e.g. 2.69 vs 0.148), so the formula
    is computed directly instead of using it.'
  sql_expression: t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM(r.trader_fin_data->>'usd_bal'), '$', ''),
    ',', '') AS DOUBLE), 0)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor
  grain: one row per trade record, with its trader
  domains:
  - calculations
- name: order_modification_intensity_omi
  description: 'Measures how frequently a trader modifies orders relative to their cancellation rate.


    OMI = \frac{\text{Order Modification Frequency}}{1 - \text{Order Cancellation Percentage}} \text{
    (undefined if cancellation percentage is 1)}


    Compiler note: mod_freq and cancel_pct read from order_behaviour.order_metrics JSON; cancel_pct is
    stored as a fraction (0-0.299), so used directly in 1 - cancel_pct. NULLIF makes it undefined (NULL)
    when cancel_pct = 1; NULL cancel_pct yields NULL.'
  sql_expression: (order_metrics->>'mod_freq')::double / NULLIF(1 - (order_metrics->>'cancel_pct')::double,
    0)
  source_model: main.order_behaviour
  domains:
  - calculations
- name: trader_leverage_exposure_tle
  description: 'Extracts the leverage ratio from the trader''s performance data.


    TLE = A trader''s leverage ratio, typically found within their performance metrics.


    Compiler note: lev_ratio stored in trade_perf JSON as numeric (double/int) or JSON null; extracted
    as text and cast to DOUBLE. Grain: one value per trade record.'
  sql_expression: CAST(trade_perf->>'lev_ratio' AS DOUBLE)
  source_model: main.trade_records
  domains:
  - calculations
- name: suspicious_activity_index_sai
  description: 'A composite index attempting to quantify overall suspicious trading behavior based on
    risk indicators.


    SAI is a weighted sum of normalized risk indicators, including probabilities for spoofing, front-running,
    wash trading, and confirmed layering.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: The entry calls SAI a weighted sum of normalized risk indicators (spoofing probability,
    front-running, wash trading, confirmed layering), but it gives no weights, no normalization method
    and no numeric mapping for the categorical inputs (wash_flag High/Medium/Low, layer_idx Confirmed/Suspected).
    Its list of indicators is also open-ended ('including'). Any formula would be a guess, not the documented
    computation.
- name: pattern_anomaly_score_pas
  description: 'Measures the deviation of a trader''s pattern similarity from their peer correlation,
    potentially indicating unique illicit behavior.


    PAS = |\text{Pattern Similarity Score} - \text{Peer Correlation Score}|


    Compiler note: Pattern Similarity Score = reg_compliance.pat_rec (the only pattern-recognition score).
    It is stored on a 0-100 scale (0.03 to 99.99), not the 0-1 range described in the documentation. I
    used it as stored, without rescaling. Peer Correlation = market_conditions.market_metrics->>''peer_corr''
    (range -0.99 to 1; NULL in 400 of 999 rows, which gives NULL PAS). The join is 1:1 on REC_COMP = REC_PIN,
    and every compliance row matches.'
  sql_expression: ABS(r.pat_rec - CAST(m.market_metrics->>'peer_corr' AS DOUBLE))
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.market_conditions m ON m."REC_PIN" = r."REC_COMP"
  grain: one row per compliance record (trade record), with its market conditions
  domains:
  - calculations
- name: compliance_recidivism_score_crs
  description: 'Calculates a score indicating the tendency for repeat compliance issues, adjusted for
    account age.


    CRS = \frac{\text{Number of Previous Violations}}{\text{Max}(1, \frac{\text{Account Age in Days}}{365})}


    Compiler note: prev_viol from reg_compliance.compliance_data JSON; age_days from traders.trader_fin_data
    JSON. Joined through trade_records (REC_KEY = REC_COMP, which is the shared record key) to the trader
    (tr_anchor). 998 of 999 compliance rows match a trade record. Float division so the age in years isn''t
    truncated.'
  sql_expression: CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0)
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.trade_records t ON t."REC_KEY" = r."REC_COMP" JOIN main.traders
    tr ON tr."TR_KEY" = t.tr_anchor
  grain: one row per compliance case (trade record), with its trader
  domains:
  - calculations
- name: investigation_intensity_index_iii
  description: 'Combines behavioral and network analysis scores from an investigation.


    III = (0.6 \times \text{Behavioral Analysis Score}) + (0.4 \times \text{Network Analysis Score})


    Compiler note: Behavioral Analysis Score = reg_compliance.behav_score, Network Analysis Score = reg_compliance.net_score
    (both REAL).'
  sql_expression: 0.6 * behav_score + 0.4 * net_score
  source_model: main.reg_compliance
  domains:
  - calculations
- name: sentiment_divergence_factor_sdf
  description: 'Measures the difference between news and social media sentiment scores.


    SDF = |\text{News Sentiment Score} - \text{Social Sentiment Score}|


    Compiler note: news_score and soc_sent are stored as JSON numbers in sentiment_data; they are cast
    to DOUBLE.'
  sql_expression: ABS(CAST(sentiment_data->>'news_score' AS DOUBLE) - CAST(sentiment_data->>'soc_sent'
    AS DOUBLE))
  source_model: main.sentiment_analytics
  domains:
  - calculations
- name: relative_short_interest_rsi
  description: 'Calculates short interest ratio relative to institutional ownership.


    RSI = \frac{\text{Short Interest Ratio}}{\text{Institutional Ownership Percentage}} \text{ (undefined
    if institutional ownership is 0)}


    Compiler note: Short interest ratio = short_rt; institutional ownership % = inst_own (both REAL, same
    percentage scale, so the ratio is taken as-is). NULLIF makes the result NULL when inst_own is 0 (undefined);
    NULLs pass through as NULL. Checked: there are no NaN values (the ''nan'' in the preview is NULL);
    inst_own ranges from 0.19 to 89.78 and is never 0.'
  sql_expression: short_rt / NULLIF(inst_own, 0)
  source_model: main.sentiment_analytics
  domains:
  - calculations
- name: enforcement_financial_impact_ratio_efir
  description: 'Calculates the ratio of the penalty amount to the trader''s account balance at the time
    of the related transaction.


    EFIR = \frac{\text{Penalty Amount}}{\text{Account Balance}}


    Compiler note: Enforcement action links to trade record via REC_ENF = REC_KEY (the shared record id),
    then to traders via tr_anchor. usd_bal is text like ''$4,692,991 '' — stripped ''$'', commas, whitespace
    and cast to double. pen_amt from enf_actions JSON. NULLIF guards zero balance. One enforcement row
    has no matching trader (yields NULL).'
  sql_expression: (e.enf_actions->>'pen_amt')::DOUBLE / NULLIF(CAST(replace(replace(trim(t.trader_fin_data->>'usd_bal'),
    '$', ''), ',', '') AS DOUBLE), 0)
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions e LEFT JOIN main.trade_records r ON r."REC_KEY" = e."REC_ENF" LEFT
    JOIN main.traders t ON t."TR_KEY" = r.tr_anchor
  grain: one row per enforcement action, with its related trade record and that record's trader
  domains:
  - calculations
- name: high_risk_trader_profile
  description: 'Identifies traders exhibiting characteristics associated with high-risk trading strategies.


    A trader is considered High-Risk if their ''Trader Leverage Exposure'' > 5.0 AND their risk level
    is ''Aggressive'' OR their ''Daily Turnover Rate'' > 0.5.


    Built on: daily_turnover_rate_dtr, trader_leverage_exposure_tle.


    Compiler note: Grouped as (TLE > 5 AND Aggressive) OR DTR > 0.5, which is standard AND-before-OR precedence.
    risk_lvl values are clean: Aggressive, Moderate, Conservative. ->> calls are parenthesized because
    of operator precedence. Evaluated per trade record, since TLE and DTR are record-level.'
  sql_expression: (CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) > 5.0 AND (r.trader_fin_data->>'risk_lvl')
    = 'Aggressive') OR (t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM((r.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor
  grain: one row per trade record, with its trader
  domains:
  - definitions
- name: potential_insider_trading_flag
  description: 'Flags transactions potentially linked to insider knowledge based on timing and context.


    A transaction is flagged if its information leakage score > 50.0 AND it is linked to a corporate event
    AND the event''s announcement timing is ''Pre-market'' or ''Intraday''.


    Built on: weighted_investigation_score_wis, sentiment_weighted_option_volume_swov.


    Compiler note: announce_time is stored with the suffix '' hrs before'' (values ''Pre-market hrs before'',
    ''Intraday hrs before'', ''Post-market hrs before''), so I matched the full strings. ''Linked to a
    corporate event'' means evt_near IS NOT NULL, because NULL means no upcoming event was recorded. One
    row per transaction (REC_EVT = trade record key).'
  sql_expression: leak_score > 50.0 AND evt_near IS NOT NULL AND announce_time IN ('Pre-market hrs before',
    'Intraday hrs before')
  source_model: main.corporate_events
  domains:
  - definitions
- name: market_manipulation_pattern_layering_spoofing
  description: 'Identifies trading sessions indicative of layering or spoofing tactics.


    A transaction record suggests Layering/Spoofing if its layering indicator is ''Confirmed'' OR (its
    spoofing probability > 0.75 AND ''Order Modification Intensity'' > 1.0).


    Built on: order_modification_intensity_omi, combined_manipulation_indicator_cmi, compliance_health_score_chs.


    Compiler note: spoof_prob is text like ''0.88%''. Once the ''%'' is removed, every value falls between
    0 and 1, so it is compared to 0.75 as it stands. layer_idx takes the values Confirmed, Suspected or
    NULL. Every manipulation_signals row has a matching order_behaviour row. OMI is reused from order_modification_intensity_omi.'
  sql_expression: m.layer_idx = 'Confirmed' OR (CAST(replace(m.manip_signals->>'spoof_prob', '%', '')
    AS DOUBLE) > 0.75 AND (o.order_metrics->>'mod_freq')::double / NULLIF(1 - (o.order_metrics->>'cancel_pct')::double,
    0) > 1.0)
  source_model: main.manipulation_signals
  from_sql: main.manipulation_signals m LEFT JOIN main.order_behaviour o ON o.REC_NODE = m.REC_TAG
  grain: one row per transaction record's manipulation signals, with its order behaviour (1:1 on record
    key)
  domains:
  - definitions
- name: collusion_network_indicator
  description: 'Suggests potential collusion based on investigation details.


    A case indicates potential collusion if the trader circle size > 5 AND the group behavior score >
    0.6 AND the communication path is ''Regular''.


    Built on: suspicion_weighted_turnover_swt.


    Compiler note: Circle size = circ_size; group behavior score = trader_links->>''grp_score'' cast to
    double; communication path = "commPath" (values Regular/Irregular/NULL). grp_score in the data ranges
    0.23–99.87 (looks like a 0–100 scale), so the stated 0.6 threshold is encoded literally as written
    and is nearly always met.'
  sql_expression: circ_size > 5 AND (trader_links->>'grp_score')::DOUBLE > 0.6 AND "commPath" = 'Regular'
  source_model: main.trader_relationships
  domains:
  - definitions
- name: elevated_regulatory_scrutiny
  description: 'Identifies compliance cases under intense review or investigation.


    A case is under Elevated Regulatory Scrutiny if its alert level is ''High'' or ''Critical'' AND its
    investigation priority is ''High'' AND its monitoring intensity is ''Intensive''.


    Built on: logarithmic_enforcement_fine_impact_lefi.


    Compiler note: Checked distinct values: alert_lvl, invest_prior, mon_inten are stored as clean exact
    labels (no padding/case variants, no NULLs seen).'
  sql_expression: alert_lvl IN ('High', 'Critical') AND invest_prior = 'High' AND mon_inten = 'Intensive'
  source_model: main.reg_compliance
  domains:
  - definitions
- name: problematic_compliance_history
  description: 'Identifies traders with a poor track record of compliance.


    A trader has a Problematic Compliance History if they have more than 3 previous violations OR their
    compliance rating is ''C'' or ''D'' OR their ''Compliance Recidivism Score'' > 1.0.


    Built on: compliance_recidivism_score_crs, aggressive_trading_intensity_ati.


    Compiler note: comp_rate values are clean ''A''-''D'' (TRIM kept as a precaution); prev_viol is an
    integer 0-5 stored in JSON. The CRS expression is reused inline over the same join.'
  sql_expression: CAST(r.compliance_data->>'prev_viol' AS DOUBLE) > 3 OR TRIM(r.compliance_data->>'comp_rate')
    IN ('C', 'D') OR CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.0
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.trade_records t ON t."REC_KEY" = r."REC_COMP" JOIN main.traders
    tr ON tr."TR_KEY" = t.tr_anchor
  grain: one row per compliance case (trade record), with its trader
  domains:
  - definitions
- name: wash_trading_alert
  description: 'Flags transactions highly suspicious for wash trading.


    A transaction triggers a Wash Trading Alert if its wash trading suspicion level is ''High''.


    Built on: risk_adjusted_turnover_rat.


    Compiler note: wash_flag is read from manipulation_signals.manip_signals JSON. The stored values are
    exactly High, Medium and Low, or NULL. A NULL flag means it was not determined, so the condition does
    not flag that row.'
  sql_expression: manip_signals->>'wash_flag' = 'High'
  source_model: main.manipulation_signals
  domains:
  - definitions
- name: event_driven_trader
  description: 'Classifies traders whose activity appears strongly linked to corporate events.


    A trader may be classified as Event-Driven if a significant portion (>30%) of their transactions are
    linked to a corporate event.


    Built on: weighted_investigation_score_wis.


    Compiler note: Every trade record has a corporate_events row (998/998), so I can''t use the row existing
    as the link. A transaction counts as linked when corporate_events.evt_near is not NULL (NULL means
    no upcoming event; 749/998 are non-NULL). The share is linked transactions divided by all of the trader''s
    trade_records. Traders with no transactions are not flagged.'
  sql_expression: s.n_tx > 0 AND s.n_evt::DOUBLE / s.n_tx > 0.3
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, COUNT(*) AS n_tx, COUNT(ce.evt_near) AS n_evt
    FROM main.trade_records tr LEFT JOIN main.corporate_events ce ON ce."REC_EVT" = tr."REC_KEY" GROUP
    BY tr.tr_anchor) s ON s.tr_anchor = t."TR_KEY"
  grain: one row per trader, with counts of their trade records and of those linked to a corporate event
  domains:
  - definitions
- name: high_cancellation_modification_trader
  description: 'Identifies traders who frequently cancel or modify orders, potentially indicating manipulative
    intent or poor execution strategy.


    A trader is flagged if their average cancellation percentage > 0.5 OR their average ''Order Modification
    Intensity'' > 1.5 across their transactions.


    Built on: order_modification_intensity_omi.


    Compiler note: Transactions = trade_records joined to order_behaviour on REC_NODE = REC_KEY (998 of
    998 records match). cancel_pct is stored as a fraction (max 0.299), so it is compared to 0.5 directly.
    Averages leave out NULLs (cancel_pct is NULL in 400 records). OMI is computed per record using the
    base entry''s formula.'
  sql_expression: a.avg_cancel > 0.5 OR a.avg_omi > 1.5
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, AVG((ob.order_metrics->>'cancel_pct')::double)
    AS avg_cancel, AVG((ob.order_metrics->>'mod_freq')::double / NULLIF(1 - (ob.order_metrics->>'cancel_pct')::double,
    0)) AS avg_omi FROM main.trade_records tr JOIN main.order_behaviour ob ON ob."REC_NODE" = tr."REC_KEY"
    GROUP BY tr.tr_anchor) a ON a.tr_anchor = t."TR_KEY"
  grain: one row per trader, with averages of cancellation percentage and OMI over their trade records
  domains:
  - definitions
- name: significant_enforcement_action
  description: 'Categorizes enforcement actions that represent substantial penalties or restrictions.


    An action is considered a Significant Enforcement Action if the penalty impact is ''Fine'' or ''Ban''
    OR the action taken is ''Suspension'' OR the business restriction is ''Full''.


    Built on: boosted_insider_leakage_score_bils, market_adjusted_pattern_anomaly_mapa.


    Compiler note: Penalty impact = enf_actions->>''pen_flag'' (values Ban/Fine/Warning/NULL). Values
    are stored exactly as ''Fine'', ''Ban'', ''Suspension'' and ''Full'', with no padding. NULLs are treated
    as not matching.'
  sql_expression: COALESCE(enf_actions->>'pen_flag' IN ('Fine', 'Ban'), FALSE) OR COALESCE(act_taken =
    'Suspension', FALSE) OR COALESCE(biz_restrict = 'Full', FALSE)
  source_model: main.enforcement_actions
  domains:
  - definitions
- name: risk_adjusted_turnover_rat
  description: 'Calculates trader turnover scaled by their leverage exposure.


    RAT = ''Daily Turnover Rate'' \times ''Trader Leverage Exposure''


    Built on: daily_turnover_rate_dtr, trader_leverage_exposure_tle.


    Compiler note: Product of the existing DTR and TLE expressions, evaluated on each trade record joined
    to its trader. The result is NULL when lev_ratio is NULL or the balance is missing or zero.'
  sql_expression: (t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM(r.trader_fin_data->>'usd_bal'), '$', ''),
    ',', '') AS DOUBLE), 0)) * CAST(t.trade_perf->>'lev_ratio' AS DOUBLE)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor
  grain: one row per trade record, with its trader
  domains:
  - calculations
- name: combined_manipulation_indicator_cmi
  description: 'A combined score reflecting both general suspicious activity and specific pattern anomalies.


    CMI = (''Suspicious Activity Index'' + ''Pattern Anomaly Score'') / 2


    Built on: suspicious_activity_index_sai, pattern_anomaly_score_pas.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: 'CMI = (SAI + PAS) / 2, so it needs the Suspicious Activity Index. SAI cannot be encoded:
    the documentation calls it a weighted sum of normalized risk indicators but gives no weights and no
    normalization method. It also gives no numeric mapping for the categorical inputs (wash_flag, layer_idx),
    and its list of indicators is open-ended. Without SAI, CMI cannot be computed from this database without
    guessing.'
- name: compliance_health_score_chs
  description: 'Inverse score reflecting compliance history severity, penalizing high recidivism and poor
    ratings.


    CHS = \frac{1}{1 + \text{''Compliance Recidivism Score''} \times \text{A numeric value mapped from
    the ''Compliance Rating Grade''}}


    Built on: compliance_recidivism_score_crs, Compliance Rating Grade.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: CHS multiplies the Compliance Recidivism Score by "a numeric value mapped from the Compliance
    Rating Grade", but the documentation never gives that mapping. The Compliance Rating Grade entry only
    describes A–D in words (excellent → serious failures) and assigns no numbers. The database holds only
    the letter grade (compliance_data->>'comp_rate'). Any numeric scale (e.g. A=1..D=4 or A=0..D=3) would
    be a guess, and it changes the result, so the metric cannot be encoded faithfully.
- name: weighted_investigation_score_wis
  description: 'Combines raw investigation scores with the current alert severity level.


    WIS = ''Investigation Intensity Index'' \times A numeric multiplier based on Alert Level Severity
    (''Low''=1, ''High''=3, etc.)


    Built on: investigation_intensity_index_iii, logarithmic_enforcement_fine_impact_lefi.


    Compiler note: alert_lvl values in data: Low, Medium, High, Critical (no NULLs observed). The entry
    gives Low=1 and High=3 and says ''etc.''; I followed the ordinal scale and set Medium=2, Critical=4.'
  sql_expression: (0.6 * behav_score + 0.4 * net_score) * CASE alert_lvl WHEN 'Low' THEN 1 WHEN 'Medium'
    THEN 2 WHEN 'High' THEN 3 WHEN 'Critical' THEN 4 END
  source_model: main.reg_compliance
  domains:
  - calculations
- name: sentiment_weighted_option_volume_swov
  description: 'Adjusts the option volume ratio based on the divergence between news and social sentiment.


    SWOV = \text{Option Volume Ratio} \times (1 + \text{''Sentiment Divergence Factor''})


    Built on: sentiment_divergence_factor_sdf.


    Compiler note: Option Volume Ratio is taken as sentiment_analytics.opt_vol (range 0.01–4.98; there
    are no NaNs, and 399 of 999 rows are NULL, so SWOV is NULL for those rows). The SDF part is the same
    as sentiment_divergence_factor_sdf.'
  sql_expression: opt_vol * (1 + ABS(CAST(sentiment_data->>'news_score' AS DOUBLE) - CAST(sentiment_data->>'soc_sent'
    AS DOUBLE)))
  source_model: main.sentiment_analytics
  domains:
  - calculations
- name: logarithmic_enforcement_fine_impact_lefi
  description: 'Calculates the log-scaled financial impact ratio of enforcement fines, emphasizing order
    of magnitude.


    LEFI = ''Enforcement Financial Impact Ratio'' \times \log_{10}(\text{Max}(10, \text{Penalty Amount}))


    Built on: enforcement_financial_impact_ratio_efir.


    Compiler note: Reuses the EFIR expression and join unchanged. Penalty amount comes from enf_actions.pen_amt
    cast to DOUBLE. If pen_amt is NULL, EFIR is NULL too, so LEFI comes out NULL.'
  sql_expression: ((e.enf_actions->>'pen_amt')::DOUBLE / NULLIF(CAST(replace(replace(trim(t.trader_fin_data->>'usd_bal'),
    '$', ''), ',', '') AS DOUBLE), 0)) * log10(GREATEST(10, (e.enf_actions->>'pen_amt')::DOUBLE))
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions e LEFT JOIN main.trade_records r ON r."REC_KEY" = e."REC_ENF" LEFT
    JOIN main.traders t ON t."TR_KEY" = r.tr_anchor
  grain: one row per enforcement action, with its related trade record and that record's trader
  domains:
  - calculations
- name: aggressive_trading_intensity_ati
  description: 'Measures intensity by combining high turnover, leverage, and order modification frequency.


    ATI = ''Daily Turnover Rate'' \times ''Trader Leverage Exposure'' \times ''Order Modification Intensity''.


    Built on: daily_turnover_rate_dtr, order_modification_intensity_omi, trader_leverage_exposure_tle.


    Compiler note: order_behaviour joins to trade_records on REC_NODE = REC_KEY; checked that all 998
    trade records match one order_behaviour row. ATI is DTR × TLE × OMI, using the existing definitions;
    it is NULL when any component is NULL.'
  sql_expression: (t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM(r.trader_fin_data->>'usd_bal'), '$', ''),
    ',', '') AS DOUBLE), 0)) * CAST(t.trade_perf->>'lev_ratio' AS DOUBLE) * ((o.order_metrics->>'mod_freq')::double
    / NULLIF(1 - (o.order_metrics->>'cancel_pct')::double, 0))
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor LEFT JOIN main.order_behaviour
    o ON o."REC_NODE" = t."REC_KEY"
  grain: one row per trade record, with its trader and its order-behaviour record
  domains:
  - calculations
- name: suspicion_weighted_turnover_swt
  description: 'Calculates daily turnover weighted by the Suspicious Activity Index.


    SWT = ''Suspicious Activity Index'' \times ''Daily Turnover Rate''


    Built on: daily_turnover_rate_dtr, suspicious_activity_index_sai.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: SWT = SAI × DTR, and SAI cannot be encoded. The documentation calls SAI a weighted sum
    of normalized risk indicators (spoofing probability, front-running, wash trading, confirmed layering),
    but it gives no weights, no normalization method and no numeric mapping for the categorical inputs
    (wash_flag, layer_idx). Its list of indicators is also open-ended. Without SAI, SWT cannot be computed
    from this database.
- name: boosted_insider_leakage_score_bils
  description: 'Increases the Information Leakage Score if a Potential Insider Trading Flag is also present.


    BILS = The raw ''Information Leakage Score'' \times (1.5 \text{ if ''Potential Insider Trading Flag''
    is True else } 1.0)


    Built on: potential_insider_trading_flag, Information Leakage Score Interpretation.


    Compiler note: Flag condition inlined from potential_insider_trading_flag. announce_time is stored
    with an '' hrs before'' suffix (checked values). A NULL leak_score gives a NULL result.'
  sql_expression: leak_score * CASE WHEN leak_score > 50.0 AND evt_near IS NOT NULL AND announce_time
    IN ('Pre-market hrs before', 'Intraday hrs before') THEN 1.5 ELSE 1.0 END
  source_model: main.corporate_events
  domains:
  - calculations
- name: market_adjusted_pattern_anomaly_mapa
  description: 'Calculates pattern anomaly score adjusted for market correlation, highlighting non-market
    related deviations.


    MAPA = ''Pattern Anomaly Score'' \times (1 - \text{Market Correlation})


    Built on: pattern_anomaly_score_pas.


    Compiler note: Reuses the PAS expression and join. Market Correlation = market_conditions.mkt_corr
    (correlation with the broader market index). NULL when peer_corr is NULL.'
  sql_expression: ABS(r.pat_rec - CAST(m.market_metrics->>'peer_corr' AS DOUBLE)) * (1 - m.mkt_corr)
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.market_conditions m ON m."REC_PIN" = r."REC_COMP"
  grain: one row per compliance record (trade record), with its market conditions
  domains:
  - calculations
- name: high_frequency_high_risk_trader
  description: 'Identifies traders classified as High-Risk who also operate at high frequency.


    A trader matching the ''High-Risk Trader Profile'' AND whose trading frequency scope is ''High''.


    Built on: high_risk_trader_profile.


    Compiler note: High-Risk Trader Profile reused as given; trading frequency scope = trade_records.freq_tag,
    values checked (High/Medium/Low, exact case).'
  sql_expression: ((CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) > 5.0 AND (r.trader_fin_data->>'risk_lvl')
    = 'Aggressive') OR (t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM((r.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5)) AND t.freq_tag = 'High'
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor
  grain: one row per trade record, with its trader
  domains:
  - definitions
- name: suspected_event_driven_insider
  description: 'Flags traders identified as event-driven who also trigger potential insider trading alerts.


    A trader who meets the criteria for ''Event-Driven Trader'' AND for whom the ''Potential Insider Trading
    Flag'' is True.


    Built on: potential_insider_trading_flag, event_driven_trader.


    Compiler note: Trader-level: Event-Driven (>30% of trade records have a non-NULL corporate_events.evt_near)
    AND at least one of their trade records meets the Potential Insider Trading Flag (leak_score > 50,
    evt_near not null, announce_time ''Pre-market hrs before'' or ''Intraday hrs before''). I used "at
    least one flagged transaction" as the way to turn the per-transaction flag into a per-trader one.
    The announce_time values were checked in the data.'
  sql_expression: s.n_tx > 0 AND s.n_evt::DOUBLE / s.n_tx > 0.3 AND s.n_insider > 0
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, COUNT(*) AS n_tx, COUNT(ce.evt_near) AS n_evt,
    COUNT(CASE WHEN ce.leak_score > 50.0 AND ce.evt_near IS NOT NULL AND ce.announce_time IN ('Pre-market
    hrs before', 'Intraday hrs before') THEN 1 END) AS n_insider FROM main.trade_records tr LEFT JOIN
    main.corporate_events ce ON ce."REC_EVT" = tr."REC_KEY" GROUP BY tr.tr_anchor) s ON s.tr_anchor =
    t."TR_KEY"
  grain: one row per trader, with counts of their trade records, of those linked to a corporate event,
    and of those triggering the Potential Insider Trading Flag
  domains:
  - definitions
- name: confirmed_manipulator_under_scrutiny
  description: 'Identifies traders with confirmed manipulative patterns whose cases are under high scrutiny.


    A trader exhibiting a confirmed ''Market Manipulation Pattern: Layering/Spoofing'' AND whose case
    status is ''Elevated Regulatory Scrutiny''.


    Built on: market_manipulation_pattern_layering_spoofing, elevated_regulatory_scrutiny.


    Compiler note: Combines the Layering/Spoofing pattern and the Elevated Regulatory Scrutiny conditions
    exactly as their entries define them. Rows are joined on the record key (REC_TAG = REC_NODE = REC_COMP).
    I checked that all 999 manipulation_signals rows have exactly one order_behaviour row and one reg_compliance
    row.'
  sql_expression: (m.layer_idx = 'Confirmed' OR (CAST(replace(m.manip_signals->>'spoof_prob', '%', '')
    AS DOUBLE) > 0.75 AND (o.order_metrics->>'mod_freq')::double / NULLIF(1 - (o.order_metrics->>'cancel_pct')::double,
    0) > 1.0)) AND (r.alert_lvl IN ('High', 'Critical') AND r.invest_prior = 'High' AND r.mon_inten =
    'Intensive')
  source_model: main.manipulation_signals
  from_sql: main.manipulation_signals m LEFT JOIN main.order_behaviour o ON o.REC_NODE = m.REC_TAG LEFT
    JOIN main.reg_compliance r ON r.REC_COMP = m.REC_TAG
  grain: one row per transaction record's manipulation signals, with its order behaviour and compliance
    case (1:1 on record key)
  domains:
  - definitions
- name: high_risk_collusion_group_member
  description: 'Identifies traders within a suspected collusion network who individually exhibit high-risk
    behavior.


    A trader flagged by the ''Collusion Network Indicator'' AND who also meets the ''High-Risk Trader
    Profile'' criteria.


    Built on: high_risk_trader_profile, collusion_network_indicator.


    Compiler note: Combines the existing collusion_network_indicator (trader_relationships, joined on
    rel_root = trader key) and high_risk_trader_profile (per trade record with its trader) predicates
    using AND. The precedence of high-risk profile ((lev>5 AND Aggressive) OR DTR>0.5) is kept as in the
    base entry.'
  sql_expression: (rel.circ_size > 5 AND (rel.trader_links->>'grp_score')::DOUBLE > 0.6 AND rel."commPath"
    = 'Regular') AND ((CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) > 5.0 AND (r.trader_fin_data->>'risk_lvl')
    = 'Aggressive') OR (t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM((r.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5))
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor JOIN main.trader_relationships
    rel ON rel.rel_root = r."TR_KEY"
  grain: one row per trade record, with its trader and that trader's relationship map
  domains:
  - definitions
- name: chronic_compliance_violator
  description: 'Identifies traders with a problematic history and a high recidivism score.


    A trader identified as having a ''Problematic Compliance History'' AND whose ''Compliance Recidivism
    Score'' is greater than 1.5.


    Built on: compliance_recidivism_score_crs, problematic_compliance_history.


    Compiler note: Combines the problematic_compliance_history and compliance_recidivism_score_crs entries
    at the same per-compliance-case grain, with CRS > 1.5.'
  sql_expression: (CAST(r.compliance_data->>'prev_viol' AS DOUBLE) > 3 OR TRIM(r.compliance_data->>'comp_rate')
    IN ('C', 'D') OR CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.0) AND CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.5
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.trade_records t ON t."REC_KEY" = r."REC_COMP" JOIN main.traders
    tr ON tr."TR_KEY" = t.tr_anchor
  grain: one row per compliance case (trade record), with its trader
  domains:
  - definitions
- name: high_volume_wash_trading_concern
  description: 'Flags traders with wash trading alerts who also trade significant volume.


    A trader triggering a ''Wash Trading Alert'' AND whose daily trading volume exceeds 1,000,000.


    Built on: wash_trading_alert.


    Compiler note: Wash Trading Alert = wash_flag ''High''; daily volume is trade_records.vol_day, joined
    on REC_TAG = REC_KEY (998 of 999 signal rows match). Currently max vol_day is ~999,001, so no rows
    qualify.'
  sql_expression: m.manip_signals->>'wash_flag' = 'High' AND t.vol_day > 1000000
  source_model: main.manipulation_signals
  from_sql: main.manipulation_signals m JOIN main.trade_records t ON t."REC_KEY" = m."REC_TAG"
  grain: one row per manipulation-signal record, with its trade record (REC_TAG = REC_KEY, 1:1)
  domains:
  - definitions
- name: aggressive_event_speculator
  description: 'Classifies event-driven traders who employ an aggressive risk strategy.


    A trader classified as an ''Event-Driven Trader'' AND whose risk appetite is ''Aggressive''.


    Built on: event_driven_trader, Order Type Distribution.


    Compiler note: Event-Driven Trader condition reused as given. Risk appetite = traders.trader_fin_data->>''risk_lvl''.
    I checked the stored values: Aggressive, Conservative and Moderate, all clean with no padding. Parentheses
    are added because of how DuckDB orders ->> against AND.'
  sql_expression: (s.n_tx > 0) AND (s.n_evt::DOUBLE / s.n_tx > 0.3) AND ((t.trader_fin_data->>'risk_lvl')
    = 'Aggressive')
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, COUNT(*) AS n_tx, COUNT(ce.evt_near) AS n_evt
    FROM main.trade_records tr LEFT JOIN main.corporate_events ce ON ce."REC_EVT" = tr."REC_KEY" GROUP
    BY tr.tr_anchor) s ON s.tr_anchor = t."TR_KEY"
  grain: one row per trader, with counts of their trade records and of those linked to a corporate event
  domains:
  - definitions
- name: potentially_evasive_order_modifier
  description: 'Flags high cancellation/modification traders who make significant use of dark pools.


    A trader identified as a ''High Cancellation/Modification Trader'' AND whose transactions show ''Dark
    Pool Usage'' in more than 50% of instances.


    Built on: high_cancellation_modification_trader, Dark Pool Usage Venues.


    Compiler note: The entry does not say what counts as ''Dark Pool Usage'' in a transaction. I counted
    it as order_behaviour.dark_use > 0. The values run from 0 to 0.4; 600 of 999 rows have a value and
    597 of those are above 0. NULL dark_use means the data was not collected, so it counts as not showing
    usage but stays in the denominator. The share is taken over all of the trader''s trade records joined
    to order_behaviour (every trade record has a match there).'
  sql_expression: (a.avg_cancel > 0.5 OR a.avg_omi > 1.5) AND a.dark_share > 0.5
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, AVG((ob.order_metrics->>'cancel_pct')::double)
    AS avg_cancel, AVG((ob.order_metrics->>'mod_freq')::double / NULLIF(1 - (ob.order_metrics->>'cancel_pct')::double,
    0)) AS avg_omi, AVG(CASE WHEN ob.dark_use > 0 THEN 1.0 ELSE 0.0 END) AS dark_share FROM main.trade_records
    tr JOIN main.order_behaviour ob ON ob."REC_NODE" = tr."REC_KEY" GROUP BY tr.tr_anchor) a ON a.tr_anchor
    = t."TR_KEY"
  grain: one row per trader, with averages of cancellation percentage and OMI and the share of their trade
    records showing dark-pool usage
  domains:
  - definitions
- name: financially_impactful_enforcement_case
  description: 'Identifies traders who faced significant enforcement actions with a high financial impact
    relative to their account size.


    A trader subject to a ''Significant Enforcement Action'' AND whose ''Enforcement Financial Impact
    Ratio (EFIR)'' is greater than 0.1.


    Built on: enforcement_financial_impact_ratio_efir, significant_enforcement_action.


    Compiler note: Combines the significant_enforcement_action predicate with the efir > 0.1 test, at
    the same per-enforcement-action grain and join as the EFIR entry. A NULL EFIR counts as not flagged.'
  sql_expression: (COALESCE(e.enf_actions->>'pen_flag' IN ('Fine', 'Ban'), FALSE) OR COALESCE(e.act_taken
    = 'Suspension', FALSE) OR COALESCE(e.biz_restrict = 'Full', FALSE)) AND COALESCE((e.enf_actions->>'pen_amt')::DOUBLE
    / NULLIF(CAST(replace(replace(trim(t.trader_fin_data->>'usd_bal'), '$', ''), ',', '') AS DOUBLE),
    0) > 0.1, FALSE)
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions e LEFT JOIN main.trade_records r ON r."REC_KEY" = e."REC_ENF" LEFT
    JOIN main.traders t ON t."TR_KEY" = r.tr_anchor
  grain: one row per enforcement action, with its related trade record and that record's trader
  domains:
  - definitions
- name: peer_mimicry_suspicion
  description: 'Flags traders whose behavior closely matches peers but deviates little from known patterns,
    potentially mimicking a risky group.


    A trader with a low ''Pattern Anomaly Score'' (e.g., < 0.1) BUT a high peer correlation score (e.g.,
    > 0.7).


    Built on: pattern_anomaly_score_pas.


    Compiler note: Uses the example thresholds from the entry (PAS < 0.1, peer_corr > 0.7). PAS is the
    existing pattern_anomaly_score_pas (|pat_rec - peer_corr|). peer_corr is read from market_conditions.market_metrics->>''peer_corr''
    as DOUBLE. pat_rec runs from 0.03 to 99.99, while peer_corr is a correlation, so no rows currently
    match (0 of 999).'
  sql_expression: ABS(r.pat_rec - CAST(m.market_metrics->>'peer_corr' AS DOUBLE)) < 0.1 AND CAST(m.market_metrics->>'peer_corr'
    AS DOUBLE) > 0.7
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.market_conditions m ON m."REC_PIN" = r."REC_COMP"
  grain: one row per compliance record (trade record), with its market conditions
  domains:
  - definitions
- name: investigation_compliance_risk_index_icri
  description: 'Combines the weighted investigation score with the inverse compliance health score, highlighting
    cases that are both problematic and under intense investigation.


    ICRI = ''Weighted Investigation Score'' \times (1 - ''Compliance Health Score'')


    Built on: compliance_health_score_chs, weighted_investigation_score_wis.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: ICRI = WIS × (1 − CHS). CHS needs a numeric value mapped from the Compliance Rating Grade,
    and the documentation never gives that mapping. The grade entry describes A–D in words only, and the
    database stores just the letter (compliance_data->>'comp_rate'). Any numeric scale would be a guess
    that changes the result, so CHS, and therefore ICRI, cannot be encoded faithfully.
- name: sentiment_driven_leakage_risk_sdlr
  description: 'Calculates potential information leakage risk weighted by sentiment-driven unusual option
    volume.


    SDLR = ''Sentiment-Weighted Option Volume'' \times \text{Information Leakage Score}.


    Built on: Information Leakage Score Interpretation, sentiment_weighted_option_volume_swov.


    Compiler note: Information Leakage Score = corporate_events.leak_score; joined 1:1 on REC_EVT = REC_SA
    (both PKs; all 999 sentiment rows match). No NaN values in opt_vol or leak_score.'
  sql_expression: s.opt_vol * (1 + ABS(CAST(s.sentiment_data->>'news_score' AS DOUBLE) - CAST(s.sentiment_data->>'soc_sent'
    AS DOUBLE))) * c.leak_score
  source_model: main.sentiment_analytics
  from_sql: main.sentiment_analytics s JOIN main.corporate_events c ON c."REC_EVT" = s."REC_SA"
  grain: one row per market-condition record (transaction), with its sentiment analytics and corporate-event
    data
  domains:
  - calculations
- name: unique_pattern_deviation_ratio_updr
  description: 'Measures the ratio of unique pattern deviation (anomaly) to the similarity with known
    illicit patterns, indicating how unusual the potentially illicit behavior is.


    UPDR = \frac{\text{''Pattern Anomaly Score''}}{\text{Max}(0.01, \text{''Pattern Similarity Score''})}


    Built on: pattern_anomaly_score_pas, Pattern Similarity Score Context.


    Compiler note: Pattern Similarity Score = reg_compliance.pat_rec, the same column the PAS dependency
    uses. The docs describe it as 0-1, but the stored values run from 0.03 to 99.99, so the formula uses
    them as stored. NULL when peer_corr is NULL.'
  sql_expression: ABS(r.pat_rec - CAST(m.market_metrics->>'peer_corr' AS DOUBLE)) / GREATEST(0.01, r.pat_rec)
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.market_conditions m ON m."REC_PIN" = r."REC_COMP"
  grain: one row per compliance record (trade record), with its market conditions
  domains:
  - calculations
- name: recidivism_enforcement_severity_res
  description: 'Multiplies the compliance recidivism score by the enforcement financial impact, highlighting
    costly repeat offenders.


    RES = ''Compliance Recidivism Score'' \times ''Enforcement Financial Impact Ratio''


    Built on: compliance_recidivism_score_crs, enforcement_financial_impact_ratio_efir.


    Compiler note: CRS and EFIR are combined on the shared record key (REC_ENF = REC_COMP = REC_KEY).
    All 999 enforcement actions have a matching compliance case; 998 have a trade record. The expression
    reuses the dependency formulas unchanged.'
  sql_expression: (CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0)) * ((e.enf_actions->>'pen_amt')::DOUBLE / NULLIF(CAST(replace(replace(trim(tr.trader_fin_data->>'usd_bal'),
    '$', ''), ',', '') AS DOUBLE), 0))
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions e LEFT JOIN main.reg_compliance r ON r."REC_COMP" = e."REC_ENF" LEFT
    JOIN main.trade_records t ON t."REC_KEY" = e."REC_ENF" LEFT JOIN main.traders tr ON tr."TR_KEY" =
    t.tr_anchor
  grain: one row per enforcement action, with its compliance case on the same record key, the related
    trade record and that record's trader
  domains:
  - calculations
- name: aggressive_suspicion_score_ass
  description: 'Combines overall suspicious activity index with aggressive trading intensity, identifying
    traders who are both suspicious and trade aggressively.


    ASS = ''Suspicious Activity Index'' \times ''Aggressive Trading Intensity''


    Built on: suspicious_activity_index_sai, aggressive_trading_intensity_ati.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: ASS = SAI × ATI. SAI (Suspicious Activity Index) cannot be encoded. The documentation
    calls it a weighted sum of normalized risk indicators but gives no weights, no normalization method
    and no numeric mapping for the categorical inputs (wash_flag, layer_idx). Its list of indicators is
    also open-ended. Without SAI the product cannot be computed.
- name: capital_adjusted_investigation_intensity_caii
  description: 'Normalizes the investigation intensity index by the trader''s account balance, showing
    investigation focus relative to trader size.


    CAII = \frac{\text{''Investigation Intensity Index''}}{\text{Max}(1000, \text{Account Balance})}


    Built on: investigation_intensity_index_iii.


    Compiler note: Each compliance case links to a trade record by REC_COMP = trade_records.REC_KEY, and
    from there to its trader through tr_anchor. All of the 999 cases except one match, and each matches
    at most one record. Account balance is stored as text such as ''$4,692,991 '' in traders.trader_fin_data->>''usd_bal''.
    I removed the ''$'', the commas and the spaces and cast the result to DOUBLE. If the balance is missing
    the result is NULL. Without that guard, DuckDB''s GREATEST would skip the NULL and divide by 1000.'
  sql_expression: (0.6 * rc.behav_score + 0.4 * rc.net_score) / CASE WHEN CAST(regexp_replace(t.trader_fin_data->>'usd_bal',
    '[^0-9.]', '', 'g') AS DOUBLE) IS NULL THEN NULL ELSE GREATEST(1000.0, CAST(regexp_replace(t.trader_fin_data->>'usd_bal',
    '[^0-9.]', '', 'g') AS DOUBLE)) END
  source_model: main.reg_compliance
  from_sql: main.reg_compliance rc LEFT JOIN main.trade_records tr ON tr.REC_KEY = rc.REC_COMP LEFT JOIN
    main.traders t ON t.TR_KEY = tr.tr_anchor
  grain: one row per compliance case (reg_compliance), with its trade record and that record's trader
  domains:
  - calculations
- name: market_agnostic_suspicion_index_masi
  description: 'Combines the general suspicion index with market-adjusted pattern anomaly, focusing on
    suspicious activity independent of market moves.


    MASI = (''Suspicious Activity Index'' + ''Market-Adjusted Pattern Anomaly'') / 2


    Built on: suspicious_activity_index_sai, market_adjusted_pattern_anomaly_mapa.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: MASI = (SAI + MAPA) / 2, and the Suspicious Activity Index can't be computed. Its entry
    only says SAI is a weighted sum of normalized risk indicators 'including' spoofing, front-running,
    wash trading and confirmed layering. It gives no weights, no normalization method, no numeric mapping
    for the categorical inputs (wash_flag, layer_idx), and its list of indicators is open-ended. Without
    SAI, any MASI formula would be a guess.
- name: cross_modification_ratio_cmr
  description: 'Calculates the ratio of cross-trade frequency to order modification intensity, potentially
    indicating coordinated or manipulative crossing activity.


    CMR = \frac{\text{Cross-Trade Frequency}}{\text{Max}(0.01, \text{''Order Modification Intensity''})}


    Built on: order_modification_intensity_omi.


    Compiler note: Cross-Trade Frequency is taken as order_behaviour.x_freq (0 to 0.1, never NULL). The
    OMI expression is used as given. If OMI is undefined (cancel_pct is NULL in about 40% of rows, or
    equals 1), CMR is NULL. Without that guard, GREATEST would skip the NULL and return 0.01.'
  sql_expression: x_freq / CASE WHEN (order_metrics->>'mod_freq')::double / NULLIF(1 - (order_metrics->>'cancel_pct')::double,
    0) IS NULL THEN NULL ELSE GREATEST(0.01, (order_metrics->>'mod_freq')::double / NULLIF(1 - (order_metrics->>'cancel_pct')::double,
    0)) END
  source_model: main.order_behaviour
  domains:
  - calculations
- name: insider_sentiment_short_ratio_issr
  description: 'Combines boosted insider leakage score with relative short interest, identifying potential
    insider trading concurrent with high relative short interest.


    ISSR = ''Boosted Insider Leakage Score'' \times ''Relative Short Interest''


    Built on: relative_short_interest_rsi, boosted_insider_leakage_score_bils.


    Compiler note: I joined corporate_events to sentiment_analytics on REC_EVT = REC_SA. Both are primary
    keys, and all 999 corporate_events rows have a match. I reused the BILS and RSI formulas as given.
    No stored NaN values were found in short_rt or inst_own. The result is NULL when inst_own is 0 or
    NULL.'
  sql_expression: (ce.leak_score * CASE WHEN ce.leak_score > 50.0 AND ce.evt_near IS NOT NULL AND ce.announce_time
    IN ('Pre-market hrs before', 'Intraday hrs before') THEN 1.5 ELSE 1.0 END) * (sa.short_rt / NULLIF(sa.inst_own,
    0))
  source_model: main.corporate_events
  from_sql: main.corporate_events ce JOIN main.sentiment_analytics sa ON sa."REC_SA" = ce."REC_EVT"
  grain: one row per corporate-event record (market-condition set), with its sentiment analytics
  domains:
  - calculations
- name: risk_adjusted_win_rate_rawr
  description: 'Calculates the trader''s historical win percentage adjusted for their leverage exposure.


    RAWR = \frac{\text{Historical Win Percentage}}{\text{Max}(1, \text{''Trader Leverage Exposure''})}


    Built on: trader_leverage_exposure_tle.


    Compiler note: win_pct and lev_ratio are JSON numbers in trade_perf (some JSON nulls), cast to DOUBLE.
    DuckDB''s GREATEST skips NULLs, so a missing lev_ratio would quietly count as 1. To avoid that, a
    missing lev_ratio (TLE) gives NULL instead. A missing win_pct also gives NULL.'
  sql_expression: CASE WHEN trade_perf->>'lev_ratio' IS NULL THEN NULL ELSE CAST(trade_perf->>'win_pct'
    AS DOUBLE) / GREATEST(1.0, CAST(trade_perf->>'lev_ratio' AS DOUBLE)) END
  source_model: main.trade_records
  domains:
  - calculations
- name: high_risk_manipulator_candidate
  description: 'Identifies traders flagged for both high-risk profiles and specific market manipulation
    patterns.


    A trader who meets the ''High-Risk Trader Profile'' AND is flagged for ''Market Manipulation Pattern:
    Layering/Spoofing''.


    Built on: high_risk_trader_profile, market_manipulation_pattern_layering_spoofing.


    Compiler note: Conjunction of the two dependency predicates, evaluated per trade record. manipulation_signals
    and order_behaviour join to trade_records on REC_KEY; checked all 998 records match 1:1.'
  sql_expression: ((CAST((t.trade_perf->>'lev_ratio') AS DOUBLE) > 5.0 AND (r.trader_fin_data->>'risk_lvl')
    = 'Aggressive') OR (t.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM((r.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5)) AND (m.layer_idx = 'Confirmed' OR (CAST(replace(m.manip_signals->>'spoof_prob',
    '%', '') AS DOUBLE) > 0.75 AND (o.order_metrics->>'mod_freq')::double / NULLIF(1 - (o.order_metrics->>'cancel_pct')::double,
    0) > 1.0))
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders r ON r."TR_KEY" = t.tr_anchor LEFT JOIN main.manipulation_signals
    m ON m."REC_TAG" = t."REC_KEY" LEFT JOIN main.order_behaviour o ON o."REC_NODE" = t."REC_KEY"
  grain: one row per trade record, with its trader, manipulation signals and order behaviour (1:1 on record
    key)
  domains:
  - definitions
- name: escalated_compliance_failure
  description: 'Identifies traders with a problematic compliance history who have now incurred significant
    enforcement actions.


    A trader identified with ''Problematic Compliance History'' AND subject to a ''Significant Enforcement
    Action''.


    Built on: problematic_compliance_history, significant_enforcement_action.


    Compiler note: Compliance case and enforcement action are joined on the same record key (REC_COMP
    = REC_ENF, both keyed by the trade record / market_conditions REC_PIN). Checked: all 999 compliance
    rows have an enforcement row, and 998 of them have a trade record. The condition is both base conditions
    ANDed together, unchanged.'
  sql_expression: (CAST(r.compliance_data->>'prev_viol' AS DOUBLE) > 3 OR TRIM(r.compliance_data->>'comp_rate')
    IN ('C', 'D') OR CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.0) AND (COALESCE(e.enf_actions->>'pen_flag' IN ('Fine', 'Ban'), FALSE) OR
    COALESCE(e.act_taken = 'Suspension', FALSE) OR COALESCE(e.biz_restrict = 'Full', FALSE))
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.trade_records t ON t."REC_KEY" = r."REC_COMP" JOIN main.traders
    tr ON tr."TR_KEY" = t.tr_anchor JOIN main.enforcement_actions e ON e."REC_ENF" = r."REC_COMP"
  grain: one row per compliance case (trade record), with its trader and the enforcement action on the
    same record
  domains:
  - definitions
- name: networked_mimicry_risk
  description: 'Flags traders suspected of peer mimicry who are also part of an identified potential collusion
    network.


    A trader flagged for ''Peer Mimicry Suspicion'' AND associated with a ''Collusion Network Indicator''.


    Built on: collusion_network_indicator, peer_mimicry_suspicion.


    Compiler note: Joined the two inputs through the trade record: market_conditions.REC_PIN = trade_records.REC_KEY,
    then trade_records.tr_anchor = trader_relationships.rel_root. I checked the joins: each record matches
    at most one row, so there is no fan-out. One of the 999 compliance records has no matching trade record,
    so the inner join drops it. The condition is the two existing definitions joined with AND, unchanged.'
  sql_expression: ABS(r.pat_rec - CAST(m.market_metrics->>'peer_corr' AS DOUBLE)) < 0.1 AND CAST(m.market_metrics->>'peer_corr'
    AS DOUBLE) > 0.7 AND tr.circ_size > 5 AND CAST(tr.trader_links->>'grp_score' AS DOUBLE) > 0.6 AND
    tr."commPath" = 'Regular'
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.market_conditions m ON m."REC_PIN" = r."REC_COMP" JOIN main.trade_records
    t ON t."REC_KEY" = r."REC_COMP" JOIN main.trader_relationships tr ON tr.rel_root = t.tr_anchor
  grain: one row per compliance record (trade record), with its market conditions, trade record and the
    trader's relationship map
  domains:
  - definitions
- name: high_scrutiny_wash_trading_case
  description: 'Identifies compliance cases involving high-volume wash trading concerns that are also
    under elevated regulatory scrutiny.


    A compliance case flagged for ''Elevated Regulatory Scrutiny'' AND linked to a ''High-Volume Wash
    Trading Concern''.


    Built on: elevated_regulatory_scrutiny, high_volume_wash_trading_concern.


    Compiler note: Combines elevated_regulatory_scrutiny and high_volume_wash_trading_concern. The tables
    are linked on the shared record key, which is a primary key in all three, so the joins are 1:1. The
    ->> extraction is put in parentheses because without them the comparison fails on operator precedence.
    With the current data, no case meets all the conditions.'
  sql_expression: r.alert_lvl IN ('High', 'Critical') AND r.invest_prior = 'High' AND r.mon_inten = 'Intensive'
    AND (m.manip_signals->>'wash_flag') = 'High' AND t.vol_day > 1000000
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r LEFT JOIN main.manipulation_signals m ON m."REC_TAG" = r."REC_COMP"
    LEFT JOIN main.trade_records t ON t."REC_KEY" = r."REC_COMP"
  grain: one row per compliance case, with its manipulation-signal record and trade record (REC_COMP =
    REC_TAG = REC_KEY, all primary keys, 1:1)
  domains:
  - definitions
- name: volatile_event_speculator
  description: 'Flags aggressive event speculators whose trading coincides with high sentiment divergence,
    indicating potential reaction to conflicting information.


    A trader identified as an ''Aggressive Event Speculator'' AND associated with a high ''Sentiment Divergence
    Factor'' (e.g., > 1.0).


    Built on: sentiment_divergence_factor_sdf, aggressive_event_speculator.


    Compiler note: Built at trader level: the Aggressive Event Speculator test (more than 30% of trades
    linked to a corporate event, risk_lvl ''Aggressive'') plus at least one of the trader''s trades with
    SDF > 1.0, using the example threshold. Sentiment links to trades by matching REC_SA to REC_KEY (998
    of 999 rows match; one per trade). SDF can be as high as about 1.93, and 241 rows are above 1.0.'
  sql_expression: (s.n_tx > 0) AND (s.n_evt::DOUBLE / s.n_tx > 0.3) AND ((t.trader_fin_data->>'risk_lvl')
    = 'Aggressive') AND (s.max_sdf > 1.0)
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, COUNT(*) AS n_tx, COUNT(ce.evt_near) AS n_evt,
    MAX(ABS(CAST(sa.sentiment_data->>'news_score' AS DOUBLE) - CAST(sa.sentiment_data->>'soc_sent' AS
    DOUBLE))) AS max_sdf FROM main.trade_records tr LEFT JOIN main.corporate_events ce ON ce."REC_EVT"
    = tr."REC_KEY" LEFT JOIN main.sentiment_analytics sa ON sa."REC_SA" = tr."REC_KEY" GROUP BY tr.tr_anchor)
    s ON s.tr_anchor = t."TR_KEY"
  grain: one row per trader, with counts of their trade records, of those linked to a corporate event,
    and the maximum Sentiment Divergence Factor across their trade records
  domains:
  - definitions
- name: confirmed_evasive_layering_spoofing
  description: 'Identifies traders confirmed to be layering or spoofing who also exhibit high cancellation/modification
    behavior, suggesting deliberate evasion.


    A trader flagged as a ''High Cancellation/Modification Trader'' AND confirmed via ''Market Manipulation
    Pattern: Layering/Spoofing'' where the layering indicator is ''Confirmed'' or the spoofing probability
    is > 0.75.


    Built on: market_manipulation_pattern_layering_spoofing, high_cancellation_modification_trader.


    Compiler note: Trader-level: High Cancellation/Modification Trader (reused definition) AND at least
    one of the trader''s trade records with layer_idx = ''Confirmed'' or spoof_prob > 0.75. spoof_prob
    is stored as text like ''0.88%'', with values from 0 to 1. I strip the ''%'' and compare the number
    to 0.75, the same way the Layering/Spoofing entry does. As the entry says, this ''confirmed'' condition
    leaves out the OMI part of the full Layering/Spoofing pattern.'
  sql_expression: (a.avg_cancel > 0.5 OR a.avg_omi > 1.5) AND COALESCE(c.n_confirmed, 0) > 0
  source_model: main.traders
  from_sql: main.traders t LEFT JOIN (SELECT tr.tr_anchor, AVG((ob.order_metrics->>'cancel_pct')::double)
    AS avg_cancel, AVG((ob.order_metrics->>'mod_freq')::double / NULLIF(1 - (ob.order_metrics->>'cancel_pct')::double,
    0)) AS avg_omi FROM main.trade_records tr JOIN main.order_behaviour ob ON ob."REC_NODE" = tr."REC_KEY"
    GROUP BY tr.tr_anchor) a ON a.tr_anchor = t."TR_KEY" LEFT JOIN (SELECT tr.tr_anchor, COUNT(*) AS n_confirmed
    FROM main.trade_records tr JOIN main.manipulation_signals m ON m."REC_TAG" = tr."REC_KEY" WHERE m.layer_idx
    = 'Confirmed' OR CAST(replace(m.manip_signals->>'spoof_prob', '%', '') AS DOUBLE) > 0.75 GROUP BY
    tr.tr_anchor) c ON c.tr_anchor = t."TR_KEY"
  grain: one row per trader, with averages of cancellation percentage and OMI over their trade records,
    and the count of their records confirmed as layering/spoofing
  domains:
  - definitions
- name: high_velocity_suspicion_trader
  description: 'Identifies traders exhibiting both high risk-adjusted turnover and a high suspicious activity
    index.


    A trader with a high ''Risk-Adjusted Turnover'' (e.g., > 1.0) AND a high ''Suspicious Activity Index''
    (e.g., > 0.6).


    Built on: suspicious_activity_index_sai, risk_adjusted_turnover_rat.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This flag needs the Suspicious Activity Index (SAI) > 0.6, and SAI cannot be computed
    from the documentation. It is described only as a weighted sum of normalized risk indicators (spoofing
    probability, front-running, wash trading, confirmed layering). No weights, normalization method or
    numeric mapping for the categorical inputs are given, and the list of indicators is open-ended. Without
    SAI, the condition can only be partly encoded (the Risk-Adjusted Turnover > 1.0 half), and a guessed
    SAI formula would be a placeholder.
- name: high_intensity_insider_investigation
  description: 'Flags investigations triggered by potential insider trading that show high intensity scores,
    suggesting significant findings.


    An investigation linked to a ''Potential Insider Trading Flag'' AND having a high ''Investigation
    Intensity Index'' (e.g., > 70).


    Built on: investigation_intensity_index_iii, potential_insider_trading_flag.


    Compiler note: Join is on primary keys reg_compliance.REC_COMP = corporate_events.REC_EVT, both keyed
    to market_conditions; it is 1:1 and every event row has a compliance row. announce_time is stored
    as ''Pre-market hrs before'', ''Intraday hrs before'' and ''Post-market hrs before''. Uses the example
    threshold of 70 for III.'
  sql_expression: c.leak_score > 50.0 AND c.evt_near IS NOT NULL AND c.announce_time IN ('Pre-market hrs
    before', 'Intraday hrs before') AND (0.6 * r.behav_score + 0.4 * r.net_score) > 70
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.corporate_events c ON c."REC_EVT" = r."REC_COMP"
  grain: one row per compliance case (investigation), with its linked corporate-event record (1:1 on primary
    keys)
  domains:
  - definitions
- name: severe_chronic_violator_case
  description: 'Identifies compliance cases under elevated scrutiny involving traders flagged as chronic
    compliance violators.


    A compliance case flagged for ''Elevated Regulatory Scrutiny'' AND involving a trader identified as
    a ''Chronic Compliance Violator''.


    Built on: elevated_regulatory_scrutiny, chronic_compliance_violator.


    Compiler note: Conjunction of the elevated_regulatory_scrutiny and chronic_compliance_violator conditions,
    evaluated per compliance case joined to its trade record and trader (same join as chronic_compliance_violator).'
  sql_expression: r.alert_lvl IN ('High', 'Critical') AND r.invest_prior = 'High' AND r.mon_inten = 'Intensive'
    AND (CAST(r.compliance_data->>'prev_viol' AS DOUBLE) > 3 OR TRIM(r.compliance_data->>'comp_rate')
    IN ('C', 'D') OR CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.0) AND CAST(r.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1.0, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.5
  source_model: main.reg_compliance
  from_sql: main.reg_compliance r JOIN main.trade_records t ON t."REC_KEY" = r."REC_COMP" JOIN main.traders
    tr ON tr."TR_KEY" = t.tr_anchor
  grain: one row per compliance case (trade record), with its trader
  domains:
  - definitions
- name: costly_high_frequency_risk_enforcement
  description: 'Identifies enforcement cases with significant financial impact against traders previously
    identified as high-frequency, high-risk.


    An enforcement case identified as ''Financially Impactful'' targeting a trader previously flagged
    as a ''High-Frequency High-Risk Trader''.


    Built on: high_frequency_high_risk_trader, financially_impactful_enforcement_case.


    Compiler note: Combines financially_impactful_enforcement_case (per enforcement action) with a trader-level
    high_frequency_high_risk_trader check. The trader counts as flagged if any of their trade records
    meets the HF high-risk condition (EXISTS). ''Previously'' is not checked against time: snap_ts is
    often NULL and has no full date. 998 of 999 actions link to a trade record and its trader.'
  sql_expression: (COALESCE(e.enf_actions->>'pen_flag' IN ('Fine', 'Ban'), FALSE) OR COALESCE(e.act_taken
    = 'Suspension', FALSE) OR COALESCE(e.biz_restrict = 'Full', FALSE)) AND COALESCE((e.enf_actions->>'pen_amt')::DOUBLE
    / NULLIF(CAST(replace(replace(trim(t.trader_fin_data->>'usd_bal'), '$', ''), ',', '') AS DOUBLE),
    0) > 0.1, FALSE) AND EXISTS (SELECT 1 FROM main.trade_records t2 JOIN main.traders r2 ON r2."TR_KEY"
    = t2.tr_anchor WHERE t2.tr_anchor = t."TR_KEY" AND ((CAST((t2.trade_perf->>'lev_ratio') AS DOUBLE)
    > 5.0 AND (r2.trader_fin_data->>'risk_lvl') = 'Aggressive') OR (t2.vol_day / NULLIF(CAST(REPLACE(REPLACE(TRIM((r2.trader_fin_data->>'usd_bal')),
    '$', ''), ',', '') AS DOUBLE), 0) > 0.5)) AND t2.freq_tag = 'High')
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions e LEFT JOIN main.trade_records r ON r."REC_KEY" = e."REC_ENF" LEFT
    JOIN main.traders t ON t."TR_KEY" = r.tr_anchor
  grain: one row per enforcement action, with its related trade record and that record's trader
  domains:
  - definitions
- name: high_sdlr_transaction
  description: 'Identifies transactions deemed high-risk based on their Sentiment-Driven Leakage Risk
    score exceeding a specific threshold.


    A transaction where the calculated ''Sentiment-Driven Leakage Risk'' > 1000.


    Built on: sentiment_driven_leakage_risk_sdlr.


    Compiler note: Reuses the SDLR expression and join as given. I checked for NaN in opt_vol and leak_score
    because DuckDB ranks NaN above every number, and found none. 2 of 999 joined rows meet the condition.'
  sql_expression: s.opt_vol * (1 + ABS(CAST(s.sentiment_data->>'news_score' AS DOUBLE) - CAST(s.sentiment_data->>'soc_sent'
    AS DOUBLE))) * c.leak_score > 1000
  source_model: main.sentiment_analytics
  from_sql: main.sentiment_analytics s JOIN main.corporate_events c ON c."REC_EVT" = s."REC_SA"
  grain: one row per market-condition record (transaction), with its sentiment analytics and corporate-event
    data
  domains:
  - definitions
- name: premature_resolution_block
  description: 'A business rule preventing an enforcement action from being marked as ''Resolved'' if
    associated risk metrics exceed a predefined threshold, ensuring high-risk cases receive sufficient
    review.


    Block an enforcement action from being marked ''Resolved'' if its linked ''Investigation Intensity
    Index'' is greater than 75.


    Built on: investigation_intensity_index_iii.


    Compiler note: An enforcement action counts as blocked from being marked ''Resolved'' when its linked
    Investigation Intensity Index (0.6*behav_score + 0.4*net_score, from reg_compliance) is above 75.
    It is linked through REC_ENF = REC_COMP. Both are primary keys, so each action matches at most one
    compliance case. The predicate does not filter on the current res_state, because the rule only gives
    the condition under which resolution is blocked.'
  sql_expression: (0.6 * r.behav_score + 0.4 * r.net_score) > 75
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions e JOIN main.reg_compliance r ON r."REC_COMP" = e."REC_ENF"
  grain: one row per enforcement action, with its linked compliance case (1:1, both keyed by the market-condition
    record id)
  domains:
  - definitions
- name: peer_correlation_z_score
  description: 'A normalized score indicating how many standard deviations an individual record''s peer
    correlation is away from the average peer correlation of all traders within the same trader category.
    Used for standardized comparison across different peer groups.


    Z-Score = (Individual Peer Correlation - Average Peer Correlation for the Trader''s Category) / Standard
    Deviation of Peer Correlation for the Trader''s Category. The score is 0 if the standard deviation
    is zero or not applicable.


    Compiler note: Peer correlation is market_conditions.market_metrics->>''peer_corr'' (JSON double;
    NULL in ~40% of rows, ignored by AVG/STDDEV). Trader category = traders.typeFlag, reached via market_conditions.REC_PIN
    = trade_records.REC_KEY -> tr_anchor. Sample standard deviation used. Std dev NULL/0 yields 0; rows
    with NULL peer_corr yield NULL when std dev is defined.'
  sql_expression: CASE WHEN s.sd_pc IS NULL OR s.sd_pc = 0 THEN 0 ELSE ((m.market_metrics->>'peer_corr')::DOUBLE
    - s.avg_pc) / s.sd_pc END
  source_model: main.market_conditions
  from_sql: main.market_conditions m JOIN main.trade_records tr ON tr."REC_KEY" = m."REC_PIN" JOIN main.traders
    t ON t."TR_KEY" = tr.tr_anchor LEFT JOIN (SELECT t2."typeFlag" AS type_flag, AVG((m2.market_metrics->>'peer_corr')::DOUBLE)
    AS avg_pc, STDDEV_SAMP((m2.market_metrics->>'peer_corr')::DOUBLE) AS sd_pc FROM main.market_conditions
    m2 JOIN main.trade_records tr2 ON tr2."REC_KEY" = m2."REC_PIN" JOIN main.traders t2 ON t2."TR_KEY"
    = tr2.tr_anchor GROUP BY t2."typeFlag") s ON s.type_flag IS NOT DISTINCT FROM t."typeFlag"
  grain: one row per market-condition record (trade record), with its trader and the per-trader-category
    peer-correlation mean and std dev
  domains:
  - calculations
tables:
- schema: main
  table: corporate_events
  columns:
  - name: REC_EVT
    type: VARCHAR
    description: TEXT. Identifier linking corporate-event data to a market-condition set. PK. FK to market_conditions(REC_PIN).
  - name: evt_near
    type: VARCHAR
    description: 'TEXT. Flag indicating proximity of an upcoming corporate event. **NULL means no upcoming
      event recorded.**. Possible values: Earnings, M&A, Restructuring.'
  - name: announce_time
    type: VARCHAR
    description: 'TEXT. Scheduled or actual announcement time of the event. Possible values: Intraday
      hrs before, Post-market hrs before, Pre-market hrs before.'
  - name: leak_score
    type: FLOAT
    description: 'REAL. Score estimating likelihood of information leakage before the event. Example:
      34.04.


      Information Leakage Score Interpretation: Provides context for the information leakage score, indicating
      potential trading on non-public information.


      A score from 0-100. Low scores (<20) suggest little evidence of informed trading. Moderate scores
      (20-50) warrant attention. High scores (>50) strongly suggest trading based on non-public information
      and require investigation.


      Compiler note: Entry interprets the information leakage score (0-100), stored in corporate_events.leak_score.'
  - name: info_leak_rate
    type: VARCHAR
    description: 'TEXT. The rate at which information leakage occurs before a corporate event''s announcement,
      measured in score per hour. Example: 0.45 score/hour.'
- schema: main
  table: enforcement_actions
  columns:
  - name: REC_ENF
    type: VARCHAR
    description: TEXT. Identifier linking enforcement actions to a market-condition set. PK. FK to market_conditions(REC_PIN).
  - name: abuse_prob
    type: FLOAT
    description: 'REAL. Probability that abusive activity occurred. **NULL means abuse probability not
      calculated.**. Example: 0.177.'
  - name: evid_pow
    type: VARCHAR
    description: 'TEXT. Evidentiary strength supporting enforcement action. Possible values: Moderate,
      Strong, Weak.'
  - name: doc_stat
    type: VARCHAR
    description: 'TEXT. Status of supporting documentation. Possible values: Complete, Incomplete, Partial.'
  - name: act_taken
    type: VARCHAR
    description: 'TEXT. Enforcement action taken. **NULL means no action recorded.**. Possible values:
      Restriction, Suspension, Warning.'
  - name: esc_lvl
    type: VARCHAR
    description: 'TEXT. Escalation level applied to the case. **NULL means escalation level not set.**.
      Possible values: Compliance, Legal, Supervisor.'
  - name: legal_state
    type: VARCHAR
    description: 'TEXT. Current legal-proceeding state. **NULL means legal case state not recorded.**.
      Possible values: Active, Pending.'
  - name: settle_state
    type: VARCHAR
    description: 'TEXT. Settlement state of the enforcement action. **NULL means settlement state unknown.**.
      Possible values: Negotiating, Settled.'
  - name: rep_impact
    type: VARCHAR
    description: 'TEXT. Reputational impact assessment. Possible values: Minimal, Moderate, Severe.'
  - name: biz_restrict
    type: VARCHAR
    description: 'TEXT. Business-restriction imposed (if any). **NULL means business restriction not documented.**.
      Possible values: Full, Partial.'
  - name: rem_status
    type: VARCHAR
    description: 'TEXT. Remediation-status update. Possible values: Completed, Not Required, Pending.'
  - name: sys_need
    type: VARCHAR
    description: 'TEXT. Required system changes identified. Possible values: Major, Minor, No.'
  - name: policy_need
    type: VARCHAR
    description: 'TEXT. Required policy changes identified. Possible values: No, Urgent, Yes.'
  - name: train_req
    type: VARCHAR
    description: 'TEXT. Mandatory training requirement specified. **NULL means training requirement not
      specified.**. Possible values: Comprehensive, Refresher.'
  - name: report_state
    type: VARCHAR
    description: 'TEXT. Reporting-obligation state. Possible values: Automated, Hybrid, Manual.'
  - name: retain_stat
    type: VARCHAR
    description: 'TEXT. Data-retention status. **NULL means retention status not indicated.**. Possible
      values: Archived, Current, Deleted.'
  - name: audit_stat
    type: VARCHAR
    description: 'TEXT. Audit-status indicator. Possible values: Complete, Missing, Partial.'
  - name: conf_lvl
    type: VARCHAR
    description: 'TEXT. Confidence level in enforcement findings. **NULL means confidence level not assigned.**.
      Possible values: Highly Sensitive, Normal, Sensitive.'
  - name: access_res
    type: VARCHAR
    description: 'TEXT. Access-restriction outcome after enforcement. Possible values: Internal, Public,
      R.'
  - name: share_state
    type: VARCHAR
    description: 'TEXT. Data-sharing state following enforcement. Possible values: Allowed, Limited, Prohibited.'
  - name: enf_actions
    type: JSON
    description: 'JSONB column. Enforcement actions including penalties and resolutions. Fields: {"pen_amt":
      "REAL. Monetary amount of the penalty imposed. Example: 290459.21.", "res_state": "TEXT. Resolution
      state of the enforcement case. Possible values: In Progress, Pending, Resolved.", "pen_flag": "TEXT.
      Indicator that a penalty was imposed. **NULL means penalty flag not decided.**. Possible values:
      Ban, Fine, Warning."}'
- schema: main
  table: instruments
  columns:
  - name: SYM_KEY
    type: VARCHAR
    description: 'TEXT. Unique symbol key identifying a financial instrument. PK. Possible values: AAPL,
      AMZN, GOOGL, META, MSFT.'
  - name: inst_info
    type: JSON
    description: 'JSONB column. Instrument data including cap and sector. Fields: {"cap": "REAL. Market-capitalisation
      value of the instrument. **NULL means market-cap could not be determined or is not reported.**.
      Example: 155167483887.68.", "sector": "TEXT. Sector classification (padded string for alignment).
      Possible values: Consumer, Energy, Finance, Healthcare, Technology.", "stream": "TEXT. Industry-stream
      or sub-sector classification. Possible values: Banking, Biotech, Oil & Gas, Retail, Software."}'
- schema: main
  table: manipulation_signals
  columns:
  - name: REC_TAG
    type: VARCHAR
    description: TEXT. Identifier linking manipulation-signal metrics to a market-condition set. PK. FK
      to market_conditions(REC_PIN).
  - name: layer_idx
    type: VARCHAR
    description: 'TEXT. Index measuring order-layering activity. **NULL means layering index not assigned.**.
      Possible values: Confirmed, Suspected.'
  - name: stuff_idx
    type: FLOAT
    description: 'REAL. Quote-stuffing index. Example: 0.409.'
  - name: ignite_sig
    type: VARCHAR
    description: 'TEXT. Signal denoting rapid-ignite trading tactics. **NULL means ignition signal not
      detected.**. Possible values: Strong, Weak.


      Momentum Ignition Signals: Explains the signals related to attempting to artificially create price
      momentum.


      The momentum ignition signal indicates attempts to create false price movement. ''Strong'' suggests
      clear patterns of manipulative intent; ''Weak'' suggests such patterns are less evident.


      Compiler note: The schema documents ignite_sig as the rapid-ignite trading signal, with values Strong
      and Weak. NULL means no signal was detected.'
  - name: close_mark
    type: VARCHAR
    description: 'TEXT. Indicator of closing-price manipulation. **NULL means close-price marker not set.**.
      Possible values: Frequent, Occasional.


      Marking the Close Patterns: Explains the patterns associated with influencing the closing price
      of a security.


      Marking the close refers to trading near market close to manipulate the closing price. ''Frequent''
      indicates repeated activity; ''Occasional'' suggests it is infrequent. This is a prohibited practice.


      Compiler note: The schema lists close_mark''s possible values as Frequent and Occasional, which
      matches this entry. NULL means the marker is not set.'
  - name: manip_signals
    type: JSON
    description: 'JSONB column. Signals related to market manipulation like spoofing. Fields: {"spoof_prob":
      "TEXT. Estimated probability of spoofing behaviour. Example: 0.88%.", "wash_flag": "TEXT. Flag indicating
      suspected wash-trading. **NULL means wash-trade flag not determined.**. Possible values: High, Low,
      Medium.", "front_run": "REAL. Score indicating likelihood of front-running. Example: 39.75."}'
- schema: main
  table: market_conditions
  columns:
  - name: REC_PIN
    type: VARCHAR
    description: TEXT. Primary key linking market-condition metrics to a trade record. PK.
  - name: vol_ano
    type: FLOAT
    description: 'REAL. Volume-anomaly indicator. Example: 2.12.'
  - name: mov_pct
    type: FLOAT
    description: 'REAL. Percentage price movement over the observation window. Example: 9.6.'
  - name: spreadTag
    type: FLOAT
    description: 'REAL. Bid-ask-spread metric for the instrument. Example: 0.471.'
  - name: impactVal
    type: VARCHAR
    description: 'TEXT. Estimated market-impact value. Example: 0.05%.'
  - name: mkt_corr
    type: FLOAT
    description: 'REAL. Correlation with the broader market index. Example: -0.327.'
  - name: rot_imp
    type: FLOAT
    description: 'REAL. Rotation-impact score on sector rotation. Example: -0.793.'
  - name: ofi_density
    type: VARCHAR
    description: 'TEXT. The order flow impact density, measured in basis points per million USD of trade
      volume. Example: 8.76 bps/million USD.'
  - name: liq_imp
    type: VARCHAR
    description: 'TEXT. The liquidity impact rate, calculated as the USD value of trades per minute. Reflects
      the instantaneous impact on market liquidity by trading volume. Example: 12,534.56 USD/min.'
  - name: price_accel
    type: VARCHAR
    description: 'TEXT. Rate of change in the price volatility per hour squared. A higher value indicates
      a more volatile price movement over time. Example: 2.32 %/(hour²).'
  - name: market_metrics
    type: JSON
    description: 'JSONB column. Market conditions data including volatility and correlation. Fields: {"px_vol":
      "REAL. Price-weighted volume metric. Example: 0.348.", "liq_ratio": "REAL. Liquidity ratio for the
      instrument. **NULL means liquidity ratio could not be determined.**. Example: 0.58.", "peer_corr":
      "REAL. Correlation with peer instruments. **NULL means peer correlation metric not computed.**.
      Example: 0.525."}'
- schema: main
  table: order_behaviour
  columns:
  - name: REC_NODE
    type: VARCHAR
    description: TEXT. Identifier linking order-behaviour stats to a market-condition set. PK. FK to market_conditions(REC_PIN).
  - name: OST_ref
    type: VARCHAR
    description: TEXT. Reference to the order-status type token. FK to order_status_types(STAT_TOKEN).
  - name: dark_use
    type: FLOAT
    description: 'REAL. Proportion of volume routed to dark pools. **NULL means dark-pool usage data not
      collected.**. Example: 0.009.


      Dark Pool Usage Venues: Explains the nature of dark pool usage indicated in transaction records.


      Dark pools are private exchanges (e.g., Alternative Trading Systems) used for large orders to reduce
      market impact. Usage patterns can be analyzed for regulatory compliance or signs of avoiding market
      transparency.


      Compiler note: Describes dark pool usage; order_behaviour.dark_use is the proportion of volume routed
      to dark pools.'
  - name: off_mkt
    type: FLOAT
    description: 'REAL. Fraction of executions occurring off-exchange. Example: 0.197.


      Off-Market Trading Activity: Illustrates types of trading activity occurring outside public exchanges.


      Off-market activity describes trades not on lit exchanges. ''Internal crosses'' involve a broker
      matching buy/sell orders from their own clients internally, which requires monitoring for fairness.


      Compiler note: The entry explains off-market (off-exchange) trading, which is what order_behaviour.off_mkt
      records ("fraction of executions occurring off-exchange"). off_mkt holds numbers, not category labels,
      so the ''Internal crosses'' example is background explanation, not a stored value.'
  - name: x_freq
    type: FLOAT
    description: 'REAL. Execution frequency (orders filled per unit time). Example: 0.069.'
  - name: order_metrics
    type: JSON
    description: 'JSONB column. Order behaviour metrics including size and cancellation. Fields: {"size_var":
      "REAL. Variance of order sizes placed. Example: 0.791.", "cancel_pct": "REAL. Percentage of orders
      cancelled. **NULL means cancellation percentage not computed.**. Example: 0.129.", "mod_freq": "REAL.
      Frequency at which orders are modified. Example: 0.46."}'
- schema: main
  table: order_status_types
  columns:
  - name: STAT_TOKEN
    type: VARCHAR
    description: TEXT. Unique token representing an order-status type. PK.
  - name: order_status
    type: JSON
    description: 'JSONB column. Order status types with tracking and spread. Fields: {"tick_type": "TEXT.
      Tick-tracking state that the status token maps to (NOT NULL). Possible values: Irregular, Regular,
      Suspicious.", "spread_type": "TEXT. Spread-classification that the status token maps to (NOT NULL).
      Possible values: Limit, Market, Mixed."}


      Order Type Distribution: Illustrates the mix of primary order types used by a trader.


      The distribution of order types shows strategy: ''Market'' orders prioritize speed; ''Limit'' orders
      prioritize price; ''Mixed'' suggests a combination of strategies.


      Compiler note: The values ''Market'', ''Limit'' and ''Mixed'' match the spread_type field inside
      the order_status_types.order_status JSONB column, which documents those same three values.'
- schema: main
  table: reg_compliance
  columns:
  - name: REC_COMP
    type: VARCHAR
    description: TEXT. Identifier linking regulatory-compliance data to a market-condition set. PK. FK
      to market_conditions(REC_PIN).
  - name: file_state
    type: VARCHAR
    description: 'TEXT. Filing-status state. Possible values: Current, Delayed, Missing.'
  - name: disc_state
    type: VARCHAR
    description: 'TEXT. Disclosure-status state. Possible values: Full, Non-compliant, Partial.'
  - name: restrict_win
    type: VARCHAR
    description: 'TEXT. Trading-restriction window status. **NULL means restriction window not defined.**.
      Possible values: Blackout, Special.


      Trading Restriction Period Types: Explains the types of trading restrictions imposed as part of
      enforcement.


      The type of trading restriction. ''Blackout'' is a complete prohibition on trading. ''Special''
      indicates other, specific restrictions tailored to a case, such as position size limits or pre-trade
      approvals.


      Compiler note: The values ''Blackout'' and ''Special'' match the documented values of reg_compliance.restrict_win
      (trading-restriction window). NULL means the restriction window is not defined.'
  - name: broker_flag
    type: VARCHAR
    description: 'TEXT. Flag indicating broker-dealer involvement. **NULL means broker-flag unset.**.
      Possible values: Complete, Incomplete, Late.'
  - name: exch_note
    type: VARCHAR
    description: 'TEXT. Exchange note or comment. **NULL means no exchange note present.**. Possible values:
      Inquiry, Warning.'
  - name: invest_stat
    type: VARCHAR
    description: 'TEXT. Current investment-status designation. **NULL means investment status not specified.**.
      Possible values: Active, Preliminary.'
  - name: alert_lvl
    type: VARCHAR
    description: 'TEXT. Alert-level assigned by compliance monitoring. Possible values: Critical, High,
      Low, Medium.'
  - name: invest_prior
    type: VARCHAR
    description: 'TEXT. Investigation-priority indicator. Possible values: High, Low, Medium.'
  - name: case_flag
    type: VARCHAR
    description: 'TEXT. Flag indicating an open compliance case. Possible values: Closed, Investigation,
      Monitoring.'
  - name: review_freq
    type: VARCHAR
    description: 'TEXT. Recommended frequency of compliance reviews. **NULL means review frequency not
      defined.**. Possible values: Daily, Monthly, Weekly.'
  - name: last_rev
    type: DATE
    description: 'DATE. Date of the most recent compliance review. Example: 2025/02/02.'
  - name: next_rev
    type: DATE
    description: 'DATE. Scheduled date of the next compliance review. Example: March 19, 2025.'
  - name: mon_inten
    type: VARCHAR
    description: 'TEXT. Monitoring-intensity setting. Possible values: Enhanced, Intensive, Standard.'
  - name: sv_sys
    type: VARCHAR
    description: 'TEXT. Surveillance system used. Possible values: Multiple, Primary, Secondary.'
  - name: det_meth
    type: VARCHAR
    description: 'TEXT. Detection method applied. Possible values: Automated, Hybrid, Manual.'
  - name: fp_rate
    type: FLOAT
    description: 'REAL. False-positive rate of the detection system. Example: 0.033.'
  - name: model_conf
    type: FLOAT
    description: 'REAL. Confidence score of the detection model. Example: 0.883.'
  - name: pat_rec
    type: FLOAT
    description: 'REAL. Pattern-recognition metric for compliance. Example: 42.51.


      Pattern Similarity Score Context: Provides context for the pattern similarity score, comparing trading
      to known illicit behaviors.


      A score from 0-1. Values near 1 indicate high similarity to known illicit trading patterns. Values
      near 0 indicate patterns do not strongly match known manipulative techniques.


      Compiler note: The pattern similarity score best matches reg_compliance.pat_rec, the pattern-recognition
      metric. The stored values do not fit the 0-1 scale the entry describes: they run from 0.03 to 99.99,
      so the column looks like it is on a 0-100 scale. No other column is a better match (model_conf runs
      0.50-1.0 and is model confidence; fp_rate is a false-positive rate).'
  - name: behav_score
    type: FLOAT
    description: 'REAL. Behavioural risk score from compliance analytics. Example: 37.76.'
  - name: net_score
    type: FLOAT
    description: 'REAL. Network-based compliance risk score. Example: 68.91.'
  - name: reg_alert_conc
    type: VARCHAR
    description: 'TEXT. The concentration of regulatory alerts per billion USD of trading volume. Helps
      identify market manipulation risks. Example: 45.2 alerts/billion USD.'
  - name: reg_resp_spd
    type: VARCHAR
    description: 'TEXT. The speed of regulatory response, measured in hours per case. A lower value indicates
      faster response times. Example: 42.3 hours/case.'
  - name: compliance_data
    type: JSON
    description: 'JSONB column. Regulatory compliance data including violations and risk. Fields: {"prev_viol":
      "BIGINT. Count of previous regulatory violations. Possible values: 0, 1, 2, 3, 4, 5.", "comp_rate":
      "TEXT. Compliance rate category. Possible values: A, B, C, D.", "risk_val": "REAL. Quantitative
      risk value for compliance breaches. Example: 58.84."}


      Compliance Rating Grade: Explains the overall compliance assessment grade assigned in compliance
      cases.


      The compliance rating grade: ''A'' represents excellent compliance; ''B'' indicates good compliance
      with minor issues; ''C'' suggests significant compliance deficiencies; ''D'' signifies serious or
      repeated compliance failures.


      Compiler note: Describes the JSON field comp_rate (values A, B, C, D) inside reg_compliance.compliance_data.'
- schema: main
  table: sentiment_analytics
  columns:
  - name: REC_SA
    type: VARCHAR
    description: TEXT. Identifier linking sentiment analytics to a market-condition set. PK. FK to market_conditions(REC_PIN).
  - name: ins_hold
    type: FLOAT
    description: 'REAL. Percentage of insider holdings in the float. Example: 45.91.'
  - name: inst_own
    type: FLOAT
    description: 'REAL. Percentage of institutional ownership. **NULL means institutional-ownership data
      unavailable.**. Example: 78.29.'
  - name: short_rt
    type: FLOAT
    description: 'REAL. Short-interest rate for the instrument. **NULL means short-interest rate not provided.**.
      Example: 17.24.'
  - name: opt_vol
    type: FLOAT
    description: 'REAL. Options-trading volume on the instrument. **NULL means options volume value is
      missing.**. Example: 2.91.'
  - name: pc_ratio
    type: FLOAT
    description: 'REAL. Put-call ratio for the instrument. Example: 1.17.'
  - name: iv_rank
    type: VARCHAR
    description: 'TEXT. Implied-volatility rank classification. Example: 11.39%.'
  - name: uo_act
    type: VARCHAR
    description: 'TEXT. Unusual-options-activity descriptor. **NULL means no unusual-options activity
      recorded.**. Possible values: High, Moderate.


      Unusual Option Activity Level: Illustrates the degree of detected unusual options trading volume
      or types.


      The level of unusual options activity indicates deviations from normal patterns. ''High'' suggests
      significant deviations, a potential flag for insider information. ''Moderate'' indicates some unusual
      activity, but less pronounced.


      Compiler note: uo_act is the unusual-options-activity descriptor, with values High and Moderate.
      NULL means no unusual activity was recorded.'
  - name: short_press_int
    type: VARCHAR
    description: 'TEXT. The intensity of short selling pressure as a percentage per hour, reflecting how
      quickly short interest builds up near corporate events. Example: 2.57 %/hour.'
  - name: sentiment_data
    type: JSON
    description: 'JSONB column. Sentiment data from news, social media, and analysts. Fields: {"news_score":
      "REAL. Sentiment score derived from news sources. Example: 0.874.", "soc_sent": "REAL. Aggregate
      social-media sentiment score. Example: 0.613.", "analyst_cnt": "BIGINT. Number of analyst reports
      considered. Example: 18."}'
- schema: main
  table: trade_records
  columns:
  - name: REC_KEY
    type: VARCHAR
    description: 'TEXT. Unique key identifying an individual trade record. PK. Example: IT291460.'
  - name: snap_ts
    type: VARCHAR
    description: 'TIMESTAMP. Snapshot timestamp capturing the trade state. **NULL means snapshot time
      was not captured.**. Example: 2024-11-24 23:31:04.103260.'
  - name: tr_anchor
    type: VARCHAR
    description: TEXT. Trader key involved in the trade. FK to traders(TR_KEY).
  - name: sym_anchor
    type: VARCHAR
    description: TEXT. Instrument symbol key traded. FK to instruments(SYM_KEY).
  - name: freq_tag
    type: VARCHAR
    description: 'TEXT. Frequency-band tag for the trader’s activity. Possible values: High, Low, Medium.'
  - name: vol_day
    type: FLOAT
    description: 'REAL. Average daily trading volume for the trader-instrument pair. Example: 693469.34.'
  - name: pos_avg
    type: FLOAT
    description: 'REAL. Average position size held by the trader. Example: 63384.3.'
  - name: hold_span
    type: VARCHAR
    description: 'TEXT. Typical holding-period span . Possible values: Intraday, Long-term, Position,
      Swing.


      Trader Position Holding Style: Illustrates the typical duration traders hold their positions, based
      on their strategy.


      The position holding span indicates strategy: ''Intraday'' for same-day trades; ''Swing'' for holds
      of a few days to weeks; ''Position'' for weeks to months; ''Long-term'' for months or years.


      Compiler note: Describes values of hold_span (Intraday, Swing, Position, Long-term), which match
      the documented possible values.'
  - name: margin_pct
    type: FLOAT
    description: 'REAL. Margin percentage utilised in the trades. Example: 74.62.'
  - name: vol_adj_lev
    type: VARCHAR
    description: 'TEXT. The volatility-adjusted leverage, indicating the amount of leverage in relation
      to market volatility. Example: 0.34 leverage-point/vol-point.'
  - name: risk_adj_lev
    type: VARCHAR
    description: 'TEXT. The risk-adjusted leverage ratio, indicating the amount of leverage relative to
      the trader''s risk tolerance. Example: 16.98 USD/risk-point.'
  - name: bal_turnover
    type: VARCHAR
    description: 'TEXT. The turnover rate of the trader''s balance per day, calculated as the ratio of
      daily trading volume to the account balance. Example: 2.34 times/day.'
  - name: trade_perf
    type: JSON
    description: 'JSONB column. Trade performance including win/loss and leverage. Fields: {"win_pct":
      "REAL. Percentage of profitable trades for the record. **NULL means win percentage has not been
      calculated.**. Example: 55.83.", "pl_ratio": "REAL. Profit-to-loss ratio for the set of trades.
      Example: 1.18.", "lev_ratio": "REAL. Leverage ratio applied by the trader. **NULL means leverage
      ratio is not available.**. Example: 1.81."}'
- schema: main
  table: trader_relationships
  columns:
  - name: rel_root
    type: VARCHAR
    description: TEXT. Root trader referenced in the relationship map. PK. FK to traders(TR_KEY).
  - name: map_state
    type: VARCHAR
    description: 'TEXT. Current mapping state of the relationship graph. Possible values: Complete, Partial,
      Pending.'
  - name: addrHits
    type: BIGINT
    description: 'BIGINT. Count of address matches across linked traders. Possible values: 0, 1, 2, 3,
      4, 5.'
  - name: commPath
    type: VARCHAR
    description: 'TEXT. Primary communication pathway identified. **NULL means communication path has
      not been mapped.**. Possible values: Irregular, Regular.'
  - name: circ_size
    type: BIGINT
    description: 'BIGINT. Size of the trader-relationship circle. Example: 32.'
  - name: insider_net_str
    type: VARCHAR
    description: 'TEXT. The strength of the insider network, calculated by the number of connected entities
      per percentage of insider ownership. Example: 12.45 connection-point/ownership%.'
  - name: trader_links
    type: JSON
    description: 'JSONB column. Relationship data for traders including contact and links. Fields: {"link_count":
      "BIGINT. Number of direct relationship links. **NULL means link count has not been recorded.**.
      Example: 19.0.", "contact_share": "TEXT. Shared contact information among related traders. **NULL
      means no shared-contact data available.**. Possible values: Email, Multiple, Phone.", "fin_link":
      "TEXT. Indicator of financial linkage between traders. **NULL means financial linkage data not provided.**.
      Possible values: Business, Personal.", "grp_score": "REAL. Group influence or cohesion score. Example:
      41.87."}'
- schema: main
  table: traders
  columns:
  - name: TR_KEY
    type: VARCHAR
    description: 'TEXT. Unique identifier for a trader account. PK. Example: TR73442.'
  - name: typeFlag
    type: VARCHAR
    description: 'TEXT. Classification flag indicating trader type . Possible values: Broker, Individual,
      Institution, Market Maker.'
  - name: trader_fin_data
    type: JSON
    description: 'JSONB column. Trader financial details including balance and risk. Fields: {"usd_bal":
      "TEXT. Current account balance denominated in U.S. dollars. Example: $4,692,991.", "risk_lvl": "TEXT.
      Qualitative risk-tone category assigned to the trader. Possible values: Aggressive, Conservative,
      Moderate.", "age_days": "BIGINT. Number of days since the trader account was created. Example: 1532."}'
