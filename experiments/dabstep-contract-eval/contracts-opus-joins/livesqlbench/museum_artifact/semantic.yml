  - name: security_visitor_overview
    type: JSON
    description: 'JSONB column. Combines hall-level security system states with visitor statistics to
      support risk analysis and staffing optimisation. Fields: {"security": {"cctv_coverage": "TEXT. CCTV
      coverage status in the exhibition hall. Possible values: Full, Limited, Partial.", "motion_detection":
      "TEXT. Motion detection status in the hall. Possible values: Active, Maintenance, Partial.", "alarm_status":
      "TEXT. Alarm system status in the exhibition hall. Possible values: Armed, Maintenance, Partial.",
      "access_control": "TEXT. Access control status for the exhibition hall. Possible values: Active,
      Maintenance, Partial."}, "visitor_statistics": {"avg_daily_visitors": "BIGINT. Daily visitor count
      for the exhibition hall. Example: 308.", "visitor_flow": "TEXT. Visitor flow data in the hall. Possible
      values: High, Low, Medium.", "avg_dwell_minutes": "BIGINT. Dwell time of visitors in minutes. Example:
      16."}, "behaviour_notes": "TEXT. Notes on visitor behavior in the hall. Possible values: Fair, Good,
      Poor."}


      CCTV Coverage Levels: Illustrates CCTV coverage classifications.


      ''Full'' indicates 100% space coverage, ''Partial'' indicates 60-90% coverage, and ''Limited'' indicates
      less than 60% coverage.


      Compiler note: Describes the values of the JSON field security.cctv_coverage (Full/Partial/Limited)
      in ExhibitionHalls.security_visitor_overview.'
- schema: main
  table: LightAndRadiationReadings
  columns:
