      provided.**. Possible values: Critical, Excellent, Fair, Good, Poor.


      Conservation Status Categories: Illustrates the conservation status values and their meanings.


      Values range from ''Excellent'' (recently conserved, no issues), ''Good'' (stable with minor issues),
      ''Fair'' (stable but with noticeable issues), ''Poor'' (active deterioration), to ''Critical'' (severe
      deterioration requiring immediate intervention).


      Compiler note: ArtifactsCore.conserve_status takes the values Critical, Excellent, Fair, Good and
      Poor, which are the five categories this entry describes.'
