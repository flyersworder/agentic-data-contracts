- schema: main
  table: SensitivityData
  columns:
  - name: ENVsense
    type: VARCHAR
    description: 'TEXT. Environmental sensitivity identifier for the artifact. PK. Possible values: High,
      Low, Medium.'
  - name: ART_link
    type: VARCHAR
    description: TEXT. Reference to the artifact in ArtifactsCore. FK to ArtifactsCore.ARTregID.
  - name: env_handling_sensitivity
    type: JSON
    description: 'JSONB column. Bundles the full multi-factor sensitivity profile (environmental, pest,
      handling, transport, display, storage) needed for preventive-conservation decision-making. Fields:
      {"environment": {"light": "TEXT. Light sensitivity data for the artifact. **NULL means no light
      sensitivity data provided.**. Possible values: High, Low, Medium.", "temperature": "TEXT. Temperature
      sensitivity data for the artifact. Possible values: High, Low, Medium.", "humidity": "TEXT. Humidity
      sensitivity data for the artifact. Possible values: High, Low, Medium.", "vibration": "TEXT. Vibration
      sensitivity data for the artifact. Possible values: High, Low, Medium.", "pollutants": "TEXT. Pollution
      sensitivity data for the artifact. Possible values: High, Low, Medium."}, "biological": {"pest":
      "TEXT. Pest sensitivity data for the artifact. Possible values: High, Low, Medium."}, "handling_transport":
      {"handling": "TEXT. Handling sensitivity data for the artifact. Possible values: High, Low, Medium.",
      "transport": "TEXT. Sensitivity to transportation for the artifact. Possible values: High, Low,
      Medium."}, "context": {"display": "TEXT. Display sensitivity data for the artifact. Possible values:
      High, Low, Medium.", "storage": "TEXT. Storage sensitivity data for the artifact. Possible values:
      High, Low, Medium."}}


      Sensitivity Weight Values: Numerical weights for sensitivity calculations.


      A mapping of qualitative sensitivity ratings to numerical values for calculation purposes. For example:
      Low=1, Medium=5, High=10 for various environmental factors like light, temperature, and humidity.


      Compiler note: The mapping Low=1, Medium=5, High=10 assigns numbers to the qualitative ratings for
      each factor (light, temperature, humidity, etc.). Those ratings are stored in the env_handling_sensitivity
      JSONB, under environment.light, environment.temperature, environment.humidity and the other keys.


      Light Sensitivity Levels: Illustrates light sensitivity classifications and their implications.


      Values include ''Low'' (can tolerate up to 300 lux), ''Medium'' (should be limited to 150-200 lux),
      and ''High'' (restricted to 50 lux or less).


      Compiler note: Describes the Low/Medium/High values of the light sensitivity rating, stored at JSON
      path environment.light inside SensitivityData.env_handling_sensitivity.


      Humidity Sensitivity Levels: Illustrates humidity sensitivity classifications and their implications.


      Values include ''Low'' (can tolerate a wide range of humidity), ''Medium'' (requires a controlled
      humidity range), and ''High'' (requires a very stable and narrow humidity range).


      Compiler note: Describes the values of the JSON field environment.humidity in env_handling_sensitivity
      (Low/Medium/High), per the column''s documented fields.'
- schema: main
  table: Showcases
  columns:
  - name: caseID
    type: VARCHAR
    description: TEXT. Unique identifier for each showcase. PK.
  - name: hall_ref
    type: VARCHAR
    description: TEXT. Reference to the exhibition hall where the showcase is located. FK to ExhibitionHalls.Hall_ID.
  - name: case_environment_profile
    type: JSON
    description: 'JSONB column. Packs the showcase’s physical condition, filtration/adsorption capacity,
      leak performance and safety-power states into a single field for monitoring dashboards. Fields:
      {"physical_state": {"airtightness_factor": "REAL. Airtightness level of the showcase. Example: 95.1.",
      "construction_material": "TEXT. Material of the showcase. **NULL means no material specified.**.
      Possible values: Acrylic, Glass, Tempered Glass.", "seal_state": "TEXT. Seal state of the showcase.
      Possible values: Excellent, Fair, Good, Poor.", "leak_rate_per_day": "REAL. Leak rate of the showcase.
      Example: 0.41.", "internal_pressure_pa": "BIGINT. Pressure level inside the showcase. Example: -2.6."},
      "maintenance": {"maint_status": "TEXT. Maintenance status of the showcase. Possible values: Due,
      Good, Overdue.", "filter_status": "TEXT. Filter status in the showcase. Possible values: Clean,
      Replace Now, Replace Soon.", "silica_status": "TEXT. Silica gel status in the showcase. Possible
      values: Active, Replace Now, Replace Soon.", "silica_last_replaced": "DATE. Date when silica gel
      was last replaced. Example: 09/15/2024."}, "buffer_capacity": {"humidity_capacity_g": "BIGINT. Humidity
      capacity of the showcase. Example: 81.0.", "pollutant_capacity_mg": "REAL. Pollutant capacity of
      the showcase. Example: 79.8."}, "safety_and_power": {"inert_gas_state": "TEXT. Inert gas status
      inside the showcase. Possible values: Active, Maintenance, Standby.", "fire_system_state": "TEXT.
      Fire system status in the showcase. Possible values: Active, Maintenance, Standby.", "primary_power_state":
      "TEXT. Power status for the showcase. Possible values: Active, Standby, Testing.", "backup_power_state":
      "TEXT. Backup system status for the showcase. Possible values: Maintenance, Ready, Testing."}}


      Showcase Airtightness Levels: Illustrates showcase airtightness measurement.


      A numerical value representing air changes per day. Museum-grade showcases typically have values
      below 0.1, while values up to 5.0 indicate poor airtightness.


      Compiler note: Describes air changes per day (values below 0.1 for museum grade, up to 5.0 for poor).
      That matches physical_state.leak_rate_per_day in this JSONB, whose observed range is 0.0-0.5. It
      does not match airtightness_factor, which ranges 90-100.'
