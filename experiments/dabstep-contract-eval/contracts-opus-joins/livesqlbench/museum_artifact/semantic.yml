- schema: main
  table: EnvironmentalReadingsCore
  columns:
  - name: monitor_code
    type: VARCHAR
    description: TEXT. Unique identifier for each environmental reading. PK.
  - name: readTS
    type: TIMESTAMP
    description: 'TIMESTAMP. Timestamp of when the environmental reading was taken. Not NULL. Example:
      2024-08-06T08:38:48.'
  - name: case_link
    type: VARCHAR
    description: TEXT. Reference to the showcase. FK to Showcases.caseID.
  - name: TEMPc
    type: BIGINT
    description: 'BIGINT. Temperature reading in Celsius. **NULL means no temperature data available.**.
      Example: 21.73.


      Temperature Reading Implications: Illustrates temperature readings and their conservation implications.


      Ideal for most collections is 18-22°C. Fluctuations greater than 2°C within 24 hours can stress
      materials. Values outside 10-30°C may indicate control failure.


      Compiler note: The entry explains how to read temperature values in Celsius: an ideal range, a range
      that may signal control failure, and a note on 24h fluctuation, which relates to tempVar24. The
      main subject is the temperature reading itself, which is EnvironmentalReadingsCore.TEMPc.'
  - name: tempVar24
    type: FLOAT
    description: 'REAL. Temperature variation over 24 hours. **NULL means no temperature variation recorded.**.
      Example: 0.85.'
  - name: RH
    type: BIGINT
    description: 'BIGINT. Relative humidity reading. Example: 53.28.


      Relative Humidity Implications: Illustrates relative humidity readings and their conservation implications.


      Ideal for mixed collections is 45-55%. Fluctuations greater than 5% within 24 hours are risky. Readings
      below 30% or above 65% indicate significant risk.


      Compiler note: The entry explains what relative humidity readings mean (ideal 45-55%, risky below
      30% or above 65%), so it belongs to the RH reading column. The part about fluctuations over 24 hours
      also touches RHvar.'
  - name: RHvar
    type: BIGINT
    description: 'BIGINT. Relative humidity variation. **NULL means no humidity variation recorded.**.
      Example: 2.54.'
  - name: air_press
    type: FLOAT
    description: 'REAL. Air pressure reading. **NULL means no air pressure data available.**. Example:
      1020.0.'
