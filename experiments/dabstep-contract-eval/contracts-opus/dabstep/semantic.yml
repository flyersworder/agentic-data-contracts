- schema: main
  table: payments
  description: "This is documentation for the payments.csv dataset\n\n\n- **Description**: Synthetic dataset\
    \ of payment transactions processed by the Payments Processor.\n- **Columns**:\n  - `psp_reference`:\
    \ Unique payment identifier (ID).\n  - `merchant`: Merchant name (Categorical), eg Starbucks or Netflix*.\n\
    \  - `card_scheme`: Card Scheme used (Categorical) - *[MasterCard, Visa, Amex, Other]*.\n  - `year`:\
    \ Payment initiation year (Numeric).\n  - `hour_of_day`: Payment initiation hour (Numeric).\n  - `minute_of_hour`:\
    \ Payment initiation minute (Numeric).\n  - `day_of_year`: Day of the year of payment initiation (Numeric).\n\
    \  - `is_credit`: Credit or Debit card indicator (Categorical).\n  - `eur_amount`: Payment amount\
    \ in euro (Numeric).\n  - `ip_country`: The country the shopper was in at time of transaction (determined\
    \ by IP address) (Categorical) - *[SE, NL, LU, IT, BE, FR, GR, ES]*.\n  - `issuing_country`: Card-issuing\
    \ country (Categorical) - *[SE, NL, LU, IT, BE, FR, GR, ES]*.\n  - `device_type`: Device type used\
    \ (Categorical) - *[Windows, Linux, MacOS, iOS, Android, Other]*.\n  - `ip_address`: Hashed shopper's\
    \ IP (ID).\n  - `email_address`: Hashed shopper's email (ID).\n  - `card_number`: Hashed card number\
    \ (ID).\n  - `shopper_interaction`: Payment method (Categorical) - *[Ecommerce, POS]*. POS means an\
    \ in-person or in-store transaction.\n  - `card_bin`: Bank Identification Number (ID).\n  - `has_fraudulent_dispute`:\
    \ Indicator of fraudulent dispute from issuing bank (Boolean).\n  - `is_refused_by_adyen`: Adyen refusal\
    \ indicator (Boolean).\n  - `aci`: Authorization Characteristics Indicator (Categorical).\n  - `acquirer_country`:\
    \ The location (country) of the acquiring bank (Categorical) - *[SE, NL, LU, IT, BE, FR, GR, ES]*."
