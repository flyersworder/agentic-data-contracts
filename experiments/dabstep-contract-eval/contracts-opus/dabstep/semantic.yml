# Compiled by dce.compile -- do not edit; recompile instead.
# benchmark: dabstep, database: dabstep, compiler: claudeopus5.5
# inputs: manual.md, payments-readme.md, dabstep.duckdb
metrics:
- name: account_type_description
  description: 'Description of a merchant''s account type code (R, D, H, F, S, O), from the Account Type
    table.


    From the manual section "2 Account Type".'
  sql_expression: CASE account_type WHEN 'R' THEN 'Enterprise - Retail' WHEN 'D' THEN 'Enterprise - Digital'
    WHEN 'H' THEN 'Enterprise - Hospitality' WHEN 'F' THEN 'Platform - Franchise' WHEN 'S' THEN 'Platform
    - SaaS' WHEN 'O' THEN 'Other' END
  source_model: main.merchant_data
  domains:
  - 2_account_type
- name: mcc_category
  description: 'MCC category: the first two digits of the four-digit merchant category code.


    From the manual section "3 Merchant Category Code".'
  sql_expression: merchant_category_code // 100
  source_model: main.merchant_data
  domains:
  - 3_merchant_category_code
- name: mcc_subcategory
  description: 'MCC subcategory: the last two digits of the four-digit merchant category code.


    From the manual section "3 Merchant Category Code".'
  sql_expression: merchant_category_code % 100
  source_model: main.merchant_data
  domains:
  - 3_merchant_category_code
- name: aci_description
  description: 'Row-level label: maps each payment''s Authorization Characteristics Indicator code (A-G)
    to its documented meaning (how the transaction was sent to the acquirer).


    From the manual section "4 Authorization Characteristics Indicator (ACI)".'
  sql_expression: CASE aci WHEN 'A' THEN 'Card present - Non-authenticated' WHEN 'B' THEN 'Card Present
    - Authenticated' WHEN 'C' THEN 'Tokenized card with mobile device' WHEN 'D' THEN 'Card Not Present
    - Card On File' WHEN 'E' THEN 'Card Not Present - Recurring Bill Payment' WHEN 'F' THEN 'Card Not
    Present - 3-D Secure' WHEN 'G' THEN 'Card Not Present - Non-3-D Secure' END
  source_model: main.payments
  domains:
  - 4_authorization_characteristics_indicator_aci
- name: is_intracountry
  description: 'Domestic transaction: card issuing country equals acquiring country (matches fees.intracountry
    = 1.0; international = 0.0).


    From the manual section "5 Understanding Payment Processing Fees".'
  sql_expression: issuing_country = acquirer_country
  source_model: main.payments
  domains:
  - 5_understanding_payment_processing_fees
- name: merchant_monthly_volume
  description: 'Total EUR volume of the payment''s merchant in the payment''s natural calendar month (day
    1 to last day), used to match fees.monthly_volume.


    From the manual section "5 Understanding Payment Processing Fees".'
  sql_expression: (SELECT SUM(p2.eur_amount) FROM payments p2 WHERE p2.merchant = payments.merchant AND
    p2.year = payments.year AND month(make_date(CAST(p2.year AS INT),1,1) + CAST(p2.day_of_year - 1 AS
    INT)) = month(make_date(CAST(payments.year AS INT),1,1) + CAST(payments.day_of_year - 1 AS INT)))
  source_model: main.payments
  domains:
  - 5_understanding_payment_processing_fees
- name: merchant_monthly_fraud_level_pct
  description: 'Fraud level of the payment''s merchant in its natural calendar month: fraudulent-dispute
    EUR volume / total EUR volume, in percent (compare to fees.monthly_fraud_level ranges like ''7.7%-8.3%'').


    From the manual section "5 Understanding Payment Processing Fees".'
  sql_expression: (SELECT 100.0 * SUM(CASE WHEN p2.has_fraudulent_dispute THEN p2.eur_amount ELSE 0 END)
    / SUM(p2.eur_amount) FROM payments p2 WHERE p2.merchant = payments.merchant AND p2.year = payments.year
    AND month(make_date(CAST(p2.year AS INT),1,1) + CAST(p2.day_of_year - 1 AS INT)) = month(make_date(CAST(payments.year
    AS INT),1,1) + CAST(payments.day_of_year - 1 AS INT)))
  source_model: main.payments
  domains:
  - 5_understanding_payment_processing_fees
- name: is_local_acquiring
  description: 'Local acquiring transaction: the card issuing country equals the acquiring bank''s country
    (section 5.1.1).


    From the manual section "5.1.1 Optimizing Transactions through Local Acquiring".'
  sql_expression: issuing_country = acquirer_country
  source_model: main.payments
  domains:
  - 5_1_1_optimizing_transactions_through_local_acquiring
- name: fraud_rate
  description: 'Fraud rate: fraudulent volume (EUR amount of payments with a fraudulent dispute) divided
    by total EUR volume. Returns a ratio (multiply by 100 for percent).


    From the manual section "7 Reducing Fraud-Related Fees".'
  sql_expression: SUM(CASE WHEN has_fraudulent_dispute THEN eur_amount ELSE 0 END) / SUM(eur_amount)
  source_model: main.payments
  domains:
  - 7_reducing_fraud_related_fees
