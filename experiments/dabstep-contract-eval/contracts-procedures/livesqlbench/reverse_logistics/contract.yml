# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: reverse_logistics, author: claudeopus5.5
version: '1.0'
name: reverse-logistics
semantic:
  source:
    type: yaml
    path: ./semantic.yml
  allowed_tables:
  - schema: main
    description: 'Reverse-logistics (product returns) database: customers, orders, products, returns,
      quality inspections, financial cost breakdowns, case management, processing facilities and the Return
      Handling Charge Schedule.'
    preferred: true
    tables:
    - customers
    - products
    - orders
    - returns
    - quality_assessment
    - return_processing
    - financial_management
    - case_management
    - return_charge_rules
  forbidden_operations:
  - DELETE
  - DROP
  - TRUNCATE
  - UPDATE
  - INSERT
  - CREATE
  - ALTER
  - MERGE
  - GRANT
  - REVOKE
  - COPY
  domains:
  - name: return_costs
    summary: Cost components of a return and the cost KPIs built on them (TRC, RPI, RRD, SAL, RCP, RCCI)
    description: 'COST COMPONENTS. Shipping Fee (S_f): cost charged by the logistics provider for transporting
      a returned item; a monetary amount reflecting transportation cost incurred for a single return shipment
      — JSON path shipping.fee in returns.return_details. Restocking Fee (R_f): service charge for reintegrating
      a returned item into inventory; fee imposed to cover administrative and handling work required to
      make the item sellable again — fees.restocking_fee in financial_management.cost_breakdown. Relabeling
      Cost (L_c): expense of printing and applying new labels or packaging identifiers to a returned item;
      direct cost of material and labor associated with correcting item labeling deficiencies — fees.relabeling_cost.
      Disposal Cost (D_c): fee incurred when discarding a returned item that cannot be resold or refurbished;
      monetary cost of disposing the item through methods such as recycling, landfill, or hazardous-waste
      processing — disposal.disposal_cost (the column financial_management.dispcost is 0 in all 995 rows,
      so the JSON field is the one carrying values). Repair Estimate (R_e): projected expense required
      to bring a defective return back to sellable condition; estimated sum of parts, labor and overhead
      needed for repair work, agreed before work commences — repair_costs.repair_estimate. Recovery Value
      (R_v): amount of monetary value recaptured from a return via resale, refurbish, or parts harvesting;
      net revenue expected after processing the return, excluding initial cost — valuation.recovery_value.
      Carbon Footprint (C_f): estimated kilograms of CO2-equivalent generated through return processing
      activities; quantifies greenhouse-gas emissions attributable to transportation, handling, and disposal
      of a single return — sustainability.carbon_footprint. Days Lapsed (D_l): number of calendar days
      between original transaction and completion of return processing; difference in days between transaction
      date and point at which funds/refund are issued — returns.dayslapsed (1 or more in every row).

      FORMULAS. Total Return Cost: TRC = S_f + R_f + L_c + D_c + R_e (aggregated monetary outlay to handle
      a single return from transport to final disposition). Return Profit Impact: RPI = R_v - TRC. Recovery
      Rate per Day: RRD = R_v / D_l (value recovered per day elapsed since sale). Sustainability-Adjusted
      Loss: SAL = TRC + 0.5 * C_f - R_v. Regulatory Compliance Penalty: if the product''s Regulatory Compliance
      Status is ''Non-compliant'', RCP = 0.2 * TRC, else RCP = 0. Return Channel Cost Index: RCCI = S_f
      / average S_f of the same return channel.

      DATA COVERAGE. financial_management has 995 rows, one per return for 995 of the 1500 returns (joined
      on casetag = returns.casenum); TRC, RPI, SAL, RCP and RRD exist only for those returns. All JSON
      numbers are stored as JSON numbers (some integers, some doubles) — read them with ->> and CAST AS
      DOUBLE. cost_breakdown.refund.refund_amount is 0 in every row.

      '
    tables:
    - main.returns
    - main.financial_management
    - main.products
  - name: return_charges
    summary: Return Handling Charge Schedule, rule matching, precedence and RHC
    description: 'RETURN HANDLING CHARGE SCHEDULE. return_charge_rules is a rule table that sets the charge
      a customer pays for having a return handled. Each row is one rule, identified by rule_id. Criteria
      are compared with a return as follows: customer_segment with customers.seg_category of the return''s
      customer (the customer is orders.buyerlink of the return''s order, returns.srctxn = orders.txnnum);
      return_channel with returns.return_channel; item_category with products.itemcategory of the returned
      item (returns.itemlink = products.itemcode); primary_reason with the text at JSON path reasoning.primary_reason
      in returns.return_details; item_condition with the text at JSON path condition.item_condition in
      quality_assessment.assessment_summary (quality_assessment.inspectref = returns.casenum); and the
      band min_monthly_returns..max_monthly_returns with the return''s Customer Monthly Return Count.
      Charge terms are flat_charge and charge_pct.

      CUSTOMER MONTHLY RETURN COUNT (CMRC): number of returns a customer has processed in one calendar
      month. The month of a return is the calendar month of returns.revdate, a ''YYYY-MM-DD'' text whose
      first seven characters give ''YYYY-MM'' (verified: all 1500 revdate values match YYYY-MM-DD, range
      2025-01-20..2025-02-19). CMRC of a return is the number of rows in returns with the same customer
      and the same month, the return itself included, so it is at least 1 and is the same for every return
      of that customer in that month.

      MATCHING. A rule matches a return when all of its criteria match. A text criterion (customer_segment,
      return_channel, item_category, primary_reason, item_condition) matches when it is NULL, or when
      it equals the return''s value exactly; a non-NULL criterion never matches a return whose value is
      NULL (for example a customer whose seg_category is NULL — 93 customers have NULL seg_category, meaning
      not assigned). The band matches when min_monthly_returns <= CMRC <= max_monthly_returns, both bounds
      inclusive; a NULL bound sets no limit on its side.

      PRECEDENCE. At most one rule applies to a return: among the rules that match it, the one with the
      highest specificity, ties broken by the lowest rule_id. Specificity counts each non-NULL text criterion
      as 1, plus 1 for the band if min_monthly_returns or max_monthly_returns is non-NULL (0 to 6). A
      return that matches no rule takes the Standard Handling Charge, flat_charge 15.00 and charge_pct
      5.0, and has no applying rule id.

      RETURN HANDLING CHARGE: RHC = F + P/100 * V, F = flat_charge and P = charge_pct of the applying
      rule (or of the Standard Handling Charge), V = products.unit_value of the returned item, in the
      currency units of unit_value. Every row of returns has an RHC. A customer''s or group''s RHC over
      a period is the sum over its returns whose revdate falls in the period; its average is that sum
      divided by the number of those returns. No intermediate rounding; round only the reported result,
      to 2 decimals. Use metrics return_handling_charge, total_return_handling_charge, average_return_handling_charge
      and applying_charge_rule_id.

      '
    tables:
    - main.return_charge_rules
    - main.returns
    - main.orders
    - main.customers
    - main.products
    - main.quality_assessment
  - name: value_leakage
    summary: Inspected Resale Value, Return Value Leakage, Customer Leakage Ratio and Leakage Class
    description: 'CUSTOMER RETURN MONTH: the customer-and-month grain at which return value leakage is
      reviewed. Customer of a return = orders.buyerlink of its order (returns.srctxn = orders.txnnum);
      month = first seven characters (''YYYY-MM'') of returns.revdate. A customer return month is the
      set of rows in returns with one customer and one month; a customer has one only for months in which
      it has at least one return (397 exist in the data).

      INSPECTED RESALE VALUE: IRV = V * A/10 * K, V = products.unit_value of the returned item; A = aesthetic
      score at JSON path results.aesthetic_score in quality_assessment.assessment_summary, a number from
      1 to 10 read as a decimal (stored as JSON number, observed range 1.0-10.0); K = completeness factor
      from condition.completeness: 1.00 for ''Complete'', 0.85 for ''Accessories Missing'', 0.60 for ''Missing
      Parts''. In the currency units of unit_value.

      RETURN VALUE LEAKAGE: value lost on one return — the item value inspection cannot recover, plus
      the return shipping: RVL = V - IRV + S_f, S_f = JSON path shipping.fee in returns.return_details
      read as a decimal. Computed for every row of returns (every return has exactly one quality_assessment
      row).

      CUSTOMER LEAKAGE RATIO: CLR = SUM(RVL) / SUM(V) over the same returns — a ratio of sums, not an
      average of per-return ratios. Computed per Customer Return Month; a customer''s or group''s CLR
      over another period takes both sums over its returns whose revdate falls in that period. Its RVL
      over a period is the sum over those returns, and its average is that sum divided by their number.
      No intermediate rounding; round only the reported result, to 2 decimals.

      LEAKAGE CLASS: graded on the unrounded CLR of a Customer Return Month: ''Contained'' when CLR <
      0.55; ''Elevated'' when 0.55 <= CLR < 0.70; ''Severe'' when CLR >= 0.70. Lower bounds inclusive,
      upper bounds exclusive. The class belongs to the customer-month, so one customer can hold different
      classes in different months.

      '
    tables:
    - main.returns
    - main.orders
    - main.products
    - main.quality_assessment
  - name: customers_and_risk
    summary: Customer return behaviour (CRFI, tenure), warranty claims and fraud scoring
    description: 'TOTAL RETURNS (T_r): lifetime count of items a customer has returned; cumulative tally
      of processed return cases associated with a single customer account — customers.return_behavior_profile
      total_returns. CUSTOMER TENURE (YEARS): length of time a customer has maintained an active account
      before current date = (current date - customer''s first recorded transaction) / 365. CUSTOMER RETURN
      FREQUENCY INDEX: CRFI = T_r / T_y. DATA WARNING: orders.txndate is NULL in all 1488 orders (and
      orders.transaction_value is 0 in all of them), so tenure and CRFI evaluate to NULL on this data;
      say so rather than substituting another date.

      WARRANTY CLAIM RATIO: WCR = N_claims / T_r, the proportion of returns that include a valid warranty
      claim, N_claims = number of authorised warranty claims. Warranty statuses: ''Valid'' = within manufacturer
      or retailer warranty period; ''Expired'' = warranty term has lapsed; ''Not Applicable'' = no warranty
      offered or proof unavailable. authorization.warranty_claim NULL means no warranty claim information
      available.

      FRAUD: Fraud Risk Levels are a qualitative grading of suspected fraud severity: ''Low'', ''Medium'',
      ''High'' (fraud.risk_level; NULL = no fraud risk level assessed, 645 of 1500 returns). Fraud Flag
      Severity Score: FFS = F_f * w_risk, F_f = number of fraud flags (fraud.fraud_flags, 0-5), w_risk
      = weight based on the Fraud Risk Level. The documentation does not state the weights; see metric
      fraud_flag_severity_score.

      '
    tables:
    - main.customers
    - main.orders
    - main.returns
  - name: processing_and_reference
    summary: Processing facilities (APT) and the documented value vocabularies
    description: 'AVERAGE PROCESSING TIME: APT = SUM(PT_i)/n, mean calendar time spent processing a batch
      of returns at a given facility (return_processing.proctime, one row per location code loccode; 26
      rows; the table has no link to returns).

      RETURN CHANNELS: ''Store'' = customer returns item in person at a retail outlet; ''Courier'' = customer
      arranges a courier service for doorstep pickup; ''Mail'' = item is posted through the national mail
      system; ''Locker'' = customer deposits parcel in an automated locker or drop-box; ''Pickup'' = retailer
      schedules a home or office collection for oversized or fragile goods. Data check: returns contain
      only Store, Mail, Courier and ''Collection Point'' (undocumented); no ''Locker'' or ''Pickup'' rows
      exist.

      ITEM CONDITION STATES: ''New'', ''Like New'', ''Used'', ''Damaged''.

      DISPOSAL METHODS: ''Recycle'' = materials separated for recycling streams; ''Hazardous Waste'' =
      components containing batteries, chemicals, or e-waste; ''Landfill'' = non-recyclable residuals;
      ''Return to Vendor'' = supplier agrees to take back for specialised processing.

      REFUND METHODS: ''Original Payment'' = credit card/PayPal reversal within payment gateway; ''Bank
      Transfer'' = direct ACH/SEPA transfer when gateway refund blocked; ''Store Credit'' = applied to
      customer account as gift card or voucher on customer request or policy.

      APPROVAL LEVELS (hierarchy of sign-off required for exceptional processing steps): ''Automatic'',
      ''Manager'', ''Supervisor''.

      SATISFACTION SCORES (case_management.satisfscore): 5-point ordinal scale, larger = more satisfied:
      1 Very Dissatisfied; 2 Dissatisfied; 3 Neutral; 4 Satisfied; 5 Very Satisfied.

      PROCESSING PRIORITIES: ''Bulk'' = palletised or batch returns processed during low-demand periods;
      ''Standard'' = default SLA (e.g., 3-5 days); ''Express'' = expedited for VIP customers, high resale
      value, or paid premium.

      REGULATORY COMPLIANCE STATUSES (products.product_traceability compliance.regulatory_compliance):
      ''Compliant'' = meeting all relevant safety/environmental standards; ''Non-compliant'' = failing
      certification, recall notice, or missing documentation, triggering quarantine or disposal penalty
      (see RCP). NULL = no status available (161 of 333 products).

      MIXED BOOLEAN TEXT: return_processing.needsrelabel, case_management.trainident and assessment_summary
      documentation.has_photos use tokens 0, 1, F, False, N, NO, P, True, Y, YES. Truthy: 1, True, Y,
      YES; falsy: 0, F, False, N, NO; ''P'' is undocumented. returns.logtime mixes formats (''Jun 15,
      2024'', ''February 18th, 2025'', ''2024-08-13'', ''2024/11/04''); use revdate for months.

      '
    tables:
    - main.return_processing
    - main.case_management
    - main.returns
    - main.financial_management
    - main.products
  rules:
  - name: use_declared_metrics
    description: 'Cost, charge and leakage computations must reuse the metric SQL in semantic.yml (TRC,
      RHC with rule precedence, IRV/RVL/CLR, Leakage Class) rather than ad-hoc formulas.

      '
    enforcement: warn
  - name: round_only_final
    description: 'No intermediate rounding: RHC, RVL and CLR are computed unrounded (Leakage Class is
      graded on the unrounded CLR); round only the reported result, to 2 decimals.

      '
    enforcement: warn
  - name: json_access
    description: 'Read JSON fields with ->> and parenthesise the expression before comparing, e.g. (r.return_details->>''$.reasoning.primary_reason'')
      = ''Size/Fit''; without parentheses DuckDB parses the comparison first and fails. Cast numeric JSON
      fields with CAST(... AS DOUBLE).

      '
    enforcement: warn
  - name: month_from_revdate
    description: 'The month of a return is substr(returns.revdate, 1, 7); the customer of a return is
      orders.buyerlink via returns.srctxn = orders.txnnum. Period filters for RHC and CLR apply to returns.revdate.

      '
    enforcement: warn
  - name: integer_division
    description: 'Integer division truncates (PostgreSQL semantics); cast counts to DOUBLE when computing
      ratios such as the Warranty Claim Ratio.

      '
    enforcement: warn
