- name: employer_monthly_case_volume
  description: 'EMCV = number of cases of an employer whose Start Month is the given calendar month; every
    cases row counts once regardless of status or headCt. GROUP BY c.homefirm (exact text, no folding/trimming),
    date_trunc(''month'', strptime(c.beginday, ''%d/%m/%Y'')). beginDay is ''DD/MM/YYYY''.

    '
  sql_expression: COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - review_effort
- name: review_rule_specificity
  description: Number of the six criteria of a review_schedule rule that place a restriction (not NULL
    and not the wildcard '*').
  sql_expression: '(CASE WHEN r.visa_class IS NOT NULL AND r.visa_class <> ''*'' THEN 1 ELSE 0 END)

    + (CASE WHEN r.wage_level IS NOT NULL AND r.wage_level <> ''*'' THEN 1 ELSE 0 END)

    + (CASE WHEN r.h1b_dependent IS NOT NULL AND r.h1b_dependent <> ''*'' THEN 1 ELSE 0 END)

    + (CASE WHEN r.soc_major_group IS NOT NULL AND r.soc_major_group <> ''*'' THEN 1 ELSE 0 END)

    + (CASE WHEN r.worksite_state IS NOT NULL AND r.worksite_state <> ''*'' THEN 1 ELSE 0 END)

    + (CASE WHEN r.monthly_volume_band IS NOT NULL AND r.monthly_volume_band <> ''*'' THEN 1 ELSE 0 END)

    '
  source_model: main.review_schedule
  from_sql: main.review_schedule r
  grain: one row per review rule
  domains:
  - review_effort
- name: review_rule_matches_case
  description: 'True when case cvb matches rule r: every criterion that is not NULL/''*'' equals the case
    value as exact text (visa_class, wage_level from prevailing_wage.level, h1b_dependent, first two chars
    of SocCd, worksite state, Monthly Volume Band). A NULL case value only matches a wildcard criterion
    (equality with NULL is not true). cvb columns: filekey, homefirm, headct, visa_class, h1b_dependent,
    soc_major_group, start_month, worksite_state, wage_level, emcv, volume_band.

    '
  sql_expression: '(r.visa_class IS NULL OR r.visa_class = ''*'' OR r.visa_class = cvb.visa_class)

    AND (r.wage_level IS NULL OR r.wage_level = ''*'' OR r.wage_level = cvb.wage_level)

    AND (r.h1b_dependent IS NULL OR r.h1b_dependent = ''*'' OR r.h1b_dependent = cvb.h1b_dependent)

    AND (r.soc_major_group IS NULL OR r.soc_major_group = ''*'' OR r.soc_major_group = cvb.soc_major_group)

    AND (r.worksite_state IS NULL OR r.worksite_state = ''*'' OR r.worksite_state = cvb.worksite_state)

    AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = ''*'' OR r.monthly_volume_band = cvb.volume_band)

    '
  source_model: main.review_schedule
  from_sql: "(SELECT cv.*, CASE WHEN cv.emcv = 1 THEN '1' WHEN cv.emcv BETWEEN 2 AND 4 THEN '2-4'\n  \
    \                 WHEN cv.emcv BETWEEN 5 AND 14 THEN '5-14' WHEN cv.emcv >= 15 THEN '15+' END AS volume_band\n\
    \ FROM (SELECT cb.*, COUNT(*) OVER (PARTITION BY cb.homefirm, cb.start_month) AS emcv\n       FROM\
    \ (SELECT c.filekey, c.homefirm, c.headct, CAST(c.visacls AS VARCHAR) AS visa_class,\n           \
    \         CAST(c.h1bdep AS VARCHAR) AS h1b_dependent, left(c.soccd, 2) AS soc_major_group,\n     \
    \               date_trunc('month', strptime(c.beginday, '%d/%m/%Y'))::DATE AS start_month,\n    \
    \                cw.wsstate AS worksite_state, pw.wage_details->>'$.prevailing_wage.level' AS wage_level\n\
    \             FROM main.cases c\n             LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n\
    \             LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack) cb) cv) cvb\nCROSS JOIN\
    \ main.review_schedule r\n"
  grain: one row per (case, review rule) pair
  domains:
  - review_effort
- name: monthly_volume_band
  description: 'The case''s Monthly Volume Band from its employer''s EMCV in its Start Month: ''1'' (EMCV
    = 1), ''2-4'', ''5-14'', ''15+'' (inclusive ends). EMCV is computed over all cases before any outer
    filter. rv columns: filekey, homefirm, start_month, headct, visa_class, wage_level, h1b_dependent,
    soc_major_group, worksite_state, emcv, volume_band, governing_rule_id, base_hours, position_hours,
    crh.

    '
  sql_expression: rv.volume_band
  source_model: main.cases
  from_sql: "(SELECT cvb.filekey, cvb.homefirm, cvb.start_month, cvb.headct, cvb.visa_class, cvb.wage_level,\n\
    \        cvb.h1b_dependent, cvb.soc_major_group, cvb.worksite_state, cvb.emcv, cvb.volume_band,\n\
    \        r.rule_id AS governing_rule_id,\n        COALESCE(r.base_hours, 3.50) AS base_hours,\n  \
    \      COALESCE(r.position_hours, 0.50) AS position_hours,\n        COALESCE(r.base_hours, 3.50) +\
    \ COALESCE(r.position_hours, 0.50) * cvb.headct AS crh\n FROM (SELECT cv.*, CASE WHEN cv.emcv = 1\
    \ THEN '1' WHEN cv.emcv BETWEEN 2 AND 4 THEN '2-4'\n                         WHEN cv.emcv BETWEEN\
    \ 5 AND 14 THEN '5-14' WHEN cv.emcv >= 15 THEN '15+' END AS volume_band\n       FROM (SELECT cb.*,\
    \ COUNT(*) OVER (PARTITION BY cb.homefirm, cb.start_month) AS emcv\n             FROM (SELECT c.filekey,\
    \ c.homefirm, c.headct, CAST(c.visacls AS VARCHAR) AS visa_class,\n                          CAST(c.h1bdep\
    \ AS VARCHAR) AS h1b_dependent, left(c.soccd, 2) AS soc_major_group,\n                          date_trunc('month',\
    \ strptime(c.beginday, '%d/%m/%Y'))::DATE AS start_month,\n                          cw.wsstate AS\
    \ worksite_state, pw.wage_details->>'$.prevailing_wage.level' AS wage_level\n                   FROM\
    \ main.cases c\n                   LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   \
    \                LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack) cb) cv) cvb\n LEFT\
    \ JOIN main.review_schedule r\n   ON (r.visa_class IS NULL OR r.visa_class = '*' OR r.visa_class =\
    \ cvb.visa_class)\n  AND (r.wage_level IS NULL OR r.wage_level = '*' OR r.wage_level = cvb.wage_level)\n\
    \  AND (r.h1b_dependent IS NULL OR r.h1b_dependent = '*' OR r.h1b_dependent = cvb.h1b_dependent)\n\
    \  AND (r.soc_major_group IS NULL OR r.soc_major_group = '*' OR r.soc_major_group = cvb.soc_major_group)\n\
    \  AND (r.worksite_state IS NULL OR r.worksite_state = '*' OR r.worksite_state = cvb.worksite_state)\n\
    \  AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = '*' OR r.monthly_volume_band = cvb.volume_band)\n\
    \ QUALIFY ROW_NUMBER() OVER (PARTITION BY cvb.filekey ORDER BY\n     (CASE WHEN r.visa_class IS NOT\
    \ NULL AND r.visa_class <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.wage_level IS NOT NULL AND r.wage_level\
    \ <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.h1b_dependent IS NOT NULL AND r.h1b_dependent <> '*'\
    \ THEN 1 ELSE 0 END\n    + CASE WHEN r.soc_major_group IS NOT NULL AND r.soc_major_group <> '*' THEN\
    \ 1 ELSE 0 END\n    + CASE WHEN r.worksite_state IS NOT NULL AND r.worksite_state <> '*' THEN 1 ELSE\
    \ 0 END\n    + CASE WHEN r.monthly_volume_band IS NOT NULL AND r.monthly_volume_band <> '*' THEN 1\
    \ ELSE 0 END) DESC,\n     r.rule_id ASC NULLS LAST) = 1) rv\n"
  grain: one row per case with its governing review rule and CRH
  domains:
  - review_effort
- name: governing_review_rule_id
  description: 'The governing rule: among matching rules the one with most restricting criteria, ties
    to the lowest rule_id; NULL when no rule matches (Default Review Schedule 3.50 / 0.50 applies; 69
    of 981 cases). Other matching rules are ignored, never added or averaged.

    '
  sql_expression: rv.governing_rule_id
  source_model: main.cases
  from_sql: "(SELECT cvb.filekey, cvb.homefirm, cvb.start_month, cvb.headct, cvb.visa_class, cvb.wage_level,\n\
    \        cvb.h1b_dependent, cvb.soc_major_group, cvb.worksite_state, cvb.emcv, cvb.volume_band,\n\
    \        r.rule_id AS governing_rule_id,\n        COALESCE(r.base_hours, 3.50) AS base_hours,\n  \
    \      COALESCE(r.position_hours, 0.50) AS position_hours,\n        COALESCE(r.base_hours, 3.50) +\
    \ COALESCE(r.position_hours, 0.50) * cvb.headct AS crh\n FROM (SELECT cv.*, CASE WHEN cv.emcv = 1\
    \ THEN '1' WHEN cv.emcv BETWEEN 2 AND 4 THEN '2-4'\n                         WHEN cv.emcv BETWEEN\
    \ 5 AND 14 THEN '5-14' WHEN cv.emcv >= 15 THEN '15+' END AS volume_band\n       FROM (SELECT cb.*,\
    \ COUNT(*) OVER (PARTITION BY cb.homefirm, cb.start_month) AS emcv\n             FROM (SELECT c.filekey,\
    \ c.homefirm, c.headct, CAST(c.visacls AS VARCHAR) AS visa_class,\n                          CAST(c.h1bdep\
    \ AS VARCHAR) AS h1b_dependent, left(c.soccd, 2) AS soc_major_group,\n                          date_trunc('month',\
    \ strptime(c.beginday, '%d/%m/%Y'))::DATE AS start_month,\n                          cw.wsstate AS\
    \ worksite_state, pw.wage_details->>'$.prevailing_wage.level' AS wage_level\n                   FROM\
    \ main.cases c\n                   LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   \
    \                LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack) cb) cv) cvb\n LEFT\
    \ JOIN main.review_schedule r\n   ON (r.visa_class IS NULL OR r.visa_class = '*' OR r.visa_class =\
    \ cvb.visa_class)\n  AND (r.wage_level IS NULL OR r.wage_level = '*' OR r.wage_level = cvb.wage_level)\n\
    \  AND (r.h1b_dependent IS NULL OR r.h1b_dependent = '*' OR r.h1b_dependent = cvb.h1b_dependent)\n\
    \  AND (r.soc_major_group IS NULL OR r.soc_major_group = '*' OR r.soc_major_group = cvb.soc_major_group)\n\
    \  AND (r.worksite_state IS NULL OR r.worksite_state = '*' OR r.worksite_state = cvb.worksite_state)\n\
    \  AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = '*' OR r.monthly_volume_band = cvb.volume_band)\n\
    \ QUALIFY ROW_NUMBER() OVER (PARTITION BY cvb.filekey ORDER BY\n     (CASE WHEN r.visa_class IS NOT\
    \ NULL AND r.visa_class <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.wage_level IS NOT NULL AND r.wage_level\
    \ <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.h1b_dependent IS NOT NULL AND r.h1b_dependent <> '*'\
    \ THEN 1 ELSE 0 END\n    + CASE WHEN r.soc_major_group IS NOT NULL AND r.soc_major_group <> '*' THEN\
    \ 1 ELSE 0 END\n    + CASE WHEN r.worksite_state IS NOT NULL AND r.worksite_state <> '*' THEN 1 ELSE\
    \ 0 END\n    + CASE WHEN r.monthly_volume_band IS NOT NULL AND r.monthly_volume_band <> '*' THEN 1\
    \ ELSE 0 END) DESC,\n     r.rule_id ASC NULLS LAST) = 1) rv\n"
  grain: one row per case
  domains:
  - review_effort
- name: case_review_hours
  description: 'CRH = base_hours + position_hours x headCt from the governing rule (or default 3.50 +
    0.50 x headCt). Reviewer-hours, exact to two decimals (DECIMAL), not rounded before aggregation. Total
    over all cases on this data: 4188.00.

    '
  sql_expression: rv.crh
  source_model: main.cases
  from_sql: "(SELECT cvb.filekey, cvb.homefirm, cvb.start_month, cvb.headct, cvb.visa_class, cvb.wage_level,\n\
    \        cvb.h1b_dependent, cvb.soc_major_group, cvb.worksite_state, cvb.emcv, cvb.volume_band,\n\
    \        r.rule_id AS governing_rule_id,\n        COALESCE(r.base_hours, 3.50) AS base_hours,\n  \
    \      COALESCE(r.position_hours, 0.50) AS position_hours,\n        COALESCE(r.base_hours, 3.50) +\
    \ COALESCE(r.position_hours, 0.50) * cvb.headct AS crh\n FROM (SELECT cv.*, CASE WHEN cv.emcv = 1\
    \ THEN '1' WHEN cv.emcv BETWEEN 2 AND 4 THEN '2-4'\n                         WHEN cv.emcv BETWEEN\
    \ 5 AND 14 THEN '5-14' WHEN cv.emcv >= 15 THEN '15+' END AS volume_band\n       FROM (SELECT cb.*,\
    \ COUNT(*) OVER (PARTITION BY cb.homefirm, cb.start_month) AS emcv\n             FROM (SELECT c.filekey,\
    \ c.homefirm, c.headct, CAST(c.visacls AS VARCHAR) AS visa_class,\n                          CAST(c.h1bdep\
    \ AS VARCHAR) AS h1b_dependent, left(c.soccd, 2) AS soc_major_group,\n                          date_trunc('month',\
    \ strptime(c.beginday, '%d/%m/%Y'))::DATE AS start_month,\n                          cw.wsstate AS\
    \ worksite_state, pw.wage_details->>'$.prevailing_wage.level' AS wage_level\n                   FROM\
    \ main.cases c\n                   LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   \
    \                LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack) cb) cv) cvb\n LEFT\
    \ JOIN main.review_schedule r\n   ON (r.visa_class IS NULL OR r.visa_class = '*' OR r.visa_class =\
    \ cvb.visa_class)\n  AND (r.wage_level IS NULL OR r.wage_level = '*' OR r.wage_level = cvb.wage_level)\n\
    \  AND (r.h1b_dependent IS NULL OR r.h1b_dependent = '*' OR r.h1b_dependent = cvb.h1b_dependent)\n\
    \  AND (r.soc_major_group IS NULL OR r.soc_major_group = '*' OR r.soc_major_group = cvb.soc_major_group)\n\
    \  AND (r.worksite_state IS NULL OR r.worksite_state = '*' OR r.worksite_state = cvb.worksite_state)\n\
    \  AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = '*' OR r.monthly_volume_band = cvb.volume_band)\n\
    \ QUALIFY ROW_NUMBER() OVER (PARTITION BY cvb.filekey ORDER BY\n     (CASE WHEN r.visa_class IS NOT\
    \ NULL AND r.visa_class <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.wage_level IS NOT NULL AND r.wage_level\
    \ <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.h1b_dependent IS NOT NULL AND r.h1b_dependent <> '*'\
    \ THEN 1 ELSE 0 END\n    + CASE WHEN r.soc_major_group IS NOT NULL AND r.soc_major_group <> '*' THEN\
    \ 1 ELSE 0 END\n    + CASE WHEN r.worksite_state IS NOT NULL AND r.worksite_state <> '*' THEN 1 ELSE\
    \ 0 END\n    + CASE WHEN r.monthly_volume_band IS NOT NULL AND r.monthly_volume_band <> '*' THEN 1\
    \ ELSE 0 END) DESC,\n     r.rule_id ASC NULLS LAST) = 1) rv\n"
  grain: one row per case
  domains:
  - review_effort
- name: employer_review_load
  description: 'ERL = sum of CRH over an employer''s cases whose Start Month lies in the period. GROUP
    BY rv.homefirm (exact text); period filter on rv.start_month (a month: rv.start_month = DATE ''2024-04-01'';
    a year: year(rv.start_month) = 2024). Round only when reported.

    '
  sql_expression: SUM(rv.crh)
  source_model: main.cases
  from_sql: "(SELECT cvb.filekey, cvb.homefirm, cvb.start_month, cvb.headct, cvb.visa_class, cvb.wage_level,\n\
    \        cvb.h1b_dependent, cvb.soc_major_group, cvb.worksite_state, cvb.emcv, cvb.volume_band,\n\
    \        r.rule_id AS governing_rule_id,\n        COALESCE(r.base_hours, 3.50) AS base_hours,\n  \
    \      COALESCE(r.position_hours, 0.50) AS position_hours,\n        COALESCE(r.base_hours, 3.50) +\
    \ COALESCE(r.position_hours, 0.50) * cvb.headct AS crh\n FROM (SELECT cv.*, CASE WHEN cv.emcv = 1\
    \ THEN '1' WHEN cv.emcv BETWEEN 2 AND 4 THEN '2-4'\n                         WHEN cv.emcv BETWEEN\
    \ 5 AND 14 THEN '5-14' WHEN cv.emcv >= 15 THEN '15+' END AS volume_band\n       FROM (SELECT cb.*,\
    \ COUNT(*) OVER (PARTITION BY cb.homefirm, cb.start_month) AS emcv\n             FROM (SELECT c.filekey,\
    \ c.homefirm, c.headct, CAST(c.visacls AS VARCHAR) AS visa_class,\n                          CAST(c.h1bdep\
    \ AS VARCHAR) AS h1b_dependent, left(c.soccd, 2) AS soc_major_group,\n                          date_trunc('month',\
    \ strptime(c.beginday, '%d/%m/%Y'))::DATE AS start_month,\n                          cw.wsstate AS\
    \ worksite_state, pw.wage_details->>'$.prevailing_wage.level' AS wage_level\n                   FROM\
    \ main.cases c\n                   LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   \
    \                LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack) cb) cv) cvb\n LEFT\
    \ JOIN main.review_schedule r\n   ON (r.visa_class IS NULL OR r.visa_class = '*' OR r.visa_class =\
    \ cvb.visa_class)\n  AND (r.wage_level IS NULL OR r.wage_level = '*' OR r.wage_level = cvb.wage_level)\n\
    \  AND (r.h1b_dependent IS NULL OR r.h1b_dependent = '*' OR r.h1b_dependent = cvb.h1b_dependent)\n\
    \  AND (r.soc_major_group IS NULL OR r.soc_major_group = '*' OR r.soc_major_group = cvb.soc_major_group)\n\
    \  AND (r.worksite_state IS NULL OR r.worksite_state = '*' OR r.worksite_state = cvb.worksite_state)\n\
    \  AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = '*' OR r.monthly_volume_band = cvb.volume_band)\n\
    \ QUALIFY ROW_NUMBER() OVER (PARTITION BY cvb.filekey ORDER BY\n     (CASE WHEN r.visa_class IS NOT\
    \ NULL AND r.visa_class <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.wage_level IS NOT NULL AND r.wage_level\
    \ <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.h1b_dependent IS NOT NULL AND r.h1b_dependent <> '*'\
    \ THEN 1 ELSE 0 END\n    + CASE WHEN r.soc_major_group IS NOT NULL AND r.soc_major_group <> '*' THEN\
    \ 1 ELSE 0 END\n    + CASE WHEN r.worksite_state IS NOT NULL AND r.worksite_state <> '*' THEN 1 ELSE\
    \ 0 END\n    + CASE WHEN r.monthly_volume_band IS NOT NULL AND r.monthly_volume_band <> '*' THEN 1\
    \ ELSE 0 END) DESC,\n     r.rule_id ASC NULLS LAST) = 1) rv\n"
  grain: one row per case
  domains:
  - review_effort
- name: average_case_review_hours
  description: Average CRH = sum of CRH divided by the number of cases in scope; unrounded until reported.
  sql_expression: SUM(rv.crh) / COUNT(*)
  source_model: main.cases
  from_sql: "(SELECT cvb.filekey, cvb.homefirm, cvb.start_month, cvb.headct, cvb.visa_class, cvb.wage_level,\n\
    \        cvb.h1b_dependent, cvb.soc_major_group, cvb.worksite_state, cvb.emcv, cvb.volume_band,\n\
    \        r.rule_id AS governing_rule_id,\n        COALESCE(r.base_hours, 3.50) AS base_hours,\n  \
    \      COALESCE(r.position_hours, 0.50) AS position_hours,\n        COALESCE(r.base_hours, 3.50) +\
    \ COALESCE(r.position_hours, 0.50) * cvb.headct AS crh\n FROM (SELECT cv.*, CASE WHEN cv.emcv = 1\
    \ THEN '1' WHEN cv.emcv BETWEEN 2 AND 4 THEN '2-4'\n                         WHEN cv.emcv BETWEEN\
    \ 5 AND 14 THEN '5-14' WHEN cv.emcv >= 15 THEN '15+' END AS volume_band\n       FROM (SELECT cb.*,\
    \ COUNT(*) OVER (PARTITION BY cb.homefirm, cb.start_month) AS emcv\n             FROM (SELECT c.filekey,\
    \ c.homefirm, c.headct, CAST(c.visacls AS VARCHAR) AS visa_class,\n                          CAST(c.h1bdep\
    \ AS VARCHAR) AS h1b_dependent, left(c.soccd, 2) AS soc_major_group,\n                          date_trunc('month',\
    \ strptime(c.beginday, '%d/%m/%Y'))::DATE AS start_month,\n                          cw.wsstate AS\
    \ worksite_state, pw.wage_details->>'$.prevailing_wage.level' AS wage_level\n                   FROM\
    \ main.cases c\n                   LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   \
    \                LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack) cb) cv) cvb\n LEFT\
    \ JOIN main.review_schedule r\n   ON (r.visa_class IS NULL OR r.visa_class = '*' OR r.visa_class =\
    \ cvb.visa_class)\n  AND (r.wage_level IS NULL OR r.wage_level = '*' OR r.wage_level = cvb.wage_level)\n\
    \  AND (r.h1b_dependent IS NULL OR r.h1b_dependent = '*' OR r.h1b_dependent = cvb.h1b_dependent)\n\
    \  AND (r.soc_major_group IS NULL OR r.soc_major_group = '*' OR r.soc_major_group = cvb.soc_major_group)\n\
    \  AND (r.worksite_state IS NULL OR r.worksite_state = '*' OR r.worksite_state = cvb.worksite_state)\n\
    \  AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = '*' OR r.monthly_volume_band = cvb.volume_band)\n\
    \ QUALIFY ROW_NUMBER() OVER (PARTITION BY cvb.filekey ORDER BY\n     (CASE WHEN r.visa_class IS NOT\
    \ NULL AND r.visa_class <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.wage_level IS NOT NULL AND r.wage_level\
    \ <> '*' THEN 1 ELSE 0 END\n    + CASE WHEN r.h1b_dependent IS NOT NULL AND r.h1b_dependent <> '*'\
    \ THEN 1 ELSE 0 END\n    + CASE WHEN r.soc_major_group IS NOT NULL AND r.soc_major_group <> '*' THEN\
    \ 1 ELSE 0 END\n    + CASE WHEN r.worksite_state IS NOT NULL AND r.worksite_state <> '*' THEN 1 ELSE\
    \ 0 END\n    + CASE WHEN r.monthly_volume_band IS NOT NULL AND r.monthly_volume_band <> '*' THEN 1\
    \ ELSE 0 END) DESC,\n     r.rule_id ASC NULLS LAST) = 1) rv\n"
  grain: one row per case
  domains:
  - review_effort
tables:
- schema: main
  table: employer
  description: One row per employer (corphandle + zipref).
  columns:
  - name: corphandle
    description: Employer name / identifier; cases.homefirm references it (exact text).
  - name: zipref
    description: Employer postal code; part of the key; cases.homezip references it.
  - name: employer_contact_info
    description: 'JSON: address{line1, line2 (NULL = none), city, state, zip, country (NULL = none), province
      (NULL = none)}, phone{number, extension (NULL = none)}, naics_code (6-digit NAICS industry code
      identifying the employer''s primary industry, e.g. 541511 Custom Computer Programming Services,
      561320 Temporary Help Services; read with ->>''$.naics_code''), alternate_name (trade name; NULL
      = none).'
- schema: main
  table: employer_poc
  description: Employer point of contact.
  columns:
  - name: contactmail
    description: Point-of-contact email (PK).
  - name: firmlink
    description: Employer reference -> employer.corphandle.
  - name: firmzip
    description: Employer postal code -> employer.zipref.
  - name: poc_contact_info
    description: 'JSON: name{first, middle (NULL = none), last}, title, address{line1, line2 (NULL = none),
      city, state, zip, country, province (NULL = none)}, phone{number (text), extension (NULL = none)}.'
- schema: main
  table: preparer
  description: Person who prepared the application.
  columns:
  - name: prepmail
    description: Preparer email (PK); cases.preplink references it.
  - name: preplname
    description: Preparer last name.
  - name: prepfname
    description: Preparer first name.
  - name: prepmi
    description: Preparer middle initial.
  - name: prepbiz
    description: Preparer business name; NULL = no business name provided.
- schema: main
  table: cases
  description: One row per labor condition application (981 rows).
  columns:
  - name: filekey
    description: Case number (PK).
  - name: statustag
    description: Case status. Outcomes can be Certified (approved), Denied (rejected), Withdrawn (voluntarily
      withdrawn by applicant), Certified-Withdrawn (approved but later withdrawn); data holds only CERTIFIED/Certified/certified
      - compare upper(trim(statustag)) = 'CERTIFIED'.
  - name: recvday
    description: Receipt date, text 'YYYY/MM/DD' (all 2023/12/21).
  - name: decisionday
    description: Decision date, text 'YYYY-MM-DD'; NULL = not provided (216 cases).
  - name: origcertday
    description: Original certification date; NULL = not provided (always NULL in data).
  - name: visacls
    description: 'Visa class enum: H-1B (specialty occupations), H-1B1 Singapore (Singapore nationals),
      H-1B1 Chile (Chilean nationals), E-3 Australian (Australian nationals), all in specialty occupations.'
  - name: jobtag
    description: Job title.
  - name: soccd
    description: SOC code, e.g. 15-1253.00 Software QA Analysts and Testers, 29-1141.00 Registered Nurses;
      first two characters = SOC major group.
  - name: soctitle
    description: SOC title.
  - name: fulltimeind
    description: Full-time indicator 'Y'/'N' (NULL = not given); full-time typically >= 35 hours/week,
      may vary by employer; non-full-time may be part-time.
  - name: beginday
    description: Employment begin date, text 'DD/MM/YYYY'; its year-month is the case's Start Month.
  - name: endday
    description: Employment end date, free text like '2026 20th Dec.'; NULL = none.
  - name: headct
    description: Total worker positions requested (headCt); used in CRH and EWAS weighting.
  - name: newemp
    description: New employment positions.
  - name: contemp
    description: Continued employment positions (> 0 = continuation application for ERR).
  - name: changeprev
    description: Change in previously approved employment positions.
  - name: concurrentlynew
    description: New concurrent employment positions.
  - name: changefirm
    description: Change of employer positions.
  - name: amendflag
    description: Amended petition positions/flag (> 0 = amended).
  - name: siteslots
    description: Total number of worksite locations.
  - name: agreelc
    description: Agreement to labor condition statement (Yes).
  - name: h1bdep
    description: Employer H-1B dependent (Yes/No/NULL). Dependent when H-1B workers exceed 15% of workforce
      (> 50 employees), 8 workers (26-50) or 4 workers (<= 25); extra attestation requirements.
  - name: willfulv
    description: 'Willful violator (No/NULL in data): found by DOL to have willfully failed LCA conditions
      or misrepresented material fact on an LCA within the past 5 years; extra attestation requirements.'
  - name: supporth
    description: Employer supports H-1B (Yes/NULL).
  - name: statbasis
    description: Statutory basis (exemption basis), e.g. '$60,000 or higher annual wage'.
  - name: appa
    description: Appendix A attached (always NULL in data).
  - name: pubdisc
    description: 'Public disclosure choice: ''Disclose Business'' (consents to public availability), ''Disclose
      Employment'', ''Disclose Business and Employment'' (other options may restrict disclosure to protect
      confidential information).'
  - name: homefirm
    description: Employer -> employer.corphandle; for employer metrics use exact text, no folding/trimming.
  - name: homezip
    description: Employer postal code -> employer.zipref.
  - name: preplink
    description: Preparer email -> preparer.prepmail.
- schema: main
  table: case_attorney
  description: Attorney assigned to a case (727 cases, one row each). A case with no row is self-represented.
  columns:
  - name: docketkey
    description: Case -> cases.filekey.
  - name: counselmail
    description: Attorney -> attorney.lawmail.
  - name: counselfor
    description: Attorney represents the employer (Yes/No; always Yes in data).
- schema: main
  table: attorney
  description: Attorney profiles.
  columns:
  - name: lawmail
    description: Attorney email (PK).
  - name: attorney_profile
    description: 'JSON: name{first, middle (NULL = none), last}, address{line1, line2 (NULL = none), city,
      state, zip, country (CANADA / UNITED STATES OF AMERICA), province (NULL = none)}, contact{phone,
      extension (NULL = none)}, firm, highest_court{state (NULL = none), name (NULL = none)}.'
- schema: main
  table: case_worksite
  description: Worksite of a case; exactly one row per case. Links to the prevailing wage record.
  columns:
  - name: dockkey
    description: Case -> cases.filekey.
  - name: ws_addr1
    description: Worksite address line 1.
  - name: wscity
    description: Worksite city.
  - name: wsstate
    description: Worksite state (used for SAD, GCI and review rule matching).
  - name: wszip
    description: Worksite postal code.
  - name: wsheads
    description: Number of workers at the worksite.
  - name: wagetrack
    description: Wage record -> prevailing_wage.trackno.
- schema: main
  table: worksite
  description: Worksite address master.
  columns:
  - name: w_addr1
    description: Address line 1 (PK part).
  - name: wcity
    description: City (PK part).
  - name: wstate
    description: State (PK part).
  - name: wzip
    description: Postal code (PK part).
  - name: secent
    description: Secondary entity at worksite (Yes/No); NULL = not specified.
  - name: secentname
    description: Secondary entity name; NULL = none provided.
  - name: waddr_2
    description: Address line 2; NULL = none.
  - name: wcnty
    description: County; NULL = none.
- schema: main
  table: prevailing_wage
  description: Offered and prevailing wage record per case worksite.
  columns:
  - name: trackno
    description: Tracking number (PK).
  - name: wage_details
    description: 'JSON: offered_wage{from (text ''$130000.00''), to (ignored), unit Hour/Week/Year}, prevailing_wage{value
      (text ''USD 116,979.00''), unit Hour/Week/Month/Year, level I-IV (I entry-level, II qualified, III
      experienced, IV fully competent; may be null), oes_year (NULL = none)}, alternate_source{source_type
      CBA/Survey, source_year, publisher, survey_title}. Acceptable sources: OES, CBA, DOL-compliant published
      surveys. Annualize with Hour 2080, Week 52, Month 12, Year 1.'
- schema: main
  table: review_schedule
  description: 'Case Review Effort Schedule: one rule per row; six criteria, wildcard stored as ''*''
    (or NULL); base_hours once per case, position_hours per worker position.'
  columns:
  - name: rule_id
    description: Rule identifier (PK); lowest wins ties.
  - name: visa_class
    description: Visa class criterion; '*' / NULL = any.
  - name: wage_level
    description: Prevailing wage level criterion (I-IV); '*' / NULL = any.
  - name: h1b_dependent
    description: H-1B dependency criterion (Yes/No); '*' / NULL = any.
  - name: soc_major_group
    description: First two digits of SOC code; '*' / NULL = any.
  - name: worksite_state
    description: Worksite state criterion; '*' / NULL = any.
  - name: monthly_volume_band
    description: Employer monthly case volume band ('1','2-4','5-14','15+'); '*' / NULL = any.
  - name: base_hours
    description: Reviewer-hours charged once per case.
  - name: position_hours
    description: Reviewer-hours charged per worker position (headCt).
relationships:
- from: main.cases.homefirm
  to: main.employer.corphandle
  type: many_to_one
  description: Join on homefirm = corphandle AND homezip = zipref.
- from: main.cases.preplink
  to: main.preparer.prepmail
  type: many_to_one
- from: main.case_attorney.docketkey
  to: main.cases.filekey
  type: many_to_one
- from: main.case_attorney.counselmail
  to: main.attorney.lawmail
  type: many_to_one
- from: main.case_worksite.dockkey
  to: main.cases.filekey
  type: one_to_one
- from: main.case_worksite.wagetrack
  to: main.prevailing_wage.trackno
  type: many_to_one
- from: main.employer_poc.firmlink
  to: main.employer.corphandle
  type: many_to_one
  description: Join on firmlink = corphandle AND firmzip = zipref.
