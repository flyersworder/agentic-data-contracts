    \ THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS aow,\n              CAST(replace(replace(pw.wage_details->>'$.prevailing_wage.value',\
    \ 'USD ', ''), ',', '') AS DOUBLE)\n                * CASE pw.wage_details->>'$.prevailing_wage.unit'\
    \ WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS apw\n \
    \      FROM main.cases c\n       JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n       JOIN\
    \ main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n       LEFT JOIN main.employer e ON e.corphandle\
    \ = c.homefirm AND e.zipref = c.homezip) b) wa\n"
