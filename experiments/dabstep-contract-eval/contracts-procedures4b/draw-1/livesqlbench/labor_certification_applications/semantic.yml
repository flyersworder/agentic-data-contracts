# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: labor_certification_applications, author: claudeopus5.5
metrics:
- name: application_processing_time_days
  description: 'APT: number of days between the date the application is received (cases.recvDay, text
    ''YYYY/MM/DD'') and the date a decision is made (cases.decisionDAY, text ''YYYY-MM-DD''). Per case;
    NULL when decisionDay is NULL (216 cases). Average with AVG(...) for a population.

    '
  sql_expression: strptime(c.decisionday, '%Y-%m-%d')::DATE - strptime(c.recvday, '%Y/%m/%d')::DATE
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: processing_efficiency_ratio
  description: 'PER = Average Processing Time / Application Processing Time, per case; values above 1
    indicate faster than average processing. The average is over all cases with a decision date in the
    query (window over the result rows). NULL when APT is NULL or 0.

    '
  sql_expression: 'AVG(CAST(strptime(c.decisionday, ''%Y-%m-%d'')::DATE - strptime(c.recvday, ''%Y/%m/%d'')::DATE
    AS DOUBLE)) OVER ()

    / NULLIF(strptime(c.decisionday, ''%Y-%m-%d'')::DATE - strptime(c.recvday, ''%Y/%m/%d'')::DATE, 0)

    '
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: approval_rate
  description: 'AR = (Number of Certified Applications / Total Number of Applications) x 100%. Certified
    = upper(trim(statustag)) = ''CERTIFIED'' (statustag mixes CERTIFIED/Certified/certified; Certified-Withdrawn
    would not count). On this data all 981 cases are certified.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE upper(trim(c.statustag)) = 'CERTIFIED') / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: visa_class_distribution
  description: 'VCD = (Number of Applications for Visa Class / Total Number of Applications) x 100%. Use
    with GROUP BY c.visacls.

    '
  sql_expression: 100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: occupational_demand_index
  description: 'ODI = Number of Applications for SOC Code / Average Applications per SOC Code. Use with
    GROUP BY c.soccd; the average is over the SOC codes in the grouped result.

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: seasonal_application_index
  description: 'SAI = Number of Applications in Month / Average Monthly Applications, by month of receipt
    (cases.recvDay). Use with GROUP BY date_trunc(''month'', strptime(c.recvday, ''%Y/%m/%d'')); the average
    is over the months present in the result. Data: every recvDay is 2023/12/21, so there is a single
    month and SAI = 1.

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: visa_filing_window
  description: 'Timing of submission (recvDay) relative to employment start (beginDay): ''After Start
    Date'' when beginDay is before recvDay; otherwise by calendar months between receipt month and start
    month: 0 ''Same Month'', 1-3 ''1-3 Months Before'', 4-6 ''Optimal Window (4-6 Months)'', more than
    6 ''Early Filing''. INTERPRETATION: months are counted as calendar-month differences. Data: Optimal
    321, 1-3 Months 393, Same Month 247, Early 20.

    '
  sql_expression: "CASE\n  WHEN strptime(c.beginday, '%d/%m/%Y') < strptime(c.recvday, '%Y/%m/%d') THEN\
    \ 'After Start Date'\n  WHEN (year(strptime(c.beginday, '%d/%m/%Y')) * 12 + month(strptime(c.beginday,\
    \ '%d/%m/%Y')))\n     - (year(strptime(c.recvday, '%Y/%m/%d')) * 12 + month(strptime(c.recvday, '%Y/%m/%d')))\
    \ = 0 THEN 'Same Month'\n  WHEN (year(strptime(c.beginday, '%d/%m/%Y')) * 12 + month(strptime(c.beginday,\
    \ '%d/%m/%Y')))\n     - (year(strptime(c.recvday, '%Y/%m/%d')) * 12 + month(strptime(c.recvday, '%Y/%m/%d')))\
    \ BETWEEN 1 AND 3 THEN '1-3 Months Before'\n  WHEN (year(strptime(c.beginday, '%d/%m/%Y')) * 12 +\
    \ month(strptime(c.beginday, '%d/%m/%Y')))\n     - (year(strptime(c.recvday, '%Y/%m/%d')) * 12 + month(strptime(c.recvday,\
    \ '%Y/%m/%d'))) BETWEEN 4 AND 6 THEN 'Optimal Window (4-6 Months)'\n  ELSE 'Early Filing'\nEND\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_complexity_tier
  description: 'Standard (straightforward cases) or Complex (cases involving H-1B dependency, willful
    violator status, or special attestations). INTERPRETATION: ''special attestations'' has no column,
    so Complex = h1bdep = ''Yes'' OR willfulv = ''Yes''.

    '
  sql_expression: CASE WHEN c.h1bdep = 'Yes' OR c.willfulv = 'Yes' THEN 'Complex' ELSE 'Standard' END
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: complexity_factor_count
  description: 'ACS proxy. ACS is documented as a weighted sum of binary factors such as H-1B dependency,
    willful violator status, new employment and amendment status, but no weights are stated; this counts
    the factors with equal weight 1: h1bdep = ''Yes'', willfulv = ''Yes'', newemp > 0, amendflag > 0.

    '
  sql_expression: '(CASE WHEN c.h1bdep = ''Yes'' THEN 1 ELSE 0 END)

    + (CASE WHEN c.willfulv = ''Yes'' THEN 1 ELSE 0 END)

    + (CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END)

    + (CASE WHEN c.amendflag > 0 THEN 1 ELSE 0 END)

    '
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_delay_risk_profile
  description: 'Low Risk (no special factors), Moderate Risk (1-2 complexity factors), High Risk (3 or
    more complexity factors or from willful violators), based on the complexity factors of complexity_factor_count.

    '
  sql_expression: "CASE\n  WHEN c.willfulv = 'Yes' THEN 'High Risk'\n  WHEN (CASE WHEN c.h1bdep = 'Yes'\
    \ THEN 1 ELSE 0 END) + (CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END)\n     + (CASE WHEN c.amendflag >\
    \ 0 THEN 1 ELSE 0 END) >= 3 THEN 'High Risk'\n  WHEN (CASE WHEN c.h1bdep = 'Yes' THEN 1 ELSE 0 END)\
    \ + (CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END)\n     + (CASE WHEN c.amendflag > 0 THEN 1 ELSE 0 END)\
    \ >= 1 THEN 'Moderate Risk'\n  ELSE 'Low Risk'\nEND\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: employer_h1b_concentration
  description: 'EHC = (Number of H-1B Applications by Employer / Total Number of H-1B Applications) x
    100%. Use with GROUP BY c.homefirm (exact text) over all cases; the window total is all H-1B applications
    in the result.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE c.visacls = 'H-1B') / SUM(COUNT(*) FILTER (WHERE c.visacls
    = 'H-1B')) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: application_success_rate_employer
  description: 'ASR = (Number of Certified Applications by Employer / Total Applications by Employer)
    x 100%. GROUP BY c.homefirm. Certified = upper(trim(statustag)) = ''CERTIFIED''.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE upper(trim(c.statustag)) = 'CERTIFIED') / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: employer_retention_rate
  description: 'ERR = (Number of Continuation Applications / Total Number of Applications by Employer)
    x 100%. GROUP BY c.homefirm. INTERPRETATION: a continuation application is a case with contemp (continued
    employment positions) > 0.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE c.contemp > 0) / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: employer_scale_indicator
  description: 'ESI = Employer Number of Applications / Average Applications per Employer. GROUP BY c.homefirm;
    the average is over the employers in the result.

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: employer_size_classification
  description: 'Small-scale users (fewer than 5 applications annually), Medium-scale (5-25 applications
    annually), Large-scale (more than 25). GROUP BY c.homefirm, year(strptime(c.recvday, ''%Y/%m/%d'')).
    INTERPRETATION: ''annually'' = per receipt year (all receipts are in 2023).

    '
  sql_expression: CASE WHEN COUNT(*) < 5 THEN 'Small-scale' WHEN COUNT(*) <= 25 THEN 'Medium-scale' ELSE
    'Large-scale' END
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: continuous_filing_employer
  description: 'True when an employer submits visa applications in at least 9 months of the year. GROUP
    BY c.homefirm, year(strptime(c.recvday, ''%Y/%m/%d'')). Submission month = receipt month (recvDay).
    Data: all receipts are on 2023/12/21, so no employer qualifies.

    '
  sql_expression: COUNT(DISTINCT month(strptime(c.recvday, '%Y/%m/%d'))) >= 9
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: industry_application_distribution
  description: 'IAD = (Number of Applications in Industry / Total Number of Applications) x 100%. Industry
    = employer NAICS code. GROUP BY e.employer_contact_info->>''$.naics_code''.

    '
  sql_expression: 100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref = c.homezip
  grain: one row per case with its employer
  domains:
  - employers
- name: industry_concentration_ratio
  description: 'ICR = sum((Applications in Industry i / Total Applications)^2) over all industries (NAICS
    codes). Returns one number.

    '
  sql_expression: SUM(i.share * i.share)
  source_model: main.cases
  from_sql: "(SELECT e.employer_contact_info->>'$.naics_code' AS naics_code,\n        COUNT(*) * 1.0 /\
    \ SUM(COUNT(*)) OVER () AS share\n FROM main.cases c\n JOIN main.employer e ON e.corphandle = c.homefirm\
    \ AND e.zipref = c.homezip\n GROUP BY e.employer_contact_info->>'$.naics_code') i\n"
  grain: one row per NAICS industry
  domains:
  - employers
- name: attorney_case_load
  description: ACL = total number of cases handled by each attorney. GROUP BY ca.counselmail.
  sql_expression: COUNT(DISTINCT ca.docketkey)
  source_model: main.case_attorney
  from_sql: main.case_attorney ca
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_success_rate
  description: 'ASR_Attorney = (Number of Certified Applications by Attorney / Total Applications by Attorney)
    x 100%. GROUP BY ca.counselmail.

    '
  sql_expression: 100.0 * COUNT(DISTINCT c.filekey) FILTER (WHERE upper(trim(c.statustag)) = 'CERTIFIED')
    / COUNT(DISTINCT c.filekey)
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_performance_rating
  description: 'High Performers (over 95% approval rate), Standard Performers (85-95%, inclusive), Underperformers
    (below 85%), from attorney_success_rate. GROUP BY ca.counselmail.

    '
  sql_expression: "CASE\n  WHEN 100.0 * COUNT(DISTINCT c.filekey) FILTER (WHERE upper(trim(c.statustag))\
    \ = 'CERTIFIED') / COUNT(DISTINCT c.filekey) > 95 THEN 'High Performer'\n  WHEN 100.0 * COUNT(DISTINCT\
    \ c.filekey) FILTER (WHERE upper(trim(c.statustag)) = 'CERTIFIED') / COUNT(DISTINCT c.filekey) >=\
    \ 85 THEN 'Standard Performer'\n  ELSE 'Underperformer'\nEND\n"
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_specialization_index
  description: 'ASI = 1 - (Number of Different Visa Types Handled by Attorney / Total Number of Visa Types);
    closer to 1 = more specialized. Total Number of Visa Types = 4 (E-3 Australian, H-1B, H-1B1 Chile,
    H-1B1 Singapore; all four occur in the data). GROUP BY ca.counselmail.

    '
  sql_expression: 1 - COUNT(DISTINCT c.visacls) / 4.0
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_top_visa_class_share
  description: 'Share (fraction) of an attorney''s cases in their most frequent visa class; an attorney
    is a Specialist when it exceeds 0.80 (over 80% of cases in one visa type). Generalist / Hybrid Practitioner
    have no quantified threshold. GROUP BY av.counselmail.

    '
  sql_expression: MAX(av.n) * 1.0 / SUM(av.n)
  source_model: main.case_attorney
  from_sql: "(SELECT ca.counselmail, c.visacls, COUNT(DISTINCT c.filekey) AS n\n FROM main.case_attorney\
    \ ca JOIN main.cases c ON c.filekey = ca.docketkey\n GROUP BY ca.counselmail, c.visacls) av\n"
  grain: one row per (attorney, visa class)
  domains:
  - attorneys
- name: external_counsel_rate
  description: 'ECR = (Number of Applications with Attorney / Total Number of Applications) x 100%. With
    attorney = case has a case_attorney row (727 of 981 cases).

    '
  sql_expression: 100.0 * COUNT(ca.docketkey) / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c LEFT JOIN (SELECT DISTINCT docketkey FROM main.case_attorney) ca ON ca.docketkey
    = c.filekey
  grain: one row per case
  domains:
  - attorneys
- name: legal_representation_efficacy
  description: 'Compares approval rate of applications with attorney representation to those without:
    gap = AR(with attorney) - AR(without), in percentage points. High Impact when the gap is over 10 points
    higher, Moderate Impact 5-10 higher, Minimal Impact when the difference is less than 5 (in absolute
    value). A gap of -5 or lower is outside the documented categories (''Unclassified''). INTERPRETATION:
    ''%'' read as percentage points of AR. On this data both rates are 100, gap 0 -> Minimal Impact.

    '
  sql_expression: "CASE\n  WHEN g.gap > 10 THEN 'High Impact'\n  WHEN g.gap >= 5 THEN 'Moderate Impact'\n\
    \  WHEN abs(g.gap) < 5 THEN 'Minimal Impact'\n  ELSE 'Unclassified'\nEND\n"
  source_model: main.cases
  from_sql: "(SELECT 100.0 * COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL AND upper(trim(c.statustag))\
    \ = 'CERTIFIED')\n          / NULLIF(COUNT(ca.docketkey), 0)\n      - 100.0 * COUNT(*) FILTER (WHERE\
    \ ca.docketkey IS NULL AND upper(trim(c.statustag)) = 'CERTIFIED')\n          / NULLIF(COUNT(*) FILTER\
    \ (WHERE ca.docketkey IS NULL), 0) AS gap\n FROM main.cases c\n LEFT JOIN (SELECT DISTINCT docketkey\
    \ FROM main.case_attorney) ca ON ca.docketkey = c.filekey) g\n"
  grain: a single row holding the approval-rate gap
  domains:
  - attorneys
- name: state_application_distribution
  description: 'SAD = (Number of Applications in State / Total Number of Applications) x 100%. State =
    case_worksite.wsState. GROUP BY cw.wsstate.

    '
  sql_expression: 100.0 * COUNT(DISTINCT c.filekey) / SUM(COUNT(DISTINCT c.filekey)) OVER ()
  source_model: main.cases
  from_sql: main.cases c JOIN main.case_worksite cw ON cw.dockkey = c.filekey
  grain: one row per case worksite (one per case)
  domains:
  - geography
- name: geographic_concentration_index
  description: GCI = sum((Applications in State i / Total Applications)^2) over all worksite states. One
    number.
  sql_expression: SUM(s.share * s.share)
  source_model: main.cases
  from_sql: "(SELECT cw.wsstate, COUNT(DISTINCT c.filekey) * 1.0 / SUM(COUNT(DISTINCT c.filekey)) OVER\
    \ () AS share\n FROM main.cases c JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n GROUP BY\
    \ cw.wsstate) s\n"
  grain: one row per worksite state
  domains:
  - geography
- name: worksite_density
  description: 'WD = Number of Workers at Worksite / Number of Worksites: total case_worksite.wsHeads
    divided by distinct worksite addresses (addr1, city, state, zip) in scope.

    '
  sql_expression: SUM(cw.wsheads) * 1.0 / COUNT(DISTINCT concat_ws('|', cw.ws_addr1, cw.wscity, cw.wsstate,
    cw.wszip))
  source_model: main.case_worksite
  from_sql: main.case_worksite cw
  grain: one row per case worksite
  domains:
  - geography
- name: worksite_diversity_index
  description: 'WDI = 1 - sum((Number of Workers at Worksite i / Total Workers)^2) over an employer''s
    worksites, workers = case_worksite.wsHeads. GROUP BY ws.homefirm.

    '
  sql_expression: 1 - SUM(ws.share * ws.share)
  source_model: main.case_worksite
  from_sql: "(SELECT g.homefirm, g.workers * 1.0 / SUM(g.workers) OVER (PARTITION BY g.homefirm) AS share\n\
    \ FROM (SELECT c.homefirm, cw.ws_addr1, cw.wscity, cw.wsstate, cw.wszip, SUM(cw.wsheads) AS workers\n\
    \       FROM main.cases c JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n       GROUP BY c.homefirm,\
    \ cw.ws_addr1, cw.wscity, cw.wsstate, cw.wszip) g) ws\n"
  grain: one row per (employer, worksite)
  domains:
  - geography
  - employers
- name: annualized_offered_wage
  description: 'AOW in US dollars per year: offered_wage.from with ''$'' and commas removed times the
    offered_wage.unit factor (Hour 2080, Week 52, Month 12, Year 1); ''to'' ignored. Verified: all 981
    ''from'' values parse; units seen Hour, Week, Year. Columns of the wa row: filekey, homefirm, homezip,
    soccd, headct, statustag, visa_class, begin_date, start_month, wsstate, naics_code, wage_level, aow,
    apw, whr, wdr, headroom_points, level_points, cwas.

    '
  sql_expression: wa.aow
  source_model: main.prevailing_wage
  from_sql: "(SELECT b.*,\n        (b.aow - b.apw) / b.apw AS whr,\n        100 * (b.aow - b.apw) / b.apw\
    \ AS wdr,\n        100 * LEAST(GREATEST((b.aow - b.apw) / b.apw, 0), 0.40) / 0.40 AS headroom_points,\n\
    \        CASE b.wage_level WHEN 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100\
    \ ELSE 50 END AS level_points,\n        0.7 * (100 * LEAST(GREATEST((b.aow - b.apw) / b.apw, 0), 0.40)\
    \ / 0.40)\n          + 0.3 * (CASE b.wage_level WHEN 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN\
    \ 75 WHEN 'IV' THEN 100 ELSE 50 END) AS cwas\n FROM (SELECT c.filekey, c.homefirm, c.homezip, c.soccd,\
    \ c.headct, c.statustag,\n              CAST(c.visacls AS VARCHAR) AS visa_class,\n              strptime(c.beginday,\
    \ '%d/%m/%Y')::DATE AS begin_date,\n              date_trunc('month', strptime(c.beginday, '%d/%m/%Y'))::DATE\
    \ AS start_month,\n              cw.wsstate,\n              e.employer_contact_info->>'$.naics_code'\
    \ AS naics_code,\n              pw.wage_details->>'$.prevailing_wage.level' AS wage_level,\n     \
    \         CAST(replace(replace(pw.wage_details->>'$.offered_wage.from', '$', ''), ',', '') AS DOUBLE)\n\
    \                * CASE pw.wage_details->>'$.offered_wage.unit' WHEN 'Hour' THEN 2080 WHEN 'Week'\
    \ THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS aow,\n              CAST(replace(replace(pw.wage_details->>'$.prevailing_wage.value',\
    \ 'USD ', ''), ',', '') AS DOUBLE)\n                * CASE pw.wage_details->>'$.prevailing_wage.unit'\
    \ WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS apw\n \
    \      FROM main.cases c\n       JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n       JOIN\
    \ main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n       LEFT JOIN main.employer e ON e.corphandle\
    \ = c.homefirm AND e.zipref = c.homezip) b) wa\n"
  grain: one row per case with its annualized wages and wage-assurance scores
  domains:
  - wages
  - wage_assurance
- name: annualized_prevailing_wage
  description: 'APW in US dollars per year: prevailing_wage.value with ''USD '' and commas removed times
    the prevailing_wage.unit factor (Hour 2080, Week 52, Month 12, Year 1). Verified: all values start
    with ''USD '' and parse.

    '
  sql_expression: wa.apw
  source_model: main.prevailing_wage
  from_sql: "(SELECT b.*,\n        (b.aow - b.apw) / b.apw AS whr,\n        100 * (b.aow - b.apw) / b.apw\
    \ AS wdr,\n        100 * LEAST(GREATEST((b.aow - b.apw) / b.apw, 0), 0.40) / 0.40 AS headroom_points,\n\
    \        CASE b.wage_level WHEN 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100\
    \ ELSE 50 END AS level_points,\n        0.7 * (100 * LEAST(GREATEST((b.aow - b.apw) / b.apw, 0), 0.40)\
    \ / 0.40)\n          + 0.3 * (CASE b.wage_level WHEN 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN\
    \ 75 WHEN 'IV' THEN 100 ELSE 50 END) AS cwas\n FROM (SELECT c.filekey, c.homefirm, c.homezip, c.soccd,\
    \ c.headct, c.statustag,\n              CAST(c.visacls AS VARCHAR) AS visa_class,\n              strptime(c.beginday,\
    \ '%d/%m/%Y')::DATE AS begin_date,\n              date_trunc('month', strptime(c.beginday, '%d/%m/%Y'))::DATE\
    \ AS start_month,\n              cw.wsstate,\n              e.employer_contact_info->>'$.naics_code'\
    \ AS naics_code,\n              pw.wage_details->>'$.prevailing_wage.level' AS wage_level,\n     \
    \         CAST(replace(replace(pw.wage_details->>'$.offered_wage.from', '$', ''), ',', '') AS DOUBLE)\n\
    \                * CASE pw.wage_details->>'$.offered_wage.unit' WHEN 'Hour' THEN 2080 WHEN 'Week'\
    \ THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS aow,\n              CAST(replace(replace(pw.wage_details->>'$.prevailing_wage.value',\
    \ 'USD ', ''), ',', '') AS DOUBLE)\n                * CASE pw.wage_details->>'$.prevailing_wage.unit'\
    \ WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS apw\n \
    \      FROM main.cases c\n       JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n       JOIN\
    \ main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n       LEFT JOIN main.employer e ON e.corphandle\
    \ = c.homefirm AND e.zipref = c.homezip) b) wa\n"
  grain: one row per case
  domains:
  - wages
  - wage_assurance
- name: wage_differential_rate
  description: 'WDR = ((Offered Wage - Prevailing Wage) / Prevailing Wage) x 100%, both converted to the
    same unit first (here annualized: AOW and APW). Percent, per case (20 means 20%). Equals 100 x WHR.

    '
  sql_expression: 100 * (wa.aow - wa.apw) / wa.apw
  source_model: main.prevailing_wage
