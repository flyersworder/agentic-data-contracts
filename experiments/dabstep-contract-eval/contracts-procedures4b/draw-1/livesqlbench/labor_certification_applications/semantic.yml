- name: wage_assurance_tier
  description: 'From unrounded EWAS: ''Thin'' < 30; ''Adequate'' 30 <= EWAS < 45; ''Strong'' 45 <= EWAS
    < 60; ''Exemplary'' >= 60. GROUP BY wa.homefirm with the same period filter as EWAS; employers with
    no case in the period have no tier (they produce no group).

