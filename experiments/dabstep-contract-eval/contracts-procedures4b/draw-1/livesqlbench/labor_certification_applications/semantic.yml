- name: wage_competitiveness_index
  description: 'WCI = Employer Average Offered Wage / Industry Average Offered Wage, on annualized offered
    wages (AOW); industry = employer NAICS code, industry average over all cases of that NAICS. GROUP
    BY wi.homefirm, wi.naics_code.

    '
  sql_expression: AVG(wi.aow) / ANY_VALUE(wi.industry_avg_aow)
  source_model: main.prevailing_wage
  from_sql: "(SELECT wa.*, AVG(wa.aow) OVER (PARTITION BY wa.naics_code) AS industry_avg_aow\n FROM (SELECT\
    \ c.homefirm, e.employer_contact_info->>'$.naics_code' AS naics_code,\n              CAST(replace(replace(pw.wage_details->>'$.offered_wage.from',\
    \ '$', ''), ',', '') AS DOUBLE)\n                * CASE pw.wage_details->>'$.offered_wage.unit' WHEN\
    \ 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS aow\n      \
    \ FROM main.cases c\n       JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n       JOIN main.prevailing_wage\
    \ pw ON pw.trackno = cw.wagetrack\n       LEFT JOIN main.employer e ON e.corphandle = c.homefirm AND\
    \ e.zipref = c.homezip) wa) wi\n"
  grain: one row per case with its industry average offered wage
  domains:
  - wages
  - employers
- name: wage_growth_rate
  description: 'WGR = ((Current Year Average Wage - Previous Year Average Wage) / Previous Year Average
    Wage) x 100%, for similar positions. INTERPRETATION: similar positions = same SOC code; year = year
    of the employment start (beginDay; 2023 and 2024 occur); wage = AOW. NULL when the immediately previous
    year has no cases. One value per (soccd, start_year) row; no GROUP BY needed.

    '
  sql_expression: "CASE WHEN LAG(y.start_year) OVER (PARTITION BY y.soccd ORDER BY y.start_year) = y.start_year\
    \ - 1\n     THEN 100.0 * (y.avg_aow - LAG(y.avg_aow) OVER (PARTITION BY y.soccd ORDER BY y.start_year))\n\
    \          / LAG(y.avg_aow) OVER (PARTITION BY y.soccd ORDER BY y.start_year) END\n"
  source_model: main.prevailing_wage
  from_sql: "(SELECT c.soccd, year(strptime(c.beginday, '%d/%m/%Y')) AS start_year,\n        AVG(CAST(replace(replace(pw.wage_details->>'$.offered_wage.from',\
    \ '$', ''), ',', '') AS DOUBLE)\n            * CASE pw.wage_details->>'$.offered_wage.unit' WHEN 'Hour'\
    \ THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END) AS avg_aow\n FROM main.cases\
    \ c\n JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n JOIN main.prevailing_wage pw ON pw.trackno\
    \ = cw.wagetrack\n GROUP BY c.soccd, year(strptime(c.beginday, '%d/%m/%Y'))) y\n"
  grain: one row per (SOC code, start year)
  domains:
  - wages
