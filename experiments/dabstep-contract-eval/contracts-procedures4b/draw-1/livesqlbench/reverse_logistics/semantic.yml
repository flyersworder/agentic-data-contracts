# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: reverse_logistics, author: claudeopus5.5
metrics:
- name: shipping_fee
  description: 'Shipping Fee: cost charged by the logistics provider for transporting a returned item;
    monetary transportation cost of a single return shipment. Stored at returns.return_details $.shipping.fee
    (JSON number, never NULL).

    '
  sql_expression: CAST(r.return_details->>'$.shipping.fee' AS DOUBLE)
  source_model: main.returns
  from_sql: main.returns r
  grain: one return case
  domains:
  - return_costs
- name: restocking_fee
  description: 'Restocking Fee: service charge for reintegrating a returned item into inventory, covering
    administrative and handling work to make it sellable again.

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.fees.restocking_fee' AS DOUBLE)
  source_model: main.financial_management
  from_sql: main.financial_management fm
  grain: one financial record (one return case)
  domains:
  - return_costs
- name: relabeling_cost
  description: 'Relabeling Cost: expense of printing and applying new labels or packaging identifiers
    to a returned item; direct material and labor cost of correcting labeling deficiencies.

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.fees.relabeling_cost' AS DOUBLE)
  source_model: main.financial_management
  from_sql: main.financial_management fm
  grain: one financial record (one return case)
  domains:
  - return_costs
- name: disposal_cost
  description: 'Disposal Cost: fee incurred when discarding a returned item that cannot be resold or refurbished
    (recycling, landfill, hazardous-waste processing). Read from cost_breakdown $.disposal.disposal_cost;
    the column financial_management.dispcost is 0 on every row and must not be used.

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.disposal.disposal_cost' AS DOUBLE)
  source_model: main.financial_management
  from_sql: main.financial_management fm
  grain: one financial record (one return case)
  domains:
  - return_costs
- name: repair_estimate
  description: 'Repair Estimate: projected expense (parts, labor and overhead) to bring a defective return
    back to sellable condition, agreed before work commences.

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.repair_costs.repair_estimate' AS DOUBLE)
  source_model: main.financial_management
  from_sql: main.financial_management fm
  grain: one financial record (one return case)
  domains:
  - return_costs
- name: recovery_value
  description: 'Recovery Value: monetary value recaptured from a return via resale, refurbish, or parts
    harvesting; net revenue expected after processing, excluding initial cost.

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.valuation.recovery_value' AS DOUBLE)
  source_model: main.financial_management
  from_sql: main.financial_management fm
  grain: one financial record (one return case)
  domains:
  - return_costs
- name: carbon_footprint
  description: 'Carbon Footprint: estimated kilograms of CO2-equivalent generated by transportation, handling
    and disposal of a single return.

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.sustainability.carbon_footprint' AS DOUBLE)
  source_model: main.financial_management
  from_sql: main.financial_management fm
  grain: one financial record (one return case)
  domains:
  - return_costs
- name: total_return_cost
  description: 'Total Return Cost (TRC): aggregated outlay to handle a single return from transport to
    final disposition. TRC = Shipping Fee + Restocking Fee + Relabeling Cost + Disposal Cost + Repair
    Estimate. Shipping fee comes from returns, the rest from financial_management (joined on casetag =
    casenum); only 995 of 1,500 returns have a financial record, so TRC exists only for them. Per return;
    SUM/AVG it for groups.

    '
  sql_expression: 'CAST(r.return_details->>''$.shipping.fee'' AS DOUBLE)

    + CAST(fm.cost_breakdown->>''$.fees.restocking_fee'' AS DOUBLE)

    + CAST(fm.cost_breakdown->>''$.fees.relabeling_cost'' AS DOUBLE)

    + CAST(fm.cost_breakdown->>''$.disposal.disposal_cost'' AS DOUBLE)

    + CAST(fm.cost_breakdown->>''$.repair_costs.repair_estimate'' AS DOUBLE)

    '
  source_model: main.returns
  from_sql: main.returns r JOIN main.financial_management fm ON fm.casetag = r.casenum
  grain: one return case that has a financial_management record
  domains:
  - return_costs
- name: return_profit_impact
  description: 'Return Profit Impact (RPI): net financial impact of a return after cost and recovery value.
    RPI = Recovery Value - TRC.

    '
  sql_expression: "CAST(fm.cost_breakdown->>'$.valuation.recovery_value' AS DOUBLE)\n- (CAST(r.return_details->>'$.shipping.fee'\
    \ AS DOUBLE)\n   + CAST(fm.cost_breakdown->>'$.fees.restocking_fee' AS DOUBLE)\n   + CAST(fm.cost_breakdown->>'$.fees.relabeling_cost'\
    \ AS DOUBLE)\n   + CAST(fm.cost_breakdown->>'$.disposal.disposal_cost' AS DOUBLE)\n   + CAST(fm.cost_breakdown->>'$.repair_costs.repair_estimate'\
    \ AS DOUBLE))\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.financial_management fm ON fm.casetag = r.casenum
  grain: one return case that has a financial_management record
  domains:
  - return_costs
- name: recovery_rate_per_day
  description: 'Recovery Rate per Day (RRD): value recovered per day elapsed since sale. RRD = Recovery
    Value / Days Lapsed (returns.dayslapsed, never NULL or 0 in data; NULLIF guards division).

    '
  sql_expression: CAST(fm.cost_breakdown->>'$.valuation.recovery_value' AS DOUBLE) / NULLIF(r.dayslapsed,
    0)
  source_model: main.returns
  from_sql: main.returns r JOIN main.financial_management fm ON fm.casetag = r.casenum
  grain: one return case that has a financial_management record
  domains:
  - return_costs
- name: sustainability_adjusted_loss
  description: 'Sustainability-Adjusted Loss (SAL): cost of a return adjusted for environmental impact.
    SAL = TRC + 0.5 x Carbon Footprint - Recovery Value.

    '
  sql_expression: "(CAST(r.return_details->>'$.shipping.fee' AS DOUBLE)\n + CAST(fm.cost_breakdown->>'$.fees.restocking_fee'\
    \ AS DOUBLE)\n + CAST(fm.cost_breakdown->>'$.fees.relabeling_cost' AS DOUBLE)\n + CAST(fm.cost_breakdown->>'$.disposal.disposal_cost'\
    \ AS DOUBLE)\n + CAST(fm.cost_breakdown->>'$.repair_costs.repair_estimate' AS DOUBLE))\n+ 0.5 * CAST(fm.cost_breakdown->>'$.sustainability.carbon_footprint'\
    \ AS DOUBLE)\n- CAST(fm.cost_breakdown->>'$.valuation.recovery_value' AS DOUBLE)\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.financial_management fm ON fm.casetag = r.casenum
  grain: one return case that has a financial_management record
  domains:
  - return_costs
- name: regulatory_compliance_penalty
  description: 'Regulatory Compliance Penalty (RCP): additional proportional cost when the product is
    non-compliant. If products.product_traceability $.compliance.regulatory_compliance = ''Non-compliant''
    then RCP = 0.2 x TRC, else 0 (including NULL status = not available).

    '
  sql_expression: "CASE WHEN (p.product_traceability->>'$.compliance.regulatory_compliance') = 'Non-compliant'\n\
    \  THEN 0.2 * (CAST(r.return_details->>'$.shipping.fee' AS DOUBLE)\n    + CAST(fm.cost_breakdown->>'$.fees.restocking_fee'\
    \ AS DOUBLE)\n    + CAST(fm.cost_breakdown->>'$.fees.relabeling_cost' AS DOUBLE)\n    + CAST(fm.cost_breakdown->>'$.disposal.disposal_cost'\
    \ AS DOUBLE)\n    + CAST(fm.cost_breakdown->>'$.repair_costs.repair_estimate' AS DOUBLE))\n  ELSE\
    \ 0 END\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.financial_management fm ON fm.casetag = r.casenum JOIN main.products
    p ON p.itemcode = r.itemlink
  grain: one return case that has a financial_management record
  domains:
  - return_costs
- name: return_channel_cost_index
  description: 'Return Channel Cost Index (RCCI): shipping fee of a return relative to the average shipping
    fee of all returns in the same return_channel. RCCI = S_f / avg(S_f of channel). Window expression,
    per return; to aggregate it, compute it in a subquery first.

    '
  sql_expression: 'CAST(r.return_details->>''$.shipping.fee'' AS DOUBLE)

    / NULLIF(AVG(CAST(r.return_details->>''$.shipping.fee'' AS DOUBLE)) OVER (PARTITION BY r.return_channel),
    0)

    '
  source_model: main.returns
  from_sql: main.returns r
  grain: one return case
  domains:
  - return_costs
- name: customer_tenure_years
  description: 'Customer Tenure (Years): (current date - the customer''s first recorded transaction date)
    / 365. First transaction = MIN of orders.txndate over the customer''s orders (orders.buyerlink = customers.profilenum),
    parsed from mixed text formats. DATA FINDING: orders.txndate is NULL on every order, so this is NULL
    for all customers in the current data. Group by c.profilenum.

    '
  sql_expression: "date_diff('day', CAST(MIN(TRY_STRPTIME(regexp_replace(o.txndate, '(\\d+)(st|nd|rd|th),',\
    \ '\\1,'),\n  ['%Y-%m-%d', '%Y/%m/%d', '%b %d, %Y', '%B %d, %Y'])) AS DATE), CURRENT_DATE) / 365.0\n"
  source_model: main.customers
  from_sql: main.customers c LEFT JOIN main.orders o ON o.buyerlink = c.profilenum
  grain: one customer (GROUP BY c.profilenum)
  domains:
  - customer_behavior
- name: customer_return_frequency_index
  description: 'Customer Return Frequency Index (CRFI): rate at which a customer initiates returns relative
    to tenure. CRFI = Total Returns / Customer Tenure (years). Total Returns = customers.return_behavior_profile
    $.total_returns. NULL for all customers with the current data because tenure is NULL (no order dates).

    '
  sql_expression: "MAX(CAST(c.return_behavior_profile->>'$.total_returns' AS DOUBLE))\n/ NULLIF(date_diff('day',\
    \ CAST(MIN(TRY_STRPTIME(regexp_replace(o.txndate, '(\\d+)(st|nd|rd|th),', '\\1,'),\n  ['%Y-%m-%d',\
    \ '%Y/%m/%d', '%b %d, %Y', '%B %d, %Y'])) AS DATE), CURRENT_DATE) / 365.0, 0)\n"
  source_model: main.customers
  from_sql: main.customers c LEFT JOIN main.orders o ON o.buyerlink = c.profilenum
  grain: one customer (GROUP BY c.profilenum)
  domains:
  - customer_behavior
- name: customer_monthly_return_count
  description: 'Customer Monthly Return Count (CMRC): number of rows in returns with the same customer
    (orders.buyerlink, via returns.srctxn = orders.txnnum) and the same calendar month (substr(revdate,1,7);
    revdate is always ''YYYY-MM-DD''), the return itself included; >= 1 and equal for all returns of that
    customer-month. Observed range 1-13. Window expression, one value per return.

    '
  sql_expression: COUNT(*) OVER (PARTITION BY o.buyerlink, substr(r.revdate, 1, 7))
  source_model: main.returns
  from_sql: main.returns r JOIN main.orders o ON o.txnnum = r.srctxn
  grain: one return case
  domains:
  - customer_behavior
  - return_charges
- name: return_charge_rule_matches
  description: 'True when rule x of return_charge_rules matches return b. All criteria must match. Text
    criteria match when NULL or ''ANY'' (the data stores "no restriction" as the literal ''ANY''; no text
    criterion is NULL) or when equal exactly to the return''s value; a specific criterion never matches
    a NULL return value (e.g. seg_category NULL). Band: min_monthly_returns <= CMRC <= max_monthly_returns,
    inclusive, NULL bound = no limit. b is the per-return base derived table in from_sql (with b.cmrc).
    Many returns match several rules; see return_handling_charge for the tie-break.

    '
  sql_expression: '(x.customer_segment IS NULL OR x.customer_segment = ''ANY'' OR x.customer_segment =
    b.seg_category)

    AND (x.return_channel IS NULL OR x.return_channel = ''ANY'' OR x.return_channel = b.return_channel)

    AND (x.item_category IS NULL OR x.item_category = ''ANY'' OR x.item_category = b.itemcategory)

    AND (x.primary_reason IS NULL OR x.primary_reason = ''ANY'' OR x.primary_reason = b.primary_reason)

    AND (x.item_condition IS NULL OR x.item_condition = ''ANY'' OR x.item_condition = b.item_condition)

    AND (x.min_monthly_returns IS NULL OR x.min_monthly_returns <= b.cmrc)

    AND (x.max_monthly_returns IS NULL OR b.cmrc <= x.max_monthly_returns)

    '
  source_model: main.return_charge_rules
  from_sql: "(SELECT r.casenum, o.buyerlink AS customer, substr(r.revdate, 1, 7) AS month, r.revdate,\n\
    \        c.seg_category, r.return_channel, p.itemcategory, CAST(p.unit_value AS DOUBLE) AS unit_value,\n\
    \        r.return_details->>'$.reasoning.primary_reason' AS primary_reason,\n        q.assessment_summary->>'$.condition.item_condition'\
    \ AS item_condition,\n        COUNT(*) OVER (PARTITION BY o.buyerlink, substr(r.revdate, 1, 7)) AS\
    \ cmrc\n FROM main.returns r\n LEFT JOIN main.orders o ON o.txnnum = r.srctxn\n LEFT JOIN main.customers\
    \ c ON c.profilenum = o.buyerlink\n LEFT JOIN main.products p ON p.itemcode = r.itemlink\n LEFT JOIN\
    \ main.quality_assessment q ON q.inspectref = r.casenum) b\nCROSS JOIN main.return_charge_rules x\n"
  grain: one (return, rule) pair
  domains:
  - return_charges
- name: return_handling_charge
  description: 'Return Handling Charge (RHC) of one return: F + P/100 x V, F = flat_charge, P = charge_pct
    of the matching rule, V = products.unit_value. A return matching no rule (91 returns) takes the Standard
    Handling Charge: flat_charge 15.00, charge_pct 5.0. Every return has an RHC. INTERPRETATION: when
    several rules match (1,188 returns), the rule with the lowest rule_id is applied - the documentation
    names no tie-break. Derived table rh has one row per return with casenum, customer, month (''YYYY-MM''),
    revdate, cmrc, unit_value, rule_id (NULL = standard charge), flat_charge, charge_pct. Filter periods
    on rh.revdate / rh.month. Total over all returns = 109208.30.

    '
  sql_expression: rh.flat_charge + rh.charge_pct / 100.0 * rh.unit_value
  source_model: main.returns
  from_sql: "(SELECT b.casenum, b.customer, b.month, b.revdate, b.cmrc, b.unit_value,\n        MIN(x.rule_id)\
    \ AS rule_id,\n        COALESCE(arg_min(x.flat_charge, x.rule_id), 15.00) AS flat_charge,\n      \
    \  COALESCE(arg_min(x.charge_pct, x.rule_id), 5.0) AS charge_pct\n FROM (SELECT r.casenum, o.buyerlink\
    \ AS customer, substr(r.revdate, 1, 7) AS month, r.revdate,\n              c.seg_category, r.return_channel,\
    \ p.itemcategory, CAST(p.unit_value AS DOUBLE) AS unit_value,\n              r.return_details->>'$.reasoning.primary_reason'\
    \ AS primary_reason,\n              q.assessment_summary->>'$.condition.item_condition' AS item_condition,\n\
    \              COUNT(*) OVER (PARTITION BY o.buyerlink, substr(r.revdate, 1, 7)) AS cmrc\n       FROM\
    \ main.returns r\n       LEFT JOIN main.orders o ON o.txnnum = r.srctxn\n       LEFT JOIN main.customers\
    \ c ON c.profilenum = o.buyerlink\n       LEFT JOIN main.products p ON p.itemcode = r.itemlink\n \
    \      LEFT JOIN main.quality_assessment q ON q.inspectref = r.casenum) b\n LEFT JOIN main.return_charge_rules\
    \ x\n   ON (x.customer_segment IS NULL OR x.customer_segment = 'ANY' OR x.customer_segment = b.seg_category)\n\
    \  AND (x.return_channel IS NULL OR x.return_channel = 'ANY' OR x.return_channel = b.return_channel)\n\
    \  AND (x.item_category IS NULL OR x.item_category = 'ANY' OR x.item_category = b.itemcategory)\n\
    \  AND (x.primary_reason IS NULL OR x.primary_reason = 'ANY' OR x.primary_reason = b.primary_reason)\n\
    \  AND (x.item_condition IS NULL OR x.item_condition = 'ANY' OR x.item_condition = b.item_condition)\n\
    \  AND (x.min_monthly_returns IS NULL OR x.min_monthly_returns <= b.cmrc)\n  AND (x.max_monthly_returns\
    \ IS NULL OR b.cmrc <= x.max_monthly_returns)\n GROUP BY b.casenum, b.customer, b.month, b.revdate,\
    \ b.cmrc, b.unit_value) rh\n"
  grain: one return case
  domains:
  - return_charges
- name: total_return_handling_charge
  description: 'A customer''s or group''s RHC over a period: sum of RHC over its returns whose revdate
    falls in the period (group by rh.customer, filter rh.revdate/rh.month). No intermediate rounding;
    round only the reported result to 2 decimals.

    '
  sql_expression: SUM(rh.flat_charge + rh.charge_pct / 100.0 * rh.unit_value)
  source_model: main.returns
  from_sql: "(SELECT b.casenum, b.customer, b.month, b.revdate, b.cmrc, b.unit_value,\n        MIN(x.rule_id)\
    \ AS rule_id,\n        COALESCE(arg_min(x.flat_charge, x.rule_id), 15.00) AS flat_charge,\n      \
    \  COALESCE(arg_min(x.charge_pct, x.rule_id), 5.0) AS charge_pct\n FROM (SELECT r.casenum, o.buyerlink\
    \ AS customer, substr(r.revdate, 1, 7) AS month, r.revdate,\n              c.seg_category, r.return_channel,\
    \ p.itemcategory, CAST(p.unit_value AS DOUBLE) AS unit_value,\n              r.return_details->>'$.reasoning.primary_reason'\
    \ AS primary_reason,\n              q.assessment_summary->>'$.condition.item_condition' AS item_condition,\n\
    \              COUNT(*) OVER (PARTITION BY o.buyerlink, substr(r.revdate, 1, 7)) AS cmrc\n       FROM\
    \ main.returns r\n       LEFT JOIN main.orders o ON o.txnnum = r.srctxn\n       LEFT JOIN main.customers\
    \ c ON c.profilenum = o.buyerlink\n       LEFT JOIN main.products p ON p.itemcode = r.itemlink\n \
    \      LEFT JOIN main.quality_assessment q ON q.inspectref = r.casenum) b\n LEFT JOIN main.return_charge_rules\
    \ x\n   ON (x.customer_segment IS NULL OR x.customer_segment = 'ANY' OR x.customer_segment = b.seg_category)\n\
    \  AND (x.return_channel IS NULL OR x.return_channel = 'ANY' OR x.return_channel = b.return_channel)\n\
    \  AND (x.item_category IS NULL OR x.item_category = 'ANY' OR x.item_category = b.itemcategory)\n\
    \  AND (x.primary_reason IS NULL OR x.primary_reason = 'ANY' OR x.primary_reason = b.primary_reason)\n\
    \  AND (x.item_condition IS NULL OR x.item_condition = 'ANY' OR x.item_condition = b.item_condition)\n\
    \  AND (x.min_monthly_returns IS NULL OR x.min_monthly_returns <= b.cmrc)\n  AND (x.max_monthly_returns\
    \ IS NULL OR b.cmrc <= x.max_monthly_returns)\n GROUP BY b.casenum, b.customer, b.month, b.revdate,\
    \ b.cmrc, b.unit_value) rh\n"
  grain: one return case (aggregate)
  domains:
  - return_charges
- name: average_return_handling_charge
  description: 'Average RHC of a customer/group over a period: RHC sum divided by the number of its returns
    with revdate in the period. Round only the final result to 2 decimals.

    '
  sql_expression: SUM(rh.flat_charge + rh.charge_pct / 100.0 * rh.unit_value) / COUNT(*)
  source_model: main.returns
  from_sql: "(SELECT b.casenum, b.customer, b.month, b.revdate, b.cmrc, b.unit_value,\n        MIN(x.rule_id)\
    \ AS rule_id,\n        COALESCE(arg_min(x.flat_charge, x.rule_id), 15.00) AS flat_charge,\n      \
    \  COALESCE(arg_min(x.charge_pct, x.rule_id), 5.0) AS charge_pct\n FROM (SELECT r.casenum, o.buyerlink\
    \ AS customer, substr(r.revdate, 1, 7) AS month, r.revdate,\n              c.seg_category, r.return_channel,\
    \ p.itemcategory, CAST(p.unit_value AS DOUBLE) AS unit_value,\n              r.return_details->>'$.reasoning.primary_reason'\
    \ AS primary_reason,\n              q.assessment_summary->>'$.condition.item_condition' AS item_condition,\n\
    \              COUNT(*) OVER (PARTITION BY o.buyerlink, substr(r.revdate, 1, 7)) AS cmrc\n       FROM\
    \ main.returns r\n       LEFT JOIN main.orders o ON o.txnnum = r.srctxn\n       LEFT JOIN main.customers\
    \ c ON c.profilenum = o.buyerlink\n       LEFT JOIN main.products p ON p.itemcode = r.itemlink\n \
    \      LEFT JOIN main.quality_assessment q ON q.inspectref = r.casenum) b\n LEFT JOIN main.return_charge_rules\
    \ x\n   ON (x.customer_segment IS NULL OR x.customer_segment = 'ANY' OR x.customer_segment = b.seg_category)\n\
    \  AND (x.return_channel IS NULL OR x.return_channel = 'ANY' OR x.return_channel = b.return_channel)\n\
    \  AND (x.item_category IS NULL OR x.item_category = 'ANY' OR x.item_category = b.itemcategory)\n\
    \  AND (x.primary_reason IS NULL OR x.primary_reason = 'ANY' OR x.primary_reason = b.primary_reason)\n\
    \  AND (x.item_condition IS NULL OR x.item_condition = 'ANY' OR x.item_condition = b.item_condition)\n\
    \  AND (x.min_monthly_returns IS NULL OR x.min_monthly_returns <= b.cmrc)\n  AND (x.max_monthly_returns\
    \ IS NULL OR b.cmrc <= x.max_monthly_returns)\n GROUP BY b.casenum, b.customer, b.month, b.revdate,\
    \ b.cmrc, b.unit_value) rh\n"
  grain: one return case (aggregate)
  domains:
  - return_charges
- name: inspected_resale_value
  description: 'Inspected Resale Value (IRV) = V x A/10 x K: value of a returned item that inspection
    says can still be resold. V = products.unit_value; A = assessment_summary $.results.aesthetic_score
    as decimal (documented 1-10, observed 2-11, used as stored); K = 1.00 ''Complete'', 0.85 ''Accessories
    Missing'', 0.60 ''Missing Parts'' ($.condition.completeness). In unit_value currency units.

    '
  sql_expression: "CAST(p.unit_value AS DOUBLE) * CAST(q.assessment_summary->>'$.results.aesthetic_score'\
    \ AS DOUBLE) / 10.0\n* CASE q.assessment_summary->>'$.condition.completeness'\n    WHEN 'Complete'\
    \ THEN 1.00 WHEN 'Accessories Missing' THEN 0.85 WHEN 'Missing Parts' THEN 0.60 END\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.products p ON p.itemcode = r.itemlink JOIN main.quality_assessment
    q ON q.inspectref = r.casenum
  grain: one return case
  domains:
  - value_leakage
- name: return_value_leakage
  description: 'Return Value Leakage (RVL) = V - IRV + S_f: item value inspection cannot recover plus
    return shipping fee ($.shipping.fee in returns.return_details, decimal). Computed for every return
    (all 1,500 have a product and inspection). SUM for a period''s RVL; average = sum / number of returns.
    Round only the final result.

    '
  sql_expression: "CAST(p.unit_value AS DOUBLE)\n- CAST(p.unit_value AS DOUBLE) * CAST(q.assessment_summary->>'$.results.aesthetic_score'\
    \ AS DOUBLE) / 10.0\n  * CASE q.assessment_summary->>'$.condition.completeness'\n      WHEN 'Complete'\
    \ THEN 1.00 WHEN 'Accessories Missing' THEN 0.85 WHEN 'Missing Parts' THEN 0.60 END\n+ CAST(r.return_details->>'$.shipping.fee'\
    \ AS DOUBLE)\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.products p ON p.itemcode = r.itemlink JOIN main.quality_assessment
    q ON q.inspectref = r.casenum
  grain: one return case
  domains:
  - value_leakage
- name: customer_leakage_ratio
  description: 'Customer Leakage Ratio (CLR) = SUM(RVL) / SUM(V) over the same returns - a ratio of sums,
    not an average of ratios. Computed per Customer Return Month: GROUP BY o.buyerlink, substr(r.revdate,
    1, 7); for another period, filter r.revdate and group by customer/group. Round only the reported result
    to 2 decimals.

    '
  sql_expression: "SUM(CAST(p.unit_value AS DOUBLE)\n    - CAST(p.unit_value AS DOUBLE) * CAST(q.assessment_summary->>'$.results.aesthetic_score'\
    \ AS DOUBLE) / 10.0\n      * CASE q.assessment_summary->>'$.condition.completeness'\n          WHEN\
    \ 'Complete' THEN 1.00 WHEN 'Accessories Missing' THEN 0.85 WHEN 'Missing Parts' THEN 0.60 END\n \
    \   + CAST(r.return_details->>'$.shipping.fee' AS DOUBLE))\n/ NULLIF(SUM(CAST(p.unit_value AS DOUBLE)),\
    \ 0)\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.orders o ON o.txnnum = r.srctxn JOIN main.products p ON p.itemcode
    = r.itemlink JOIN main.quality_assessment q ON q.inspectref = r.casenum
  grain: one Customer Return Month (GROUP BY o.buyerlink, substr(r.revdate, 1, 7))
  domains:
  - value_leakage
- name: leakage_class
  description: 'Leakage Class of a Customer Return Month from its UNROUNDED CLR: ''Contained'' CLR < 0.55;
    ''Elevated'' 0.55 <= CLR < 0.70; ''Severe'' CLR >= 0.70 (lower bounds inclusive, upper exclusive).
    Use with GROUP BY o.buyerlink, substr(r.revdate,1,7). Data: 195 Contained, 123 Elevated, 79 Severe
    of 397 customer-months.

    '
  sql_expression: "CASE\n  WHEN SUM(CAST(p.unit_value AS DOUBLE)\n           - CAST(p.unit_value AS DOUBLE)\
    \ * CAST(q.assessment_summary->>'$.results.aesthetic_score' AS DOUBLE) / 10.0\n             * CASE\
    \ q.assessment_summary->>'$.condition.completeness'\n                 WHEN 'Complete' THEN 1.00 WHEN\
    \ 'Accessories Missing' THEN 0.85 WHEN 'Missing Parts' THEN 0.60 END\n           + CAST(r.return_details->>'$.shipping.fee'\
    \ AS DOUBLE))\n       / NULLIF(SUM(CAST(p.unit_value AS DOUBLE)), 0) < 0.55 THEN 'Contained'\n  WHEN\
    \ SUM(CAST(p.unit_value AS DOUBLE)\n           - CAST(p.unit_value AS DOUBLE) * CAST(q.assessment_summary->>'$.results.aesthetic_score'\
    \ AS DOUBLE) / 10.0\n             * CASE q.assessment_summary->>'$.condition.completeness'\n     \
    \            WHEN 'Complete' THEN 1.00 WHEN 'Accessories Missing' THEN 0.85 WHEN 'Missing Parts' THEN\
    \ 0.60 END\n           + CAST(r.return_details->>'$.shipping.fee' AS DOUBLE))\n       / NULLIF(SUM(CAST(p.unit_value\
    \ AS DOUBLE)), 0) < 0.70 THEN 'Elevated'\n  ELSE 'Severe'\nEND\n"
  source_model: main.returns
  from_sql: main.returns r JOIN main.orders o ON o.txnnum = r.srctxn JOIN main.products p ON p.itemcode
    = r.itemlink JOIN main.quality_assessment q ON q.inspectref = r.casenum
  grain: one Customer Return Month (GROUP BY o.buyerlink, substr(r.revdate, 1, 7))
  domains:
  - value_leakage
- name: average_processing_time
  description: 'Average Processing Time (APT) = sum of processing times / n, the mean calendar time spent
    processing returns at a facility (return_processing.proctime; loccode identifies the facility and
    is unique per row).

    '
  sql_expression: AVG(rp.proctime)
  source_model: main.return_processing
  from_sql: main.return_processing rp
  grain: one processing location row
  domains:
  - operations
- name: warranty_claim_ratio
  description: 'Warranty Claim Ratio (WCR) = N_claims / total returns: proportion of returns that include
    a valid (authorised) warranty claim. INTERPRETATION: an authorised claim has $.authorization.warranty_claim
    NOT NULL and $.authorization.auth_status = ''Approved'' (270 of 1,500 returns). Denominator = number
    of returns in the population.

    '
  sql_expression: "COUNT(*) FILTER (WHERE (r.return_details->>'$.authorization.warranty_claim') IS NOT\
    \ NULL\n                   AND (r.return_details->>'$.authorization.auth_status') = 'Approved')\n\
    / NULLIF(COUNT(*), 0)\n"
  source_model: main.returns
  from_sql: main.returns r
  grain: one return case (aggregate)
  domains:
  - operations
- name: fraud_flag_severity_score
  description: 'Fraud Flag Severity Score (FFS) = fraud flags x risk weight. fraud_flags at $.fraud.fraud_flags
    (0-5); risk level at $.fraud.risk_level (Low/Medium/High, NULL = not assessed). INTERPRETATION: the
    documentation gives no weights; this uses Low=1, Medium=2, High=3, NULL level -> NULL score.

    '
  sql_expression: 'CAST(r.return_details->>''$.fraud.fraud_flags'' AS DOUBLE)

    * CASE (r.return_details->>''$.fraud.risk_level'') WHEN ''Low'' THEN 1 WHEN ''Medium'' THEN 2 WHEN
    ''High'' THEN 3 END

    '
  source_model: main.returns
  from_sql: main.returns r
  grain: one return case
  domains:
  - operations
tables:
- schema: main
  table: customers
  description: One row per customer profile.
  columns:
  - name: profilenum
    description: Customer profile id (PK); orders.buyerlink points here.
  - name: seg_category
    description: 'Customer segment: Wholesale, Retail, Individual. NULL (93 of 206 customers) = not assigned;
      such customers never match a charge rule with a specific customer_segment.'
  - name: geographyzone
    description: Geographic zone (country name), e.g. Cambodia.
  - name: return_behavior_profile
    description: 'JSON: $.total_returns = Total Returns, the lifetime count / cumulative tally of processed
      return cases of the customer (used in CRFI); $.return_frequency_score = frequency score; $.similar_previous_returns
      = simulated returns (NULL = no data).'
- schema: main
  table: products
  description: One row per product.
  columns:
  - name: itemcode
    description: Product id (PK); returns.itemlink points here.
  - name: itemcategory
    description: 'Category: Apparel, Accessories, Electronics, Home Goods (matched to return_charge_rules.item_category).'
  - name: subcat
    description: 'Subcategory: Laptops, Shirts, Shoes, Smartphones.'
  - name: unit_value
    description: Unit value/price (REAL; cast to DOUBLE). V in RHC, IRV, RVL and CLR.
  - name: product_traceability
    description: 'JSON: $.trace.{batch_reference, lot_reference, serial_number, manufacture_date}; $.compliance.regulatory_compliance
      ''Compliant'' (meets all relevant safety/environmental standards) / ''Non-compliant'' (fails certification,
      recall notice or missing documentation, triggering quarantine or disposal penalty; drives RCP) /
      NULL (not available); $.compliance.hazardous_material; $.compliance.recall_flag Yes/No.'
- schema: main
  table: orders
  description: One row per original sale transaction.
  columns:
  - name: txnnum
    description: Order id (PK); returns.srctxn points here.
  - name: buyerlink
    description: Customer of the order (customers.profilenum); the customer of a return.
  - name: transaction_value
    description: Order value; 0 on every row in this data.
  - name: txndate
    description: Transaction date text; NULL on all orders in this data, so tenure is not computable.
- schema: main
  table: returns
  description: One row per return case (1,500).
  columns:
  - name: casenum
    description: Return case id (PK).
  - name: logtime
    description: When the return was logged; mixed text formats (2024-08-13, 2024/11/04, Jun 15, 2024,
      February 18th, 2025).
  - name: srctxn
    description: Order (orders.txnnum).
  - name: itemlink
    description: Returned product (products.itemcode).
  - name: revdate
    description: Date the return was processed, always 'YYYY-MM-DD'; substr(revdate,1,7) is the return's
      month for CMRC, Customer Return Month and period filters.
  - name: dayslapsed
    description: 'Days Lapsed: calendar days between original transaction and completion of return processing
      (when funds/refund are issued). Denominator of RRD.'
  - name: return_channel
    description: 'Return channel. Documented: Store (in person at retail outlet), Courier (doorstep pickup
      arranged by customer), Mail (national mail system), Locker (automated locker/drop-box), Pickup (retailer-scheduled
      home/office collection for oversized/fragile goods). Data holds Store, Courier, Mail, Collection
      Point.'
  - name: return_details
    description: 'JSON: $.reasoning.{primary_reason (Changed Mind, Quality Issue, Size/Fit, Wrong Item),
      secondary_reason, reason_notes, client_notes}; $.authorization.{auth_status Approved/Pending/Rejected,
      warranty_status Valid (within warranty period)/Expired (term lapsed)/Not Applicable (no warranty
      or proof unavailable), warranty_claim (NULL = none)}; $.shipping.{fee = Shipping Fee, carrier, insurance_amount,
      estimated_arrival, tracking_reference}; $.fraud.{risk_level Low/Medium/High, NULL = not assessed;
      fraud_flags 0-5}.'
- schema: main
  table: quality_assessment
  description: One inspection per return (inspectref = returns.casenum; all 1,500 returns inspected).
  columns:
  - name: inspectref
    description: Return case (returns.casenum).
  - name: assessment_summary
    description: 'JSON: $.condition.item_condition New/Like New/Used/Damaged (Item Condition States);
      $.condition.completeness Complete/Accessories Missing/Missing Parts (IRV factor 1.00/0.85/0.60);
      $.condition.package_condition; $.condition.usage_signs (NULL = none); $.defects.{defect_type, defect_severity};
      $.results.{qa_result, functional_test_result, aesthetic_score (number, observed 2-11), tech_review_status};
      $.documentation.{documentation_status, has_photos (mixed true/false tokens), qa_alert, needs_investigation}.'
- schema: main
  table: return_processing
  description: One row per processing location; not linked to returns by any key.
  columns:
  - name: loccode
    description: Location/facility code (PK).
  - name: procprio
    description: 'Processing priority: Bulk (palletised/batch returns in low-demand periods), Standard
      (default SLA, e.g. 3-5 days), Express (expedited for VIP customers, high resale value, or paid premium).'
  - name: procstate
    description: Completed, Inspecting, Processing, Received.
  - name: proctime
    description: Processing time; PT_i in APT.
  - name: handreq
    description: Fragile, Hazardous, Special, Standard.
  - name: needsquar
    description: Yes/No.
  - name: quardays
    description: Quarantine days.
  - name: dispaction
    description: Refurbish, Repair, Resell, Scrap.
  - name: dispreason
    description: Good Condition, Repairable, Too Costly, Unsalvageable; NULL = none provided.
  - name: needsrelabel
    description: 'Mixed tokens: truthy 1/True/Y/YES, falsy 0/F/False/N/NO, P undefined.'
  - name: apprlevel
    description: 'Approval level, hierarchy of sign-off for exceptional processing: Automatic, Manager,
      Supervisor.'
  - name: excepttype
    description: Customer Value, Error, Goodwill; NULL = none provided.
- schema: main
  table: financial_management
  description: One financial record per return case for 995 of 1,500 returns.
  columns:
  - name: creditref
    description: Financial record id (PK).
  - name: casetag
    description: Return case (returns.casenum), unique.
  - name: dispcost
    description: 0 on every row; use cost_breakdown $.disposal.disposal_cost for Disposal Cost.
  - name: cost_breakdown
    description: 'JSON numbers: $.fees.{restocking_fee, relabeling_cost, repackaging_cost, qa_fee}; $.refund.{refund_amount,
      method Original Payment (card/PayPal reversal in gateway) / Bank Transfer (ACH/SEPA when gateway
      refund blocked) / Store Credit (gift card/voucher on request or policy), status, processing_days};
      $.repair_costs.{repair_estimate, parts_fee, labor_fee}; $.disposal.{disposal_cost, disposal_method
      Recycle (recycling streams) / Hazardous Waste (batteries, chemicals, e-waste) / Landfill (non-recyclable
      residuals) / Return to Vendor (supplier takes back for specialised processing), environmental_impact,
      recycling_category}; $.valuation.{recovery_value, value_loss_pct}; $.sustainability.{sustainability_score,
      carbon_footprint (kg CO2e), efficiency_score, cost_efficiency}.'
- schema: main
  table: case_management
  description: One case-management record per return case (casetie = returns.casenum).
  columns:
  - name: casetie
    description: Return case (returns.casenum).
  - name: satisfscore
    description: 'Satisfaction 1-5, larger = more satisfied: 1 Very Dissatisfied, 2 Dissatisfied, 3 Neutral,
      4 Satisfied, 5 Very Satisfied.'
  - name: trainident
    description: 'Mixed tokens: truthy 1/True/Y/YES, falsy 0/F/False/N/NO, P undefined.'
  - name: closestate
    description: Closed, Open, Pending.
- schema: main
  table: return_charge_rules
  description: 'Return Handling Charge Schedule: one rule per row (rule_id) setting the charge a customer
    pays for having a return handled. Text criteria use the literal ''ANY'' as "no restriction" (never
    NULL in data); bounds use NULL. Charge terms flat_charge and charge_pct. Standard Handling Charge
    for unmatched returns: 15.00 flat, 5.0 pct. 400 rules.

    '
  columns:
  - name: rule_id
    description: Rule id (PK); lowest matching rule_id is applied when several match (contract tie-break).
  - name: customer_segment
    description: Compared with customers.seg_category; 'ANY'/NULL = no restriction.
  - name: return_channel
    description: Compared with returns.return_channel; 'ANY'/NULL = no restriction.
  - name: item_category
    description: Compared with products.itemcategory; 'ANY'/NULL = no restriction.
  - name: primary_reason
    description: Compared with return_details $.reasoning.primary_reason; 'ANY'/NULL = no restriction.
  - name: item_condition
    description: Compared with assessment_summary $.condition.item_condition; 'ANY'/NULL = no restriction.
  - name: min_monthly_returns
    description: Inclusive lower bound on CMRC; NULL = no lower bound.
  - name: max_monthly_returns
    description: Inclusive upper bound on CMRC; NULL = no upper bound.
  - name: flat_charge
    description: F in RHC, in unit_value currency units.
  - name: charge_pct
    description: P in RHC, percent of products.unit_value.
relationships:
- from: main.returns.srctxn
  to: main.orders.txnnum
  type: many_to_one
- from: main.orders.buyerlink
  to: main.customers.profilenum
  type: many_to_one
- from: main.returns.itemlink
  to: main.products.itemcode
  type: many_to_one
- from: main.quality_assessment.inspectref
  to: main.returns.casenum
  type: one_to_one
- from: main.financial_management.casetag
  to: main.returns.casenum
  type: one_to_one
- from: main.case_management.casetie
  to: main.returns.casenum
  type: one_to_one
