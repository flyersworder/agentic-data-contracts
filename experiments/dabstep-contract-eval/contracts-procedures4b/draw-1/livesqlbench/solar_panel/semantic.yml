  grain: one row per plant_record snapshot
  domains:
  - warranty_settlement
- name: potential_snapshot_yield
  description: 'E_pot = E / ((A/100) * (1 - L_soil/100)). availability_pct is stored as a fraction (0.95-0.9999),
    so it is used directly as A/100; soil_loss_pct is a 0-100 percentage. ep exposes e (energy_yield_kwh),
    avail_frac, soil_pct, e_pot. NULL if any input NULL. Unrounded, kWh.

    '
  sql_expression: ep.e_pot
  source_model: main.electrical_performance
  from_sql: "main.plant_record r JOIN main.plants p ON p.sitekey = r.sitetie JOIN main.panel_models m\
    \ ON m.modkey = p.modhook JOIN (SELECT snaplink,\n        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh'\
    \ AS DOUBLE) AS e,\n        CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct' AS DOUBLE)\
    \ AS avail_frac,\n        CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE) AS soil_pct,\n\
    \        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh' AS DOUBLE)\n          / NULLIF(CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct'\
    \ AS DOUBLE)\n            * (1 - CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE)\
    \ / 100.0), 0) AS e_pot\n      FROM main.electrical_performance) ep ON ep.snaplink = r.snapkey\n"
  grain: one row per snapshot
  domains:
  - energy_loss
- name: recoverable_energy_loss
  description: E_loss = E_pot - E (kWh), only where E_pot exists; unrounded.
  sql_expression: ep.e_pot - ep.e
  source_model: main.electrical_performance
  from_sql: "main.plant_record r JOIN main.plants p ON p.sitekey = r.sitetie JOIN main.panel_models m\
    \ ON m.modkey = p.modhook JOIN (SELECT snaplink,\n        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh'\
    \ AS DOUBLE) AS e,\n        CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct' AS DOUBLE)\
    \ AS avail_frac,\n        CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE) AS soil_pct,\n\
    \        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh' AS DOUBLE)\n          / NULLIF(CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct'\
    \ AS DOUBLE)\n            * (1 - CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE)\
    \ / 100.0), 0) AS e_pot\n      FROM main.electrical_performance) ep ON ep.snaplink = r.snapkey\n"
  grain: one row per snapshot
  domains:
  - energy_loss
- name: technology_monthly_energy_loss_ratio
  description: 'R = 100 * SUM(E_loss) / SUM(E_pot) over snapshots with E_pot; GROUP BY m.pnlkind, date_trunc(''month'',
    r.snapts). Ratio of sums. Report ROUND(R, 2); classify unrounded. Months without snapshots have no
    row.

    '
  sql_expression: 100.0 * SUM(ep.e_pot - ep.e) FILTER (WHERE ep.e_pot IS NOT NULL) / NULLIF(SUM(ep.e_pot)
    FILTER (WHERE ep.e_pot IS NOT NULL), 0)
  source_model: main.electrical_performance
  from_sql: "main.plant_record r JOIN main.plants p ON p.sitekey = r.sitetie JOIN main.panel_models m\
    \ ON m.modkey = p.modhook JOIN (SELECT snaplink,\n        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh'\
    \ AS DOUBLE) AS e,\n        CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct' AS DOUBLE)\
    \ AS avail_frac,\n        CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE) AS soil_pct,\n\
    \        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh' AS DOUBLE)\n          / NULLIF(CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct'\
    \ AS DOUBLE)\n            * (1 - CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE)\
    \ / 100.0), 0) AS e_pot\n      FROM main.electrical_performance) ep ON ep.snaplink = r.snapkey\n"
  grain: one row per snapshot (aggregate per pnlkind x calendar month)
  domains:
  - energy_loss
- name: energy_loss_band
  description: 'Band of unrounded R per technology-month: Low < 6, Moderate [6,10), Elevated [10,14),
    Severe >= 14. GROUP BY m.pnlkind, date_trunc(''month'', r.snapts).'
  sql_expression: "CASE WHEN 100.0 * SUM(ep.e_pot - ep.e) FILTER (WHERE ep.e_pot IS NOT NULL) / NULLIF(SUM(ep.e_pot)\
    \ FILTER (WHERE ep.e_pot IS NOT NULL), 0) < 6 THEN 'Low'\n     WHEN 100.0 * SUM(ep.e_pot - ep.e) FILTER\
    \ (WHERE ep.e_pot IS NOT NULL) / NULLIF(SUM(ep.e_pot) FILTER (WHERE ep.e_pot IS NOT NULL), 0) < 10\
    \ THEN 'Moderate'\n     WHEN 100.0 * SUM(ep.e_pot - ep.e) FILTER (WHERE ep.e_pot IS NOT NULL) / NULLIF(SUM(ep.e_pot)\
    \ FILTER (WHERE ep.e_pot IS NOT NULL), 0) < 14 THEN 'Elevated'\n     WHEN 100.0 * SUM(ep.e_pot - ep.e)\
    \ FILTER (WHERE ep.e_pot IS NOT NULL) / NULLIF(SUM(ep.e_pot) FILTER (WHERE ep.e_pot IS NOT NULL),\
    \ 0) >= 14 THEN 'Severe' END\n"
  source_model: main.electrical_performance
  from_sql: "main.plant_record r JOIN main.plants p ON p.sitekey = r.sitetie JOIN main.panel_models m\
    \ ON m.modkey = p.modhook JOIN (SELECT snaplink,\n        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh'\
    \ AS DOUBLE) AS e,\n        CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct' AS DOUBLE)\
    \ AS avail_frac,\n        CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE) AS soil_pct,\n\
    \        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh' AS DOUBLE)\n          / NULLIF(CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct'\
    \ AS DOUBLE)\n            * (1 - CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE)\
    \ / 100.0), 0) AS e_pot\n      FROM main.electrical_performance) ep ON ep.snaplink = r.snapkey\n"
  grain: one row per snapshot (aggregate per pnlkind x calendar month)
  domains:
  - energy_loss
- name: technology_recoverable_energy
  description: E_rec = ROUND(SUM(E_loss), 2) kWh per m.pnlkind, filtering r.snapts to the period; rounding
    only after summing.
  sql_expression: ROUND(SUM(ep.e_pot - ep.e), 2)
  source_model: main.electrical_performance
  from_sql: "main.plant_record r JOIN main.plants p ON p.sitekey = r.sitetie JOIN main.panel_models m\
    \ ON m.modkey = p.modhook JOIN (SELECT snaplink,\n        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh'\
    \ AS DOUBLE) AS e,\n        CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct' AS DOUBLE)\
    \ AS avail_frac,\n        CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE) AS soil_pct,\n\
    \        CAST(elec_perf_snapshot->'energy_yield'->>'energy_yield_kwh' AS DOUBLE)\n          / NULLIF(CAST(elec_perf_snapshot->'energy_yield'->>'availability_pct'\
    \ AS DOUBLE)\n            * (1 - CAST(elec_perf_snapshot->'efficiency'->>'soil_loss_pct' AS DOUBLE)\
    \ / 100.0), 0) AS e_pot\n      FROM main.electrical_performance) ep ON ep.snaplink = r.snapkey\n"
  grain: one row per snapshot
  domains:
  - energy_loss
tables:
- schema: main
  table: electrical_performance
  columns:
  - name: snaplink
    type: TEXT
    description: PK & FK to plant_record.snapkey.
  - name: elec_perf_snapshot
    type: JSON
    description: JSON with groups grid, power, inverter, iv_curve, efficiency, energy_yield. Read numbers
      with ->> and CAST AS DOUBLE. energy_yield.availability_pct is a FRACTION (0.95-0.9999), not 0-100.
      energy_yield.energy_yield_kwh is kWh. iv_curve.series_res_ohm is text like '0.17 Ω'; efficiency.spectral_mismatch
      is text like '100.50%' (= factor 1.005). power.power_now_w / power_loss_w and energy_yield.performance_ratio
      are NULL in 400 rows.
- schema: main
  table: environmental_conditions
  columns:
  - name: snapref
    type: TEXT
    description: PK & FK to plant_record.snapkey.
  - name: env_snapshot
    type: JSON
    description: JSON groups temperatures (cell_temp_c NULL in 398 rows, ambient_temp_c), irradiance (ghi/dni/dhi/poa_irr
      in W/m2), atmospheric (uv_index etc.), wind_rain_snow.
- schema: main
  table: mechanical_condition
  columns:
  - name: snapmk
    type: TEXT
    description: PK & FK to plant_record.snapkey.
  - name: mech_health_snapshot
    type: JSON
    description: JSON groups tracker (tracker_state Error/Maintenance/Normal), module_surface (busbar_corrosion
      Severe/Visible/NULL, delamination_status Major/Minor/NULL, microcrack_count integer), electrical_integrity
      (grounding_status, bypass_diode_status Failed/Normal/Partial), mount_cleaning (mount_structure_status
      Stable/Unstable/Check Required, last_clean_date 'YYYY-MM-DD').
- schema: main
  table: panel_models
  columns:
  - name: modkey
    type: TEXT
    description: Panel model id.
  - name: makertag
    type: TEXT
    description: Manufacturer; NULL in 228 models (true NULL) = 'Unlisted' group for warranty settlement.
  - name: pnlkind
    type: TEXT
    description: 'Technology: Bifacial, HJT, Mono-PERC, Poly-PERC, TOPCon (never NULL).'
  - name: rated_w
    type: REAL
    description: Max power under STC, W.
  - name: effpct
    type: REAL
    description: Conversion efficiency %.
  - name: degyrrate
    type: REAL
    description: 'Specified annual degradation rate in % per year (0.3-1.2). High degradation model: >
      0.7.'
  - name: tempcoeff
    type: REAL
    description: Temperature coefficient of power, %/C (e.g. -0.389); NULL in 237 models.
  - name: nomoptempc
    type: TEXT
    description: NOCT as text like '45.7 °C'; strip ' °C' to cast.
- schema: main
  table: plants
  columns:
  - name: sitekey
    type: TEXT
    description: Plant id.
  - name: sitelabel
    type: TEXT
    description: Plant name.
  - name: cap_mw
    type: REAL
    description: Installed capacity, MW (P_rated; x1000 for kW).
  - name: goliveon
    type: DATE
    description: Go-live date; base for age.
  - name: modhook
    type: TEXT
    description: FK to panel_models.modkey; the model link used for manufacturer/technology grouping.
  - name: tiltdeg
    type: REAL
    description: Tilt from horizontal, degrees.
  - name: azmdeg
    type: REAL
    description: Azimuth from true north, degrees.
  - name: recyclenote
    type: TEXT
    description: 'Recycling program: Available, In Development, NULL.'
  - name: docstate
    type: TEXT
    description: 'Documentation: Complete, Missing, Partial.'
  - name: warrstate
    type: TEXT
    description: Warranty status Active/Claimed/Expired; NULL in 378 plants.
  - name: warrclaims
    type: BIGINT
    description: Number of warranty claims (0-5), NULL possible.
  - name: insurstate
    type: TEXT
    description: 'Insurance: Covered, Expired, Partial.'
  - name: complyflag
    type: TEXT
    description: 'Compliance: Compliant, Non-Compliant, Under Review.'
  - name: envtag
    type: TEXT
    description: Environmental risk class High/Low/Medium; 'High' = High Environmental Risk Site.
- schema: main
  table: plant_panel_model
  columns:
  - name: sitelink
    type: TEXT
    description: FK to plants.sitekey. Not used by the settlement or energy-loss definitions.
  - name: modlink
    type: TEXT
    description: FK to panel_models.modkey.
- schema: main
  table: plant_record
  columns:
  - name: snapkey
    type: TEXT
    description: Snapshot id (998 rows), key for all per-snapshot tables.
  - name: sitetie
    type: TEXT
    description: FK to plants.sitekey (never NULL).
  - name: snapts
    type: TIMESTAMP
    description: Snapshot timestamp (2015-03 to 2025-02); calendar month = date_trunc('month', snapts).
      Often earlier than the plant's goliveon.
- schema: main
  table: operational_metrics
  columns:
  - name: snapops
    type: TEXT
    description: PK & FK to plant_record.snapkey.
  - name: mtbfh
    type: REAL
    description: MTBF hours; NULL in 400 rows.
  - name: mttrh
    type: REAL
    description: MTTR hours.
  - name: maintcost
    type: REAL
    description: Maintenance cost.
  - name: cleancost
    type: REAL
    description: Cleaning cost.
  - name: replcost
    type: REAL
    description: Component replacement cost, USD (C_repl in settlement; no NULLs currently, treat NULL
      as 0).
  - name: revloss
    type: TEXT
    description: Revenue loss as text like '$13,375.59 '; parse with CAST(replace(replace(trim(revloss),'$',''),',','')
      AS DOUBLE).
  - name: optpot
    type: TEXT
    description: Optimization potential High/Low/Medium.
- schema: main
  table: inspection
  columns:
  - name: inspectmode
    type: TEXT
    description: Inspection method (PK, 4 rows); no key links to snapshots or plants.
  - name: inspectres
    type: TEXT
    description: Major Issues, Minor Issues, Pass.
  - name: inspectdt
    type: DATE
    description: Inspection date.
  - name: maintsched
    type: TEXT
    description: Delayed, On Schedule, Overdue.
  - name: dqscore
    type: REAL
    description: Data quality score 0-100; < 50 = Data Quality Concern.
- schema: main
  table: alert
  columns:
  - name: snapalrt
    type: TEXT
    description: PK & FK to plant_record.snapkey.
  - name: alrtstate
    type: TEXT
    description: Critical, Warning or NULL (594 rows, true NULL).
  - name: alrtcnt
    type: TEXT
    description: Active alert count as text like '6 events'; cast split_part(alrtcnt,' ',1).
  - name: maintprio
    type: TEXT
    description: High/Low/Medium; NULL in 399 rows.
  - name: replprio
    type: TEXT
    description: High/Low/Medium.
- schema: main
  table: warranty_settle_rules
  columns:
  - name: rule_id
    type: INTEGER
    description: Rule id; ties in specificity go to the lowest.
  - name: maker_tag
    type: TEXT
    description: Manufacturer criterion; 'ALL' (stored literal, no NULLs) = no restriction.
  - name: pnl_kind
    type: TEXT
    description: Technology criterion; 'ALL' = no restriction.
  - name: alrt_state
    type: TEXT
    description: Alert status criterion (Critical/Warning); 'ALL' = no restriction.
  - name: warr_state
    type: TEXT
    description: Warranty status criterion; 'ALL' = no restriction.
  - name: cap_band
    type: TEXT
    description: Small/Mid/Large or 'ALL'.
  - name: vol_tier
    type: TEXT
    description: Single/Moderate/Bulk or 'ALL'.
  - name: fixed_fee_usd
    type: DOUBLE
    description: Fixed handling fee per settled snapshot, USD.
  - name: cover_pct
    type: DOUBLE
    description: Coverage % of replcost.
