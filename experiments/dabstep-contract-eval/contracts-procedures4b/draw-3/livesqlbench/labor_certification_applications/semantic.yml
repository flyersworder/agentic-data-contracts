# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: labor_certification_applications, author: claudeopus5.5
metrics:
- name: approval_rate
  description: 'AR [13] = (Number of Certified Applications / Total Number of Applications) × 100%. Certified
    = upper(statustag) = ''CERTIFIED'' (data holds three spellings). Returns a percentage.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED') / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: application_success_rate
  description: 'ASR [18] = (Number of Certified Applications by Employer / Total Applications by Employer)
    × 100%. Group by c.homefirm (exact text).

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED') / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
  - employers
- name: application_processing_time
  description: 'APT [12]: days between the date the application is received (recvday, text ''YYYY/MM/DD'')
    and the decision date (decisionday, text ''YYYY-MM-DD''). Per case; NULL for the 216 cases with no
    decision date.

    '
  sql_expression: date_diff('day', CAST(strptime(c.recvday, '%Y/%m/%d') AS DATE), CAST(c.decisionday AS
    DATE))
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: processing_efficiency_ratio
  description: 'PER [32] = Average Processing Time / Application Processing Time, per case; values above
    1 indicate faster than average. The average is over all selected cases with a decision date (window
    over the selected rows). NULL when APT is 0 or missing.

    '
  sql_expression: 'AVG(date_diff(''day'', CAST(strptime(c.recvday, ''%Y/%m/%d'') AS DATE), CAST(c.decisionday
    AS DATE))) OVER () / NULLIF(date_diff(''day'', CAST(strptime(c.recvday, ''%Y/%m/%d'') AS DATE), CAST(c.decisionday
    AS DATE)), 0)

    '
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: visa_class_distribution
  description: 'VCD [29] = (Number of Applications for Visa Class / Total Number of Applications) × 100%.
    Use with GROUP BY c.visacls.

    '
  sql_expression: 100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
  - distribution
- name: employer_h1b_concentration
  description: 'EHC [15] = (Number of H-1B Applications by Employer / Total Number of H-1B Applications)
    × 100%. Use with GROUP BY c.homefirm.

    '
  sql_expression: '100.0 * COUNT(*) FILTER (WHERE CAST(c.visacls AS TEXT) = ''H-1B'') / SUM(COUNT(*) FILTER
    (WHERE CAST(c.visacls AS TEXT) = ''H-1B'')) OVER ()

    '
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
  - application_data
- name: employer_scale_indicator
  description: 'ESI [30] = Employer Number of Applications / Average Applications per Employer. Use with
    GROUP BY c.homefirm; the average is over all employers in the result.

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
  - distribution
- name: employer_retention_rate
  description: 'ERR [25] = (Number of Continuation Applications / Total Number of Applications by Employer)
    × 100%. INTERPRETATION: a continuation application is a case with contemp (continued employment positions)
    > 0. Use with GROUP BY c.homefirm.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE c.contemp > 0) / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: occupational_demand_index
  description: 'ODI [21] = Number of Applications for SOC Code / Average Applications per SOC Code. Use
    with GROUP BY c.soccd.

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - distribution
- name: seasonal_application_index
  description: 'SAI [23] = Number of Applications in Month / Average Monthly Applications, by month of
    receipt (recvday ''YYYY/MM/DD''). Use with GROUP BY date_trunc(''month'', strptime(c.recvday, ''%Y/%m/%d'')).
    The average is over months that have applications. Data: all cases were received in December 2023.

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - distribution
  - application_data
- name: application_complexity_factor_count
  description: 'Number of complexity factors present on a case, from the ACS [37] factor list: H-1B dependency
    (h1bdep = ''Yes''), willful violator (willfulv = ''Yes''), new employment (newemp > 0), amendment
    (amendflag > 0). INTERPRETATION: ACS is a weighted sum but no weights are documented, so this is the
    unweighted count (0-4).

    '
  sql_expression: "(CASE WHEN CAST(c.h1bdep AS TEXT) = 'Yes' THEN 1 ELSE 0 END\n + CASE WHEN CAST(c.willfulv\
    \ AS TEXT) = 'Yes' THEN 1 ELSE 0 END\n + CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END\n + CASE WHEN c.amendflag\
    \ > 0 THEN 1 ELSE 0 END)\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: application_complexity_tier
  description: '[51] ''Complex'' for cases involving H-1B dependency or willful violator status (or special
    attestations, which no column records), else ''Standard''.

    '
  sql_expression: "CASE WHEN CAST(c.h1bdep AS TEXT) = 'Yes' OR CAST(c.willfulv AS TEXT) = 'Yes'\n    \
    \ THEN 'Complex' ELSE 'Standard' END\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: application_delay_risk_profile
  description: '[57] Low Risk (no complexity factors), Moderate Risk (1-2 factors), High Risk (3 or more
    factors or from a willful violator), using application_complexity_factor_count.

    '
  sql_expression: "CASE WHEN CAST(c.willfulv AS TEXT) = 'Yes'\n       OR (CASE WHEN CAST(c.h1bdep AS TEXT)\
    \ = 'Yes' THEN 1 ELSE 0 END\n           + CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END\n           + CASE\
    \ WHEN c.amendflag > 0 THEN 1 ELSE 0 END) >= 3 THEN 'High Risk'\n     WHEN (CASE WHEN CAST(c.h1bdep\
    \ AS TEXT) = 'Yes' THEN 1 ELSE 0 END\n           + CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END\n    \
    \       + CASE WHEN c.amendflag > 0 THEN 1 ELSE 0 END) >= 1 THEN 'Moderate Risk'\n     ELSE 'Low Risk'\
    \ END\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: visa_filing_window
  description: '[41] Filing timing relative to employment start. months_before = calendar-month difference
    date_diff(''month'', receipt date, begin date) (recvday ''YYYY/MM/DD'', beginday ''DD/MM/YYYY'').
    < 0 ''After Start Date''; 0 ''Same Month''; 1-3 ''1-3 Months Before''; 4-6 ''Optimal Window (4-6 Months)'';
    > 6 ''Early Filing''. INTERPRETATION: months are counted as calendar-month boundaries.

    '
  sql_expression: "CASE WHEN date_diff('month', CAST(strptime(c.recvday, '%Y/%m/%d') AS DATE), CAST(strptime(c.beginday,\
    \ '%d/%m/%Y') AS DATE)) < 0 THEN 'After Start Date'\n     WHEN date_diff('month', CAST(strptime(c.recvday,\
    \ '%Y/%m/%d') AS DATE), CAST(strptime(c.beginday, '%d/%m/%Y') AS DATE)) = 0 THEN 'Same Month'\n  \
    \   WHEN date_diff('month', CAST(strptime(c.recvday, '%Y/%m/%d') AS DATE), CAST(strptime(c.beginday,\
    \ '%d/%m/%Y') AS DATE)) <= 3 THEN '1-3 Months Before'\n     WHEN date_diff('month', CAST(strptime(c.recvday,\
    \ '%Y/%m/%d') AS DATE), CAST(strptime(c.beginday, '%d/%m/%Y') AS DATE)) <= 6 THEN 'Optimal Window\
    \ (4-6 Months)'\n     ELSE 'Early Filing' END\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - application_data
- name: employer_size_classification
  description: '[46] Per employer (exact homefirm) and year of receipt: ''Small-scale'' (< 5 applications
    annually), ''Medium-scale'' (5-25), ''Large-scale'' (> 25). Use with GROUP BY c.homefirm, year(strptime(c.recvday,
    ''%Y/%m/%d'')).

    '
  sql_expression: "CASE WHEN COUNT(*) < 5 THEN 'Small-scale' WHEN COUNT(*) <= 25 THEN 'Medium-scale'\n\
    \     ELSE 'Large-scale' END\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: continuous_filing_employer
  description: '[58] True when the employer submitted applications (by receipt month) in at least 9 distinct
    months of the year. Use with GROUP BY c.homefirm, year(strptime(c.recvday, ''%Y/%m/%d'')).

    '
  sql_expression: COUNT(DISTINCT month(strptime(c.recvday, '%Y/%m/%d'))) >= 9
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - employers
- name: state_application_distribution
  description: 'SAD [19] = (Applications in State / Total Applications) × 100%, state = case_worksite.wsstate
    (one worksite row per case). Use with GROUP BY cw.wsstate.

    '
  sql_expression: 100.0 * COUNT(DISTINCT c.filekey) / SUM(COUNT(DISTINCT c.filekey)) OVER ()
  source_model: main.cases
  from_sql: main.cases c JOIN main.case_worksite cw ON cw.dockkey = c.filekey
  grain: one row per case (each case has exactly one worksite row)
  domains:
  - distribution
- name: geographic_concentration_index
  description: 'GCI [33] = sum over states of (Applications in State i / Total Applications)^2. Single
    value.

    '
  sql_expression: SUM(s.share * s.share)
  source_model: main.case_worksite
  from_sql: "(SELECT cw.wsstate, COUNT(*) * 1.0 / SUM(COUNT(*)) OVER () AS share\n FROM main.cases c JOIN\
    \ main.case_worksite cw ON cw.dockkey = c.filekey\n GROUP BY cw.wsstate) s\n"
  grain: one row per worksite state with its share of applications
  domains:
  - distribution
- name: industry_application_distribution
  description: 'IAD [20] = (Applications in Industry / Total Applications) × 100%, industry = employer
    NAICS code (employer_contact_info->>''naics_code''). Use with GROUP BY e.employer_contact_info->>''naics_code''.

    '
  sql_expression: 100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref = c.homezip
  grain: one row per case
  domains:
  - distribution
  - employers
- name: industry_concentration_ratio
  description: 'ICR [35] = sum over industries (NAICS) of (Applications in Industry i / Total Applications)^2.
    Single value.

    '
  sql_expression: SUM(s.share * s.share)
  source_model: main.employer
  from_sql: "(SELECT e.employer_contact_info->>'naics_code' AS naics_code,\n        COUNT(*) * 1.0 / SUM(COUNT(*))\
    \ OVER () AS share\n FROM main.cases c JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref\
    \ = c.homezip\n GROUP BY 1) s\n"
  grain: one row per NAICS code with its share of applications
  domains:
  - distribution
  - employers
- name: worksite_density
  description: 'WD [16] = Number of Workers at Worksite(s) / Number of Worksites; workers = SUM(case_worksite.wsheads),
    worksites = distinct (address, city, state, zip).

    '
  sql_expression: 'SUM(cw.wsheads) * 1.0 / COUNT(DISTINCT cw.ws_addr1 || ''|'' || cw.wscity || ''|'' ||
    cw.wsstate || ''|'' || cw.wszip)

    '
  source_model: main.case_worksite
  from_sql: main.case_worksite cw
  grain: one row per case-worksite link
  domains:
  - distribution
- name: worksite_diversity_index
  description: 'WDI [27] = 1 − sum((Workers at Worksite i / Total Workers)^2) over an employer''s worksites;
    workers = wsheads. Use with GROUP BY ew.homefirm.

    '
  sql_expression: 1 - SUM(ew.share * ew.share)
  source_model: main.case_worksite
  from_sql: "(SELECT c.homefirm,\n        SUM(cw.wsheads) * 1.0 / SUM(SUM(cw.wsheads)) OVER (PARTITION\
    \ BY c.homefirm) AS share\n FROM main.cases c JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n\
    \ GROUP BY c.homefirm, cw.ws_addr1, cw.wscity, cw.wsstate, cw.wszip) ew\n"
  grain: one row per employer and worksite with the worksite's share of the employer's workers
  domains:
  - employers
  - distribution
- name: attorney_case_load
  description: 'ACL [14]: number of cases handled by each attorney. Use with GROUP BY ca.counselmail.'
  sql_expression: COUNT(DISTINCT ca.docketkey)
  source_model: main.case_attorney
  from_sql: main.case_attorney ca
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_success_rate
  description: 'ASR_Attorney [24] = (Certified Applications by Attorney / Total Applications by Attorney)
    × 100%. Use with GROUP BY ca.counselmail.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED') / COUNT(*)
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_performance_rating
  description: '[52] ''High Performer'' (approval rate over 95%), ''Standard Performer'' (85-95%), ''Underperformer''
    (below 85%), from attorney_success_rate. Use with GROUP BY ca.counselmail.

    '
  sql_expression: "CASE WHEN 100.0 * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED') / COUNT(*)\
    \ > 95 THEN 'High Performer'\n     WHEN 100.0 * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED')\
    \ / COUNT(*) >= 85 THEN 'Standard Performer'\n     ELSE 'Underperformer' END\n"
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_specialization_index
  description: 'ASI [34] = 1 − (Different Visa Types Handled by Attorney / Total Number of Visa Types);
    closer to 1 = more specialized. Total visa types = 4 (E-3 Australian, H-1B, H-1B1 Chile, H-1B1 Singapore;
    all present in data). Use with GROUP BY ca.counselmail.

    '
  sql_expression: 1 - COUNT(DISTINCT c.visacls) / 4.0
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_specialization_category
  description: '[45] ''Specialist'' when over 80% of the attorney''s cases are in one visa type; otherwise
    ''Hybrid Practitioner'' when the attorney handles 2-3 visa types, else ''Generalist''. INTERPRETATION:
    "significant experience" and "even distribution" are not quantified; this reads them by type count.
    Use with GROUP BY av.counselmail.

    '
  sql_expression: "CASE WHEN MAX(av.n) * 1.0 / SUM(av.n) > 0.8 THEN 'Specialist'\n     WHEN COUNT(*) BETWEEN\
    \ 2 AND 3 THEN 'Hybrid Practitioner'\n     ELSE 'Generalist' END\n"
  source_model: main.case_attorney
  from_sql: "(SELECT ca.counselmail, CAST(c.visacls AS TEXT) AS visa_class, COUNT(*) AS n\n FROM main.case_attorney\
    \ ca JOIN main.cases c ON c.filekey = ca.docketkey\n GROUP BY 1, 2) av\n"
  grain: one row per attorney and visa class with its case count
  domains:
  - attorneys
- name: external_counsel_rate
  description: 'ECR [26] = (Applications with Attorney / Total Applications) × 100%. A case has an attorney
    when it has a case_attorney row.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL) / COUNT(*)
  source_model: main.cases
  from_sql: main.cases c LEFT JOIN (SELECT DISTINCT docketkey FROM main.case_attorney) ca ON ca.docketkey
    = c.filekey
  grain: one row per case
  domains:
  - attorneys
- name: legal_representation_efficacy
  description: '[59] Approval-rate gap g.gap = AR(cases with attorney) − AR(cases without), in percentage
    points; ''High Impact'' when > 10, ''Moderate Impact'' when 5-10, ''Minimal Impact'' when the absolute
    difference < 5; otherwise (represented cases lower by 5+ points) ''Unclassified''. INTERPRETATION:
    "% higher" read as percentage points. Select g.gap to report the raw gap.

    '
  sql_expression: "CASE WHEN g.gap > 10 THEN 'High Impact' WHEN g.gap >= 5 THEN 'Moderate Impact'\n  \
    \   WHEN ABS(g.gap) < 5 THEN 'Minimal Impact' ELSE 'Unclassified' END\n"
  source_model: main.cases
  from_sql: "(SELECT 100.0 * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED' AND ca.docketkey\
    \ IS NOT NULL)\n          / NULLIF(COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL), 0)\n      - 100.0\
    \ * COUNT(*) FILTER (WHERE upper(c.statustag) = 'CERTIFIED' AND ca.docketkey IS NULL)\n          /\
    \ NULLIF(COUNT(*) FILTER (WHERE ca.docketkey IS NULL), 0) AS gap\n FROM main.cases c\n LEFT JOIN (SELECT\
    \ DISTINCT docketkey FROM main.case_attorney) ca ON ca.docketkey = c.filekey) g\n"
  grain: a single row holding the approval-rate gap
  domains:
  - attorneys
- name: annualized_offered_wage
  description: 'AOW [68]: offered ''from'' (''$130000.00''; strip ''$'' and commas; ''to'' ignored) ×
    unit factor of offered_wage.unit (Hour 2080, Week 52, Month 12, Year 1). USD per year. The from_sql
    wc is the case wage profile, one row per case, exposing filekey, homefirm, homezip, headct, statustag,
    soccd, visa_class, wsstate, begin_date, start_month (first day of beginday month), received_date,
    naics_code, wage_level, aow, apw, whr, headroom_points, level_points, cwas.

    '
  sql_expression: wc.aow
  source_model: main.prevailing_wage
  from_sql: "(SELECT w.*,\n        (w.aow - w.apw) / w.apw AS whr,\n        100 * LEAST(GREATEST((w.aow\
    \ - w.apw) / w.apw, 0), 0.40) / 0.40 AS headroom_points,\n        CASE w.wage_level WHEN 'I' THEN\
    \ 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100 ELSE 50 END AS level_points,\n      \
    \  0.7 * (100 * LEAST(GREATEST((w.aow - w.apw) / w.apw, 0), 0.40) / 0.40)\n          + 0.3 * CASE\
    \ w.wage_level WHEN 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100 ELSE 50 END\
    \ AS cwas\n FROM (\n   SELECT c.filekey, c.homefirm, c.homezip, c.headct, c.statustag, c.soccd,\n\
    \          CAST(c.visacls AS TEXT) AS visa_class, cw.wsstate,\n          CAST(strptime(c.beginday,\
    \ '%d/%m/%Y') AS DATE) AS begin_date,\n          CAST(date_trunc('month', strptime(c.beginday, '%d/%m/%Y'))\
    \ AS DATE) AS start_month,\n          CAST(strptime(c.recvday, '%Y/%m/%d') AS DATE) AS received_date,\n\
    \          CAST(e.employer_contact_info->>'naics_code' AS BIGINT) AS naics_code,\n          pw.wage_details->'prevailing_wage'->>'level'\
    \ AS wage_level,\n          CAST(replace(replace(pw.wage_details->'offered_wage'->>'from', '$', ''),\
    \ ',', '') AS DOUBLE)\n            * CASE pw.wage_details->'offered_wage'->>'unit' WHEN 'Hour' THEN\
    \ 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS aow,\n          CAST(replace(replace(pw.wage_details->'prevailing_wage'->>'value',\
    \ 'USD ', ''), ',', '') AS DOUBLE)\n            * CASE pw.wage_details->'prevailing_wage'->>'unit'\
    \ WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS apw\n \
    \  FROM main.cases c\n   JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   JOIN main.prevailing_wage\
    \ pw ON pw.trackno = cw.wagetrack\n   JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref\
    \ = c.homezip\n ) w) wc\n"
  grain: one row per case (case wage profile)
  domains:
  - wage_assurance
  - wages
- name: annualized_prevailing_wage
  description: 'APW [68]: prevailing ''value'' (''USD 116,979.00''; strip ''USD '' and commas) × unit
    factor of prevailing_wage.unit (Hour 2080, Week 52, Month 12, Year 1). USD per year.

    '
  sql_expression: wc.apw
  source_model: main.prevailing_wage
  from_sql: "(SELECT w.*,\n        (w.aow - w.apw) / w.apw AS whr,\n        100 * LEAST(GREATEST((w.aow\
    \ - w.apw) / w.apw, 0), 0.40) / 0.40 AS headroom_points,\n        CASE w.wage_level WHEN 'I' THEN\
    \ 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100 ELSE 50 END AS level_points,\n      \
    \  0.7 * (100 * LEAST(GREATEST((w.aow - w.apw) / w.apw, 0), 0.40) / 0.40)\n          + 0.3 * CASE\
    \ w.wage_level WHEN 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100 ELSE 50 END\
    \ AS cwas\n FROM (\n   SELECT c.filekey, c.homefirm, c.homezip, c.headct, c.statustag, c.soccd,\n\
    \          CAST(c.visacls AS TEXT) AS visa_class, cw.wsstate,\n          CAST(strptime(c.beginday,\
    \ '%d/%m/%Y') AS DATE) AS begin_date,\n          CAST(date_trunc('month', strptime(c.beginday, '%d/%m/%Y'))\
    \ AS DATE) AS start_month,\n          CAST(strptime(c.recvday, '%Y/%m/%d') AS DATE) AS received_date,\n\
    \          CAST(e.employer_contact_info->>'naics_code' AS BIGINT) AS naics_code,\n          pw.wage_details->'prevailing_wage'->>'level'\
    \ AS wage_level,\n          CAST(replace(replace(pw.wage_details->'offered_wage'->>'from', '$', ''),\
    \ ',', '') AS DOUBLE)\n            * CASE pw.wage_details->'offered_wage'->>'unit' WHEN 'Hour' THEN\
    \ 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS aow,\n          CAST(replace(replace(pw.wage_details->'prevailing_wage'->>'value',\
    \ 'USD ', ''), ',', '') AS DOUBLE)\n            * CASE pw.wage_details->'prevailing_wage'->>'unit'\
    \ WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN 1 END AS apw\n \
    \  FROM main.cases c\n   JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n   JOIN main.prevailing_wage\
    \ pw ON pw.trackno = cw.wagetrack\n   JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref\
    \ = c.homezip\n ) w) wc\n"
  grain: one row per case (case wage profile)
  domains:
  - wage_assurance
  - wages
- name: wage_headroom_ratio
  description: WHR [69] = (AOW − APW) / APW, a fraction (0.15 = 15% above), per case, unrounded.
  sql_expression: wc.whr
  source_model: main.prevailing_wage
  from_sql: "(SELECT w.*,\n        (w.aow - w.apw) / w.apw AS whr,\n        100 * LEAST(GREATEST((w.aow\
    \ - w.apw) / w.apw, 0), 0.40) / 0.40 AS headroom_points,\n        CASE w.wage_level WHEN 'I' THEN\
    \ 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100 ELSE 50 END AS level_points,\n      \
