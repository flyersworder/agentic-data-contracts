# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: labor_certification_applications, author: claudeopus5.5
metrics:
- name: approval_rate
  description: 'AR = (Number of Certified Applications / Total Number of Applications) x 100%. Certified
    = UPPER(statustag) = ''CERTIFIED'' (Certified-Withdrawn is not certified).

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE UPPER(c.statustag) = 'CERTIFIED') / NULLIF(COUNT(*),
    0)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_success_rate
  description: 'ASR by employer = (Certified Applications by Employer / Total Applications by Employer)
    x 100%. Use with GROUP BY c.homefirm.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE UPPER(c.statustag) = 'CERTIFIED') / NULLIF(COUNT(*),
    0)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_processing_time
  description: 'APT = number of days between the date the application is received (recvday) and the date
    a decision is made (decisionday). Per case.

    '
  sql_expression: date_diff('day', d.recv_date, d.decision_date)
  source_model: main.cases
  from_sql: "(\n  SELECT c.filekey, c.homefirm, c.statustag, CAST(c.visacls AS VARCHAR) AS visa_class,\n\
    \         CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday, '%Y-%m-%d'))\
    \ AS DATE) AS recv_date,\n         CAST(COALESCE(try_strptime(c.decisionday, '%Y-%m-%d'), try_strptime(c.decisionday,\
    \ '%Y/%m/%d')) AS DATE) AS decision_date,\n         CAST(try_strptime(c.beginday, '%d/%m/%Y') AS DATE)\
    \ AS begin_date\n  FROM main.cases c\n) d\n"
  grain: one row per case
  domains:
  - applications
- name: processing_efficiency_ratio
  description: 'PER = Average Processing Time / Application Processing Time, per case; values above 1
    indicate faster than average processing. Average is over all cases with a computable APT.

    '
  sql_expression: AVG(date_diff('day', d.recv_date, d.decision_date)) OVER () / NULLIF(date_diff('day',
    d.recv_date, d.decision_date), 0)
  source_model: main.cases
  from_sql: "(\n  SELECT c.filekey, c.homefirm, c.statustag, CAST(c.visacls AS VARCHAR) AS visa_class,\n\
    \         CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday, '%Y-%m-%d'))\
    \ AS DATE) AS recv_date,\n         CAST(COALESCE(try_strptime(c.decisionday, '%Y-%m-%d'), try_strptime(c.decisionday,\
    \ '%Y/%m/%d')) AS DATE) AS decision_date,\n         CAST(try_strptime(c.beginday, '%d/%m/%Y') AS DATE)\
    \ AS begin_date\n  FROM main.cases c\n) d\n"
  grain: one row per case
  domains:
  - applications
- name: seasonal_application_index
  description: 'SAI = Number of Applications in Month / Average Monthly Applications, by receipt month.
    Use with GROUP BY month(d.recv_date) (month of the year; add year(d.recv_date) to the grouping for
    calendar months).

    '
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: "(\n  SELECT c.filekey, c.homefirm, c.statustag, CAST(c.visacls AS VARCHAR) AS visa_class,\n\
    \         CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday, '%Y-%m-%d'))\
    \ AS DATE) AS recv_date,\n         CAST(COALESCE(try_strptime(c.decisionday, '%Y-%m-%d'), try_strptime(c.decisionday,\
    \ '%Y/%m/%d')) AS DATE) AS decision_date,\n         CAST(try_strptime(c.beginday, '%d/%m/%Y') AS DATE)\
    \ AS begin_date\n  FROM main.cases c\n) d\n"
  grain: one row per case
  domains:
  - applications
  - qualitative_categories
- name: visa_filing_window
  description: 'Category of receipt timing relative to employment start date (beginday): ''Optimal Window
    (4-6 Months)'' before start, ''Early Filing'' (more than 6 months before), ''1-3 Months Before'',
    ''Same Month'', or ''After Start Date''. Months are counted as calendar-month differences between
    receipt and begin date.

    '
  sql_expression: "CASE\n  WHEN d.recv_date IS NULL OR d.begin_date IS NULL THEN NULL\n  WHEN d.begin_date\
    \ < d.recv_date THEN 'After Start Date'\n  WHEN date_diff('month', d.recv_date, d.begin_date) = 0\
    \ THEN 'Same Month'\n  WHEN date_diff('month', d.recv_date, d.begin_date) BETWEEN 1 AND 3 THEN '1-3\
    \ Months Before'\n  WHEN date_diff('month', d.recv_date, d.begin_date) BETWEEN 4 AND 6 THEN 'Optimal\
    \ Window (4-6 Months)'\n  ELSE 'Early Filing'\nEND\n"
  source_model: main.cases
  from_sql: "(\n  SELECT c.filekey, c.homefirm, c.statustag, CAST(c.visacls AS VARCHAR) AS visa_class,\n\
    \         CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday, '%Y-%m-%d'))\
    \ AS DATE) AS recv_date,\n         CAST(COALESCE(try_strptime(c.decisionday, '%Y-%m-%d'), try_strptime(c.decisionday,\
    \ '%Y/%m/%d')) AS DATE) AS decision_date,\n         CAST(try_strptime(c.beginday, '%d/%m/%Y') AS DATE)\
    \ AS begin_date\n  FROM main.cases c\n) d\n"
  grain: one row per case
  domains:
  - applications
- name: employer_size_classification
  description: 'Small-scale users (fewer than 5 applications annually), Medium-scale (5-25), Large-scale
    (more than 25). Use with GROUP BY d.homefirm, year(d.recv_date) (year of receipt).

    '
  sql_expression: CASE WHEN COUNT(*) < 5 THEN 'Small-scale' WHEN COUNT(*) <= 25 THEN 'Medium-scale' ELSE
    'Large-scale' END
  source_model: main.cases
  from_sql: "(\n  SELECT c.filekey, c.homefirm, c.statustag, CAST(c.visacls AS VARCHAR) AS visa_class,\n\
    \         CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday, '%Y-%m-%d'))\
    \ AS DATE) AS recv_date,\n         CAST(COALESCE(try_strptime(c.decisionday, '%Y-%m-%d'), try_strptime(c.decisionday,\
    \ '%Y/%m/%d')) AS DATE) AS decision_date,\n         CAST(try_strptime(c.beginday, '%d/%m/%Y') AS DATE)\
    \ AS begin_date\n  FROM main.cases c\n) d\n"
  grain: one row per case
  domains:
  - applications
- name: continuous_filing_employer
  description: 'True when an employer submits applications in at least 9 months of the year. Use with
    GROUP BY d.homefirm, year(d.recv_date).

    '
  sql_expression: COUNT(DISTINCT month(d.recv_date)) >= 9
  source_model: main.cases
  from_sql: "(\n  SELECT c.filekey, c.homefirm, c.statustag, CAST(c.visacls AS VARCHAR) AS visa_class,\n\
    \         CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday, '%Y-%m-%d'))\
    \ AS DATE) AS recv_date,\n         CAST(COALESCE(try_strptime(c.decisionday, '%Y-%m-%d'), try_strptime(c.decisionday,\
    \ '%Y/%m/%d')) AS DATE) AS decision_date,\n         CAST(try_strptime(c.beginday, '%d/%m/%Y') AS DATE)\
    \ AS begin_date\n  FROM main.cases c\n) d\n"
  grain: one row per case
  domains:
  - applications
- name: visa_class_distribution
  description: VCD = Applications for Visa Class / Total Applications x 100%. Use with GROUP BY c.visacls.
  sql_expression: 100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: employer_h1b_concentration
  description: 'EHC = (H-1B Applications by Employer / Total H-1B Applications) x 100%. Use with GROUP
    BY c.homefirm.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE CAST(c.visacls AS VARCHAR) = 'H-1B') / NULLIF(SUM(COUNT(*)
    FILTER (WHERE CAST(c.visacls AS VARCHAR) = 'H-1B')) OVER (), 0)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: employer_scale_indicator
  description: ESI = Employer Number of Applications / Average Applications per Employer. Use with GROUP
    BY c.homefirm.
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: employer_retention_rate
  description: 'ERR = (Continuation Applications / Total Applications by Employer) x 100%. A continuation
    application is a case with contemp (continued employment positions) > 0. Use with GROUP BY c.homefirm.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE c.contemp > 0) / NULLIF(COUNT(*), 0)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_complexity_factor_count
  description: 'Application Complexity Score (ACS): a weighted sum of binary factors — H-1B dependency
    (h1bdep=''Yes''), willful violator (willfulv=''Yes''), new employment (newemp > 0) and amendment (amendflag
    > 0). The documentation gives no weights, so this counts the factors with weight 1 each (0-4).

    '
  sql_expression: "(CASE WHEN CAST(c.h1bdep AS VARCHAR) = 'Yes' THEN 1 ELSE 0 END\n + CASE WHEN CAST(c.willfulv\
    \ AS VARCHAR) = 'Yes' THEN 1 ELSE 0 END\n + CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END\n + CASE WHEN\
    \ c.amendflag > 0 THEN 1 ELSE 0 END)\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_delay_risk_profile
  description: 'Low Risk (no special factors), Moderate Risk (1-2 complexity factors), High Risk (3 or
    more complexity factors or from willful violators), based on the ACS factors.

    '
  sql_expression: "CASE\n  WHEN CAST(c.willfulv AS VARCHAR) = 'Yes'\n    OR (CASE WHEN CAST(c.h1bdep AS\
    \ VARCHAR) = 'Yes' THEN 1 ELSE 0 END\n        + CASE WHEN CAST(c.willfulv AS VARCHAR) = 'Yes' THEN\
    \ 1 ELSE 0 END\n        + CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END\n        + CASE WHEN c.amendflag\
    \ > 0 THEN 1 ELSE 0 END) >= 3 THEN 'High Risk'\n  WHEN (CASE WHEN CAST(c.h1bdep AS VARCHAR) = 'Yes'\
    \ THEN 1 ELSE 0 END\n        + CASE WHEN c.newemp > 0 THEN 1 ELSE 0 END\n        + CASE WHEN c.amendflag\
    \ > 0 THEN 1 ELSE 0 END) >= 1 THEN 'Moderate Risk'\n  ELSE 'Low Risk'\nEND\n"
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: application_complexity_tier
  description: 'Standard (straightforward) or Complex (cases involving H-1B dependency, willful violator
    status, or special attestations). Special attestations are not recorded separately, so Complex is
    decided by h1bdep or willfulv = ''Yes''.

    '
  sql_expression: CASE WHEN CAST(c.h1bdep AS VARCHAR) = 'Yes' OR CAST(c.willfulv AS VARCHAR) = 'Yes' THEN
    'Complex' ELSE 'Standard' END
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - applications
- name: attorney_case_load
  description: ACL = total number of cases handled by each attorney. Use with GROUP BY ca.counselmail.
  sql_expression: COUNT(DISTINCT ca.docketkey)
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_success_rate
  description: 'ASR_Attorney = (Certified Applications by Attorney / Total Applications by Attorney) x
    100%. Use with GROUP BY ca.counselmail.

    '
  sql_expression: 100.0 * COUNT(DISTINCT c.filekey) FILTER (WHERE UPPER(c.statustag) = 'CERTIFIED') /
    NULLIF(COUNT(DISTINCT c.filekey), 0)
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_performance_rating
  description: 'High Performers (over 95% approval rate), Standard Performers (85-95%), Underperformers
    (below 85%). Use with GROUP BY ca.counselmail.

    '
  sql_expression: "CASE\n  WHEN 100.0 * COUNT(DISTINCT c.filekey) FILTER (WHERE UPPER(c.statustag) = 'CERTIFIED')\
    \ / NULLIF(COUNT(DISTINCT c.filekey), 0) > 95 THEN 'High Performer'\n  WHEN 100.0 * COUNT(DISTINCT\
    \ c.filekey) FILTER (WHERE UPPER(c.statustag) = 'CERTIFIED') / NULLIF(COUNT(DISTINCT c.filekey), 0)\
    \ >= 85 THEN 'Standard Performer'\n  ELSE 'Underperformer'\nEND\n"
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_specialization_index
  description: 'ASI = 1 - (Different Visa Types Handled by Attorney / Total Number of Visa Types), total
    = 4 (H-1B, H-1B1 Chile, H-1B1 Singapore, E-3 Australian); closer to 1 = more specialized. Use with
    GROUP BY ca.counselmail.

    '
  sql_expression: 1 - COUNT(DISTINCT c.visacls) / 4.0
  source_model: main.case_attorney
  from_sql: main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey
  grain: one row per (case, attorney)
  domains:
  - attorneys
- name: attorney_top_visa_class_share
  description: 'Share of an attorney''s cases in their most frequent visa class. Specialist when > 0.80
    (over 80% of cases in one visa type); Generalists (even distribution across visa types) and Hybrid
    Practitioners (significant experience in 2-3 visa categories) have no numeric threshold — judge them
    from this share and the number of visa classes handled. Use with GROUP BY av.counselmail.

    '
  sql_expression: MAX(av.n) * 1.0 / SUM(av.n)
  source_model: main.case_attorney
  from_sql: "(\n  SELECT ca.counselmail, CAST(c.visacls AS VARCHAR) AS visa_class, COUNT(DISTINCT c.filekey)\
    \ AS n\n  FROM main.case_attorney ca JOIN main.cases c ON c.filekey = ca.docketkey\n  GROUP BY ca.counselmail,\
    \ CAST(c.visacls AS VARCHAR)\n) av\n"
  grain: one row per (attorney, visa class)
  domains:
  - attorneys
- name: external_counsel_rate
  description: 'ECR = (Applications with Attorney / Total Applications) x 100%. A case has an attorney
    when it has at least one case_attorney row.

    '
  sql_expression: 100.0 * COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL) / NULLIF(COUNT(*), 0)
  source_model: main.cases
  from_sql: main.cases c LEFT JOIN (SELECT DISTINCT docketkey FROM main.case_attorney) ca ON ca.docketkey
    = c.filekey
  grain: one row per case
  domains:
  - attorneys
- name: legal_representation_approval_gap
  description: 'Approval rate of attorney-represented applications minus approval rate of those without,
    in percentage points.

    '
  sql_expression: '100.0 * COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL AND UPPER(c.statustag) = ''CERTIFIED'')
    / NULLIF(COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL), 0)

    - 100.0 * COUNT(*) FILTER (WHERE ca.docketkey IS NULL AND UPPER(c.statustag) = ''CERTIFIED'') / NULLIF(COUNT(*)
    FILTER (WHERE ca.docketkey IS NULL), 0)

    '
  source_model: main.cases
  from_sql: main.cases c LEFT JOIN (SELECT DISTINCT docketkey FROM main.case_attorney) ca ON ca.docketkey
    = c.filekey
  grain: one row per case
  domains:
  - attorneys
- name: legal_representation_efficacy
  description: 'High Impact when represented approval rate is over 10 points higher, Moderate Impact 5-10
    higher, Minimal Impact less than 5 points difference (absolute). A gap below -5 is unclassified (NULL).
    NULL also when one group is empty.

    '
  sql_expression: "CASE\n  WHEN g.gap > 10 THEN 'High Impact'\n  WHEN g.gap >= 5 THEN 'Moderate Impact'\n\
    \  WHEN ABS(g.gap) < 5 THEN 'Minimal Impact'\nEND\n"
  source_model: main.cases
  from_sql: "(\n  SELECT 100.0 * COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL AND UPPER(c.statustag)\
    \ = 'CERTIFIED') / NULLIF(COUNT(*) FILTER (WHERE ca.docketkey IS NOT NULL), 0)\n       - 100.0 * COUNT(*)\
    \ FILTER (WHERE ca.docketkey IS NULL AND UPPER(c.statustag) = 'CERTIFIED') / NULLIF(COUNT(*) FILTER\
    \ (WHERE ca.docketkey IS NULL), 0) AS gap\n  FROM main.cases c LEFT JOIN (SELECT DISTINCT docketkey\
    \ FROM main.case_attorney) ca ON ca.docketkey = c.filekey\n) g\n"
  grain: one row overall
  domains:
  - attorneys
- name: worksite_density
  description: WD = Number of Workers at Worksite (sum of wsheads) / Number of Worksites (distinct addresses).
  sql_expression: SUM(cw.wsheads) * 1.0 / NULLIF(COUNT(DISTINCT cw.ws_addr1 || '|' || cw.wscity || '|'
    || cw.wsstate || '|' || cw.wszip), 0)
  source_model: main.case_worksite
  from_sql: main.case_worksite cw
  grain: one row per (case, worksite)
  domains:
  - worksites
- name: state_application_distribution
  description: SAD = Applications in State / Total Applications x 100%, state from case_worksite.wsstate.
    Use with GROUP BY cw.wsstate.
  sql_expression: 100.0 * COUNT(DISTINCT cw.dockkey) / (SELECT COUNT(*) FROM main.cases)
  source_model: main.case_worksite
  from_sql: main.case_worksite cw
  grain: one row per (case, worksite)
  domains:
  - worksites
- name: geographic_concentration_index
  description: GCI = sum((Applications in State i / Total Applications)^2) over all states.
  sql_expression: SUM(s.n * s.n) * 1.0 / POWER(SUM(s.n), 2)
  source_model: main.case_worksite
  from_sql: (SELECT cw.wsstate, COUNT(DISTINCT cw.dockkey) AS n FROM main.case_worksite cw GROUP BY cw.wsstate)
    s
  grain: one row per state
  domains:
  - worksites
- name: worksite_diversity_index
  description: 'WDI = 1 - sum((Workers at Worksite i / Total Workers)^2) over an employer''s worksites.
    Use with GROUP BY ew.homefirm.

    '
  sql_expression: 1 - SUM(ew.workers * ew.workers) * 1.0 / NULLIF(POWER(SUM(ew.workers), 2), 0)
  source_model: main.case_worksite
  from_sql: "(\n  SELECT c.homefirm, cw.ws_addr1, cw.wscity, cw.wsstate, cw.wszip, SUM(cw.wsheads) AS\
    \ workers\n  FROM main.cases c JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n  GROUP BY c.homefirm,\
    \ cw.ws_addr1, cw.wscity, cw.wsstate, cw.wszip\n) ew\n"
  grain: one row per (employer, worksite)
  domains:
  - worksites
- name: industry_application_distribution
  description: IAD = Applications in Industry / Total Applications x 100%, industry = employer NAICS.
    Use with GROUP BY json_extract_string(e.employer_contact_info, '$.naics_code').
  sql_expression: 100.0 * COUNT(*) / SUM(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c LEFT JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref = c.homezip
  grain: one row per case
  domains:
  - industry_occupation
- name: industry_concentration_ratio
  description: ICR = sum((Applications in Industry i / Total Applications)^2) over all NAICS industries.
  sql_expression: SUM(i.n * i.n) * 1.0 / POWER(SUM(i.n), 2)
  source_model: main.cases
  from_sql: "(\n  SELECT json_extract_string(e.employer_contact_info, '$.naics_code') AS naics_code, COUNT(*)\
    \ AS n\n  FROM main.cases c LEFT JOIN main.employer e ON e.corphandle = c.homefirm AND e.zipref =\
    \ c.homezip\n  GROUP BY 1\n) i\n"
  grain: one row per industry
  domains:
  - industry_occupation
- name: occupational_demand_index
  description: ODI = Applications for SOC Code / Average Applications per SOC Code. Use with GROUP BY
    c.soccd.
  sql_expression: COUNT(*) / AVG(COUNT(*)) OVER ()
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - industry_occupation
- name: annualized_offered_wage
  description: 'AOW: offered_wage.from with ''$'' and commas removed, read as a number (''to'' ignored),
    times the factor of offered_wage.unit (Hour 2080, Week 52, Month 12, Year 1). USD/year. E.g. hourly
    ''$41.00'' -> 85,280. Case reaches its wage record via its single case_worksite row and wagetrack
    = trackno.

    '
  sql_expression: w.aow
  source_model: main.prevailing_wage
  from_sql: "(\n  SELECT b.*, 0.7 * b.headroom_points + 0.3 * b.level_points AS cwas\n  FROM (\n    SELECT\
    \ a.*,\n           (a.aow - a.apw) / NULLIF(a.apw, 0) AS whr,\n           CASE WHEN (a.aow - a.apw)\
    \ / NULLIF(a.apw, 0) IS NULL THEN NULL\n                ELSE 100 * LEAST(GREATEST((a.aow - a.apw)\
    \ / NULLIF(a.apw, 0), 0), 0.40) / 0.40 END AS headroom_points,\n           CASE a.wage_level WHEN\
    \ 'I' THEN 25 WHEN 'II' THEN 50 WHEN 'III' THEN 75 WHEN 'IV' THEN 100 ELSE 50 END AS level_points\n\
    \    FROM (\n      SELECT c.filekey, c.homefirm, c.homezip, c.headct, c.soccd,\n             CAST(c.visacls\
    \ AS VARCHAR) AS visa_class,\n             date_trunc('month', try_strptime(c.beginday, '%d/%m/%Y'))\
    \ AS start_month,\n             CAST(COALESCE(try_strptime(c.recvday, '%Y/%m/%d'), try_strptime(c.recvday,\
    \ '%Y-%m-%d')) AS DATE) AS recv_date,\n             json_extract_string(e.employer_contact_info, '$.naics_code')\
    \ AS naics_code,\n             json_extract_string(pw.wage_details, '$.prevailing_wage.level') AS\
    \ wage_level,\n             TRY_CAST(replace(replace(trim(json_extract_string(pw.wage_details, '$.offered_wage.from')),\
    \ '$', ''), ',', '') AS DOUBLE)\n               * CASE json_extract_string(pw.wage_details, '$.offered_wage.unit')\n\
    \                   WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN\
    \ 1 END AS aow,\n             TRY_CAST(replace(replace(trim(json_extract_string(pw.wage_details, '$.prevailing_wage.value')),\
    \ 'USD ', ''), ',', '') AS DOUBLE)\n               * CASE json_extract_string(pw.wage_details, '$.prevailing_wage.unit')\n\
    \                   WHEN 'Hour' THEN 2080 WHEN 'Week' THEN 52 WHEN 'Month' THEN 12 WHEN 'Year' THEN\
    \ 1 END AS apw\n      FROM main.cases c\n      LEFT JOIN main.case_worksite cw ON cw.dockkey = c.filekey\n\
    \      LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n      LEFT JOIN main.employer\
    \ e ON e.corphandle = c.homefirm AND e.zipref = c.homezip\n    ) a\n  ) b\n) w\n"
  grain: one row per case
  domains:
  - wage_assurance
  - wages
- name: annualized_prevailing_wage
  description: 'APW: prevailing_wage.value with ''USD '' and commas removed, times the factor of prevailing_wage.unit
    (Hour 2080, Week 52, Month 12, Year 1). USD/year.

    '
  sql_expression: w.apw
  source_model: main.prevailing_wage
  from_sql: "(\n  SELECT b.*, 0.7 * b.headroom_points + 0.3 * b.level_points AS cwas\n  FROM (\n    SELECT\
    \ a.*,\n           (a.aow - a.apw) / NULLIF(a.apw, 0) AS whr,\n           CASE WHEN (a.aow - a.apw)\
    \ / NULLIF(a.apw, 0) IS NULL THEN NULL\n                ELSE 100 * LEAST(GREATEST((a.aow - a.apw)\
