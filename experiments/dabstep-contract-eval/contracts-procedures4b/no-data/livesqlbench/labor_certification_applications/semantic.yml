- name: employer_monthly_case_volume
  description: 'EMCV = number of cases of an employer (exact homefirm text) whose Start Month (year+month
    of beginday, DD/MM/YYYY) is the given month; every case row counts once, whatever status or headCt.
    GROUP BY c.homefirm, date_trunc(''month'', try_strptime(c.beginday, ''%d/%m/%Y'')).

    '
  sql_expression: COUNT(*)
  source_model: main.cases
  from_sql: main.cases c
  grain: one row per case
  domains:
  - review_effort
- name: monthly_volume_band
  description: 'The case''s band from its employer''s EMCV in its Start Month: ''1'' (EMCV=1), ''2-4'',
    ''5-14'', ''15+'' (EMCV>=15), inclusive ends.

    '
  sql_expression: crh.volume_band
  source_model: main.cases
  from_sql: "(\n  SELECT k.filekey, k.homefirm, k.headct, k.start_month, k.emcv, k.volume_band,\n    \
    \     k.visa_class, k.wage_level, k.h1b_dependent, k.soc_major_group, k.worksite_state,\n        \
    \ r.rule_id AS governing_rule_id,\n         COALESCE(r.base_hours, 3.50) AS base_hours,\n        \
    \ COALESCE(r.position_hours, 0.50) AS position_hours\n  FROM (\n    SELECT c.filekey, c.homefirm,\
    \ c.headct,\n           CAST(c.visacls AS VARCHAR) AS visa_class,\n           CAST(c.h1bdep AS VARCHAR)\
    \ AS h1b_dependent,\n           substr(c.soccd, 1, 2) AS soc_major_group,\n           cw.wsstate AS\
    \ worksite_state,\n           json_extract_string(pw.wage_details, '$.prevailing_wage.level') AS wage_level,\n\
    \           date_trunc('month', try_strptime(c.beginday, '%d/%m/%Y')) AS start_month,\n          \
    \ v.emcv,\n           CASE WHEN v.emcv = 1 THEN '1'\n                WHEN v.emcv BETWEEN 2 AND 4 THEN\
    \ '2-4'\n                WHEN v.emcv BETWEEN 5 AND 14 THEN '5-14'\n                WHEN v.emcv >=\
    \ 15 THEN '15+' END AS volume_band\n    FROM main.cases c\n    LEFT JOIN main.case_worksite cw ON\
    \ cw.dockkey = c.filekey\n    LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n   \
    \ LEFT JOIN (\n      SELECT c2.homefirm, date_trunc('month', try_strptime(c2.beginday, '%d/%m/%Y'))\
    \ AS sm, COUNT(*) AS emcv\n      FROM main.cases c2\n      GROUP BY c2.homefirm, date_trunc('month',\
    \ try_strptime(c2.beginday, '%d/%m/%Y'))\n    ) v ON v.homefirm = c.homefirm AND v.sm = date_trunc('month',\
    \ try_strptime(c.beginday, '%d/%m/%Y'))\n  ) k\n  LEFT JOIN main.review_schedule r\n    ON (r.visa_class\
    \ IS NULL OR r.visa_class = k.visa_class)\n   AND (r.wage_level IS NULL OR r.wage_level = k.wage_level)\n\
    \   AND (r.h1b_dependent IS NULL OR r.h1b_dependent = k.h1b_dependent)\n   AND (r.soc_major_group\
    \ IS NULL OR r.soc_major_group = k.soc_major_group)\n   AND (r.worksite_state IS NULL OR r.worksite_state\
    \ = k.worksite_state)\n   AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = k.volume_band)\n\
    \  QUALIFY ROW_NUMBER() OVER (\n    PARTITION BY k.filekey\n    ORDER BY (CASE WHEN r.visa_class IS\
    \ NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.wage_level IS NOT NULL THEN 1 ELSE 0 END\n\
    \            + CASE WHEN r.h1b_dependent IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.soc_major_group\
    \ IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.worksite_state IS NOT NULL THEN 1 ELSE\
    \ 0 END\n            + CASE WHEN r.monthly_volume_band IS NOT NULL THEN 1 ELSE 0 END) DESC,\n    \
    \         r.rule_id ASC) = 1\n) crh\n"
  grain: one row per case
  domains:
  - review_effort
- name: governing_review_rule
  description: 'rule_id of the case''s Governing Review Rule: among matching rules (every non-NULL criterion
    equals the case value as exact text; NULL criterion = wildcard; NULL case value matches only a NULL
    criterion), the one with the most non-NULL criteria, ties to lowest rule_id. NULL when no rule matches
    (Default Review Schedule 3.50 / 0.50 applies).

    '
  sql_expression: crh.governing_rule_id
  source_model: main.review_schedule
  from_sql: "(\n  SELECT k.filekey, k.homefirm, k.headct, k.start_month, k.emcv, k.volume_band,\n    \
    \     k.visa_class, k.wage_level, k.h1b_dependent, k.soc_major_group, k.worksite_state,\n        \
    \ r.rule_id AS governing_rule_id,\n         COALESCE(r.base_hours, 3.50) AS base_hours,\n        \
    \ COALESCE(r.position_hours, 0.50) AS position_hours\n  FROM (\n    SELECT c.filekey, c.homefirm,\
    \ c.headct,\n           CAST(c.visacls AS VARCHAR) AS visa_class,\n           CAST(c.h1bdep AS VARCHAR)\
    \ AS h1b_dependent,\n           substr(c.soccd, 1, 2) AS soc_major_group,\n           cw.wsstate AS\
    \ worksite_state,\n           json_extract_string(pw.wage_details, '$.prevailing_wage.level') AS wage_level,\n\
    \           date_trunc('month', try_strptime(c.beginday, '%d/%m/%Y')) AS start_month,\n          \
    \ v.emcv,\n           CASE WHEN v.emcv = 1 THEN '1'\n                WHEN v.emcv BETWEEN 2 AND 4 THEN\
    \ '2-4'\n                WHEN v.emcv BETWEEN 5 AND 14 THEN '5-14'\n                WHEN v.emcv >=\
    \ 15 THEN '15+' END AS volume_band\n    FROM main.cases c\n    LEFT JOIN main.case_worksite cw ON\
    \ cw.dockkey = c.filekey\n    LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n   \
    \ LEFT JOIN (\n      SELECT c2.homefirm, date_trunc('month', try_strptime(c2.beginday, '%d/%m/%Y'))\
    \ AS sm, COUNT(*) AS emcv\n      FROM main.cases c2\n      GROUP BY c2.homefirm, date_trunc('month',\
    \ try_strptime(c2.beginday, '%d/%m/%Y'))\n    ) v ON v.homefirm = c.homefirm AND v.sm = date_trunc('month',\
    \ try_strptime(c.beginday, '%d/%m/%Y'))\n  ) k\n  LEFT JOIN main.review_schedule r\n    ON (r.visa_class\
    \ IS NULL OR r.visa_class = k.visa_class)\n   AND (r.wage_level IS NULL OR r.wage_level = k.wage_level)\n\
    \   AND (r.h1b_dependent IS NULL OR r.h1b_dependent = k.h1b_dependent)\n   AND (r.soc_major_group\
    \ IS NULL OR r.soc_major_group = k.soc_major_group)\n   AND (r.worksite_state IS NULL OR r.worksite_state\
    \ = k.worksite_state)\n   AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = k.volume_band)\n\
    \  QUALIFY ROW_NUMBER() OVER (\n    PARTITION BY k.filekey\n    ORDER BY (CASE WHEN r.visa_class IS\
    \ NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.wage_level IS NOT NULL THEN 1 ELSE 0 END\n\
    \            + CASE WHEN r.h1b_dependent IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.soc_major_group\
    \ IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.worksite_state IS NOT NULL THEN 1 ELSE\
    \ 0 END\n            + CASE WHEN r.monthly_volume_band IS NOT NULL THEN 1 ELSE 0 END) DESC,\n    \
    \         r.rule_id ASC) = 1\n) crh\n"
  grain: one row per case
  domains:
  - review_effort
- name: case_review_hours
  description: 'CRH = base_hours + position_hours x headCt from the governing rule (or default 3.50 +
    0.50 x headCt). Reviewer-hours, exact to two decimals, not rounded before aggregation.

    '
  sql_expression: crh.base_hours + crh.position_hours * crh.headct
  source_model: main.cases
  from_sql: "(\n  SELECT k.filekey, k.homefirm, k.headct, k.start_month, k.emcv, k.volume_band,\n    \
    \     k.visa_class, k.wage_level, k.h1b_dependent, k.soc_major_group, k.worksite_state,\n        \
    \ r.rule_id AS governing_rule_id,\n         COALESCE(r.base_hours, 3.50) AS base_hours,\n        \
    \ COALESCE(r.position_hours, 0.50) AS position_hours\n  FROM (\n    SELECT c.filekey, c.homefirm,\
    \ c.headct,\n           CAST(c.visacls AS VARCHAR) AS visa_class,\n           CAST(c.h1bdep AS VARCHAR)\
    \ AS h1b_dependent,\n           substr(c.soccd, 1, 2) AS soc_major_group,\n           cw.wsstate AS\
    \ worksite_state,\n           json_extract_string(pw.wage_details, '$.prevailing_wage.level') AS wage_level,\n\
    \           date_trunc('month', try_strptime(c.beginday, '%d/%m/%Y')) AS start_month,\n          \
    \ v.emcv,\n           CASE WHEN v.emcv = 1 THEN '1'\n                WHEN v.emcv BETWEEN 2 AND 4 THEN\
    \ '2-4'\n                WHEN v.emcv BETWEEN 5 AND 14 THEN '5-14'\n                WHEN v.emcv >=\
    \ 15 THEN '15+' END AS volume_band\n    FROM main.cases c\n    LEFT JOIN main.case_worksite cw ON\
    \ cw.dockkey = c.filekey\n    LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n   \
    \ LEFT JOIN (\n      SELECT c2.homefirm, date_trunc('month', try_strptime(c2.beginday, '%d/%m/%Y'))\
    \ AS sm, COUNT(*) AS emcv\n      FROM main.cases c2\n      GROUP BY c2.homefirm, date_trunc('month',\
    \ try_strptime(c2.beginday, '%d/%m/%Y'))\n    ) v ON v.homefirm = c.homefirm AND v.sm = date_trunc('month',\
    \ try_strptime(c.beginday, '%d/%m/%Y'))\n  ) k\n  LEFT JOIN main.review_schedule r\n    ON (r.visa_class\
    \ IS NULL OR r.visa_class = k.visa_class)\n   AND (r.wage_level IS NULL OR r.wage_level = k.wage_level)\n\
    \   AND (r.h1b_dependent IS NULL OR r.h1b_dependent = k.h1b_dependent)\n   AND (r.soc_major_group\
    \ IS NULL OR r.soc_major_group = k.soc_major_group)\n   AND (r.worksite_state IS NULL OR r.worksite_state\
    \ = k.worksite_state)\n   AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = k.volume_band)\n\
    \  QUALIFY ROW_NUMBER() OVER (\n    PARTITION BY k.filekey\n    ORDER BY (CASE WHEN r.visa_class IS\
    \ NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.wage_level IS NOT NULL THEN 1 ELSE 0 END\n\
    \            + CASE WHEN r.h1b_dependent IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.soc_major_group\
    \ IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.worksite_state IS NOT NULL THEN 1 ELSE\
    \ 0 END\n            + CASE WHEN r.monthly_volume_band IS NOT NULL THEN 1 ELSE 0 END) DESC,\n    \
    \         r.rule_id ASC) = 1\n) crh\n"
  grain: one row per case
  domains:
  - review_effort
- name: employer_review_load
  description: 'ERL = sum of CRH over an employer''s (crh.homefirm, exact text) cases whose Start Month
    (crh.start_month) lies in the period: a calendar month, or a calendar year = all twelve Start Months.
    Round only when reporting.

    '
  sql_expression: SUM(crh.base_hours + crh.position_hours * crh.headct)
  source_model: main.cases
  from_sql: "(\n  SELECT k.filekey, k.homefirm, k.headct, k.start_month, k.emcv, k.volume_band,\n    \
    \     k.visa_class, k.wage_level, k.h1b_dependent, k.soc_major_group, k.worksite_state,\n        \
    \ r.rule_id AS governing_rule_id,\n         COALESCE(r.base_hours, 3.50) AS base_hours,\n        \
    \ COALESCE(r.position_hours, 0.50) AS position_hours\n  FROM (\n    SELECT c.filekey, c.homefirm,\
    \ c.headct,\n           CAST(c.visacls AS VARCHAR) AS visa_class,\n           CAST(c.h1bdep AS VARCHAR)\
    \ AS h1b_dependent,\n           substr(c.soccd, 1, 2) AS soc_major_group,\n           cw.wsstate AS\
    \ worksite_state,\n           json_extract_string(pw.wage_details, '$.prevailing_wage.level') AS wage_level,\n\
    \           date_trunc('month', try_strptime(c.beginday, '%d/%m/%Y')) AS start_month,\n          \
    \ v.emcv,\n           CASE WHEN v.emcv = 1 THEN '1'\n                WHEN v.emcv BETWEEN 2 AND 4 THEN\
    \ '2-4'\n                WHEN v.emcv BETWEEN 5 AND 14 THEN '5-14'\n                WHEN v.emcv >=\
    \ 15 THEN '15+' END AS volume_band\n    FROM main.cases c\n    LEFT JOIN main.case_worksite cw ON\
    \ cw.dockkey = c.filekey\n    LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n   \
    \ LEFT JOIN (\n      SELECT c2.homefirm, date_trunc('month', try_strptime(c2.beginday, '%d/%m/%Y'))\
    \ AS sm, COUNT(*) AS emcv\n      FROM main.cases c2\n      GROUP BY c2.homefirm, date_trunc('month',\
    \ try_strptime(c2.beginday, '%d/%m/%Y'))\n    ) v ON v.homefirm = c.homefirm AND v.sm = date_trunc('month',\
    \ try_strptime(c.beginday, '%d/%m/%Y'))\n  ) k\n  LEFT JOIN main.review_schedule r\n    ON (r.visa_class\
    \ IS NULL OR r.visa_class = k.visa_class)\n   AND (r.wage_level IS NULL OR r.wage_level = k.wage_level)\n\
    \   AND (r.h1b_dependent IS NULL OR r.h1b_dependent = k.h1b_dependent)\n   AND (r.soc_major_group\
    \ IS NULL OR r.soc_major_group = k.soc_major_group)\n   AND (r.worksite_state IS NULL OR r.worksite_state\
    \ = k.worksite_state)\n   AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = k.volume_band)\n\
    \  QUALIFY ROW_NUMBER() OVER (\n    PARTITION BY k.filekey\n    ORDER BY (CASE WHEN r.visa_class IS\
    \ NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.wage_level IS NOT NULL THEN 1 ELSE 0 END\n\
    \            + CASE WHEN r.h1b_dependent IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.soc_major_group\
    \ IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.worksite_state IS NOT NULL THEN 1 ELSE\
    \ 0 END\n            + CASE WHEN r.monthly_volume_band IS NOT NULL THEN 1 ELSE 0 END) DESC,\n    \
    \         r.rule_id ASC) = 1\n) crh\n"
  grain: one row per case
  domains:
  - review_effort
- name: average_case_review_hours
  description: Average CRH = sum of CRH / number of cases, over the chosen employer and period. Round
    only when reporting.
  sql_expression: SUM(crh.base_hours + crh.position_hours * crh.headct) / COUNT(*)
  source_model: main.cases
  from_sql: "(\n  SELECT k.filekey, k.homefirm, k.headct, k.start_month, k.emcv, k.volume_band,\n    \
    \     k.visa_class, k.wage_level, k.h1b_dependent, k.soc_major_group, k.worksite_state,\n        \
    \ r.rule_id AS governing_rule_id,\n         COALESCE(r.base_hours, 3.50) AS base_hours,\n        \
    \ COALESCE(r.position_hours, 0.50) AS position_hours\n  FROM (\n    SELECT c.filekey, c.homefirm,\
    \ c.headct,\n           CAST(c.visacls AS VARCHAR) AS visa_class,\n           CAST(c.h1bdep AS VARCHAR)\
    \ AS h1b_dependent,\n           substr(c.soccd, 1, 2) AS soc_major_group,\n           cw.wsstate AS\
    \ worksite_state,\n           json_extract_string(pw.wage_details, '$.prevailing_wage.level') AS wage_level,\n\
    \           date_trunc('month', try_strptime(c.beginday, '%d/%m/%Y')) AS start_month,\n          \
    \ v.emcv,\n           CASE WHEN v.emcv = 1 THEN '1'\n                WHEN v.emcv BETWEEN 2 AND 4 THEN\
    \ '2-4'\n                WHEN v.emcv BETWEEN 5 AND 14 THEN '5-14'\n                WHEN v.emcv >=\
    \ 15 THEN '15+' END AS volume_band\n    FROM main.cases c\n    LEFT JOIN main.case_worksite cw ON\
    \ cw.dockkey = c.filekey\n    LEFT JOIN main.prevailing_wage pw ON pw.trackno = cw.wagetrack\n   \
    \ LEFT JOIN (\n      SELECT c2.homefirm, date_trunc('month', try_strptime(c2.beginday, '%d/%m/%Y'))\
    \ AS sm, COUNT(*) AS emcv\n      FROM main.cases c2\n      GROUP BY c2.homefirm, date_trunc('month',\
    \ try_strptime(c2.beginday, '%d/%m/%Y'))\n    ) v ON v.homefirm = c.homefirm AND v.sm = date_trunc('month',\
    \ try_strptime(c.beginday, '%d/%m/%Y'))\n  ) k\n  LEFT JOIN main.review_schedule r\n    ON (r.visa_class\
    \ IS NULL OR r.visa_class = k.visa_class)\n   AND (r.wage_level IS NULL OR r.wage_level = k.wage_level)\n\
    \   AND (r.h1b_dependent IS NULL OR r.h1b_dependent = k.h1b_dependent)\n   AND (r.soc_major_group\
    \ IS NULL OR r.soc_major_group = k.soc_major_group)\n   AND (r.worksite_state IS NULL OR r.worksite_state\
    \ = k.worksite_state)\n   AND (r.monthly_volume_band IS NULL OR r.monthly_volume_band = k.volume_band)\n\
    \  QUALIFY ROW_NUMBER() OVER (\n    PARTITION BY k.filekey\n    ORDER BY (CASE WHEN r.visa_class IS\
    \ NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.wage_level IS NOT NULL THEN 1 ELSE 0 END\n\
    \            + CASE WHEN r.h1b_dependent IS NOT NULL THEN 1 ELSE 0 END\n            + CASE WHEN r.soc_major_group\
