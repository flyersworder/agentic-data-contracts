tables:
- schema: main
  table: cases
  description: One row per labor condition application (case).
  columns:
  - name: filekey
    description: Unique case number. PK.
  - name: statustag
    description: 'Case status. Categories: Certified (approved), Denied (rejected), Withdrawn (voluntarily
      withdrawn by applicant), Certified-Withdrawn (approved but later withdrawn). Stored as CERTIFIED/Certified/certified:
      compare with UPPER(statustag) = ''CERTIFIED''.'
  - name: recvday
    description: Date received, text like '2023/12/21'.
  - name: decisionday
    description: Decision date, text like '2023-12-29'. NULL = not provided.
  - name: origcertday
    description: Original certification date. NULL = not provided.
  - name: visacls
    description: 'Visa class: H-1B (specialty occupations requiring theoretical and practical application
      of specialized knowledge), H-1B1 Singapore (Singapore nationals in specialty occupations), H-1B1
      Chile (Chilean nationals in specialty occupations), E-3 Australian (Australian nationals in specialty
      occupations).'
  - name: jobtag
    description: Job title.
  - name: soccd
    description: SOC code, a standardized occupation classification (e.g. 15-1253.00 Software Quality
      Assurance Analysts and Testers, 29-1141.00 Registered Nurses) that ensures workers are properly
      classified and paid. First two characters = SOC major group.
  - name: soctitle
    description: SOC title.
  - name: fulltimeind
    description: 'Full-time indicator: Y/1 = full-time (typically at least 35 hours/week, may vary by
      employer), N/0 = not full-time (e.g. part-time).'
  - name: beginday
    description: Employment begin date, text DD/MM/YYYY ('01/04/2024' = 1 April 2024). Its year+month
      is the Start Month.
  - name: endday
    description: Employment end date (free text). NULL = not provided.
  - name: headct
    description: Total worker positions requested (headCt).
  - name: newemp
    description: New employment positions (ACS factor when > 0).
  - name: contemp
    description: Continued employment positions; > 0 marks a continuation application.
  - name: changeprev
    description: Change in previously approved employment.
  - name: concurrentlynew
    description: New concurrent employment.
  - name: changefirm
    description: Change of employer.
  - name: amendflag
    description: Amended petition (ACS factor when > 0).
  - name: siteslots
    description: Total worksite locations.
  - name: agreelc
    description: Agreement to labor condition statement.
  - name: h1bdep
    description: 'H-1B dependent employer (Yes/No): H-1B workers exceed 15% of workforce for >50 employees,
      8 workers for 26-50 employees, or 4 workers for <=25 employees; faces additional attestation requirements.'
  - name: willfulv
    description: 'Willful violator (Yes/No): found by DOL to have willfully failed LCA conditions or misrepresented
      material fact on an LCA within the past 5 years; additional attestation requirements similar to
      H-1B dependent.'
  - name: supporth
    description: Employer supports H-1B.
  - name: statbasis
    description: Statutory basis for exemption.
  - name: appa
    description: Appendix A attached.
  - name: pubdisc
    description: 'Public disclosure choice: ''Disclose Business'' = consents to public availability of
      business information; other options may restrict disclosure to protect confidential business information.'
  - name: homefirm
    description: Employer name; FK with homezip to employer(corphandle, zipref). For EMCV/ERL/EWAS the
      employer is this exact text.
  - name: homezip
    description: Employer postal code reference.
  - name: preplink
    description: Preparer email; FK to preparer.prepmail.
- schema: main
  table: employer
  description: Employers, keyed by (corphandle, zipref).
  columns:
  - name: corphandle
    description: Employer name/identifier.
  - name: zipref
    description: Employer postal code.
  - name: employer_contact_info
    description: 'JSON: address{line1,line2,city,state,zip,country,province}, phone{number,extension},
      naics_code (6-digit NAICS identifying the primary industry, e.g. 541511 Custom Computer Programming
      Services, 561320 Temporary Help Services; read with json_extract_string(employer_contact_info, ''$.naics_code'')),
      alternate_name.'
- schema: main
  table: employer_poc
  description: Employer points of contact.
  columns:
  - name: contactmail
    description: POC email. PK.
  - name: firmlink
    description: Employer corphandle.
  - name: firmzip
    description: Employer zipref.
  - name: poc_contact_info
    description: 'JSON: name{first,middle,last}, title, address{...}, phone{number,extension}.'
- schema: main
  table: preparer
  description: Application preparers.
  columns:
  - name: prepmail
    description: Preparer email. PK.
  - name: prepbiz
    description: Business name; NULL = none provided.
- schema: main
  table: case_attorney
  description: Attorney assignments to cases; a case with at least one row is attorney-represented, otherwise
    self-represented.
  columns:
  - name: docketkey
    description: Case number; FK to cases.filekey.
  - name: counselmail
    description: Attorney email; FK to attorney.lawmail.
  - name: counselfor
    description: Whether the attorney represents the employer (Yes/No).
- schema: main
  table: attorney
  description: Attorneys.
  columns:
  - name: lawmail
    description: Attorney email. PK.
  - name: attorney_profile
    description: 'JSON: name{first,middle,last}, address{...}, contact{phone,extension}, firm, highest_court{state,name}.'
- schema: main
  table: case_worksite
  description: Worksite(s) of a case; each case has a single row linking to its wage record.
  columns:
  - name: dockkey
    description: Case number; FK to cases.filekey.
  - name: wsstate
    description: Worksite state (review_schedule.worksite_state criterion; state for SAD/GCI).
  - name: wsheads
    description: Workers at the worksite.
  - name: wagetrack
    description: FK to prevailing_wage.trackno.
- schema: main
  table: worksite
  description: Worksite addresses.
  columns:
  - name: secent
    description: Secondary entity (Yes/No); NULL = not specified.
  - name: wcnty
    description: County; NULL = not specified.
- schema: main
  table: prevailing_wage
  description: Wage determination records.
  columns:
  - name: trackno
    description: Tracking number. PK.
  - name: wage_details
    description: 'JSON: offered_wage{from (text like ''$130000.00''), to (ignored), unit Hour/Week/Year};
      prevailing_wage{value (text like ''USD 116,979.00''), unit Hour/Week/Month/Year, level I (entry-level),
      II (qualified), III (experienced), IV (fully competent), oes_year}; alternate_source{source_type
      CBA/Survey, source_year, publisher, survey_title}. Acceptable sources: OES, Collective Bargaining
      Agreements, independent published wage surveys meeting DOL requirements. Units: Hour per working
      hour, Week weekly salary, Month monthly salary, Year annual salary.'
- schema: main
  table: review_schedule
  description: 'Case Review Effort Schedule: one rule per row with six criteria (NULL = wildcard) and
    two amounts. Default when no rule matches: base 3.50, position 0.50.'
  columns:
  - name: rule_id
    description: Rule identifier; lowest wins ties on specificity.
  - name: visa_class
    description: Matches cases.visacls exactly; NULL = any.
  - name: wage_level
    description: Matches prevailing_wage.level (I-IV); NULL = any.
  - name: h1b_dependent
    description: Matches cases.h1bdep; NULL = any.
  - name: soc_major_group
    description: Matches first two characters of cases.soccd; NULL = any.
  - name: worksite_state
    description: Matches case_worksite.wsstate; NULL = any.
  - name: monthly_volume_band
    description: Matches the case's Monthly Volume Band ('1','2-4','5-14','15+'); NULL = any.
  - name: base_hours
    description: Reviewer-hours charged once per case.
  - name: position_hours
    description: Reviewer-hours charged per worker position (headCt).
relationships:
- from: main.cases.filekey
  to: main.case_worksite.dockkey
  type: one_to_many
- from: main.case_worksite.wagetrack
  to: main.prevailing_wage.trackno
  type: many_to_one
- from: main.case_attorney.docketkey
  to: main.cases.filekey
  type: many_to_one
- from: main.case_attorney.counselmail
  to: main.attorney.lawmail
  type: many_to_one
- from: main.cases.preplink
  to: main.preparer.prepmail
  type: many_to_one
- from: main.cases.homefirm
  to: main.employer.corphandle
  type: many_to_one
  description: Join on homefirm = corphandle AND homezip = zipref.
