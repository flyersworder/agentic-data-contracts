    \ AS reputation_score,\n  r.risk_profile->>'$.risk_scores.threat_level' AS threat_level,\n  CAST(r.risk_profile->>'$.violation_history.abuse_count'\
    \ AS DOUBLE) AS abuse_count,\n  CAST(r.risk_profile->>'$.violation_history.warning_count' AS DOUBLE)\
    \ AS warning_count,\n  CAST(r.risk_profile->>'$.violation_history.suspension_history_json' AS DOUBLE)\
