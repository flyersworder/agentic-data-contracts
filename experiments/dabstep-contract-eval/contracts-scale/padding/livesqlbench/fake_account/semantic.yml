    \ AS tei,\n  0.4*(1 - x.content_uniqueness) + 0.3*x.media_reuse_rate + 0.3*(1 - x.txt_uniq) AS cms,\n\
    \  0.3*x.abuse_count/1000 + 0.4*x.impact_score + 0.3*x.risk_value AS mps,\n  srs*(1 + 0.2*x.country_count)\
    \ AS cpri,\n  0.5*pci + 0.5*cas_content AS ets,\n  0.7*(1 - cms) + 0.3*cas_content AS csi,\n  0.4*bbi\
    \ + 0.3*tei + 0.3*(1 - cas_content) AS abs_score,\n  0.5*tei + 0.3*(1 - pci) + 0.2*srs AS ars,\n \
    \ 0.4*bbi + 0.4*aaf + 0.2*ngv AS bas\nFROM (SELECT a.acct_ref, a.plt_key, a.StateFlag AS state_flag,\
    \ a.acct_form, a.AGE_D AS age_d,\n  a.ProfileScore AS profile_score,\n  CAST(s.session_telemetry->>'$.session_stats.session_count'\
    \ AS DOUBLE) AS session_count,\n  CAST(s.session_telemetry->>'$.ip_reputation.proxy_hits' AS DOUBLE)\
    \ AS proxy_hits,\n  CAST(s.session_telemetry->>'$.ip_reputation.country_count' AS DOUBLE) AS country_count,\n\
    \  CAST(replace(s.session_telemetry->>'$.vpn_usage_pct', '%', '') AS DOUBLE) / 100 AS vpn_ratio,\n\
    \  CAST(c.content_metrics->>'$.posting.posts_per_day' AS DOUBLE) AS posts_per_day,\n  CAST(c.content_metrics->>'$.content_quality.content_uniqueness'\
    \ AS DOUBLE) AS content_uniqueness,\n  CAST(c.content_metrics->>'$.link_media.media_reuse_rate' AS\
    \ DOUBLE) AS media_reuse_rate,\n  n.FollGrow AS foll_grow, n.FingGrow AS fing_grow, n.ConnQual AS\
    \ conn_qual, n.IntDiv AS int_div,\n  n.EngAuth AS eng_auth, n.TempIntPtn AS temp_int_ptn,\n  i.ConvNat\
    \ AS conv_nat, i.TxtUniq AS txt_uniq,\n  CAST(b.behavioral_anomaly_scores->>'$.automation_spam.bot_likelihood'\
    \ AS DOUBLE) AS bot_likelihood,\n  CAST(b.behavioral_anomaly_scores->>'$.automation_spam.automated_behavior'\
    \ AS DOUBLE) AS automated_behavior,\n  CAST(r.risk_profile->>'$.risk_scores.risk_value' AS DOUBLE)\
    \ AS risk_value,\n  CAST(r.risk_profile->>'$.risk_scores.trust_score' AS DOUBLE) AS trust_score,\n\
    \  CAST(r.risk_profile->>'$.risk_scores.impact_score' AS DOUBLE) AS impact_score,\n  CAST(r.risk_profile->>'$.risk_scores.authenticity_score'\
    \ AS DOUBLE) AS authenticity_score,\n  CAST(r.risk_profile->>'$.risk_scores.credibility_score' AS\
    \ DOUBLE) AS credibility_score,\n  CAST(r.risk_profile->>'$.risk_scores.reputation_score' AS DOUBLE)\
    \ AS reputation_score,\n  r.risk_profile->>'$.risk_scores.threat_level' AS threat_level,\n  CAST(r.risk_profile->>'$.violation_history.abuse_count'\
    \ AS DOUBLE) AS abuse_count,\n  CAST(r.risk_profile->>'$.violation_history.warning_count' AS DOUBLE)\
    \ AS warning_count,\n  CAST(r.risk_profile->>'$.violation_history.suspension_history_json' AS DOUBLE)\
