- name: bbi
  description: 'Bot Behavior Index: 0.4*bot likelihood + 0.3*automated behavior + 0.3*(1 - ConvNat). bot_likelihood
    is stored 0-1 (documented 0-100) and is NULL for 112 accounts, making BBI NULL there.

    '
  sql_expression: sc.bbi
  source_model: main.accounts
  grain: one row per account
  domains:
  - account_scores
  from_sql: "(SELECT x.*,\n  x.session_count / NULLIF(x.age_d, 0) AS aaf,\n  0.3*x.authenticity_score\
    \ + 0.3*x.content_uniqueness + 0.4*x.conv_nat AS cas_content,\n  sqrt(x.foll_grow*x.foll_grow + x.fing_grow*x.fing_grow)\
