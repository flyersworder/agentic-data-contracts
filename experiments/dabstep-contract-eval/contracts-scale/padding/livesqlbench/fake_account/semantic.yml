- name: cluster_member_count
  description: 'Member count: COUNT(DISTINCT account) per cluster identifier, where (for Amplification-Network
    reports) the cluster identifier is the accounts'' platform identifier a.plt_key. Filter to the candidate
    clusters first, then GROUP BY a.plt_key.

    '
  sql_expression: COUNT(DISTINCT a.acct_ref)
  source_model: main.accounts
  grain: one row per account-cluster membership, grouped by a.plt_key
  domains:
  - networks
  from_sql: main.accounts a JOIN main.account_clusters ac ON ac.acct_bridge = a.acct_ref JOIN main.cluster_analysis
    cl ON cl.CLSTR_PIN = ac.clu_ref
- name: cluster_max_coordination_score
  description: 'Maximum coordination score: highest CoordScore among the members of the identified cluster
    (GROUP BY a.plt_key).'
  sql_expression: MAX(cl.CoordScore)
  source_model: main.accounts
  grain: one row per account-cluster membership, grouped by a.plt_key
  domains:
  - networks
  from_sql: main.accounts a JOIN main.account_clusters ac ON ac.acct_bridge = a.acct_ref JOIN main.cluster_analysis
    cl ON cl.CLSTR_PIN = ac.clu_ref
- name: cluster_member_account_ids
  description: 'Member account IDs: array of the unique account ids in the identified cluster (GROUP BY
    a.plt_key).'
  sql_expression: list_sort(list(DISTINCT a.acct_ref))
  source_model: main.accounts
  grain: one row per account-cluster membership, grouped by a.plt_key
  domains:
  - networks
  from_sql: main.accounts a JOIN main.account_clusters ac ON ac.acct_bridge = a.acct_ref JOIN main.cluster_analysis
    cl ON cl.CLSTR_PIN = ac.clu_ref
- name: latest_bot_likelihood_score
  description: 'Latest Bot Likelihood Score: the bot likelihood recorded at the account''s most recent
    detection timestamp (monitoring.snap_ts). GROUP BY mo.acct_mon.'
  sql_expression: arg_max(CAST(b.behavioral_anomaly_scores->>'$.automation_spam.bot_likelihood' AS DOUBLE),
    mo.snap_ts)
  source_model: main.monitoring
  grain: one row per monitoring record, grouped by mo.acct_mon
  domains:
  - monitoring
  from_sql: main.monitoring mo JOIN main.behavioral_scores b ON b.acct_beh = mo.acct_mon
- name: last_activity_proxy_time
  description: 'Last activity proxy time: MAX(snap_ts) of the account''s security detection records. GROUP
    BY mo.acct_mon. Cast to VARCHAR when selecting it (tz-aware values cannot be fetched raw).'
  sql_expression: CAST(MAX(mo.snap_ts) AS VARCHAR)
  source_model: main.monitoring
  grain: one row per monitoring record, grouped by mo.acct_mon
  domains:
  - monitoring
  from_sql: main.monitoring mo
- name: is_account_inactive
  description: 'Account Inactivity: last activity proxy time MAX(snap_ts) < CURRENT_DATE - 90 days. GROUP
    BY mo.acct_mon.'
  sql_expression: (MAX(mo.snap_ts) < CURRENT_DATE - INTERVAL 90 DAY)
  source_model: main.monitoring
  grain: one row per monitoring record, grouped by mo.acct_mon
  domains:
  - monitoring
  from_sql: main.monitoring mo
tables:
- schema: main
  table: platforms
  columns:
  - name: PLT_CODE
    description: Unique platform code (PK), e.g. PL331.
  - name: PLT_KIND
    description: 'Platform type: Forum, Microblog, Social Network, Video Platform.'
- schema: main
  table: accounts
  columns:
  - name: acct_ref
    description: Unique account reference (PK), e.g. ACC7210284.
  - name: plt_key
    description: Platform code, FK to platforms. Serves as the cluster identifier in Amplification-Network
      grouping reports.
  - name: OrigStamp
    description: Account creation date. NULL means creation timestamp not provided.
  - name: AGE_D
    description: Account age in days (AAF denominator).
  - name: StateFlag
    description: 'Account status: Active, Deleted, Dormant, Suspended. ''Dormant'' = Dormant Bot.'
  - name: acct_form
    description: 'Account type: Bot, Business, Hybrid, Personal.'
  - name: VerifyMark
    description: 'Verification status: Failed, Pending, Suspicious, Unverified.'
  - name: ProfileScore
    description: Profile score, used as profile completeness in PCI. 0-1; > 0.8 well-maintained profile,
      < 0.4 placeholder or abandoned.
- schema: main
  table: profiles
  columns:
  - name: acct_anchor
    description: Account reference (PK, FK to accounts).
  - name: HandleMask
    description: 'Handle pattern: Natural, Random, Sequential, Template.'
  - name: usrn_Ent
    description: Username entropy value.
  - name: USR_LEN
    description: Username length.
  - name: UsrPtn
    description: 'Username pattern: AlphaNum, Generated, Meaningful, Random.'
  - name: DispChg
    description: Display-name change count. NULL means not recorded.
  - name: pic_form
    description: 'Profile picture type: AI Generated, Celebrity, Real, Stock. NULL means not specified.'
  - name: PicScore
    description: Profile picture score.
  - name: BIO_L
    description: Bio length.
  - name: BioLang
    description: 'Bio language: en, mixed, multiple, unknown.'
  - name: BioLinks
    description: Number of bio links (0-5).
  - name: BioKwHit
    description: 'Bio keyword hits: Normal, Promo, Spam, Suspicious. NULL means not counted.'
  - name: LocFlag
    description: 'Location flag: Fake, Multiple, No, Yes.'
  - name: LOC_MOV
    description: Location movement count.
  - name: mail_dom
    description: 'Email domain type: Custom, Disposable, Free, Unknown.'
  - name: TelState
    description: 'Telephone state: Invalid, VOIP, Valid. NULL means not recorded.'
- schema: main
  table: security_sessions
  columns:
  - name: acct_gate
    description: Account reference (PK, FK to accounts).
  - name: session_telemetry
    description: 'JSON. Paths (read with ->> then CAST): $.ip_reputation.{registration_ip, ip_reputation_score
      (0-1; > 0.8 trusted IPs, < 0.3 potentially malicious/compromised), country_count (login country
      count, 1-20), proxy_hits (proxy count, 0-100, NULL for 106 accounts = not recorded), tor_flag (No,
      Suspected, Yes)}; $.vpn_usage_pct (text ''0.00%''-''1.00%''; VPN ratio = stripped number / 100);
      $.device_profile.{device_count, device_mix_json, browser_diversity_idx, ua_consistency}; $.login_behavior.{login_chronology
      (Bot-like, Burst, Random, Regular; NULL = not available), login_freq_per_day (High, Low, Medium,
      Suspicious), location_variability}; $.session_stats.{avg_session_duration_min, session_count (max
      1000)}; $.activity_pattern.{activity_regularity, activity_spread_code (text of a Morning/Afternoon/Night
      dict)}.

      '
- schema: main
  table: content_activity
  columns:
  - name: acct_slot
    description: Account reference (PK, FK to accounts).
  - name: content_metrics
    description: 'JSON. $.posting.{total_posts, posts_per_day (posting frequency; NULL for 100 accounts),
      post_gap_variability}; $.content_quality.{content_similarity, content_uniqueness (0-1; > 0.8 highly
      unique, < 0.3 duplicate or templated), content_diversity, topic_entropy}; $.language_tags.{language_count
      (1-5), hashtag_pattern (Normal, Random, Spam, Trending), hashtag_ratio, mention_pattern (Normal,
      Random, Spam, Targeted), mention_ratio (text like ''0.40%'')}; $.link_media.{url_freq (NULL = not
      recorded), url_diversity, media_upload_rate, media_reuse_rate (media reuse ratio, 0-1, NULL = not
      recorded)}.

      '
- schema: main
  table: network_metrics
  columns:
  - name: acct_node
    description: Account reference (PK, FK to accounts).
  - name: FollowNum
    description: Number of followers.
  - name: FollowgNum
    description: Number of followees.
  - name: FollGrow
    description: Follower growth rate (NGV component).
  - name: FingGrow
    description: Following growth rate (NGV component).
  - name: FollRatio
    description: Follower-followee ratio.
  - name: MutConn
    description: Mutual connections score.
  - name: ConnGrowPtn
    description: 'Connection growth pattern: Bot-like, Burst, Organic, Suspicious.'
  - name: ConnQual
    description: Connection quality score (NIC component).
  - name: EngRate
    description: Engagement rate.
  - name: EngAuth
    description: Engagement authenticity score, 0-1; > 0.9 highly authentic, < 0.4 artificial or automated.
      < 0.3 with TempIntPtn='Automated' = Engagement Manipulator.
  - name: LikeRt
    description: Like rate score.
  - name: ComRt
    description: Comment rate score. NULL means not recorded.
  - name: ShareRt
    description: Share rate score.
  - name: IntRecip
    description: Interaction reciprocity score.
  - name: IntDiv
    description: Interaction diversity score (NIC component).
  - name: TempIntPtn
    description: 'Temporal interaction pattern: Automated, Natural, Periodic, Random.'
- schema: main
  table: interaction_metrics
  columns:
  - name: acct_dm
    description: Account reference (PK, FK to accounts).
  - name: MsgSim
    description: Message similarity score.
  - name: MsgFreq
    description: Message frequency.
  - name: MsgTargetDiv
    description: Message target diversity.
  - name: RespTimePtn
    description: 'Response time pattern: Delayed, Instant, Natural, Random. NULL means not recorded.'
  - name: ConvNat
    description: Conversation naturalness value, 0-1; > 0.7 natural human conversation, < 0.3 automated
      or scripted. Used in CAS (content) and BBI.
  - name: SentVar
    description: Sentiment variance score.
  - name: LangSoph
    description: Language sophistication score.
  - name: TxtUniq
    description: Text uniqueness score (CMS component).
  - name: KeyPtnHit
    description: Key pattern hit score. NULL means not recorded.
  - name: TopCoh
    description: Topic coherence score.
- schema: main
  table: behavioral_scores
  columns:
  - name: acct_beh
    description: Account reference (PK, FK to accounts).
  - name: behavioral_anomaly_scores
    description: 'JSON. $.automation_spam.{automated_behavior, bot_likelihood (documented 0-100 with >
      70 strongly bot and < 20 human-like, but STORED 0-1 — use 0.70 / 0.20; NULL for 112 accounts = not
      calculated), spam_score}; $.commercial_intent_score (NULL = not recorded); $.pattern_scores.{behavior_pattern,
      temporal_pattern (NULL = not recorded), network_pattern, content_pattern, profile_pattern, technical_pattern}.

      '
- schema: main
  table: risk_and_moderation
  columns:
  - name: acct_risk
    description: Account reference (PK, FK to accounts).
  - name: risk_profile
    description: 'JSON. $.risk_scores.{risk_value (NULL = not assigned), threat_level (Critical, High,
      Low, Medium), authenticity_score, credibility_score, reputation_score (0-1), trust_score (trust
      value, 0-1; > 0.7 highly trusted, < 0.3 untrusted or suspicious), impact_score (impact value, 0-1;
      > 0.7 high-impact violations requiring immediate attention, < 0.3 low-priority)}; $.violation_history.{abuse_count
      (abuse report count, 0-100), violation_distribution_json (Fake/Spam/Abuse dict), suspension_history_json
      (an integer 0-5: suspension history count), warning_count (0-10), appeal_count (0-5)}.

      '
- schema: main
  table: account_clusters
  columns:
  - name: acct_bridge
    description: Account reference (FK to accounts). Accounts belong to 1-3 clusters.
  - name: clu_ref
    description: Cluster reference (FK to cluster_analysis).
- schema: main
  table: cluster_analysis
  columns:
  - name: CLSTR_PIN
    description: Unique cluster identifier (PK).
  - name: ClusterQty
    description: Number of accounts in the cluster (cluster size, 5-15); equals its account_clusters row
      count.
  - name: CluRole
    description: 'Cluster role: Botnet, Community, InfluenceNetwork, SocialGroup, SpamRing (no ''Amplifier'').'
  - name: NetInfl
    description: Network influence score (NIC component).
  - name: CoordScore
    description: Coordination score, 0-1; > 0.7 strongly indicates coordinated behavior, < 0.2 independent
      actions.
- schema: main
  table: monitoring
  columns:
  - name: RecKey
    description: Monitoring (security detection) record key (PK).
  - name: snap_ts
    description: Detection snapshot timestamp (TIMESTAMPTZ; cast to VARCHAR to display). NULL means not
      recorded.
  - name: acct_mon
    description: Account reference (FK to accounts); one row per account in this data.
  - name: DetectSrc
    description: 'Detection source: Algorithm, Manual Review, Pattern Match, User Report.'
  - name: DetectConf
    description: Detection confidence (detection score), 0-1; > 0.8 high-confidence detection, < 0.3 uncertain,
      requiring manual review. NULL means not recorded.
  - name: MonPrio
    description: 'Monitoring priority: High, Low, Medium, Urgent.'
  - name: InvestState
    description: 'Investigation state: Active, Completed, Pending. ''Active'' = active security detection.'
  - name: ActionDone
    description: 'Action taken: Restriction, Suspension, Warning. NULL means no action recorded.'
  - name: RevFreq
    description: 'Review frequency: Daily, Monthly, Quarterly, Weekly.'
  - name: LastRev
    description: Last review date.
  - name: NextRev
    description: Next review date.
  - name: ConfScore
    description: Confidence score. NULL means not assigned.
  - name: FPP
    description: False positive probability.
  - name: MethRel
    description: Method reliability score.
  - name: ModelVer
    description: Model version used, e.g. v1.5.
  - name: FeatVer
    description: Feature version used, e.g. f1.7.
  - name: LastUp
    description: Last update timestamp (TIMESTAMPTZ).
  - name: UpFreqH
    description: Update frequency in hours.
