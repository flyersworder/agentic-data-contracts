  source_model: main.account_clusters
  grain: one row per account-cluster membership (account_clusters row)
  domains:
  - account_patterns
  from_sql: "(SELECT sc.*, cl.CLSTR_PIN AS cluster_id, cl.ClusterQty AS cluster_size, cl.CluRole AS cluster_role,\n\
    \  cl.NetInfl AS net_infl, cl.CoordScore AS coord_score,\n  0.4*sc.conn_qual + 0.3*cl.NetInfl + 0.3*sc.int_div\
    \ AS nic,\n  0.5*cl.CoordScore + 0.3*nic + 0.2*cl.ClusterQty AS coord_cas,\n  0.6*sc.bbi + 0.4*coord_cas\
    \ AS nmi,\n  sc.bbi*coord_cas*cl.ClusterQty AS cbr,\n  sc.pci*(1 - sc.ngv)*(1 - cbr) AS nts,\n  sc.cms*sc.mps*nic\
    \ AS cis\nFROM (SELECT x.*,\n  x.session_count / NULLIF(x.age_d, 0) AS aaf,\n  0.3*x.authenticity_score\
    \ + 0.3*x.content_uniqueness + 0.4*x.conv_nat AS cas_content,\n  sqrt(x.foll_grow*x.foll_grow + x.fing_grow*x.fing_grow)\
    \ AS ngv,\n  0.4*x.bot_likelihood + 0.3*x.automated_behavior + 0.3*(1 - x.conv_nat) AS bbi,\n  0.4*x.risk_value\
    \ + 0.3*(1 - x.trust_score) + 0.3*x.impact_score AS srs,\n  0.3*x.credibility_score + 0.3*x.reputation_score\
    \ + 0.4*x.profile_score AS pci,\n  0.4*x.vpn_ratio + 0.3*x.proxy_hits/10 + 0.3*x.country_count/20\
    \ AS tei,\n  0.4*(1 - x.content_uniqueness) + 0.3*x.media_reuse_rate + 0.3*(1 - x.txt_uniq) AS cms,\n\
    \  0.3*x.abuse_count/1000 + 0.4*x.impact_score + 0.3*x.risk_value AS mps,\n  srs*(1 + 0.2*x.country_count)\
