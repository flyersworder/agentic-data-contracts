# Authored by dce.author -- do not edit; re-author instead.
# benchmark: livesqlbench, database: insider_trading, author: claudeopus5.5
metrics:
- name: account_balance
  description: 'Trader account balance in USD parsed from traders.trader_fin_data->>''usd_bal'', stored
    as text like ''$4,692,991 '' ($, commas, trailing space).

    '
  sql_expression: CAST(regexp_replace(tr.trader_fin_data->>'usd_bal', '[$, ]', '', 'g') AS DOUBLE)
  source_model: main.traders
  from_sql: main.traders tr
  grain: one row per trader
  domains:
  - data_formats
- name: daily_turnover_rate
  description: 'Daily Turnover Rate (DTR): ratio of a trader''s daily trading volume to their account
    balance, indicating capital velocity. DTR = Daily Trading Volume / Account Balance = trade_records.vol_day
    / parsed usd_bal. Note: the stored text column trade_records.bal_turnover (''2.69 times/day'') does
    NOT equal this formula in the data; use this metric for DTR. Record-level join used by most metrics:
    trade_records t, traders tr, and LEFT JOINs of every per-record table on the record key plus trader_relationships
    rel on the trader.

    '
  sql_expression: t.vol_day / NULLIF(CAST(regexp_replace(tr.trader_fin_data->>'usd_bal', '[$, ]', '',
    'g') AS DOUBLE), 0)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - trading_behaviour
- name: order_modification_intensity
  description: 'Order Modification Intensity (OMI): how frequently a trader modifies orders relative to
    their cancellation rate. OMI = mod_freq / (1 - cancel_pct), undefined (NULL) if cancellation percentage
    is 1. Fields from order_behaviour.order_metrics (cancel_pct is a 0..1 fraction, NULL when not computed).
    Observed max OMI is ~0.71.

    '
  sql_expression: CAST(ob.order_metrics->>'mod_freq' AS DOUBLE) / NULLIF(1 - CAST(ob.order_metrics->>'cancel_pct'
    AS DOUBLE), 0)
  source_model: main.order_behaviour
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - trading_behaviour
- name: trader_leverage_exposure
  description: 'Trader Leverage Exposure (TLE): the trader''s leverage ratio from performance data, trade_records.trade_perf->>''lev_ratio''
    (NULL for 400 records).

    '
  sql_expression: CAST(t.trade_perf->>'lev_ratio' AS DOUBLE)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - trading_behaviour
- name: suspicious_activity_index
  description: 'Suspicious Activity Index (SAI): composite index quantifying overall suspicious trading
    behaviour as a weighted sum of normalized risk indicators, including probabilities for spoofing, front-running,
    wash trading and confirmed layering. INTERPRETATION (weights/normalization are not documented): equal
    weights 0.25 each of spoof_prob (0..1 after stripping ''%''), front_run/100, wash_flag mapped High=1,
    Medium=0.5, Low/NULL=0, and layer_idx=''Confirmed''=1 else 0; missing components count 0. Result range
    0..1.

    '
  sql_expression: (0.25 * COALESCE(CAST(REPLACE(ms.manip_signals->>'spoof_prob', '%', '') AS DOUBLE),
    0) + 0.25 * COALESCE(CAST(ms.manip_signals->>'front_run' AS DOUBLE) / 100.0, 0) + 0.25 * (CASE (ms.manip_signals->>'wash_flag')
    WHEN 'High' THEN 1.0 WHEN 'Medium' THEN 0.5 ELSE 0.0 END) + 0.25 * (CASE WHEN ms.layer_idx = 'Confirmed'
    THEN 1.0 ELSE 0.0 END))
  source_model: main.manipulation_signals
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - manipulation
- name: pattern_anomaly_score
  description: 'Pattern Anomaly Score (PAS): deviation of pattern similarity from peer correlation, potentially
    indicating unique illicit behaviour. PAS = |Pattern Similarity Score - Peer Correlation Score| = |reg_compliance.pat_rec
    - market_metrics->>''peer_corr''|. INTERPRETATION: pat_rec is the pattern-similarity score; it is
    stored 0..100 (documented context says 0-1) and is used as stored.

    '
  sql_expression: ABS(rc.pat_rec - CAST(mc.market_metrics->>'peer_corr' AS DOUBLE))
  source_model: main.reg_compliance
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - manipulation
- name: compliance_recidivism_score
  description: 'Compliance Recidivism Score (CRS): tendency for repeat compliance issues, adjusted for
    account age. CRS = prev_viol / Max(1, age_days/365), with prev_viol from reg_compliance.compliance_data
    and age_days from traders.trader_fin_data (365.0 to avoid integer division).

    '
  sql_expression: CAST(rc.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0)
  source_model: main.reg_compliance
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - compliance
- name: investigation_intensity_index
  description: 'Investigation Intensity Index (III): combines behavioural and network analysis scores.
    III = 0.6 * behav_score + 0.4 * net_score (reg_compliance).

    '
  sql_expression: 0.6 * rc.behav_score + 0.4 * rc.net_score
  source_model: main.reg_compliance
  from_sql: main.reg_compliance rc
  grain: one row per compliance case (record)
  domains:
  - compliance
- name: sentiment_divergence_factor
  description: 'Sentiment Divergence Factor (SDF): |News Sentiment Score - Social Sentiment Score| = |sentiment_data->>''news_score''
    - sentiment_data->>''soc_sent''|.

    '
  sql_expression: ABS(CAST(sa.sentiment_data->>'news_score' AS DOUBLE) - CAST(sa.sentiment_data->>'soc_sent'
    AS DOUBLE))
  source_model: main.sentiment_analytics
  from_sql: main.sentiment_analytics sa
  grain: one row per record
  domains:
  - insider_events
- name: relative_short_interest
  description: 'Relative Short Interest (RSI): short interest ratio relative to institutional ownership.
    RSI = short_rt / inst_own, undefined (NULL) if institutional ownership is 0. Both NULL for ~400 rows.

    '
  sql_expression: sa.short_rt / NULLIF(sa.inst_own, 0)
  source_model: main.sentiment_analytics
  from_sql: main.sentiment_analytics sa
  grain: one row per record
  domains:
  - insider_events
- name: enforcement_financial_impact_ratio
  description: 'Enforcement Financial Impact Ratio (EFIR): penalty amount over the trader''s account balance
    at the time of the related transaction. EFIR = enf_actions->>''pen_amt'' / parsed usd_bal of the record''s
    trader.

    '
  sql_expression: CAST(ea.enf_actions->>'pen_amt' AS DOUBLE) / NULLIF(CAST(regexp_replace(tr.trader_fin_data->>'usd_bal',
    '[$, ]', '', 'g') AS DOUBLE), 0)
  source_model: main.enforcement_actions
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - compliance
- name: high_risk_trader_profile
  description: 'High-Risk Trader Profile: trader is High-Risk if TLE > 5.0 AND risk level (trader_fin_data->>''risk_lvl'')
    is ''Aggressive'' OR DTR > 0.5. Grouped as written: (TLE > 5.0 AND Aggressive) OR DTR > 0.5. Evaluated
    per trade record (aggregate with BOOL_OR by t.tr_anchor for a trader-level flag).

    '
  sql_expression: ((CAST(t.trade_perf->>'lev_ratio' AS DOUBLE) > 5.0 AND (tr.trader_fin_data->>'risk_lvl')
    = 'Aggressive') OR t.vol_day / NULLIF(CAST(regexp_replace(tr.trader_fin_data->>'usd_bal', '[$, ]',
    '', 'g') AS DOUBLE), 0) > 0.5)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - trading_behaviour
- name: potential_insider_trading_flag
  description: 'Potential Insider Trading Flag: a transaction is flagged if its information leakage score
    > 50.0 AND it is linked to a corporate event (evt_near IS NOT NULL) AND the announcement timing is
    ''Pre-market'' or ''Intraday'' (stored as ''Pre-market hrs before'' / ''Intraday hrs before'', matched
    by prefix).

    '
  sql_expression: (ce.leak_score > 50.0 AND ce.evt_near IS NOT NULL AND (ce.announce_time LIKE 'Pre-market%'
    OR ce.announce_time LIKE 'Intraday%'))
  source_model: main.corporate_events
  from_sql: main.corporate_events ce
  grain: one row per record
  domains:
  - insider_events
- name: leakage_score_band
  description: 'Information Leakage Score Interpretation (0-100): Low (<20) little evidence of informed
    trading; Moderate (20-50) warrants attention; High (>50) strongly suggests trading on non-public information
    and requires investigation.

    '
  sql_expression: CASE WHEN ce.leak_score < 20 THEN 'Low' WHEN ce.leak_score <= 50 THEN 'Moderate' WHEN
    ce.leak_score > 50 THEN 'High' END
  source_model: main.corporate_events
  from_sql: main.corporate_events ce
  grain: one row per record
  domains:
  - insider_events
- name: layering_spoofing_pattern
  description: 'Market Manipulation Pattern: Layering/Spoofing: a record suggests Layering/Spoofing if
    layer_idx is ''Confirmed'' OR (spoofing probability > 0.75 AND OMI > 1.0). spoof_prob is text ''x.xx%''
    whose number is a 0..1 probability; it is compared after stripping ''%''.

    '
  sql_expression: "(ms.layer_idx = 'Confirmed' OR (CAST(REPLACE(ms.manip_signals->>'spoof_prob', '%',\
    \ '') AS DOUBLE) > 0.75\n    AND CAST(ob.order_metrics->>'mod_freq' AS DOUBLE) / NULLIF(1 - CAST(ob.order_metrics->>'cancel_pct'\
    \ AS DOUBLE), 0) > 1.0))"
  source_model: main.manipulation_signals
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - manipulation
- name: collusion_network_indicator
  description: 'Collusion Network Indicator: potential collusion if trader circle size (trader_relationships.circ_size)
    > 5 AND group behaviour score (trader_links->>''grp_score'') > 0.6 AND communication path (commPath)
    is ''Regular''. grp_score is stored 0.23..99.87; the threshold 0.6 is applied as stored. Relationship
    row is per trader (rel_root).

    '
  sql_expression: (rel.circ_size > 5 AND CAST(rel.trader_links->>'grp_score' AS DOUBLE) > 0.6 AND rel.commPath
    = 'Regular')
  source_model: main.trader_relationships
  from_sql: main.trader_relationships rel
  grain: one row per trader
  domains:
  - manipulation
- name: elevated_regulatory_scrutiny
  description: 'Elevated Regulatory Scrutiny: alert_lvl is ''High'' or ''Critical'' AND invest_prior is
    ''High'' AND mon_inten is ''Intensive''.

    '
  sql_expression: (rc.alert_lvl IN ('High', 'Critical') AND rc.invest_prior = 'High' AND rc.mon_inten
    = 'Intensive')
  source_model: main.reg_compliance
  from_sql: main.reg_compliance rc
  grain: one row per compliance case (record)
  domains:
  - compliance
- name: problematic_compliance_history
  description: 'Problematic Compliance History: more than 3 previous violations OR compliance rating (comp_rate)
    ''C'' or ''D'' OR CRS > 1.0.

    '
  sql_expression: (CAST(rc.compliance_data->>'prev_viol' AS DOUBLE) > 3 OR (rc.compliance_data->>'comp_rate')
    IN ('C', 'D') OR CAST(rc.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0) > 1.0)
  source_model: main.reg_compliance
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - compliance
- name: wash_trading_alert
  description: 'Wash Trading Alert: wash trading suspicion level manip_signals->>''wash_flag'' is ''High''.'
  sql_expression: ((ms.manip_signals->>'wash_flag') = 'High')
  source_model: main.manipulation_signals
  from_sql: main.manipulation_signals ms
  grain: one row per record
  domains:
  - manipulation
- name: event_driven_trader
  description: 'Event-Driven Trader: more than 30% (>0.3) of the trader''s transactions are linked to
    a corporate event (corporate_events.evt_near IS NOT NULL), over all the trader''s trade records. Aggregate:
    GROUP BY t.tr_anchor.

    '
  sql_expression: (AVG(CASE WHEN ce.evt_near IS NOT NULL THEN 1.0 ELSE 0.0 END) > 0.3)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trader (GROUP BY t.tr_anchor)
  domains:
  - insider_events
- name: high_cancellation_modification_trader
  description: 'High Cancellation/Modification Trader: average cancel_pct > 0.5 OR average OMI > 1.5 across
    the trader''s transactions. GROUP BY t.tr_anchor.

    '
  sql_expression: (AVG(CAST(ob.order_metrics->>'cancel_pct' AS DOUBLE)) > 0.5 OR AVG(CAST(ob.order_metrics->>'mod_freq'
    AS DOUBLE) / NULLIF(1 - CAST(ob.order_metrics->>'cancel_pct' AS DOUBLE), 0)) > 1.5)
  source_model: main.order_behaviour
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trader (GROUP BY t.tr_anchor)
  domains:
  - trading_behaviour
- name: significant_enforcement_action
  description: 'Significant Enforcement Action: penalty impact (enf_actions->>''pen_flag'') is ''Fine''
    or ''Ban'' OR act_taken is ''Suspension'' OR biz_restrict is ''Full''.

    '
  sql_expression: ((ea.enf_actions->>'pen_flag') IN ('Fine', 'Ban') OR ea.act_taken = 'Suspension' OR
    ea.biz_restrict = 'Full')
  source_model: main.enforcement_actions
  from_sql: main.enforcement_actions ea
  grain: one row per enforcement action (record)
  domains:
  - compliance
- name: risk_adjusted_turnover
  description: Risk-Adjusted Turnover (RAT) = DTR * TLE.
  sql_expression: (t.vol_day / NULLIF(CAST(regexp_replace(tr.trader_fin_data->>'usd_bal', '[$, ]', '',
    'g') AS DOUBLE), 0)) * CAST(t.trade_perf->>'lev_ratio' AS DOUBLE)
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - trading_behaviour
- name: combined_manipulation_indicator
  description: Combined Manipulation Indicator (CMI) = (SAI + PAS) / 2.
  sql_expression: ((0.25 * COALESCE(CAST(REPLACE(ms.manip_signals->>'spoof_prob', '%', '') AS DOUBLE),
    0) + 0.25 * COALESCE(CAST(ms.manip_signals->>'front_run' AS DOUBLE) / 100.0, 0) + 0.25 * (CASE (ms.manip_signals->>'wash_flag')
    WHEN 'High' THEN 1.0 WHEN 'Medium' THEN 0.5 ELSE 0.0 END) + 0.25 * (CASE WHEN ms.layer_idx = 'Confirmed'
    THEN 1.0 ELSE 0.0 END)) + ABS(rc.pat_rec - CAST(mc.market_metrics->>'peer_corr' AS DOUBLE))) / 2
  source_model: main.manipulation_signals
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - manipulation
- name: compliance_health_score
  description: 'Compliance Health Score (CHS) = 1 / (1 + CRS * numeric grade). INTERPRETATION of the numeric
    mapping of comp_rate (not documented): A=1, B=2, C=3, D=4 (worse grade = larger penalty).

    '
  sql_expression: 1.0 / (1 + (CAST(rc.compliance_data->>'prev_viol' AS DOUBLE) / GREATEST(1, CAST(tr.trader_fin_data->>'age_days'
    AS DOUBLE) / 365.0)) * (CASE (rc.compliance_data->>'comp_rate') WHEN 'A' THEN 1 WHEN 'B' THEN 2 WHEN
    'C' THEN 3 WHEN 'D' THEN 4 END))
  source_model: main.reg_compliance
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
