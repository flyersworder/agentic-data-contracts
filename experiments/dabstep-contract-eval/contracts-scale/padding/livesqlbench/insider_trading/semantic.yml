    deviation (STDDEV_SAMP).

    '
  sql_expression: "COALESCE((CAST(mc.market_metrics->>'peer_corr' AS DOUBLE)\n  - AVG(CAST(mc.market_metrics->>'peer_corr'\
    \ AS DOUBLE)) OVER (PARTITION BY tr.typeFlag))\n  / NULLIF(STDDEV_SAMP(CAST(mc.market_metrics->>'peer_corr'\
    \ AS DOUBLE)) OVER (PARTITION BY tr.typeFlag), 0), 0)"
  source_model: main.market_conditions
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
    mc ON mc.REC_PIN = t.REC_KEY LEFT JOIN main.order_behaviour ob ON ob.REC_NODE = t.REC_KEY LEFT JOIN
    main.manipulation_signals ms ON ms.REC_TAG = t.REC_KEY LEFT JOIN main.sentiment_analytics sa ON sa.REC_SA
    = t.REC_KEY LEFT JOIN main.corporate_events ce ON ce.REC_EVT = t.REC_KEY LEFT JOIN main.reg_compliance
    rc ON rc.REC_COMP = t.REC_KEY LEFT JOIN main.enforcement_actions ea ON ea.REC_ENF = t.REC_KEY LEFT
    JOIN main.trader_relationships rel ON rel.rel_root = t.tr_anchor
  grain: one row per trade record
  domains:
  - manipulation
tables:
- schema: main
  table: traders
  columns:
  - name: TR_KEY
    type: VARCHAR
    description: Unique trader account id (PK), e.g. TR73442.
  - name: typeFlag
    type: VARCHAR
    description: 'Trader type / category: Broker, Individual, Institution, Market Maker. The ''trader
      category'' for the Peer Correlation Z-Score.'
  - name: trader_fin_data
    type: JSON
    description: 'JSON: usd_bal text ''$4,692,991 '' (parse with metric account_balance); risk_lvl Aggressive/Conservative/Moderate
      (risk level / risk appetite); age_days integer account age in days. Parenthesize (x->>''risk_lvl'')
      before = comparisons.'
- schema: main
  table: instruments
  columns:
  - name: SYM_KEY
    type: VARCHAR
    description: 'Instrument symbol (PK): AAPL, AMZN, GOOGL, META, MSFT.'
  - name: inst_info
    type: JSON
    description: 'JSON: cap (market cap, NULL if not reported), sector (Consumer, Energy, Finance, Healthcare,
      Technology; no padding found), stream (Banking, Biotech, Oil & Gas, Retail, Software).'
- schema: main
  table: trader_relationships
  columns:
  - name: rel_root
    type: VARCHAR
    description: Root trader (PK, FK traders.TR_KEY).
  - name: map_state
    type: VARCHAR
    description: 'Mapping state: Complete, Partial, Pending.'
  - name: addrHits
    type: BIGINT
    description: Address matches across linked traders (0-5).
  - name: commPath
    type: VARCHAR
    description: 'Communication path: Regular, Irregular; NULL = not mapped. Collusion requires ''Regular''.'
  - name: circ_size
    type: BIGINT
    description: Trader circle size (1-50). Collusion requires > 5.
  - name: insider_net_str
    type: VARCHAR
    description: Insider network strength text '18.68 connection-point/ownership%'.
  - name: trader_links
    type: JSON
    description: 'JSON: link_count, contact_share (Email/Multiple/Phone), fin_link (Business/Personal),
      grp_score (group behaviour score, stored 0..100).'
- schema: main
  table: trade_records
  columns:
  - name: REC_KEY
    type: VARCHAR
    description: Trade record key (PK); equals REC_PIN/REC_NODE/REC_TAG/REC_SA/REC_EVT/REC_COMP/REC_ENF
      of the linked tables.
  - name: snap_ts
    type: VARCHAR
    description: Snapshot time fragment 'mm:ss.f' only; NULL = not captured (400 rows).
  - name: tr_anchor
    type: VARCHAR
    description: Trader key (FK traders.TR_KEY).
  - name: sym_anchor
    type: VARCHAR
    description: Instrument symbol (FK instruments.SYM_KEY).
  - name: freq_tag
    type: VARCHAR
    description: 'Trading frequency scope: High, Low, Medium.'
  - name: vol_day
    type: FLOAT
    description: Average daily trading volume; numerator of DTR; > 1,000,000 for High-Volume Wash Trading
      Concern.
  - name: pos_avg
    type: FLOAT
    description: Average position size.
  - name: hold_span
    type: VARCHAR
    description: 'Holding style: Intraday (same-day), Swing (few days to weeks), Position (weeks to months),
      Long-term (months or years).'
  - name: margin_pct
    type: FLOAT
    description: Margin percentage utilised.
  - name: vol_adj_lev
    type: VARCHAR
    description: Volatility-adjusted leverage text '0.19 leverage-point/vol-point'.
  - name: risk_adj_lev
    type: VARCHAR
    description: Risk-adjusted leverage text '20.18 USD/risk-point'.
  - name: bal_turnover
    type: VARCHAR
    description: Stored balance turnover text '2.69 times/day'; does not match vol_day/usd_bal in the
      data — use metric daily_turnover_rate for DTR.
  - name: trade_perf
    type: JSON
    description: 'JSON: win_pct (historical win percentage), pl_ratio, lev_ratio (TLE). NULLs are JSON
      null.'
- schema: main
  table: market_conditions
  columns:
  - name: REC_PIN
    type: VARCHAR
    description: Record key (PK) = trade_records.REC_KEY.
  - name: vol_ano
    type: FLOAT
    description: Volume-anomaly indicator.
  - name: mov_pct
    type: FLOAT
    description: Percentage price movement over window.
  - name: spreadTag
    type: FLOAT
    description: Bid-ask spread metric.
  - name: impactVal
    type: VARCHAR
    description: Market impact text like '0.05%'.
  - name: mkt_corr
    type: FLOAT
    description: Market Correlation with the broad index; used in MAPA.
  - name: rot_imp
    type: FLOAT
    description: Sector rotation impact score.
  - name: ofi_density
    type: VARCHAR
    description: Order flow impact density text 'bps/million USD'.
  - name: liq_imp
    type: VARCHAR
    description: Liquidity impact text 'USD/min'.
  - name: price_accel
    type: VARCHAR
    description: Price acceleration text '%/(hour_)' (hour squared); higher = more volatile.
  - name: market_metrics
    type: JSON
    description: 'JSON: px_vol, liq_ratio, peer_corr (Peer Correlation Score, -1..1).'
- schema: main
  table: order_status_types
  columns:
  - name: STAT_TOKEN
    type: VARCHAR
    description: Order-status token (PK).
  - name: order_status
    type: JSON
    description: 'JSON: tick_type (Irregular/Regular/Suspicious), spread_type order type (Market = speed,
      Limit = price, Mixed = combination).'
- schema: main
  table: sentiment_analytics
  columns:
  - name: REC_SA
    type: VARCHAR
    description: Record key (PK).
  - name: ins_hold
    type: FLOAT
    description: Insider holdings % of float.
  - name: inst_own
    type: FLOAT
    description: Institutional Ownership Percentage; NULL = unavailable; never 0.
  - name: short_rt
    type: FLOAT
    description: Short Interest Ratio; NULL = not provided.
  - name: opt_vol
    type: FLOAT
    description: Option Volume Ratio (options volume); used in SWOV.
  - name: pc_ratio
    type: FLOAT
    description: Put-call ratio.
  - name: iv_rank
    type: VARCHAR
    description: Implied-volatility rank text like '11.39%'.
  - name: uo_act
    type: VARCHAR
    description: 'Unusual options activity: High (significant deviation, potential insider flag), Moderate
      (less pronounced); NULL = none recorded.'
  - name: short_press_int
    type: VARCHAR
    description: Short pressure intensity text '%/hour'.
  - name: sentiment_data
    type: JSON
    description: 'JSON: news_score, soc_sent, analyst_cnt.'
- schema: main
  table: order_behaviour
  columns:
  - name: REC_NODE
    type: VARCHAR
    description: Record key (PK).
  - name: OST_ref
    type: VARCHAR
    description: FK order_status_types.STAT_TOKEN.
  - name: dark_use
    type: FLOAT
    description: Proportion routed to dark pools (private venues such as ATS for large orders); NULL =
      not collected. Dark Pool Usage = dark_use > 0.
  - name: off_mkt
    type: FLOAT
    description: Fraction of off-exchange executions (not on lit exchanges, incl. internal crosses).
  - name: x_freq
    type: FLOAT
    description: Cross-Trade Frequency / execution frequency; numerator of CMR.
  - name: order_metrics
    type: JSON
    description: 'JSON: size_var, cancel_pct (0..1 fraction), mod_freq.'
- schema: main
  table: manipulation_signals
  columns:
  - name: REC_TAG
    type: VARCHAR
    description: Record key (PK).
  - name: layer_idx
    type: VARCHAR
    description: 'Layering indicator: Confirmed, Suspected; NULL = not assigned.'
  - name: stuff_idx
    type: FLOAT
    description: Quote-stuffing index.
  - name: ignite_sig
    type: VARCHAR
    description: 'Momentum ignition: Strong (clear manipulative intent), Weak (less evident); NULL = not
      detected.'
  - name: close_mark
    type: VARCHAR
    description: 'Marking the close (prohibited): Frequent (repeated), Occasional (infrequent); NULL =
      not set.'
  - name: manip_signals
    type: JSON
    description: 'JSON: spoof_prob text ''x.xx%'' (number is 0..1 probability), wash_flag High/Medium/Low
      (NULL = not determined), front_run score 0..100.'
- schema: main
  table: corporate_events
  columns:
  - name: REC_EVT
    type: VARCHAR
    description: Record key (PK).
  - name: evt_near
    type: VARCHAR
    description: 'Upcoming event: Earnings, M&A, Restructuring; NULL = no event (record not linked to
      a corporate event).'
  - name: announce_time
    type: VARCHAR
    description: '''Pre-market hrs before'', ''Intraday hrs before'', ''Post-market hrs before''.'
  - name: leak_score
    type: FLOAT
    description: 'Information Leakage Score 0-100: <20 low, 20-50 moderate, >50 high (investigate).'
  - name: info_leak_rate
    type: VARCHAR
    description: Leak rate text 'score/hour'.
- schema: main
  table: reg_compliance
  columns:
  - name: REC_COMP
    type: VARCHAR
    description: Record key (PK); one compliance case.
  - name: file_state
    type: VARCHAR
    description: 'Filing status: Current, Delayed, Missing.'
  - name: disc_state
    type: VARCHAR
    description: 'Disclosure: Full, Non-compliant, Partial.'
  - name: restrict_win
    type: VARCHAR
    description: 'Trading restriction: Blackout (complete prohibition), Special (tailored, e.g. position
      limits, pre-trade approval); NULL = not defined.'
  - name: broker_flag
    type: VARCHAR
    description: 'Broker-dealer flag: Complete, Incomplete, Late; NULL = unset.'
  - name: exch_note
    type: VARCHAR
    description: 'Exchange note: Inquiry, Warning; NULL = none.'
  - name: invest_stat
    type: VARCHAR
    description: 'Investigation status: Active, Preliminary; NULL = not specified.'
  - name: alert_lvl
    type: VARCHAR
    description: 'Alert level: Low, Medium, High, Critical (WIS multiplier 1-4).'
  - name: invest_prior
    type: VARCHAR
    description: 'Investigation priority: High, Low, Medium.'
  - name: case_flag
    type: VARCHAR
    description: 'Case flag: Closed, Investigation, Monitoring.'
  - name: review_freq
    type: VARCHAR
    description: 'Review frequency: Daily, Monthly, Weekly; NULL = not defined.'
  - name: last_rev
    type: DATE
    description: Last review date.
  - name: next_rev
    type: DATE
    description: Next review date.
  - name: mon_inten
    type: VARCHAR
    description: 'Monitoring intensity: Enhanced, Intensive, Standard.'
  - name: sv_sys
    type: VARCHAR
    description: 'Surveillance system: Multiple, Primary, Secondary.'
  - name: det_meth
    type: VARCHAR
    description: 'Detection method: Automated, Hybrid, Manual.'
  - name: fp_rate
    type: FLOAT
    description: False-positive rate.
  - name: model_conf
    type: FLOAT
    description: Model confidence.
  - name: pat_rec
    type: FLOAT
    description: Pattern Similarity Score (pattern recognition), stored 0..100 although documented context
      says 0-1 (near 1/high = similar to illicit patterns).
  - name: behav_score
    type: FLOAT
    description: Behavioral Analysis Score (0..100); III weight 0.6.
  - name: net_score
    type: FLOAT
    description: Network Analysis Score (0..100); III weight 0.4.
  - name: reg_alert_conc
    type: VARCHAR
    description: Alert concentration text 'alerts/billion USD'.
  - name: reg_resp_spd
    type: VARCHAR
    description: Regulatory response speed text 'hours/case'; lower = faster.
  - name: compliance_data
    type: JSON
    description: 'JSON: prev_viol (0-5), comp_rate grade A (excellent), B (good, minor issues), C (significant
      deficiencies), D (serious/repeated failures), risk_val.'
- schema: main
  table: enforcement_actions
  columns:
  - name: REC_ENF
    type: VARCHAR
    description: Record key (PK); one enforcement action.
  - name: abuse_prob
    type: FLOAT
    description: Abuse probability; NULL = not calculated.
  - name: evid_pow
    type: VARCHAR
    description: 'Evidence strength: Moderate, Strong, Weak.'
  - name: doc_stat
    type: VARCHAR
    description: 'Documentation: Complete, Incomplete, Partial.'
  - name: act_taken
    type: VARCHAR
    description: 'Action taken: Restriction, Suspension, Warning; NULL = none recorded.'
  - name: esc_lvl
    type: VARCHAR
    description: 'Escalation: Compliance, Legal, Supervisor; NULL = not set.'
  - name: legal_state
    type: VARCHAR
    description: 'Legal state: Active, Pending; NULL = not recorded.'
  - name: settle_state
    type: VARCHAR
    description: 'Settlement: Negotiating, Settled; NULL = unknown.'
  - name: rep_impact
    type: VARCHAR
    description: 'Reputational impact: Minimal, Moderate, Severe.'
  - name: biz_restrict
    type: VARCHAR
    description: 'Business restriction: Full, Partial; NULL = not documented.'
  - name: rem_status
    type: VARCHAR
    description: 'Remediation: Completed, Not Required, Pending.'
  - name: sys_need
    type: VARCHAR
    description: 'System changes: Major, Minor, No.'
  - name: policy_need
    type: VARCHAR
    description: 'Policy changes: No, Urgent, Yes.'
  - name: train_req
    type: VARCHAR
    description: 'Training: Comprehensive, Refresher; NULL = not specified.'
  - name: report_state
    type: VARCHAR
    description: 'Reporting: Automated, Hybrid, Manual.'
  - name: retain_stat
    type: VARCHAR
    description: 'Retention: Archived, Current, Deleted; NULL = not indicated.'
  - name: audit_stat
    type: VARCHAR
    description: 'Audit: Complete, Missing, Partial.'
  - name: conf_lvl
    type: VARCHAR
    description: 'Confidentiality level: Highly Sensitive, Normal, Sensitive; NULL = not assigned.'
  - name: access_res
    type: VARCHAR
    description: 'Access restriction: Internal, Public, R.'
  - name: share_state
    type: VARCHAR
    description: 'Data sharing: Allowed, Limited, Prohibited.'
  - name: enf_actions
    type: JSON
    description: 'JSON: pen_amt (penalty amount), res_state (In Progress, Pending, Resolved), pen_flag
      penalty impact (Ban, Fine, Warning; NULL = not decided). Resolution is blocked when III > 75.'
