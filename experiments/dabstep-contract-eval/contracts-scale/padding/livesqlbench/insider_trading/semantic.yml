    '[$, ]', '', 'g') AS DOUBLE), 0)) * CAST(t.trade_perf->>'lev_ratio' AS DOUBLE) * (CAST(ob.order_metrics->>'mod_freq'
    AS DOUBLE) / NULLIF(1 - CAST(ob.order_metrics->>'cancel_pct' AS DOUBLE), 0))
  source_model: main.trade_records
  from_sql: main.trade_records t JOIN main.traders tr ON tr.TR_KEY = t.tr_anchor LEFT JOIN main.market_conditions
