    \ e JOIN main.treatmentbasics t ON t.enc_ref = e.enc_key\n  GROUP BY e.fac_id) tb ON tb.fac_id = f.fac_key\n\
    LEFT JOIN (SELECT e.fac_id,\n    COUNT(*) FILTER (WHERE (o.txprogmet->>'Tx_Adh') IN ('High', 'Medium',\
    \ 'Compliant')) * 1.0 / NULLIF(COUNT(*), 0) AS tar,\n    AVG(CASE lower(o.txprogmet->>'Ther_Alliance')\
    \ WHEN 'strong' THEN 3 WHEN 'moderate' THEN 2 WHEN 'weak' THEN 1 WHEN 'poor' THEN 0 END) AS alliance_avg,\n\
