- name: fpq_facility_performance_quadrant
  description: 'Facility Performance Quadrant (FPQ): each facility is placed in a quadrant by whether
    its TAR and its PSM are above or below the median over all facilities (medians over non-NULL values).
    INTERPRETATION: a value equal to the median counts as High; facilities lacking TAR or PSM get NULL.
    Labels are ''High TAR / High PSM'', ''High TAR / Low PSM'', ''Low TAR / High PSM'', ''Low TAR / Low
    PSM''.

    '
  sql_expression: "CASE WHEN fs.tar IS NULL OR (1.0 / (1 + fs.cif + fs.mar)) IS NULL THEN NULL\n  ELSE\
    \ (CASE WHEN fs.tar >= median(fs.tar) OVER () THEN 'High TAR' ELSE 'Low TAR' END)\n    || ' / ' ||\n\
    \    (CASE WHEN (1.0 / (1 + fs.cif + fs.mar)) >= median(1.0 / (1 + fs.cif + fs.mar)) OVER () THEN\
    \ 'High PSM' ELSE 'Low PSM' END)\nEND"
  source_model: main.facilities
  grain: one row per facility (fs.fac_key)
  domains:
  - facility_metrics
  from_sql: "(SELECT f.fac_key, f.r_source, f.com_res,\n  CASE f.com_res WHEN 'Comprehensive' THEN 3 WHEN\
    \ 'Extensive' THEN 3 WHEN 'Adequate' THEN 2 WHEN 'Limited' THEN 1 END AS frai,\n  sr.apsf, sr.agsf,\
    \ sr.srp, sd.pfis, sd.sse_avg, tb.tes, COALESCE(tb.crisis_total, 0) AS crisis_total,\n  tx.tar, tx.alliance_avg,\
    \ tx.fimpv_avg, en.miss_total, en.n_patients,\n  COALESCE(tb.crisis_total, 0) / NULLIF(en.n_patients,\
    \ 0) AS cif,\n  en.miss_total / NULLIF(en.n_patients, 0) AS mar\nFROM main.facilities f LEFT JOIN\
    \ (SELECT e.fac_id, AVG(s.phq9_scr) AS apsf, AVG(s.gad7_scr) AS agsf,\n    100.0 * COUNT(*) FILTER\
    \ (WHERE s.suic_risk = 'High') / NULLIF(COUNT(*), 0) AS srp\n  FROM main.encounters e JOIN main.assessmentsymptomsandrisk\
    \ s ON s.asr_key = e.ab_ref\n  GROUP BY e.fac_id) sr ON sr.fac_id = f.fac_key\nLEFT JOIN (SELECT e.fac_id,\n\
    \    AVG(CASE lower(d.func_imp) WHEN 'severe' THEN 3 WHEN 'moderate' THEN 2 WHEN 'mild' THEN 1 END)\
    \ AS pfis,\n    AVG((CASE (d.funcassess->>'Soc_Sup') WHEN 'Strong' THEN 3 WHEN 'Adequate' THEN 2 WHEN\
    \ 'Limited' THEN 1 WHEN 'Weak' THEN 0 END)\n      + (CASE (d.funcassess->>'Rel_Qual') WHEN 'Good'\
    \ THEN 3 WHEN 'Fair' THEN 2 WHEN 'Poor' THEN 1 WHEN 'Conflicted' THEN 0 END)) AS sse_avg\n  FROM main.encounters\
    \ e JOIN main.assessmentsocialanddiagnosis d ON d.asd_key = e.ab_ref\n  GROUP BY e.fac_id) sd ON sd.fac_id\
    \ = f.fac_key\nLEFT JOIN (SELECT e.fac_id,\n    AVG(CASE t.th_eng WHEN 'High' THEN 3 WHEN 'Medium'\
    \ THEN 2 WHEN 'Low' THEN 1 END) AS tes,\n    SUM(t.crisis_int) AS crisis_total\n  FROM main.encounters\
    \ e JOIN main.treatmentbasics t ON t.enc_ref = e.enc_key\n  GROUP BY e.fac_id) tb ON tb.fac_id = f.fac_key\n\
    LEFT JOIN (SELECT e.fac_id,\n    COUNT(*) FILTER (WHERE (o.txprogmet->>'Tx_Adh') IN ('High', 'Medium',\
    \ 'Compliant')) * 1.0 / NULLIF(COUNT(*), 0) AS tar,\n    AVG(CASE lower(o.txprogmet->>'Ther_Alliance')\
    \ WHEN 'strong' THEN 3 WHEN 'moderate' THEN 2 WHEN 'weak' THEN 1 WHEN 'poor' THEN 0 END) AS alliance_avg,\n\
    \    AVG(CASE lower(o.txprogmet->>'Func_Impv') WHEN 'significant' THEN 3 WHEN 'moderate' THEN 2 WHEN\
    \ 'minimal' THEN 1 END) AS fimpv_avg\n  FROM main.encounters e JOIN main.treatmentbasics t ON t.enc_ref\
    \ = e.enc_key\n    JOIN main.treatmentoutcomes o ON o.tx_ref = t.tx_key\n  GROUP BY e.fac_id) tx ON\
    \ tx.fac_id = f.fac_key\nLEFT JOIN (SELECT fac_id, SUM(miss_appt) AS miss_total, COUNT(DISTINCT pat_ref)\
    \ AS n_patients\n  FROM main.encounters GROUP BY fac_id) en ON en.fac_id = f.fac_key) fs"
