- name: therapy_engagement_score
  description: 'Therapy Engagement Score (TES): the average of engagement scores across therapy sessions
    (treatmentbasics rows), score 3 for ''High'' engagement, 2 for ''Medium'', 1 for ''Low''. th_eng ''Non-compliant''
    has no score and is excluded from the average. Group by whatever population is analysed; the facility-level
    TES is metric facility_therapy_engagement_score.

    '
  sql_expression: AVG(CASE t.th_eng WHEN 'High' THEN 3 WHEN 'Medium' THEN 2 WHEN 'Low' THEN 1 END)
  source_model: main.treatmentbasics
  domains:
  - facility_metrics
  - value_scales
  from_sql: main.treatmentbasics t
  grain: one row per treatment record (aggregate over the group analysed)
