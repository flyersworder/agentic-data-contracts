- name: patient_functional_impairment_score
  description: 'Patient Functional Impairment Score (PFIS): average of functional impairment scores across
    patients, 3 for ''Severe'', 2 for ''Moderate'', 1 for ''Mild''. func_imp is mixed case (SEVERE/severe/...),
    so compared with lower(); NULL excluded. The facility-level PFIS is metric facility_pfis.

    '
  sql_expression: AVG(CASE lower(d.func_imp) WHEN 'severe' THEN 3 WHEN 'moderate' THEN 2 WHEN 'mild' THEN
    1 END)
  source_model: main.assessmentsocialanddiagnosis
  from_sql: main.assessmentsocialanddiagnosis d
  grain: one row per social/diagnosis assessment (aggregate over the group)
  domains:
  - facility_metrics
  - value_scales
