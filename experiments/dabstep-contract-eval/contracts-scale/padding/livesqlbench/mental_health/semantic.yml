- name: social_support_effectiveness
  description: 'Social Support Effectiveness (SSE) for one assessment: social support score (funcassess->>''Soc_Sup'':
    Strong=3, Adequate=2, Limited=1, Weak=0) + relationship quality score (funcassess->>''Rel_Qual'':
    Good=3, Fair=2, Poor=1, Conflicted=0). SSE as a KPI is the average of this sum (wrap in AVG). DATA
    NOTE: Soc_Sup in the data holds Strong, Moderate, Limited or NULL; ''Moderate'' and NULL are not in
    the documented scoring, so SSE is NULL for those rows. A patient''s "personal" SSE is this value on
    their assessment.

    '
  sql_expression: "((CASE (d.funcassess->>'Soc_Sup') WHEN 'Strong' THEN 3 WHEN 'Adequate' THEN 2 WHEN\
    \ 'Limited' THEN 1 WHEN 'Weak' THEN 0 END)\n + (CASE (d.funcassess->>'Rel_Qual') WHEN 'Good' THEN\
    \ 3 WHEN 'Fair' THEN 2 WHEN 'Poor' THEN 1 WHEN 'Conflicted' THEN 0 END))"
  source_model: main.assessmentsocialanddiagnosis
  from_sql: main.assessmentsocialanddiagnosis d
  grain: one row per social/diagnosis assessment
  domains:
  - patient_classification
  - value_scales
