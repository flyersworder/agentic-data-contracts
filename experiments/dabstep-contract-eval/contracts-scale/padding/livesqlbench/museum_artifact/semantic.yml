- name: artifact_rarity_valuation
  description: 'ARV: high rarity and valuation when insurance value (insUSD) exceeds $1,000,000. Evaluated
    per ArtifactSecurityAccess record (loan status); none qualifies in current data.

    '
  sql_expression: sa.insUSD > 1000000
  source_model: main.ArtifactSecurityAccess
  from_sql: main.ArtifactSecurityAccess sa
  grain: one row per loan-status security record
  domains:
  - visitors_security
- name: security_risk_exposure
  description: 'SRE = (insurance value / 100000) * (10 - VIR) / 10; higher = greater security risk. INTERPRETATION:
    insurance cannot be tied to an artifact or hall, so SRE is evaluated for each (hall, security-access
    record) pair.

    '
  sql_expression: "(sa.insUSD / 100000.0) * (10 - (CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_daily_visitors'\
    \ AS DOUBLE)\n * CASE h.security_visitor_overview->>'$.visitor_statistics.visitor_flow' WHEN 'Low'\
    \ THEN 1 WHEN 'Medium' THEN 3 WHEN 'High' THEN 5 END\n * CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_dwell_minutes'\
    \ AS DOUBLE)) / 1000.0) / 10\n"
  source_model: main.ArtifactSecurityAccess
  from_sql: main.ExhibitionHalls h CROSS JOIN main.ArtifactSecurityAccess sa
  grain: one row per (exhibition hall, ArtifactSecurityAccess record)
  domains:
  - visitors_security
