- name: visitor_impact_risk
  description: 'VIR = (avg_daily_visitors * flow rate * avg_dwell_minutes) / 1000 with visitor_flow Low=1,
    Medium=3, High=5 (JSON visitor_statistics). Per hall; NULL flow (e.g. Hall-5) -> NULL. Per artifact
    it is t.vir (hall of its showcase).

    '
  sql_expression: "(CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_daily_visitors' AS DOUBLE)\n\
    \ * CASE h.security_visitor_overview->>'$.visitor_statistics.visitor_flow' WHEN 'Low' THEN 1 WHEN\
    \ 'Medium' THEN 3 WHEN 'High' THEN 5 END\n * CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_dwell_minutes'\
    \ AS DOUBLE)) / 1000.0\n"
  source_model: main.ExhibitionHalls
  from_sql: main.ExhibitionHalls h
  grain: one row per exhibition hall
  domains:
  - visitors_security
- name: visitor_crowd_risk
  description: 'Hall flag: VIR > 5 AND an artifact has the lowest security level. INTERPRETATION: lowest
    = ''Level 1''; ArtifactSecurityAccess has no artifact/hall key, so the security clause is checked
    table-wide (all rows are ''Level 3'' today, so the flag is FALSE everywhere).

    '
  sql_expression: "(CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_daily_visitors' AS DOUBLE)\n\
    \ * CASE h.security_visitor_overview->>'$.visitor_statistics.visitor_flow' WHEN 'Low' THEN 1 WHEN\
    \ 'Medium' THEN 3 WHEN 'High' THEN 5 END\n * CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_dwell_minutes'\
    \ AS DOUBLE)) / 1000.0 > 5\nAND EXISTS (SELECT 1 FROM main.ArtifactSecurityAccess sa WHERE sa.SEC_LEVEL\
    \ = 'Level 1')\n"
  source_model: main.ExhibitionHalls
  from_sql: main.ExhibitionHalls h
  grain: one row per exhibition hall
  domains:
  - visitors_security
