- name: light_exposure_threshold_exceeded
  description: 'TRUE when lux exceeds the maximum for the artifact''s light sensitivity: High > 50 lux,
    Medium > 200 lux (Light Exposure Thresholds); Low > 300 lux (Light Sensitivity Levels). NULL when
    sensitivity or lux is missing.

    '
  sql_expression: CASE t.light_sens WHEN 'High' THEN t.lux > 50 WHEN 'Medium' THEN t.lux > 200 WHEN 'Low'
    THEN t.lux > 300 END
  source_model: main.LightAndRadiationReadings
  grain: one row per artifact x condition assessment
  from_sql: "(\nSELECT artifact_id, art_title, dynasty, material, age_years, conserve_status, conserve_status_value,\
    \ hist_sign, research_score, cultural_score, overall_sensitivity, light_sens, temperature_sens, humidity_sens,\
