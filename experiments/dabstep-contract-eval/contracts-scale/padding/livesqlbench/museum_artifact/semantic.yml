    \    LEFT JOIN main.ConditionAssessments ca ON ca.art_exam = a.ARTregID\n    LEFT JOIN main.LightAndRadiationReadings\
    \ l ON l.rad_id = ca.light_link\n    LEFT JOIN main.EnvironmentalReadingsCore e ON e.monitor_code\
    \ = l.env_link\n    LEFT JOIN main.Showcases s ON s.caseID = ca.case_exam\n    LEFT JOIN main.ExhibitionHalls\
    \ h ON h.Hall_ID = s.hall_ref\n    LEFT JOIN main.ConservationAndMaintenance cm ON cm.monitor_link\
    \ = e.monitor_code\n    LEFT JOIN main.UsageRecords u ON u.env_link = e.monitor_code\n  ) b\n) x\n\
    ) t\n"
  domains:
  - sensitivity
- name: artifact_vulnerability_score
  description: AVS = CPI * ERF. Higher scores indicate artifacts requiring more urgent attention.
  sql_expression: t.cpi * t.erf
  source_model: main.ArtifactsCore
  grain: one row per artifact x condition assessment
  from_sql: "(\nSELECT artifact_id, art_title, dynasty, material, age_years, conserve_status, conserve_status_value,\
    \ hist_sign, research_score, cultural_score, overall_sensitivity, light_sens, temperature_sens, humidity_sens,\
    \ vibration_sens, pollutants_sens, light_w, temperature_w, humidity_w, vibration_w, pollutants_w,\
    \ n_high_env_sens, cond_id, case_id, hall_id, monitor_code, read_ts, temp_c, rh, temp_var_24h, rh_var,\
    \ leak_rate_per_day, lux, vis_lxh, avg_daily_visitors, visitor_flow_rate, avg_dwell_minutes, prio_tag,\
    \ budget_alloc, last_clean, clean_days, next_clean, budget_weight, display_months,\n  erf, cpi, ler,\
    \ mdr, sesr, vir, dsd, cbr, budget_ratio, top10_significance,\n  AVG(cpi * budget_ratio) OVER () AS\
    \ cbe,\n  BOOL_OR(conserve_status = 'Critical' AND budget_alloc = 'Insufficient') OVER () AS has_critical_insufficient\n\
    FROM (\n  SELECT artifact_id, art_title, dynasty, material, age_years, conserve_status, conserve_status_value,\
    \ hist_sign, research_score, cultural_score, overall_sensitivity, light_sens, temperature_sens, humidity_sens,\
    \ vibration_sens, pollutants_sens, light_w, temperature_w, humidity_w, vibration_w, pollutants_w,\
    \ n_high_env_sens, cond_id, case_id, hall_id, monitor_code, read_ts, temp_c, rh, temp_var_24h, rh_var,\
    \ leak_rate_per_day, lux, vis_lxh, avg_daily_visitors, visitor_flow_rate, avg_dwell_minutes, prio_tag,\
    \ budget_alloc, last_clean, clean_days, next_clean, budget_weight, display_months,\n    list_avg([light_w,\
    \ temperature_w, humidity_w, vibration_w, pollutants_w]) AS erf,\n    ((hist_sign + research_score\
    \ + cultural_score) * (10 - conserve_status_value)) / 30.0 AS cpi,\n    (lux * light_w * vis_lxh)\
    \ / 1000.0 AS ler,\n    (age_years * list_avg([light_w, temperature_w, humidity_w, vibration_w, pollutants_w])\
    \ * POWER(rh - 50, 2) * temp_c) / 100000.0 AS mdr,\n    10 - ((temp_var_24h + rh_var / 5.0 + leak_rate_per_day)\
    \ / 3) AS sesr,\n    (avg_daily_visitors * visitor_flow_rate * avg_dwell_minutes) / 1000.0 AS vir,\n\
    \    (36 * (10 - light_w) * (10 - temperature_w) * (10 - humidity_w)) / 1000.0 AS dsd,\n    (((hist_sign\
    \ + research_score + cultural_score) * (10 - conserve_status_value)) / 30.0 * ((CURRENT_DATE - last_clean)\
    \ - clean_days)) / 100.0 AS cbr,\n    budget_weight / NULLIF(SUM(budget_weight) OVER (), 0) AS budget_ratio,\n\
    \    (hist_sign >= (SELECT quantile_cont(r2.HIST_sign, 0.9) FROM main.ArtifactRatings r2)\n     AND\
    \ cultural_score >= (SELECT quantile_cont(CAST(r2.rating_profile->>'$.cultural_score' AS DOUBLE),\
    \ 0.9) FROM main.ArtifactRatings r2)) AS top10_significance\n  FROM (\n    SELECT a.ARTregID AS artifact_id,\
    \ a.art_title, a.DYNASTY AS dynasty, a.MatKind AS material, a.ageYears AS age_years, a.conserve_status,\n\
    \      CASE a.conserve_status WHEN 'Excellent' THEN 1 WHEN 'Good' THEN 3 WHEN 'Fair' THEN 5 WHEN 'Poor'\
    \ THEN 7 WHEN 'Critical' THEN 10 END AS conserve_status_value,\n      r.HIST_sign AS hist_sign, CAST(r.rating_profile->>'$.research_score'\
    \ AS DOUBLE) AS research_score, CAST(r.rating_profile->>'$.cultural_score' AS DOUBLE) AS cultural_score,\n\
    \      sd.ENVsense AS overall_sensitivity,\n      sd.env_handling_sensitivity->>'$.environment.light'\
    \ AS light_sens,\n      sd.env_handling_sensitivity->>'$.environment.temperature' AS temperature_sens,\n\
    \      sd.env_handling_sensitivity->>'$.environment.humidity' AS humidity_sens,\n      sd.env_handling_sensitivity->>'$.environment.vibration'\
    \ AS vibration_sens,\n      sd.env_handling_sensitivity->>'$.environment.pollutants' AS pollutants_sens,\n\
    \      CASE sd.env_handling_sensitivity->>'$.environment.light' WHEN 'Low' THEN 1 WHEN 'Medium' THEN\
    \ 5 WHEN 'High' THEN 10 END AS light_w,\n      CASE sd.env_handling_sensitivity->>'$.environment.temperature'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS temperature_w,\n      CASE sd.env_handling_sensitivity->>'$.environment.humidity'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS humidity_w,\n      CASE sd.env_handling_sensitivity->>'$.environment.vibration'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS vibration_w,\n      CASE sd.env_handling_sensitivity->>'$.environment.pollutants'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 5 WHEN 'High' THEN 10 END AS pollutants_w,\n      len(list_filter([sd.env_handling_sensitivity->>'$.environment.light',\
    \ sd.env_handling_sensitivity->>'$.environment.temperature', sd.env_handling_sensitivity->>'$.environment.humidity',\
    \ sd.env_handling_sensitivity->>'$.environment.vibration', sd.env_handling_sensitivity->>'$.environment.pollutants'],\
    \ x -> x = 'High')) AS n_high_env_sens,\n      ca.cond_id, ca.case_exam AS case_id, s.hall_ref AS\
    \ hall_id, e.monitor_code, e.readTS AS read_ts,\n      e.TEMPc AS temp_c, e.RH AS rh, e.tempVar24\
    \ AS temp_var_24h, e.RHvar AS rh_var,\n      CAST(s.case_environment_profile->>'$.physical_state.leak_rate_per_day'\
    \ AS DOUBLE) AS leak_rate_per_day,\n      l.lux, l.visLxh AS vis_lxh,\n      CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_daily_visitors'\
    \ AS DOUBLE) AS avg_daily_visitors,\n      CASE h.security_visitor_overview->>'$.visitor_statistics.visitor_flow'\
    \ WHEN 'Low' THEN 1 WHEN 'Medium' THEN 3 WHEN 'High' THEN 5 END AS visitor_flow_rate,\n      CAST(h.security_visitor_overview->>'$.visitor_statistics.avg_dwell_minutes'\
    \ AS DOUBLE) AS avg_dwell_minutes,\n      cm.prio_tag, cm.budget_alloc, cm.lastClean AS last_clean,\
    \ cm.cleanDays AS clean_days, cm.nextClean AS next_clean,\n      CASE cm.budget_alloc WHEN 'Adequate'\
    \ THEN 1.0 WHEN 'Review Required' THEN 0.5 WHEN 'Insufficient' THEN 0.0 END AS budget_weight,\n  \
    \    u.displayMonths AS display_months\n    FROM main.ArtifactsCore a\n    LEFT JOIN main.ArtifactRatings\
    \ r ON r.ART_link = a.ARTregID\n    LEFT JOIN main.SensitivityData sd ON sd.ART_link = a.ARTregID\n\
    \    LEFT JOIN main.ConditionAssessments ca ON ca.art_exam = a.ARTregID\n    LEFT JOIN main.LightAndRadiationReadings\
    \ l ON l.rad_id = ca.light_link\n    LEFT JOIN main.EnvironmentalReadingsCore e ON e.monitor_code\
    \ = l.env_link\n    LEFT JOIN main.Showcases s ON s.caseID = ca.case_exam\n    LEFT JOIN main.ExhibitionHalls\
    \ h ON h.Hall_ID = s.hall_ref\n    LEFT JOIN main.ConservationAndMaintenance cm ON cm.monitor_link\
    \ = e.monitor_code\n    LEFT JOIN main.UsageRecords u ON u.env_link = e.monitor_code\n  ) b\n) x\n\
    ) t\n"
