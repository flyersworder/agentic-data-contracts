    \ cm.cleanDays AS clean_days, cm.nextClean AS next_clean,\n      CASE cm.budget_alloc WHEN 'Adequate'\
    \ THEN 1.0 WHEN 'Review Required' THEN 0.5 WHEN 'Insufficient' THEN 0.0 END AS budget_weight,\n  \
    \    u.displayMonths AS display_months\n    FROM main.ArtifactsCore a\n    LEFT JOIN main.ArtifactRatings\
    \ r ON r.ART_link = a.ARTregID\n    LEFT JOIN main.SensitivityData sd ON sd.ART_link = a.ARTregID\n\
    \    LEFT JOIN main.ConditionAssessments ca ON ca.art_exam = a.ARTregID\n    LEFT JOIN main.LightAndRadiationReadings\
    \ l ON l.rad_id = ca.light_link\n    LEFT JOIN main.EnvironmentalReadingsCore e ON e.monitor_code\
    \ = l.env_link\n    LEFT JOIN main.Showcases s ON s.caseID = ca.case_exam\n    LEFT JOIN main.ExhibitionHalls\
    \ h ON h.Hall_ID = s.hall_ref\n    LEFT JOIN main.ConservationAndMaintenance cm ON cm.monitor_link\
    \ = e.monitor_code\n    LEFT JOIN main.UsageRecords u ON u.env_link = e.monitor_code\n  ) b\n) x\n\
    ) t\n"
  domains:
  - sensitivity
- name: temperature_reading_band
  description: 'Temperature implications: 18-22 C ''Ideal''; outside 10-30 C ''Possible Control Failure'';
    else ''Outside Ideal''. Fluctuations > 2 C in 24 h (tempVar24 > 2) stress materials.

    '
  sql_expression: "CASE WHEN e.TEMPc IS NULL THEN NULL WHEN e.TEMPc < 10 OR e.TEMPc > 30 THEN 'Possible\
    \ Control Failure'\n     WHEN e.TEMPc BETWEEN 18 AND 22 THEN 'Ideal' ELSE 'Outside Ideal' END\n"
  source_model: main.EnvironmentalReadingsCore
  from_sql: main.EnvironmentalReadingsCore e
  grain: one row per environmental reading
  domains:
  - environment
- name: relative_humidity_band
  description: 'RH implications: 45-55% ''Ideal''; below 30% or above 65% ''Significant Risk''; else ''Outside
    Ideal''. Fluctuations > 5% in 24 h (RHvar > 5) are risky.

    '
  sql_expression: "CASE WHEN e.RH IS NULL THEN NULL WHEN e.RH < 30 OR e.RH > 65 THEN 'Significant Risk'\n\
    \     WHEN e.RH BETWEEN 45 AND 55 THEN 'Ideal' ELSE 'Outside Ideal' END\n"
  source_model: main.EnvironmentalReadingsCore
  from_sql: main.EnvironmentalReadingsCore e
  grain: one row per environmental reading
  domains:
  - environment
- name: pm25_band
  description: 'PM2.5 (ug/m3): < 5 ''Clean''; > 30 ''Hazardous''; > 15 ''Potential Risk''; 5-15 ''Acceptable''
    (not named by docs).'
  sql_expression: "CASE WHEN CAST(aq.air_quality_metrics->>'$.particulates.pm25_ug_m3' AS DOUBLE) IS NULL\
    \ THEN NULL\n     WHEN CAST(aq.air_quality_metrics->>'$.particulates.pm25_ug_m3' AS DOUBLE) > 30 THEN\
    \ 'Hazardous'\n     WHEN CAST(aq.air_quality_metrics->>'$.particulates.pm25_ug_m3' AS DOUBLE) > 15\
    \ THEN 'Potential Risk'\n     WHEN CAST(aq.air_quality_metrics->>'$.particulates.pm25_ug_m3' AS DOUBLE)\
    \ < 5 THEN 'Clean'\n     ELSE 'Acceptable' END\n"
  source_model: main.AirQualityReadings
  from_sql: main.AirQualityReadings aq
  grain: one row per air quality reading
  domains:
  - environment
- name: conservation_environment_chronology
  description: 'CEC: group environmental readings into fixed intervals, e.g. by year of readTS (use date_trunc(''month'',
    ...) for monthly).'
  sql_expression: EXTRACT(year FROM e.readTS)
  source_model: main.EnvironmentalReadingsCore
  from_sql: main.EnvironmentalReadingsCore e
  grain: one row per environmental reading
  domains:
  - environment
tables:
- schema: main
  table: ArtifactsCore
  columns:
  - name: ARTregID
    type: VARCHAR
    description: Artifact id (PK).
  - name: DYNASTY
    type: VARCHAR
    description: Han, Ming, Qing, Song, Tang, Yuan. Ming/Han/Tang are the documented historically significant
      dynasties.
  - name: ageYears
    type: BIGINT
    description: Age in years; used in MDR.
  - name: MatKind
    type: VARCHAR
    description: 'Material. Organic materials: Wood, Textile, Paper.'
  - name: conserve_status
    type: VARCHAR
    description: Excellent (recently conserved, no issues)=1, Good (stable, minor issues)=3, Fair (stable,
      noticeable issues)=5, Poor (active deterioration)=7, Critical (severe deterioration, immediate intervention)=10
      for CPI. NULL = not provided (150 rows).
- schema: main
  table: ArtifactRatings
  columns:
  - name: HIST_sign
    type: BIGINT
    description: 'Historical Significance Rating, 1-10: 1-3 minor, 4-7 moderate, 8-10 exceptional historical
      importance. Only 10 artifacts are rated.'
  - name: ART_link
    type: VARCHAR
    description: FK to ArtifactsCore.ARTregID.
  - name: rating_profile
    type: JSON
    description: 'JSON: research_score (Research Value Rating), cultural_score, exhibit_value, educational_value,
      public_access_rating, conservation_difficulty, treatment_complexity, material_stability, deterioration_rate.
      Extract with ->>''$.field'' and CAST to DOUBLE.'
- schema: main
  table: SensitivityData
  columns:
  - name: ENVsense
    type: VARCHAR
    description: Overall environmental sensitivity rating (High/Low/Medium); PK, so only 3 artifacts have
      sensitivity data.
  - name: ART_link
    type: VARCHAR
    description: FK to ArtifactsCore.ARTregID.
  - name: env_handling_sensitivity
    type: JSON
    description: JSON paths $.environment.light/temperature/humidity/vibration/pollutants, $.biological.pest,
      $.handling_transport.handling/transport, $.context.display/storage; values Low/Medium/High (weights
      1/5/10), JSON null -> SQL NULL.
- schema: main
  table: ExhibitionHalls
  columns:
  - name: Hall_ID
    type: VARCHAR
    description: Hall id, e.g. Hall-3 (20 halls).
  - name: security_visitor_overview
    type: JSON
    description: JSON $.security.cctv_coverage ('Full' = 100% space coverage, 'Partial' = 60-90%, 'Limited'
      = less than 60%), motion_detection, alarm_status, access_control; $.visitor_statistics.avg_daily_visitors,
      visitor_flow (Low=1, Medium=3, High=5 for VIR), avg_dwell_minutes; $.behaviour_notes.
- schema: main
  table: Showcases
  columns:
  - name: caseID
    type: VARCHAR
    description: Showcase id.
  - name: hall_ref
    type: VARCHAR
    description: FK to ExhibitionHalls.Hall_ID.
  - name: case_environment_profile
    type: JSON
    description: JSON $.physical_state.leak_rate_per_day (air changes/day; < 0.1 museum grade, up to 5.0
      poor; used in SESR), airtightness_factor (different scale), seal_state, internal_pressure_pa, construction_material;
      $.maintenance.maint_status/filter_status/silica_status/silica_last_replaced; $.buffer_capacity;
      $.safety_and_power.
- schema: main
  table: EnvironmentalReadingsCore
  columns:
  - name: monitor_code
    type: VARCHAR
    description: Reading id; target of env_link / monitor_link FKs.
  - name: readTS
    type: TIMESTAMP
    description: Reading time, 2024-02-19 to 2025-02-19.
  - name: case_link
    type: VARCHAR
    description: FK to Showcases.caseID.
  - name: TEMPc
    type: BIGINT
    description: Temperature C (integer, 18-22 observed). Ideal 18-22; outside 10-30 may mean control
      failure. NULL in 150 rows.
  - name: tempVar24
    type: FLOAT
    description: 24h temperature variation C; > 1 is an instability event; > 2 stresses materials.
  - name: RH
    type: BIGINT
    description: Relative humidity % (45-55 observed). Ideal 45-55; < 30 or > 65 significant risk.
  - name: RHvar
    type: BIGINT
    description: 24h RH variation %; > 3 is an instability event; > 5 risky.
- schema: main
  table: LightAndRadiationReadings
  columns:
  - name: rad_id
    type: BIGINT
    description: PK; ConditionAssessments.light_link points here.
  - name: env_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: lux
    type: BIGINT
    description: 'Light level in lux (LER input). Limits: 50 lux high sensitivity, 150-200 medium, 300
      low.'
  - name: visLxh
    type: BIGINT
    description: Visible light exposure in lux-hours (LER input).
- schema: main
  table: ConditionAssessments
  columns:
  - name: art_exam
    type: VARCHAR
    description: FK to ArtifactsCore; the artifact's link to showcase and readings.
  - name: case_exam
    type: VARCHAR
    description: FK to Showcases.
  - name: light_link
    type: BIGINT
    description: FK to LightAndRadiationReadings.rad_id; the 1:1 path to the artifact's environmental
      reading.
- schema: main
  table: ConservationAndMaintenance
  columns:
  - name: monitor_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: prio_tag
    type: VARCHAR
    description: 'Treatment priority: Low/Medium/High/Urgent; ''Urgent'' + Critical status = Conservation
      Emergency.'
  - name: lastClean
    type: DATE
    description: Last cleaning date; days since = CURRENT_DATE - lastClean (CBR).
  - name: nextClean
    type: DATE
    description: Next scheduled cleaning; Overdue Days = CURRENT_DATE - nextClean.
  - name: cleanDays
    type: BIGINT
    description: Documented as days since last cleaning, but does not match the dates; used as the cleaning
      interval in CBR.
  - name: budget_alloc
    type: VARCHAR
    description: 'Adequate / Insufficient / Review Required (text, no amount). Budget weight for CBE:
      1.0 / 0.0 / 0.5.'
- schema: main
  table: UsageRecords
  columns:
  - name: env_link
    type: VARCHAR
    description: FK to EnvironmentalReadingsCore.monitor_code.
  - name: displayMonths
    type: BIGINT
    description: Months on display (current display duration) for rotation candidate and ERPS.
- schema: main
  table: ArtifactSecurityAccess
  columns:
  - name: loan_stat
    type: VARCHAR
    description: PK (On Loan / Available / Not Available). Table has 3 rows and no artifact key.
  - name: insUSD
    type: FLOAT
    description: Insurance value USD; > 1,000,000 = monetary high value / ARV (max is 968,368).
  - name: SEC_LEVEL
    type: VARCHAR
    description: Level 1-3; all rows are Level 3.
- schema: main
  table: AirQualityReadings
  columns:
  - name: air_quality_metrics
    type: JSON
    description: JSON $.particulates.pm25_ug_m3 (< 5 clean, > 15 risk, > 30 hazardous), pm10_ug_m3; $.gases_ppm_ppb.co2_ppm
      is TEXT like '794 ppm'; tvoc_ppb, ozone_ppb, so2_ppb, no2_ppb, formaldehyde_mg_m3; $.air_flow.
- schema: main
  table: Monitor_Showcase_Map
  columns:
  - name: mon_ID
    type: VARCHAR
    description: Monitor id (= EnvironmentalReadingsCore.monitor_code).
  - name: case_ID
    type: VARCHAR
    description: FK to Showcases.caseID.
relationships:
- from: main.ConditionAssessments.art_exam
  to: main.ArtifactsCore.ARTregID
  type: many_to_one
- from: main.ConditionAssessments.light_link
  to: main.LightAndRadiationReadings.rad_id
  type: many_to_one
- from: main.ConditionAssessments.case_exam
  to: main.Showcases.caseID
  type: many_to_one
- from: main.LightAndRadiationReadings.env_link
  to: main.EnvironmentalReadingsCore.monitor_code
  type: many_to_one
- from: main.EnvironmentalReadingsCore.case_link
  to: main.Showcases.caseID
  type: many_to_one
- from: main.Showcases.hall_ref
  to: main.ExhibitionHalls.Hall_ID
  type: many_to_one
- from: main.ConservationAndMaintenance.monitor_link
  to: main.EnvironmentalReadingsCore.monitor_code
  type: many_to_one
- from: main.UsageRecords.env_link
  to: main.EnvironmentalReadingsCore.monitor_code
  type: many_to_one
- from: main.AirQualityReadings.env_link
  to: main.EnvironmentalReadingsCore.monitor_code
  type: many_to_one
- from: main.SurfaceAndPhysicalReadings.env_link
  to: main.EnvironmentalReadingsCore.monitor_code
  type: many_to_one
- from: main.ArtifactRatings.ART_link
  to: main.ArtifactsCore.ARTregID
  type: many_to_one
- from: main.SensitivityData.ART_link
  to: main.ArtifactsCore.ARTregID
  type: many_to_one
- from: main.RiskAssessments.art_concern
  to: main.ArtifactsCore.ARTregID
  type: many_to_one
- from: main.RiskAssessments.hall_concern
  to: main.ExhibitionHalls.Hall_ID
  type: many_to_one
- from: main.Monitor_Showcase_Map.mon_ID
  to: main.EnvironmentalReadingsCore.monitor_code
  type: many_to_one
