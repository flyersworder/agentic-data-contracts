- name: showcase_environmental_stability_rating
  description: 'SESR = 10 - ((tempVar24 + RHvar / 5 + leak_rate_per_day) / 3), per environmental reading
    of a showcase (EnvironmentalReadingsCore.case_link = Showcases.caseID; 999 readings over 952 showcases,
    so a few showcases have 2 readings). Higher = more stable. NULL when tempVar24 is NULL. The same value
    per artifact is t.sesr in artifact_scores.

    '
  sql_expression: '10 - ((e.tempVar24 + e.RHvar / 5.0 + CAST(s.case_environment_profile->>''$.physical_state.leak_rate_per_day''
    AS DOUBLE)) / 3)

    '
  source_model: main.Showcases
  from_sql: main.EnvironmentalReadingsCore e JOIN main.Showcases s ON s.caseID = e.case_link
  grain: one row per environmental reading of a showcase
  domains:
  - showcases
- name: showcase_failure_risk
  description: 'TRUE when SESR < 4 OR at least three maintenance indicators are critical: seal_state ''Poor'',
    maint_status ''Overdue'', filter_status ''Replace Now'', silica_status ''Replace Now'' (NULL indicator
    counts as not critical).

    '
  sql_expression: "(10 - ((e.tempVar24 + e.RHvar / 5.0 + CAST(s.case_environment_profile->>'$.physical_state.leak_rate_per_day'\
    \ AS DOUBLE)) / 3)) < 4\nOR (CASE WHEN s.case_environment_profile->>'$.physical_state.seal_state'\
    \ = 'Poor' THEN 1 ELSE 0 END\n  + CASE WHEN s.case_environment_profile->>'$.maintenance.maint_status'\
    \ = 'Overdue' THEN 1 ELSE 0 END\n  + CASE WHEN s.case_environment_profile->>'$.maintenance.filter_status'\
    \ = 'Replace Now' THEN 1 ELSE 0 END\n  + CASE WHEN s.case_environment_profile->>'$.maintenance.silica_status'\
    \ = 'Replace Now' THEN 1 ELSE 0 END) >= 3\n"
  source_model: main.Showcases
  from_sql: main.EnvironmentalReadingsCore e JOIN main.Showcases s ON s.caseID = e.case_link
  grain: one row per environmental reading of a showcase
  domains:
  - showcases
- name: secondary_stability_threshold_risk
  description: 'Less stringent stability check: SESR < 5 (instead of < 4) prompts deeper evaluation.'
  sql_expression: '(10 - ((e.tempVar24 + e.RHvar / 5.0 + CAST(s.case_environment_profile->>''$.physical_state.leak_rate_per_day''
    AS DOUBLE)) / 3)) < 5

    '
  source_model: main.Showcases
  from_sql: main.EnvironmentalReadingsCore e JOIN main.Showcases s ON s.caseID = e.case_link
  grain: one row per environmental reading of a showcase
  domains:
  - showcases
- name: showcase_airtightness_grade
  description: 'Airtightness in air changes per day = physical_state.leak_rate_per_day: below 0.1 is museum
    grade; higher values are below museum grade, and values up to 5.0 indicate poor airtightness. airtightness_factor
    is a different scale and is not used.

    '
  sql_expression: "CASE WHEN CAST(s.case_environment_profile->>'$.physical_state.leak_rate_per_day' AS\
    \ DOUBLE) < 0.1 THEN 'Museum Grade'\n     WHEN CAST(s.case_environment_profile->>'$.physical_state.leak_rate_per_day'\
    \ AS DOUBLE) IS NOT NULL THEN 'Below Museum Grade' END\n"
  source_model: main.Showcases
  from_sql: main.Showcases s
  grain: one row per showcase
  domains:
  - showcases
