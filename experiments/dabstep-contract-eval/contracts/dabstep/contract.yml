  - name: 3_merchant_category_code
    summary: 3 Merchant Category Code
    description: '## 3. Merchant Category Code


      The Merchant Category Code (MCC) is a four-digit code assigned to a merchant by the card networks,
      also known as schemes (e.g. Visa, Mastercard), to categorize their business type. The MCC is used
      to determine the type of business or industry a merchant is in, and is often used for risk assessment,
      fraud detection, and accounting purposes.


      The MCC is typically assigned by the merchant''s bank or payment processor, and is used to classify
      merchants into one of over 400 categories. Each category corresponds to a specific industry or business
      type, such as retail, restaurant, hotel, or healthcare.


      The MCC is usually represented by a four-digit code, such as 5451 (Automated Fuel Dispensers) or
      5812 (Automotive Parts and Accessories Stores). The first two digits of the MCC indicate the category,
      while the last two digits indicate the subcategory.


      Here is an example of how the MCC might be used in a merchant''s account information:


      Merchant Name: ABC Car Dealership

      Merchant Category Code (MCC): 5521 (Motor Vehicle Dealers - New and Used Cars)

      Business Type: Retail

      The MCC is an important piece of information for merchants, as it can affect their payment processing
      rates, fees, and other business operations.


      You can find a complete list of MCC in the annexed file `merchant_category_codes.csv`.


      Compiler note: Section 3 is descriptive prose about what MCC codes are and how they are structured/used;
      it states no computable rule, threshold, or condition over the data (merchant_category_codes just
      stores the code-description mapping referenced here, no derived metric to encode).'
  - name: 4_authorization_characteristics_indicator_aci
    summary: 4 Authorization Characteristics Indicator (ACI)
    description: '## 4. Authorization Characteristics Indicator (ACI)


      The Authorization Characteristics Indicator is a field that facilitates the identification of the
      transaction flow submitted to the acquirer. This indicator provides a standardized method for describing
      the manner in which the transaction was sent to the acquirer.


      The following table outlines the possible values for the Authorization Characteristics Indicator:


      | Authorization Characteristic Indicator | Details                            |

      |----------------------------------------|------------------------------------|

      | A                                      | Card present - Non-authenticated   |

      | B                                      | Card Present - Authenticated       |

      | C                                      | Tokenized card with mobile device  |

      | D                                      | Card Not Present - Card On File    |

      | E                                      | Card Not Present - Recurring Bill Payment |

      | F                                      | Card Not Present - 3-D Secure      |

      | G                                      | Card Not Present - Non-3-D Secure  |


      Compiler note: This section only defines a lookup table mapping ACI codes (A-G) to their descriptions.
      It states no computation or row-level condition over the database; the `aci` column in payments/fees
      already stores these codes directly as values, so there is nothing to encode as a metric.'
  - name: 5_understanding_payment_processing_fees
    summary: 5 Understanding Payment Processing Fees
    description: "## 5. Understanding Payment Processing Fees\n\nPayment Processing Fees depend on a number\
      \ of characteristics. These characteristics belong to either the merchant or the transaction.\n\n\
      Merchant characteritics include \n\n* **ID**: identifier of the fee rule within the rule fee dataset\n\
      * **card_scheme**: string type. name of the card scheme or network that the fee applies to\n* **account_type**:\
      \ list type. list of account types according to the categorization `Account Type` in this manual\n\
      * **capture_delay**: string type. rule that specifies the number of days in which the capture from\
      \ authorization to settlement needs to happen. Possible values are '3-5' (between 3 and 5 days),\
      \ '>5' (more than 5 days is possible), '<3' (before 3 days), 'immediate', or 'manual'. The faster\
      \ the capture to settlement happens, the more expensive it is.\n* **monthly_fraud_level**: string\
      \ type. rule that specifies the fraud levels measured as ratio between monthly total volume and\
      \ monthly volume notified as fraud. For example '7.7%-8.3%' means that the ratio should be between\
      \ 7.7 and 8.3 percent. Generally, the payment processors will become more expensive as fraud rate\
      \ increases.\n* **monthly_volume**: string type. rule that specifies the monthly total volume of\
      \ the merchant. '100k-1m' is between 100.000 (100k) and 1.000.000 (1m). All volumes are specified\
      \ in euros. Normally merchants with higher volume are able to get cheaper fees from payments processors.\n\
      * **merchant_category_code**: list type. integer that specifies the possible merchant category codes,\
      \ according to the categorization found in this manual in the section `Merchant Category Code`.\
      \ eg: `[8062, 8011, 8021]`.\n* **is_credit**: bool. True if the rule applies for credit transactions.\
      \ Typically credit transactions are more expensive (higher fee).\n* **aci**: list type. string that\
      \ specifies an array of possible Authorization Characteristics Indicator (ACI) according to the\
      \ categorization specified in this manual in the section `Authorization Characteristics Indicator`.\n\
      * **fixed_amount**: float. Fixed amount of the fee in euros per transaction, for the given rule.\n\
      * **rate**: integer. Variable rate to be especified to be multiplied by the transaction value and\
      \ divided by 10000.\n* **intracountry**: bool. True if the transaction is domestic, defined by the\
      \ fact that the issuer country and the acquiring country are the same. False are for international\
      \ transactions where the issuer country and acquirer country are different and typically are more\
      \ expensive.\n\n**Notes**:\n* The fee then is provided by `fee = fixed_amount + rate * transaction_value\
      \ / 10000`.\n* Monthly volumes and rates are computed always in natural months (e.g. January, February),\
      \ starting always in day 1 and ending in the last natural day of the month (i.e. 28 for February,\
      \ 30 or 31).\n* Fixed amount and transaction values are given in the same currency, typically euros.\n\
      * If a field is set to null it means that it applies to all possible values of that field. E.g.\
      \ null value in aci means that the rules applies for all possible values of aci.\n\nThe full list\
      \ of fee rules and values depending on these characteristics can be found in the annexed file `fees.json`.\n\
      \nCompiler note: Encoded only the 'intracountry' definition (issuing_country = acquirer_country\
      \ on payments) since it is a concrete condition over existing columns. The fee formula (fee = fixed_amount\
      \ + rate * transaction_value / 10000) cannot be encoded as a single-table metric because it requires\
      \ combining a specific fee rule row (fees table) with a specific transaction's eur_amount (payments\
      \ table) - there's no join key given to match them uniquely, so this is left out. All other items\
      \ in this section (ID, card_scheme, account_type, capture_delay, monthly_fraud_level, monthly_volume,\
      \ merchant_category_code, is_credit, aci, fixed_amount, rate) are schema/field descriptions rather\
      \ than computations or conditions, so no metrics are derived from them."
