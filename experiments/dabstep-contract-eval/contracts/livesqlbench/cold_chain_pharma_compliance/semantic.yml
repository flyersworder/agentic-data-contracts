    type: VARCHAR
    description: 'text. Cost-optimisation opportunities. **NULL means none identified.**. Possible values:
      High, Low, Medium.'
  - name: sustainimpact
    type: VARCHAR
    description: 'text. Sustainability impact assessment. **NULL means not assessed.**. Possible values:
      Negative, Neutral, Positive.'
  - name: carbonkg
    type: FLOAT
    description: 'real. Estimated carbon footprint in kg CO₂-e. **NULL means footprint not calculated.**.
      Example: 2617.3.'
  - name: energyscore
    type: VARCHAR
    description: 'text. Energy efficiency score. **NULL means score not set.**. Example: 81.0.'
  - name: docformat
    type: VARCHAR
    description: 'text. Review document format. Possible values: Electronic, Hybrid, Paper.'
  - name: dataintegrity
    type: VARCHAR
    description: 'text. Data integrity verification status. Possible values: Compromised, Under Review,
      Verified.'
  - name: audittrailcomplete
