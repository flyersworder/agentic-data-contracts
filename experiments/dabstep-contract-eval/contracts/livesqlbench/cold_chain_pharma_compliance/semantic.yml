- schema: main
  table: shipments
  columns:
  - name: reckey
    type: VARCHAR
    description: 'text. Unique shipment record key. PK. Example: CC381686.'
  - name: log_ts
    type: TIMESTAMP
    description: 'timestamp. Log-creation timestamp for this record. **NULL means record creation time
      not captured.**. Example: 2025-01-29T16:01:15.'
  - name: shiptok
    type: VARCHAR
    description: 'text. Human-friendly shipment token (unique within system). Example: SH88875.'
  - name: shipment_overview
    type: JSON
    description: 'JSONB column. Groups routing, timing and risk-performance metadata of a single cold-chain
      shipment so that dashboards can fetch a complete lane summary from one JSONB field. Fields: {"route":
      {"origin": {"hub": "text. Code of the originating logistics hub. Example: Gonzales-Lopez Facility.",
      "address": "text. Street-level origin address. Example: 0131 Johnson Station\nNew Tinatown, FL 65757.",
      "nation": "text. ISO country code of origin. **NULL means country not provided.**. Example: Fiji."},
      "destination": {"hub": "text. Code of the destination logistics hub. Example: Williams-Aguilar Hospital.",
      "address": "text. Street-level destination address. Example: 7209 West Flats\nEast Tonya, OR 13658.",
      "nation": "text. ISO country code of destination. **NULL means country not provided.**. Example:
      Bouvet Island (Bouvetoya)."}, "route_string": "text. Encoded string of planned route waypoints.
      Example: Fiji -> Bouvet Island (Bouvetoya).", "risk_note": "text. Qualitative notes on route-specific
      risks. Possible values: High, Low, Medium."}, "timing_performance": {"go_time_ts": "timestamp. Planned
      departure timestamp. Example: 2025/2/17 19:29.", "planned_eta_hrs": "bigint. Estimated transit time
      in hours. Example: 27.6.", "actual_duration_hrs": "bigint. Actual transit time in hours. **NULL
      means actual hours not yet recorded.**. Example: 10.2.", "end_time_ts": "timestamp. Actual arrival
      timestamp. Possible values: 2025/2/19 08:29.", "distance_km": "bigint. Total kilometres travelled
      for the shipment. Example: 2608."}}


      Route Risk Classification: Categorizes shipping routes based on their risk level for temperature
      excursions.


      Routes are classified as: ''Low Risk'' (0-1 historical excursion events per 10 shipments), ''Medium
      Risk'' (2-4 historical excursion events per 10 shipments), ''High Risk'' (5+ historical excursion
      events per 10 shipments).


      Compiler note: Describes the categorical values (''Low''/''Medium''/''High'') stored at shipment_overview->route->risk_note,
      which already holds exactly these three labels for route risk level; verified via query showing
      only Low/Medium/High (plus nulls) present.


      Delivery Performance Classification: Categorizes delivery performance based on variance from expected
      delivery time.


      Shipments are classified as: ''Early'' (>2 hours before scheduled time), ''On-Time'' (within ±2
      hours of scheduled time), ''Delayed'' (2-24 hours after scheduled time), ''Severely Delayed'' (>24
      hours after scheduled time).


      Compiler note: Classification is computable from shipment_overview->''timing_performance'' fields
      (actual_duration_hrs vs planned_eta_hrs, or end_time_ts vs go_time_ts+planned_eta_hrs) within the
      shipments table; no other table needed.'
- schema: main
  table: shipsensorlink
  columns:
  - name: shpnode
    type: VARCHAR
    description: text. Shipment record key in link. PK. FK to Shipments.
  - name: devnode
    type: VARCHAR
    description: text. Monitoring-device reference in link. PK. FK to MonitoringDevices.
- schema: main
  table: vehicles
  columns:
  - name: vehref
    type: VARCHAR
    description: 'text. Unique vehicle reference identifier. PK. Example: VH6122.'
  - name: carrierbond
    type: VARCHAR
    description: text. Carrier identifier to which the vehicle belongs. FK to Carriers.
  - name: vehtype
    type: VARCHAR
    description: 'text. Vehicle type (e.g., van, truck, reefer). Possible values: Aircraft, Container,
      Reefer Truck, Van.'
  - name: veh_qual
    type: VARCHAR
    description: 'text. Qualitative vehicle qualification/status. Possible values: Qualified, Under Review,
      Validated.


      Cold Chain Vehicle Qualification Status: Illustrates the validation levels of vehicles used in pharmaceutical
      transport.


      Vehicles can be classified as: ''Validated'' (fully validated through performance and temperature
      mapping studies), ''Qualified'' (basic qualification but not fully validated), ''Unqualified'' (not
      formally qualified for pharmaceutical transport).


      Compiler note: Checked distinct values: Qualified, Validated, Under Review. Entry describes ''Validated'',
      ''Qualified'', ''Unqualified'' categories which don''t exactly match (actual data has ''Under Review''
      instead of ''Unqualified''), but this column is clearly the one being described (vehicle qualification/validation
      status).'
  - name: temp_mon_sys
    type: VARCHAR
    description: 'text. Temperature-monitoring system installed. Possible values: Continuous, Interval,
      Manual.


      Vehicle Temperature Monitoring Types: Methods used to monitor temperatures in transport vehicles.


      Vehicle temperature monitoring types include: ''Continuous'' (uninterrupted monitoring throughout
      transport), ''Interval'' (periodic checks at predetermined times), ''None'' (no active monitoring),
      with null values indicating monitoring type was not specified in documentation.


      Compiler note: Column stores vehicle temperature monitoring method. Actual distinct values are ''Continuous'',
      ''Interval'', ''Manual'' (plus NULL), not ''None'' as the entry states - likely a naming mismatch
      for the same concept (no active monitoring).'
