  columns:
  - name: AUDIT_TRACE
    type: BIGINT
    description: BIGINT. Unique audit record identifier. PK.
  - name: profjoin
    type: BIGINT
    description: BIGINT. Linked data-profile identifier. FK to DataProfile.
  - name: COMP_JOIN
    type: BIGINT
    description: BIGINT. Linked compliance identifier. FK to Compliance.
  - name: VendJoin
    type: BIGINT
    description: BIGINT. Linked vendor-management identifier. FK to VendorManagement.
  - name: record_registry
    type: VARCHAR
    description: TEXT. Record registry reference string.
  - name: AudtrailState
    type: VARCHAR
    description: 'TEXT. Audit-trail state descriptor. Possible values: Complete, Missing, Partial. Possible
      values: Complete, Missing, Partial.'
  - name: FINDTALLY
    type: BIGINT
    description: 'BIGINT. Total findings tally. Example: 3. Example: 3.'
  - name: critFindNum
    type: BIGINT
    description: 'BIGINT. Number of critical findings. **NULL means no critical findings recorded.**.
      Example: 6.0. Example: 6.0.'
  - name: remed_state
    type: VARCHAR
    description: 'TEXT. Remediation state descriptor. Possible values: Completed, In Progress, Not Started.
      Possible values: Completed, In Progress, Not Started.'
  - name: REMED_DUE
    type: DATE
    description: 'DATE. Remediation due date. Example: 2025-03-16. Example: 2025-03-16.'
  - name: authNotify
    type: VARCHAR
    description: 'TEXT. Authority-notification status. **NULL means authority not notified.**. Possible
      values: Not Required, Required, Submitted. Possible values: Not Required, Required, Submitted.'
  - name: border_mech
    type: VARCHAR
    description: 'TEXT. Cross-border mechanism descriptor. Possible values: Adequacy Decision, BCRs, Derogations,
      SCCs. Possible values: Adequacy Decision, BCRs, Derogations, SCCs.'
  - name: TRANSIMPASSESS
    type: VARCHAR
    description: 'TEXT. Transfer impact assessment status. **NULL means assessment not performed.**. Possible
      values: Completed, In Progress, Required. Possible values: Completed, In Progress, Required.'
  - name: localReqs
    type: VARCHAR
    description: 'TEXT. Local requirements descriptor. Possible values: Met, Not Met, Partial. Possible
      values: Met, Not Met, Partial.'
  - name: data_map_state
    type: VARCHAR
    description: 'TEXT. Data-mapping state. Possible values: Complete, Outdated, Partial. Possible values:
      Complete, Outdated, Partial.'
  - name: SYSINTSTATE
    type: VARCHAR
    description: 'TEXT. System-integration state. Possible values: Fully Integrated, Manual, Partial.
      Possible values: Fully Integrated, Manual, Partial.'
  - name: AccReqNum
    type: BIGINT
    description: 'BIGINT. Data-access request count. Example: 959. Example: 959.'
  - name: DEL_REQ_NUM
    type: BIGINT
    description: 'BIGINT. Deletion request count. Example: 409. Example: 409.'
  - name: rect_req_num
    type: BIGINT
    description: 'BIGINT. Rectification request count. Example: 76. Example: 76.'
  - name: PORTREQNUM
    type: BIGINT
    description: 'BIGINT. Portability request count. Example: 53. Example: 53.'
  - name: resp_time_day
    type: FLOAT
    description: 'REAL. Average response time in days. Example: 4.5. Example: 4.5.


      Response Time: Shows how many days it takes to reply to a request.


      Lower means faster response; higher means delays.


      Compiler note: Matches AuditAndCompliance.resp_time_day: average response time in days (e.g., 4.5,
      13.4, 23.2) - lower means faster response, higher means delays, consistent with the entry''s description.'
- schema: main
  table: Compliance
