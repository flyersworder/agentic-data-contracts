    description: 'BIGINT. Log-retention period in days. Example: 905. Example: 905.


      Audit Log Retention: Shows for how many days logs are kept.


      Higher means longer history is available.


      Compiler note: Matches SecurityProfile.LogRetDays, the log-retention period in days.'
  - name: bkp_state
    type: VARCHAR
    description: 'TEXT. Backup state descriptor. **NULL means backup state not documented.**. Possible
      values: Current, Failed, Outdated. Possible values: Current, Failed, Outdated.'
  - name: DRECSTATE
    type: VARCHAR
    description: 'TEXT. Data-recovery state descriptor. Possible values: Missing, Tested, Untested. Possible
      values: Missing, Tested, Untested.'
  - name: bc_state
    type: VARCHAR
    description: 'TEXT. Business-continuity or blockchain state descriptor. Possible values: Active, Outdated,
      Review Required. Possible values: Active, Outdated, Review Required.'
