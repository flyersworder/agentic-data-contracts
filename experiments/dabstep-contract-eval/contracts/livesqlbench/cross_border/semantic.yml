      Possible values: Adequate, Strong, Weak.'
  - name: APISECSTATE
    type: VARCHAR
    description: 'TEXT. API security state descriptor. **NULL means API security not assessed.**. Possible
      values: Review Required, Secure, Vulnerable. Possible values: Review Required, Secure, Vulnerable.'
  - name: logIntCheck
    type: VARCHAR
    description: 'TEXT. Logging integrity-check status. Possible values: Failed, Passed, Pending. Possible
      values: Failed, Passed, Pending.'
  - name: LogRetDays
