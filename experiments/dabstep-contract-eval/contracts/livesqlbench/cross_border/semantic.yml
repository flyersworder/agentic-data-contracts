      Compiler note: Matches values Compliant/Non-compliant/Partial, GDPR compliance indicator column.'
  - name: CCPA_COMP
    type: VARCHAR
    description: 'TEXT. CCPA compliance indicator. Possible values: Compliant, Non-compliant, Partial.
      Possible values: Compliant, Non-compliant, Partial.'
