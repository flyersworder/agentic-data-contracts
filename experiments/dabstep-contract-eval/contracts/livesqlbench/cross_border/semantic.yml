  - name: Record_Registry
    type: VARCHAR
    description: TEXT. Record registry reference string.
  - name: DATATYPE
    type: VARCHAR
    description: 'TEXT. Primary data-type description. Possible values: Commercial, Financial, Industrial,
      Medical, Personal.'
  - name: dataSense
    type: VARCHAR
    description: 'TEXT. Data-sensitivity description. Possible values: Critical, High, Low, Medium.'
  - name: vol_gb
    type: FLOAT
    description: 'REAL. Volume of data in gigabytes. Example: 1093.6. Example: 1093.6.


      Data Volume: Shows the size of the data batch, in gigabytes.


      Ranges from small amounts (like 0.1) to large ones (like 1000).


      Compiler note: Describes vol_gb column: data batch volume in GB.'
  - name: REC_TALLY
    type: BIGINT
    description: 'BIGINT. Total number of data records. Example: 2629296. Example: 2629296.'
  - name: subjectTally
    type: BIGINT
    description: 'BIGINT. Count of data subjects represented. Example: 754585. Example: 754585.'
  - name: ret_days
    type: BIGINT
    description: 'BIGINT. Data-retention period in days. Example: 2208. Example: 2208.'
  - name: FormatType
    type: VARCHAR
    description: 'TEXT. Data-format type (e.g., CSV, Parquet). Possible values: Mixed, Structured, Unstructured.
      Possible values: Mixed, Structured, Unstructured.'
  - name: qlty_score
    type: FLOAT
    description: 'REAL. Data quality score. Example: 52.45. Example: 52.45.'
  - name: Int_check
    type: VARCHAR
    description: 'TEXT. Data-integrity check result. **NULL means integrity check not performed.**. Possible
      values: Failed, Partial, Passed. Possible values: Failed, Partial, Passed.'
  - name: CSUMVERIFY
    type: VARCHAR
    description: 'TEXT. Checksum-verification status. Possible values: Failed, Pending, Success. Possible
      values: Failed, Pending, Success.'
  - name: srcValState
    type: VARCHAR
    description: 'TEXT. Source-validation state. **NULL means source validation not performed.**. Possible
      values: Failed, Pending, Verified. Possible values: Failed, Pending, Verified.'
  - name: DEST_VAL_state
    type: VARCHAR
    description: 'TEXT. Destination-validation state. Possible values: Failed, Pending, Verified. Possible
      values: Failed, Pending, Verified.'
- schema: main
  table: RiskManagement
  columns:
  - name: RISKTRACE
    type: BIGINT
    description: BIGINT. Unique risk-management record identifier. PK.
  - name: flow_link
    type: VARCHAR
    description: TEXT. Identifier of the related data-flow record. FK to DataFlow.
  - name: recordRegistry
    type: VARCHAR
    description: TEXT. Redundant record registry reference string.
  - name: risk_management_profile
    type: JSON
    description: 'JSONB column. Bundles quantitative risk scores, mitigation progress, incident history,
      cost exposure and compliance-maturity indicators into one JSONB structure for quick reporting and
      comparative risk analytics. Fields: {"assessment": {"risk_score": "REAL. Quantitative risk-assessment
      score. Example: 75.89. Example: 75.89.", "residual_risk_level": "TEXT. Residual risk-level descriptor.
      Possible values: High, Low, Medium. Possible values: High, Low, Medium.", "control_effectiveness_pct":
      "REAL. Control effectiveness score. **NULL means control effectiveness not evaluated.**. Example:
      30.51. Example: 30.51.", "compliance_score": "REAL. Compliance score. Example: 76.41. Example: 76.41.",
      "maturity_level": "TEXT. Process-maturity level descriptor. Possible values: Initial, Managed, Optimized.
      Possible values: Initial, Managed, Optimized."}, "mitigation": {"mitigation_state": "TEXT. Current
      risk-mitigation state. Possible values: Implemented, Partial, Pending. Possible values: Implemented,
      Partial, Pending.", "secure_action": "TEXT. Security action plan description. Possible values: Adequate,
      Insufficient, Strong. Possible values: Adequate, Insufficient, Strong.", "breach_notification":
      "TEXT. Breach-notification status. Possible values: Established, Missing, Partial. Possible values:
      Established, Missing, Partial.", "incident_plan_status": "TEXT. Incident-response plan descriptor.
      Possible values: Active, Missing, Outdated. Possible values: Active, Missing, Outdated.", "plan_state":
      "TEXT. Risk-management plan state. **NULL means plan state not set.**. Possible values: Delayed,
      Not Started, On Track. Possible values: Delayed, Not Started, On Track.", "next_review_date": "DATE.
      Next scheduled risk review date. Example: 2025-06-02. Example: 2025-06-02."}, "incident_statistics":
      {"incident_count": "BIGINT. Total number of recorded incidents. Example: 8. Example: 8.", "breach_count":
      "BIGINT. Number of data breaches. **NULL means no breaches recorded.**. Example: 1.0. Example: 1.0.",
      "near_miss_count": "BIGINT. Near-miss incident count. **NULL means near-miss count unavailable.**.
      Example: 1.0. Example: 1.0.", "avg_resolution_hrs": "REAL. Average incident resolution time in hours.
      Example: 42.7. Example: 42.7.", "sla_compliance_pct": "REAL. Service-level agreement compliance
      percentage. Example: 97.28. Example: 97.28."}, "financial_impact": {"cost_usd": "REAL. Financial
      cost incurred (USD). Example: 62143.31. Example: 62143.31.", "penalties_usd": "REAL. Penalty amount
      incurred (USD). Example: 1035760.69. Example: 1035760.69.", "insurance_coverage_state": "TEXT. Insurance
      or coverage state descriptor. **NULL means coverage state not set.**. Possible values: Adequate,
      Limited. Possible values: Adequate, Limited."}}


      Risk Assessment Score: Shows the overall risk level determined in an assessment.


      Ranges from 0 to 100. Higher means greater risk.


      Compiler note: Describes the risk_score field within risk_management_profile.assessment (e.g., 75.89,
      67.11, 17.4), ranging 0-100, higher = greater risk.


      Control Effectiveness Score: Shows how well controls are working to reduce risk.


      Higher score means stronger controls.


      Compiler note: Maps to the control_effectiveness_pct field within the ''assessment'' object of the
      risk_management_profile JSONB column (RiskManagement.risk_management_profile->''assessment''->>''control_effectiveness_pct'');
      higher value means stronger controls, NULL means not evaluated.'
- schema: main
  table: SecurityProfile
  columns:
  - name: SECURITY_TRACE
    type: BIGINT
    description: BIGINT. Unique security-profile identifier. PK.
  - name: flowKey
