      Possible values: Not Required, Obtained, Pending.'
  - name: priv_imp_assess
    type: VARCHAR
    description: 'TEXT. Privacy-impact assessment status. Possible values: Completed, In Progress, Required.
      Possible values: Completed, In Progress, Required.'
  - name: Datasubjright
    type: VARCHAR
    description: 'TEXT. Data-subject rights fulfilment status. Possible values: Fully Supported, Limited,
      Partial. Possible values: Fully Supported, Limited, Partial.'
- schema: main
  table: DataFlow
  columns:
  - name: RecordRegistry
    type: VARCHAR
    description: 'TEXT. Unique data-flow record identifier. PK. Example: CB932064.'
  - name: FLOWSTAMP
    type: VARCHAR
    description: 'TEXT. Timestamp string representing when the flow was logged. Example: 2024-03-11T11:43:31.
      Example: 2024-03-11T11:43:31.'
  - name: flow_overview
    type: JSON
    description: 'JSONB column. Encapsulates the end-to-end characteristics of a single data-transfer
      stream—routing details, classification, security flagging, and real-time performance statistics—so
      dashboards and analytics engines can retrieve everything from one JSONB document. Fields: {"routing":
      {"origin_country": "TEXT. Origin location or system name. Example: Niue. Example: Niue.", "destination_country":
      "TEXT. Destination nation or region code. Example: Djibouti. Example: Djibouti.", "origin_actor":
      "TEXT. Actor or system initiating the transfer. Example: Hill Ltd. Example: Hill Ltd.", "destination_actor":
      "TEXT. Destination actor or receiving system. **NULL means destination actor not recorded.**. Example:
      Davis, Harper and Weber. Example: Davis, Harper and Weber.", "protocol": "TEXT. Communication-channel
      protocol (e.g., HTTPS, SFTP). Possible values: Blockchain, HTTPS, Private Network, SFTP. Possible
      values: Blockchain, HTTPS, Private Network, SFTP.", "transfer_frequency": "TEXT. Frequency or schedule
      of the data channel. Possible values: Daily, Hourly, Real-time, Weekly. Possible values: Daily,
      Hourly, Real-time, Weekly."}, "classification": {"flow_tag": "TEXT. Human-readable tag assigned
      to the flow. Example: DF7811.", "data_category": "TEXT. Logical category of the data (e.g., HR,
      Finance). Possible values: Commercial, Financial, Industrial, Medical, Personal.", "sensitivity_level":
      "TEXT. Data-sensitivity classification level. Possible values: Critical, High, Low, Medium.", "encryption_status":
      "TEXT. Encryption status of the flow. **NULL means encryption status not specified.**. Possible
      values: Full, Partial."}, "performance": {"data_size_mb": "REAL. Amount of data transferred in megabytes.
      **NULL means data size not measured.**. Example: 42668.42. Example: 42668.42.", "duration_min":
      "BIGINT. Transfer duration in minutes. Example: 1068.03. Example: 1068.03.", "bandwidth_util_pct":
      "REAL. Percentage of channel bandwidth utilised. Example: 68.81. Example: 68.81.", "success_pct":
      "REAL. Successful-transfer percentage. Example: 99.93. Example: 99.93.", "error_count": "BIGINT.
      Count of transfer error events. Example: 39. Example: 39.", "retry_count": "BIGINT. Count of transfer
      retries. Example: 1. Example: 1."}}


      Success Percentage: Shows how often data transfers succeed.


      Ranges from 0 to 100. Higher means more reliable transfers.


      Compiler note: Maps to performance.success_pct within flow_overview JSON; verified observed range
      (90.01-100) fits within stated 0-100 range.


      Error Count: Shows how many errors happened during data transfers.


      A higher value means more problems.


      Compiler note: Describes the performance.error_count field within the flow_overview JSONB column
      (count of transfer error events, higher = more problems).'
- schema: main
  table: DataProfile
  columns:
  - name: profileTrace
    type: BIGINT
