- schema: main
  table: orderExecutions
  columns:
  - name: RecordVault
    type: VARCHAR
    description: 'TEXT. Unique execution record identifier. PK. Example: OB333576. Example: OB333576.'
  - name: ExecMARK
    type: BIGINT
    description: BIGSERIAL. Auto-increment execution index.
  - name: FillAmt
    type: FLOAT
    description: 'REAL. Executed fill amount. Example: 1.447931.'
  - name: remain_amt
    type: FLOAT
    description: 'REAL. Remaining order amount. **NULL means remaining amount not recorded.**. Example:
      0.545024.'
  - name: fillQuote
    type: FLOAT
    description: 'REAL. Execution price quote. Example: 26244.44.'
  - name: FILL_SUM
    type: FLOAT
    description: 'REAL. Cumulative fill value. Example: 38000.14.'
  - name: expireSpot
    type: TIMESTAMP
    description: 'TIMESTAMP. Expiration timestamp for the execution record. Example: 02/22/2025 08:29.'
  - name: CancelNote
    type: VARCHAR
    description: 'TEXT. Cancellation reason or note. **NULL means no cancellation note.**. Possible values:
      Expired, InsufficientFunds, UserRequested. Possible values: Expired, InsufficientFunds, UserRequested.'
  - name: EXECtune
    type: VARCHAR
    description: 'TEXT. Execution tuning parameter. **NULL means execution tune not specified.**. Possible
      values: Maker, Taker.


      exectune: Illustrates the meaning of different values for the exectune enum.


      An enum with values ''Maker'' or ''Taker''. ''Maker'' indicates the order added liquidity to the
      order book by not matching immediately. ''Taker'' indicates the order removed liquidity from the
      order book by matching with existing orders immediately upon placement.


      Compiler note: EXECtune column holds ''Maker''/''Taker'' values matching the exectune enum description.'
  - name: Ord_Link
    type: VARCHAR
    description: TEXT. Identifier of the parent order. FK to orders.
- schema: main
  table: orders
  columns:
  - name: ORD_STAMP
    type: VARCHAR
    description: 'TEXT. Unique order identifier. PK. Example: OR6015391.'
  - name: TimeCode
    type: TIMESTAMP
    description: 'TIMESTAMP. Timestamp when the order was submitted. Possible values: 2025/2/19. Possible
      values: 2025/2/19.'
  - name: exchSpot
    type: VARCHAR
    description: 'TEXT. Exchange trading pair or market symbol. Example: EX203.'
  - name: market_note
    type: VARCHAR
    description: 'TEXT. Descriptive note about the market context. Example: ETH-USDT.'
  - name: UserRef
    type: VARCHAR
    description: TEXT. User identifier who placed the order. FK to users.
  - name: created_at
    type: TIMESTAMP
    description: 'TIMESTAMP. Record-creation timestamp. Example: 2025-02-18T09:54:51+09:00.'
  - name: UPDATED_AT
    type: TIMESTAMP
    description: 'TIMESTAMP. Last update timestamp for the order record. Possible values: 2025/2/19 08:29.'
  - name: order_attributes
    type: JSON
    description: 'JSONB column. Aggregates the core descriptive parameters of an order (type, side, price,
      size, status, etc.) into one JSONB field for simpler retrieval and analytics. Fields: {"type": "TEXT.
      Order-type or tuning parameter. Possible values: Limit, Market, Stop, StopLimit.", "side": "TEXT.
      Deal-edge or strategy tag. Possible values: Buy, Sell.", "limit_price": "REAL. Executed deal price
      quote. Example: 27080.39.", "quantity": "REAL. Quantity executed in base units. Example: 1.992955.
      Example: 1.992955.", "notional_value": "TEXT. Notional trade value. **NULL means notional value
      not recorded.**. Example: $81,019.90 .", "status": "TEXT. Order-flow direction or category. Possible
      values: Cancelled, Filled, New, PartiallyFilled.", "time_in_force": "TEXT. Intended order lifespan
      or validity period. **NULL means lifespan not specified.**. Possible values: FOK, GTC, GTD, IOC.",
      "source": "TEXT. Base currency origin or funding source. Possible values: API, Bot, Mobile, Web.",
      "client_order_id": "TEXT. Client-side marker or reference label. Example: CL5311016."}


      dealedge: Illustrates the meaning of different values for the dealedge enum.


      An enum with values ''Buy'' or ''Sell''. ''Buy'' indicates the order is to purchase the base asset
      using the quote asset (e.g., buying BTC with USDT). ''Sell'' indicates the order is to sell the
      base asset for the quote asset (e.g., selling BTC for USDT).


      Compiler note: Describes the ''side'' field within order_attributes JSON (values ''Buy''/''Sell'').


      orderflow: Illustrates the meaning of different values for the orderflow enum.


      An enum with values ''New'', ''PartiallyFilled'', ''Cancelled'', or ''Filled''. ''New'' indicates
      a newly placed order that hasn''t been matched. ''PartiallyFilled'' means some portion has been
      executed but not all. ''Cancelled'' means the order was cancelled before full execution. ''Filled''
      means the order has been completely executed.


      Compiler note: Describes the enum values for order_attributes->>''status'' (New, PartiallyFilled,
      Cancelled, Filled), confirmed in column meanings/sample data.


      timespan: Illustrates the meaning of different values for the timespan enum.


      An enum with values ''IOC'', ''GTC'', ''GTD'', or ''FOK''. ''IOC'' (Immediate-or-Cancel) means execute
      immediately available portion or cancel. ''GTC'' (Good-Till-Cancelled) means the order remains active
      until explicitly cancelled. ''GTD'' (Good-Till-Date) means the order remains active until a specified
      date. ''FOK'' (Fill-or-Kill) means execute completely immediately or cancel entirely.


      Compiler note: Describes enum values of the ''time_in_force'' field within order_attributes JSON
      (IOC, GTC, GTD, FOK), matching documented possible values.'
- schema: main
  table: riskandmargin
  columns:
  - name: MARG_FORM
    type: VARCHAR
    description: 'TEXT. Unique margin-form identifier. PK. Possible values: Cross, Isolated.'
  - name: ordStamp
    type: VARCHAR
    description: TEXT. Associated order identifier. FK to orders.
  - name: margin_risk_profile
    type: JSON
    description: 'JSONB column. Consolidates leverage, margin requirements, liquidation levels and qualitative
      risk flags into one JSONB column for quicker position-risk assessment and auditing. Fields: {"leverage":
      "TEXT. Leverage scale descriptor. Possible values: 1, 2, 3, 5, 10, 20, 50, 100. Possible values:
      1, 2, 3, 5, 10, 20, 50, 100.", "initial_margin_pct": "REAL. Initial margin requirement. Example:
      10794.0.", "maintenance_margin_pct": "REAL. Maintenance margin requirement. Example: 5397.0. Example:
      5397.0.", "liquidation_price": "TEXT. Liquidation price quote. **NULL means liquidation quote not
      set.**. Example: $28,043.66 .", "stop_loss_price": "REAL. Stop-price quote. Example: 27952.84.",
      "stop_trigger_price": "REAL. Trigger price quote. Example: 29018.82. Example: 29018.82.", "trailing_delta":
      "REAL. Trailing difference for stop orders. Example: 0.029.", "iceberg_qty": "REAL. Iceberg order
      count. Example: 0.778158.", "visible_qty": "REAL. Visible order count. Example: 1.214797.", "liquidation_risk":
      "TEXT. Liquidation-risk factor. Example: 0.124.", "counterparty_risk": "TEXT. Counter-party-risk
      factor. Example: 0.191.", "settlement_risk": "TEXT. Settlement-risk factor. Example: 0.387.", "custody_risk":
      "TEXT. Customer-specific factor. Example: 0.076.", "network_risk": "TEXT. Net-position factor. Example:
      0.937. Example: 0.937.", "regulatory_risk": "TEXT. Regulatory factor. Example: 0.426.", "position_size":
      "REAL. Position count. Example: 52.028722. Example: 52.028722.", "position_notional": "REAL. Aggregate
      position size. Example: 1408958.08.", "position_side": "TEXT. Position edge strategy. **NULL means
      position edge not defined.**. Possible values: Long, Short.", "leverage_multiplier": "TEXT. Position
      magnitude description. Possible values: 1, 2, 3, 5, 10, 20, 50, 100. Possible values: 1, 2, 3, 5,
      10, 20, 50, 100.", "position_risk_pct": "REAL. Position-specific risk rate. Example: 0.762.", "margin_ratio_pct":
      "TEXT. Margin rate tier. **NULL means margin rate not specified.**. Example: 65.90%.", "margin_call_price":
      "REAL. Margin call quote. Example: 38557.58.", "bankruptcy_price": "REAL. Break-point quote for
      liquidation. **NULL means break-point quote not set.**. Example: 20254.06.", "collateral_ratio_pct":
      "TEXT. Collateral rate. **NULL means collateral rate not specified.**. Example: 48.00%.", "collateral_amount":
      "TEXT. Collateral sum amount. Example: 750,485.81 USDT.", "collateral_currency": "TEXT. Coin used
      as collateral. **NULL means collateral coin not specified.**. Possible values: BTC, ETH, USDC, USDT.",
      "insurance_fund_share": "TEXT. Insurance fund share. Example: $28.51 ."}


      posedge: Illustrates the meaning of different values for the posedge enum.


      An enum with values ''Long'' or ''Short''. ''Long'' indicates a position that profits from price
      increases of the underlying asset. ''Short'' indicates a position that profits from price decreases
      of the underlying asset.


      Compiler note: Describes the ''position_side'' field within margin_risk_profile JSONB, which takes
      values ''Long''/''Short''.


      posmagn: Illustrates the meaning of different values for the posmagn enum.


      An enum with values ''1'', ''2'', ''3'', ''5'', ''10'', ''20'', ''50'', or ''100'', representing
      leverage multipliers. For example, ''10'' means the position uses 10x leverage, amplifying both
      potential profits and losses by a factor of 10 compared to an unleveraged position.


      Compiler note: posmagn enum corresponds to the ''leverage_multiplier'' key within margin_risk_profile
      jsonb (documented as ''Position magnitude description'', values 1,2,3,5,10,20,50,100 matching leverage
      multipliers).'
