  - name: indicator_bundle
    type: JSON
    description: 'JSONB column. Groups together real-time technical, order-flow and sentiment indicators
      so that trading models can access a single JSONB payload instead of many separate columns. Fields:
      {"order_flow": {"buy_wall_pct": "REAL. Buy wall band measurement. Example: 0.017.", "sell_wall_pct":
      "REAL. Sell wall band measurement. Example: 0.0891.", "buy_pressure": "REAL. Aggregate buy-side
      force. Example: 0.926. Example: 0.926.", "sell_pressure": "REAL. Aggregate sell-side force. Example:
      0.536.", "order_flow_imbalance": "REAL. Order-flow imbalance. Example: -0.599.", "trade_flow_imbalance":
      "REAL. Trade imbalance indicator. **NULL means trade imbalance not computed.**. Example: 0.102.
      Example: 0.102.", "large_order_ratio": "REAL. Rate of large-size trades. Example: 0.683. Example:
      0.683."}, "technical": {"rsi_14": "REAL. 14-period RSI value. Example: 15.28.", "macd_hist": "REAL.
      MACD trailing value. Example: 4.77.", "bollinger_width_pct": "REAL. Bollinger-band span. Example:
      31.69."}, "sentiment": {"market_sentiment": "TEXT. Market sentiment descriptor. Possible values:
      Bearish, Bullish, Neutral.", "signal": "TEXT. Technical meter indicator. Possible values: Buy, Hold,
      Sell. Possible values: Buy, Hold, Sell."}, "participant_flow": {"smart_money": "REAL. Smart-money
      force indicator. Example: 0.449.", "retail_flow": "REAL. Retail-flow share. **NULL means retail
      flow not measured.**. Example: -0.893.", "institutional_flow": "REAL. Institutional-flow share.
      Example: -0.04. Example: -0.04.", "whale_activity": "TEXT. Whale-wallet activity descriptor. **NULL
      means whale motion not assessed.**. Possible values: High, Low, Medium.", "market_maker_note": "TEXT.
      Maker-order flow descriptor. Possible values: High, Low, Medium."}, "cross_venue": {"arbitrage_pct":
      "REAL. Arbitrage-potential score. Example: 0.0088.", "cross_exchange_spread_pct": "REAL. Cross-exchange
      band width. **NULL means band not computed.**. Example: 0.0077.", "funding_gap_pct": "REAL. Funding-rate
      gap across exchanges. Example: 0.0011.", "basis_gap_pct": "REAL. Basis gap between spot and futures.
      Example: 0.0009."}}


      mktfeel: Illustrates the meaning of different values for the mktfeel enum.


      An enum with values ''Bearish'', ''Bullish'', or ''Neutral''. ''Bearish'' indicates negative market
      sentiment with expectations of price decreases. ''Bullish'' indicates positive market sentiment
      with expectations of price increases. ''Neutral'' indicates balanced market sentiment with no strong
      directional bias.


      Compiler note: Describes enum values for indicator_bundle.sentiment.market_sentiment field (Bearish/Bullish/Neutral).


      techmeter: Illustrates the meaning of different values for the techmeter enum.


      An enum with values ''Buy'', ''Sell'', or ''Hold''. ''Buy'' indicates technical indicators suggest
      purchasing the asset. ''Sell'' indicates technical indicators suggest selling the asset. ''Hold''
      indicates technical indicators suggest maintaining current positions without new trades.


      Compiler note: Describes the enum values (''Buy'',''Sell'',''Hold'') of indicator_bundle->''sentiment''->>''signal''
      in analyticsindicators, confirmed via distinct values query.


      whalemotion: Illustrates the meaning of different values for the whalemotion enum.


      An enum with values ''Low'', ''Medium'', or ''High''. ''Low'' indicates minimal activity from large
      traders. ''Medium'' indicates moderate activity from large traders. ''High'' indicates significant
      activity from large traders, potentially signaling important market movements.


      Compiler note: Describes the whale_activity field (participant_flow.whale_activity) within the indicator_bundle
      JSONB column, enum values Low/Medium/High.


      makermotion: Illustrates the meaning of different values for the makermotion enum.


      An enum with values ''Low'', ''Medium'', or ''High''. ''Low'' indicates minimal market maker activity
      with potentially wider spreads. ''Medium'' indicates normal market maker activity. ''High'' indicates
      substantial market maker activity, typically resulting in tighter spreads and higher liquidity.


      Compiler note: Describes the enum values Low/Medium/High for the participant_flow.market_maker_note
      field within the indicator_bundle JSONB column.'
