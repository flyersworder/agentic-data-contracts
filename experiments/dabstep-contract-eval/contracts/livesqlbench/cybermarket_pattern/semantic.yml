    type: VARCHAR
    description: TEXT. Code of the platform where the transaction occurred. FK to markets(PlatCode).
  - name: VendorLink
    type: VARCHAR
    description: 'TEXT. Identifier of the vendor involved in the transaction. FK to vendors(SellerKey).
      Example: V63085.'
  - name: AcqLink
    type: VARCHAR
    description: 'TEXT. Identifier of the buyer involved in the transaction. FK to buyers(AcqCode). Example:
      B41538.'
  - name: OriginRegion
    type: VARCHAR
    description: 'TEXT. Geographical origin region of the shipment. Possible values: Region_A, Region_B,
      Region_C, Unknown.'
  - name: DestRegion
    type: VARCHAR
    description: 'TEXT. Destination region of the shipment. Possible values: Region_X, Region_Y, Region_Z,
      Unknown.'
  - name: CrossBorder
    type: BIGINT
    description: 'BOOLEAN. Indicates whether the shipment crosses national borders. Possible values: No,
      Yes.'
  - name: RouteComplex
    type: VARCHAR
    description: 'TEXT. Complexity classification of the shipping route. Possible values: Complex, Medium,
      Simple.


      Shipping Route Complexity: Describes the complexity of delivery routes.


      Values: Simple, Medium, Complex.


      Compiler note: Matches documented values Simple, Medium, Complex for transactions.RouteComplex column.'
  - name: Transaction_Velocity
    type: VARCHAR
    description: 'text. The rate at which transactions are completed, measured in USD/hour. Example: 45.67
      USD/hour.'
  - name: Border_cross_pre
    type: VARCHAR
    description: 'text. The premium associated with cross-border transactions, calculated based on payment
      amount and cross-border flag. Example: 78.04 USD/border-crossing.'
  - name: GeoDistScore
    type: VARCHAR
    description: 'text. The geographical distance involved in the transaction, measured in km. Example:
      137.66 USD/border-crossing.'
  - name: transaction_financials
    type: JSON
    description: 'JSONB column. Contains financial details related to the transaction, such as value,
      fees, escrow usage, and shipping costs. Fields: {"pmt_method_type": "TEXT. Payment method used for
      the transaction. **NULL means payment method information is not available.**. Possible values: Crypto_A,
      Crypto_B, Crypto_C, Token.", "value_amt_usd": "TEXT. Total monetary value of the transaction. Example:
      $16,635.50 .", "fee_amt_usd": "TEXT. Platform or escrow fee charged for the transaction. Example:
      $637.83 .", "escrow_used_stat": "TEXT. Indicator describing escrow usage for the transaction. **NULL
      means escrow usage detail is unavailable.**. Possible values: No, Yes.", "escrow_duration_hrs":
      "BIGINT. Number of hours funds were held in escrow. **NULL means escrow duration could not be determined.**.
      Example: 72.0.", "multisig_flag_stat": "BOOLEAN. Indicates whether multisignature payments were
      employed. **NULL means multisignature information is missing.**. Possible values: No, Yes.", "completion_state_stat":
      "TEXT. Final completion state of the transaction (e.g., completed, disputed). Possible values: Completed,
      Disputed, Failed, In Progress.", "process_time_hrs": "BIGINT. Processing time from order to completion,
      in hours. **NULL means processing time has not been calculated.**. Example: 114.9.", "shipping_method_type":
      "TEXT. Shipping method chosen for physical goods. Possible values: Custom, Digital, Express, Standard.",
      "shipping_cost_density": "text. The density of shipping cost per unit of geographical distance,
      measured in USD/km. Example: 1.95 USD/km."}


      Escrow Usage States: Whether escrow was used in a transaction.


      Values: Yes, No.

      Label descriptions:

      - Yes: Funds were held in escrow pending delivery confirmation or dispute resolution, reducing counterparty
      risk.

      - No: Payment was released directly without escrow protection, increasing the chance of fraud.


      Compiler note: Describes the escrow_used_stat field (Yes/No) within the transaction_financials JSONB
      column, documenting the meaning of its two values.'
