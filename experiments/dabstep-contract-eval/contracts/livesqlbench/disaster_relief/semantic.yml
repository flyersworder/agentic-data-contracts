- schema: main
  table: disasterevents
  columns:
  - name: distregistry
    type: VARCHAR
    description: VARCHAR(20). Unique disaster event identifier. PK.
  - name: timemark
    type: TIMESTAMP
    description: 'TIMESTAMP. Timestamp when the disaster event was recorded. Example: 2024-12-21 19:49.'
  - name: haztype
    type: ENUM('Wildfire', 'Earthquake', 'Tsunami', 'Flood', 'Hurricane')
    description: 'HazType_enum. Type of the disaster (e.g., Wildfire, Earthquake). Possible values: Earthquake,
      Flood, Hurricane, Tsunami, Wildfire.'
  - name: haz_level
    type: VARCHAR
    description: 'TEXT. Severity level of the disaster event. Possible values: Severity-1, Severity-2,
      Severity-3, Severity-4, Severity-5.


      Hazard Severity Levels: A classification of a disaster''s intensity, guiding the scale of the required
      response.


      ''Level 1'' indicates a minor, localized event. ''Level 3'' indicates a moderate event with regional
      impact. ''Level 5'' indicates a catastrophic event with widespread, severe impact requiring international
      assistance.


      Compiler note: Describes the categorical values of haz_level (Severity-1..Severity-5), confirmed
      via sample data showing values ''Severity-3'' and ''Severity-5''.'
  - name: affectedarea
    type: VARCHAR
    description: 'TEXT. Geographic area impacted by the disaster. Example: East Jeremy.'
  - name: region_tag
    type: VARCHAR
    description: 'TEXT. Regional tag for categorization. Example: RC7250.'
  - name: latcoord
    type: FLOAT
    description: 'REAL. Latitude coordinate of the disaster center. Example: 51.203609.'
  - name: lon_coord
    type: FLOAT
    description: 'REAL. Longitude coordinate of the disaster center. Example: 36.221141.'
  - name: damagereport
    type: VARCHAR
    description: 'TEXT. Detailed report of the damage caused by the disaster. Possible values: Catastrophic,
      Minor, Moderate, Severe.


      Damage Report Categories: A qualitative assessment of the physical destruction caused by a disaster.


      ''Minor'': Limited damage. ''Moderate'': Visible damage to some structures. ''Severe'': Widespread
      destruction. ''Catastrophic'': Near-total destruction of the built environment in the affected area.


      Compiler note: Matches disasterevents.damagereport, which holds exactly these 4 values: Minor, Moderate,
      Severe, Catastrophic.'
  - name: impact_summary
    type: JSON
    description: 'JSONB column. Summarizes the impact of the disaster including population effects and
      damage levels. Fields: {"population_impact": {"affected": "BIGINT. Number of affected population.
      Example: 228943.", "displaced": "BIGINT. Number of displaced individuals. **NULL means displacement
      data not available.**. Example: 31578.0.", "casualties": "BIGINT. Number of casualties due to the
      disaster. Example: 174.", "injured": "BIGINT. Number of injuries caused by the disaster. **NULL
      means injury data not available.**. Example: 4524.0.", "missing": "BIGINT. Number of missing persons.
      **NULL means missing persons data not recorded.**. Example: 212.0."}, "infrastructure_damage": {"infra_damage_pct":
      "REAL. Percentage of infrastructure damaged. Example: 19.0.", "power_outage_pct": "REAL. Percentage
      of power outages. **NULL means power outage data not recorded.**. Example: 93.2.", "water_damage_pct":
      "BIGINT. Percentage of water infrastructure damage. **NULL means water damage data not available.**.
      Example: 77.4."}, "communication_and_transport": {"communication_state": "TEXT. Communication network
      status during the disaster. Possible values: Down, Limited, OP.", "transport_access": "TEXT. Access
      to transportation routes during the disaster. Possible values: Full, Limited, Minimal."}}'
