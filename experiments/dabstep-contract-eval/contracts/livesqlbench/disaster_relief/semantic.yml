  - name: stakeholder_satisf
    type: FLOAT
    description: 'REAL. Stakeholder satisfaction score. Example: 4.0.'
  - name: mediacoversentiment
    type: ENUM('Positive', 'Neutral', 'Negative')
    description: 'MediaCoverSentiment_enum. Media coverage sentiment. Possible values: Negative, Neutral,
      Positive.'
  - name: public_perception
    type: VARCHAR
