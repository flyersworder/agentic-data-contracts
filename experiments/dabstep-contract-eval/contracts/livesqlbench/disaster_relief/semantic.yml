      Last-Mile Delivery Status: The status of the final and most critical stage of delivery, from a local
      hub to the final distribution points.


      ''On Track'': Deliveries are proceeding as planned. ''Delayed'': Deliveries are facing obstacles
      and are behind schedule. ''Suspended'': Deliveries have been halted due to safety, access, or other
      critical issues.


      Compiler note: Matches Transportation.lastmilestatus column, which holds values On Track/Delayed/Suspended
      as described.'
