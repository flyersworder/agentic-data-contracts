- schema: main
  table: operations
  columns:
  - name: opsregistry
    type: VARCHAR
    description: VARCHAR(20). Unique operation registry identifier. PK.
  - name: emerglevel
    type: ENUM('Black', 'Orange', 'Red', 'Yellow')
    description: 'EmergLevel_enum. Emergency level of the operation. Possible values: Black, Orange, Red,
      Yellow.


      Emergency Alert Levels: Color-coded levels that define the urgency and command structure for an
      ongoing operation.


      ''Yellow'': Monitoring required. ''Orange'': Active response, regional command. ''Red'': Full-scale
      emergency, national command. ''Black'': Catastrophic event, international-level coordination.


      Compiler note: Describes the enum values (Yellow, Orange, Red, Black) of Operations.emerglevel column.'
  - name: resp_phase
    type: VARCHAR
    description: 'TEXT. Response phase during the operation. Possible values: Emergency, Initial, Reconstruction,
      Recovery.


      Response Phases: The distinct phases of a disaster management cycle, from immediate action to long-term
      rebuilding.


      ''Initial'': First 24-72 hours, focus on life-saving. ''Emergency'': Period of active, large-scale
      relief. ''Recovery'': Transition to restoring services. ''Reconstruction'': Long-term rebuilding
      of infrastructure and society.


      Compiler note: Describes the possible values (Initial, Emergency, Recovery, Reconstruction) of Operations.resp_phase.'
  - name: opsstatus
    type: VARCHAR
    description: 'TEXT. Operational status description. Possible values: Active, Completed, Planning,
      Scaling Down.'
  - name: coordcenter
    type: VARCHAR
    description: 'TEXT. Coordination center for the operation. Example: CC7649.'
  - name: ops_start_date
    type: DATE
    description: 'DATE. Date when the operation started. Example: 2025-01-26.'
  - name: estdurationdays
    type: BIGINT
    description: 'BIGINT. Estimated duration of the operation in days. Example: 12.'
  - name: priority_rank
    type: ENUM('High', 'Medium', 'Low', 'Critical')
    description: 'PriorityRank_enum. Priority rank of the operation. Possible values: Critical, High,
      Low, Medium.'
  - name: resourceallocstate
    type: ENUM('Limited', 'Critical', 'Sufficient')
    description: 'ResourceAllocState_enum. Resource allocation status. Possible values: Critical, Limited,
      Sufficient.'
  - name: supply_flow_state
    type: VARCHAR
    description: 'TEXT. Supply flow status during the operation. Possible values: Disrupted, Stable, Strained.


      Supply Flow States: Describes the overall health and functionality of the supply chain for a relief
      operation.


      ''Stable'': Goods are moving predictably and efficiently. ''Strained'': The supply chain is functioning
      but experiencing delays or difficulties. ''Disrupted'': The supply chain is broken, and goods are
      not reaching their destinations.


      Compiler note: Describes the categorical values (Stable/Strained/Disrupted) of operations.supply_flow_state
      column.'
