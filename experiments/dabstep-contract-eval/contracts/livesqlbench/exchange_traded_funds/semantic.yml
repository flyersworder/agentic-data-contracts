- schema: main
  table: risk_metrics
  description: 'Beta: Illustrates the fund''s market sensitivity (Beta).


    Measures a fund''s volatility in relation to the overall market. Beta > 1 indicates the fund is more
    volatile than the market. Beta < 1 indicates it is less volatile. Beta = 1 implies its movement matches
    the market.


    Compiler note: Beta appears as Beta_3Y, Beta_5Y, Beta_10Y within the risk3y, risk5y, risk10y jsonb
    columns respectively, not a single column, so attributed to the table.


    R-Squared: Illustrates the fund''s correlation to its benchmark (R-squared).


    Represents the percentage of a fund''s movements that can be explained by movements in its benchmark
    index. A value of 95 means that 95% of the fund''s performance is attributable to the benchmark''s
    performance.


    Compiler note: R-Squared values appear as R_Squared_3Y/5Y/10Y nested fields inside risk3y/risk5y/risk10y
    JSONB columns, stored as percentage numbers (e.g. 75.96 meaning 75.96%), consistent with the entry''s
    description. Since the metric spans multiple columns (risk3y, risk5y, risk10y) within this table,
    it is attributed to the table rather than a single column.


    Sharpe Ratio: Illustrates the fund''s risk-adjusted return (Sharpe Ratio).


    Measures the fund''s excess return per unit of total risk (volatility). A higher Sharpe Ratio is better.
    A ratio > 1 is generally considered good, > 2 is very good, and > 3 is excellent.


    Compiler note: Sharpe Ratio values are stored as Sharpe_Ratio_3Y/5Y/10Y nested inside the risk3y,
    risk5y, and risk10y JSONB columns of risk_metrics (confirmed e.g. risk3y->''risk_measures_3y''->>''Sharpe_Ratio_3Y'').
    No single column holds it since it''s split across three time-horizon columns, so mapped to the table
    level.'
