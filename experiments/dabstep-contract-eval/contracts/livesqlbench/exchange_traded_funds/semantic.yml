  - name: fundclass
    type: JSON
    description: 'JSONB column. Consolidates fund classification and strategy information including geographic
      focus, investment strategy, market cap focus, and basic fund characteristics. Fields: {"GeoZone_Class":
      "Geographic region or market focus of the fund (e.g., ''US'', ''International'', ''Emerging Markets'',
      ''Global''). Contains  NULL when geographic focus is not specified or fund has global diversification
      without specific regional focus.", "Strategy_Type": "Investment strategy classification (e.g., ''Index'',
      ''Active'', ''Passive'', ''Smart Beta'') describing the fund''s management approach. Contains  NULL
      when strategy type is not classified or is proprietary/unique.", "Cap_Size": "Market capitalization
      focus (e.g., ''Large Cap'', ''Mid Cap'', ''Small Cap'', ''Multi Cap'') indicating the size of companies
      the fund invests in. Contains  NULL when fund does not focus on specific market cap sizes or invests
      in non-equity assets.", "Quote_Mode": "Trading quote type or mechanism (e.g., ''NAV'', ''Market'',
      ''Real-time'') indicating how the fund is priced and quoted. Contains  NULL when quote mode is not
      specified or uses non-standard pricing mechanisms.", "Currency_Base": "Base currency in which the
      fund is denominated and reports net asset value (e.g., ''USD'', ''EUR'', ''GBP''). Contains  NULL
      when currency information is not available."}'
  - name: fundmetrics
    type: JSON
    description: 'JSONB column. Groups fundamental financial metrics and operational data including assets
      under management, yield rates, expense ratios, and turnover statistics. Fields: {"Net_Worth": "Total
      net assets under management (AUM) for the fund in the base currency, representing the fund''s total
      market value. Contains  NULL when AUM data is not available or not reported.", "Yield_Rate": "Current
      dividend yield percentage (0-1) that the fund distributes to shareholders annually. Contains  NULL
      when fund does not pay dividends or yield data is not available.", "Turnover_Ratio": "Annual portfolio
      turnover ratio (0-1) indicating how frequently the fund''s holdings are bought and sold within a
      year. Contains  NULL when turnover data is not available or not applicable (e.g., for newly launched
      funds).", "Expense_Net": "Net expense ratio (0-1) representing the annual fee charged to investors
      as a percentage of assets under management. Contains  NULL when expense ratio is not yet determined
      or not available.", "Benchmark_Exp": "Benchmark or category average expense ratio for comparison
      with similar funds in the same category. Contains  NULL when benchmark data is not available for
      comparison."}


      Yield Rate: Illustrates the fund''s annual dividend yield.


      Represents the annual dividend per share as a percentage of the share''s price. A value of 0.02
      signifies a 2% yield. This is a crucial metric for income-focused investors.


      Compiler note: Describes the Yield_Rate field within funds.fundmetrics JSONB column (e.g. 0.0031
      = 0.31% yield), consistent with ''A value of 0.02 signifies a 2% yield.''


      Turnover Ratio: Illustrates the fund''s portfolio turnover.


      Measures how frequently assets within a fund are bought and sold. A ratio of 1.0 (100%) means the
      fund replaces its entire portfolio once per year. A low value (<0.3) suggests a buy-and-hold strategy,
      while a high value (>1.0) indicates active trading.


      Compiler note: Describes the Turnover_Ratio field within funds.fundmetrics JSONB column (Turnover_Ratio
      key documented as annual portfolio turnover ratio).


      Net Expense Ratio: Illustrates the fund''s net annual cost (Expense Ratio).


      The annual fee charged to investors as a percentage of assets. A value of 0.005 corresponds to a
      0.5% annual fee. Lower is generally better, as costs directly reduce returns.


      Compiler note: Maps to the Expense_Net field within funds.fundmetrics JSONB (e.g., 0.005 = 0.5%
      annual fee).'
  - name: tradingdata
    type: JSON
    description: 'JSONB column. Aggregates trading and market data including volume metrics and moving
      averages for technical analysis and liquidity assessment. Fields: {"volume_metrics": {"Vol_3M":
      "Average daily trading volume over the past 3 months, indicating liquidity and investor interest.
      Contains  NULL when volume data is not available or fund has insufficient trading history.", "Vol_Recent":
      "Recent average daily trading volume over a shorter time period (typically 10 days). Contains  NULL
      when recent volume data is not available."}, "moving_averages": {"MA_50": "50-day moving average
      price of the fund, used for technical analysis and trend identification. Contains  NULL when insufficient
      price history exists for calculation.", "MA_200": "200-day moving average price of the fund, used
      for long-term trend analysis. Contains  NULL when fund has less than 200 days of trading history."}}'
  - name: allocweights
    type: JSON
    description: 'JSONB column. Contains asset allocation percentages and portfolio composition data including
      equity, bond weights and bond characteristics for portfolio analysis. Fields: {"asset_allocation":
      {"Equity_Weight": "Percentage (0-1) of the fund''s assets allocated to equity securities (stocks).
      Contains  NULL when equity allocation data is not available or not applicable for fund type.", "Bond_Weight":
      "Percentage (0-1) of the fund''s assets allocated to fixed-income securities (bonds). Contains  NULL
      when bond allocation data is not available or fund does not invest in bonds."}, "bond_characteristics":
      {"Avg_Maturity": "Average maturity in years of the fund''s bond holdings, applicable for fixed-income
      funds. Contains  NULL when fund does not hold bonds or maturity data is not available.", "Duration_Yrs":
      "Average duration in years of the fund''s bond holdings, measuring interest rate sensitivity. Contains  NULL
      when fund does not hold bonds or duration data is not available."}}


      Duration: Illustrates a bond fund''s interest rate sensitivity (Duration).


      Measures how much a bond fund''s price is likely to change for every 1% change in interest rates.
      A duration of 7 years means the fund''s price will likely fall by about 7% if interest rates rise
      by 1%.


      Compiler note: Duration corresponds to the Duration_Yrs field within the bond_characteristics object
      of funds.allocweights JSONB column (path: allocweights->''bond_characteristics''->>''Duration_Yrs'').


      Equity Weight: Illustrates the fund''s allocation to stocks.


      The percentage of the fund''s assets invested in equities (stocks). A value of 0.9 indicates that
      90% of the fund is invested in stocks, suggesting a growth-oriented strategy.


      Compiler note: Equity Weight corresponds to the Equity_Weight field within the asset_allocation
      object of the allocweights JSONB column (path: allocweights->''asset_allocation''->>''Equity_Weight''),
      representing fraction (0-1) of assets in equities.'
  - name: valuationratios
    type: JSON
    description: 'JSONB column. Consolidates fundamental valuation ratios for equity holdings including
      price-to-book, price-to-earnings, price-to-cash-flow, and price-to-sales ratios. Fields: {"valuation_metrics":
      {"PB_Ratio": "Weighted average price-to-book ratio of the fund''s equity holdings, indicating valuation
      characteristics. Contains  NULL when P/B ratio is not available or not applicable for fund''s holdings.",
      "PCF_Ratio": "Weighted average price-to-cash-flow ratio of the fund''s equity holdings. Contains  NULL
      when P/CF ratio is not available or not applicable.", "PE_Ratio": "Weighted average price-to-earnings
      ratio of the fund''s equity holdings. Contains  NULL when P/E ratio is not available or holdings
      have negative earnings.", "PS_Ratio": "Weighted average price-to-sales ratio of the fund''s equity
      holdings. Contains  NULL when P/S ratio is not available or not applicable."}}'
