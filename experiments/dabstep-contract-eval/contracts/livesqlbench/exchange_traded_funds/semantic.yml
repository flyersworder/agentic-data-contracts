- schema: main
  table: sector_allocations
  columns:
  - name: allockey
    type: BIGINT
    description: A SERIAL primary key uniquely identifying each sector allocation record for funds.
  - name: productlink
    type: VARCHAR
    description: Foreign key referencing funds.TickerSym, indicating which fund has this sector allocation.
  - name: sectorlink
    type: BIGINT
    description: Foreign key referencing sectors.SecID, indicating which economic sector the allocation
      applies to.
  - name: weightpct
    type: FLOAT
    description: 'Percentage (0-1) of the fund''s assets allocated to this specific sector, must sum to
      1.0 across all sectors for each fund.


      Sector Weight: Illustrates the fund''s concentration in a specific economic sector.


      The percentage of a fund''s assets invested in a particular sector, like ''technology'' or ''healthcare''.
      A high value, such as 0.4 (40%), indicates a significant bet on that sector''s performance.


      Compiler note: Matches sector_allocations.weightpct, a 0-1 fraction representing a fund''s allocation
      percentage to a given sector (joined via sectorlink to sectors.industrytag).'
- schema: main
  table: sectors
  columns:
  - name: secid
    type: BIGINT
    description: A SERIAL primary key uniquely identifying each economic sector or industry classification
      in the database.
  - name: industrytag
    type: VARCHAR
    description: Unique sector or industry name (e.g., 'Technology', 'Healthcare', 'Financial Services',
      'Energy', 'Consumer Defensive'). Must be unique across all records.
- schema: main
  table: securities
  columns:
  - name: securityref
    type: BIGINT
    description: A SERIAL primary key uniquely identifying each individual security or holding instrument
      in the database.
  - name: securitylabel
    type: VARCHAR
    description: Full company name or description of the security (e.g., 'Apple Inc.', 'Microsoft Corporation').
