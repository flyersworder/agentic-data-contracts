- schema: main
  table: risk_and_moderation
  columns:
  - name: acct_risk
    type: VARCHAR
    description: TEXT. Account reference for risk and moderation data. PK. FK to accounts.
  - name: risk_profile
    type: JSON
    description: 'JSONB column. Bundles risk, authenticity / credibility, violation history and overall
      reputation into one JSONB field for faster trust-and-safety look-ups and enforcement rules. Fields:
      {"risk_scores": {"risk_value": "REAL. Risk value score. **NULL means risk value not assigned.**.
      Example: 0.155.", "threat_level": "TEXT. Threat level description. Possible values: Critical, High,
      Low, Medium.", "authenticity_score": "REAL. Authorization score. Example: 0.15.", "credibility_score":
      "REAL. Credit score. Example: 0.441.", "reputation_score": "REAL. Reputation score. Example: 0.23.",
      "trust_score": "REAL. Trust value score. Example: 0.353.", "impact_score": "REAL. Impact value score.
      Example: 0.544."}, "violation_history": {"abuse_count": "BIGINT. Abuse count against the account.
      Example: 24.", "violation_distribution_json": "JSONB. Violations distribution details. Example:
      {''Spam'': 0.9353273606557855, ''Fake'': 0.4490233249279981, ''Abuse'': 0.08219689664928109}.",
      "suspension_history_json": "JSONB. Suspension history data. Possible values: 0, 1, 2, 3, 4, 5.",
      "warning_count": "BIGINT. Warning count. Example: 0.", "appeal_count": "BIGINT. Appeal count. Possible
      values: 0, 1, 2, 3, 4, 5."}}


      trust value: Illustrates trust value meaning.


      Ranges from 0 to 1. Values above 0.7 indicate highly trusted accounts, while values below 0.3 suggest
      untrusted or suspicious accounts.


      Compiler note: Maps to risk_profile->''risk_scores''->>''trust_score'', a REAL in [0,1] (checked
      sample values 0-1); describes meaning of this JSON field''s value range.


      impact value: Illustrates impact value meaning.


      Ranges from 0 to 1. Values above 0.7 indicate high-impact violations requiring immediate attention,
      while values below 0.3 suggest low-priority issues.


      Compiler note: Describes the impact_score field inside risk_profile.risk_scores.impact_score (range
      0-1, example 0.544), matching the described thresholds.'
