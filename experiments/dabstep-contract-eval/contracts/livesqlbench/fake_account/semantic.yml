  - name: session_telemetry
    type: JSON
    description: 'JSONB column. Aggregates IP reputation, device-mix, VPN / proxy usage and log-in behaviour
      so threat-detection jobs can retrieve the full session context from one JSONB column. Fields: {"ip_reputation":
      {"registration_ip": "INET. Registered IP address. **NULL means IP not recorded.**. Example: 186.221.8.216.",
      "ip_reputation_score": "REAL. IP reputation score. Example: 0.729.", "country_count": "BIGINT. Country
      of the IP address. Example: 14.", "proxy_hits": "BIGINT. Proxy hits during session. **NULL means
      proxy hits not recorded.**. Example: 98.0.", "tor_flag": "TEXT. Tor usage flag. Possible values:
      No, Suspected, Yes."}, "vpn_usage_pct": "TEXT. VPN usage percentage. Example: 0.00%.", "device_profile":
      {"device_count": "BIGINT. Device number. Example: 20.", "device_mix_json": "JSONB. Device mix used
      in session. Example: {''Mobile'': 0.8966897433246256, ''Desktop'': 0.5115558690500416, ''Tablet'':
      0.3299024746948329}.", "browser_diversity_idx": "REAL. Browser mix score. Example: 0.016.", "ua_consistency":
      "REAL. User agent consistency score. Example: 0.639."}, "login_behavior": {"login_chronology": "TEXT.
      Login chronology or history. **NULL means login chronology not available.**. Possible values: Bot-like,
      Burst, Random, Regular.", "login_freq_per_day": "TEXT. Login frequency descriptor. Possible values:
      High, Low, Medium, Suspicious.", "location_variability": "REAL. Location variance during session.
      Example: 0.311."}, "session_stats": {"avg_session_duration_min": "REAL. Session duration. Example:
      2766.0.", "session_count": "BIGINT. Number of sessions during the account lifecycle. Example: 419."},
      "activity_pattern": {"activity_regularity": "REAL. Activity registration score. Example: 0.313.",
      "activity_spread_code": "TEXT. Activity spread during the session. Example: {''Morning'': 0.08864600070960105,
      ''Afternoon'': 0.7421617693224358, ''Night'': 0.3718840943461962}."}}


      reputation scoring: Illustrates IP reputation scoring.


      Ranges from 0 to 1. Scores above 0.8 indicate trusted IPs, while scores below 0.3 suggest potentially
      malicious or compromised IPs.


      Compiler note: Describes the ip_reputation_score field nested at session_telemetry->''ip_reputation''->''ip_reputation_score''
      (range 0-1), confirmed via sample query.'
