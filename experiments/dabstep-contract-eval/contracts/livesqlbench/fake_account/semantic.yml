# Compiled by dce.compile -- do not edit; recompile instead.
# benchmark: livesqlbench, database: fake_account, compiler: claudesonnet5
# inputs: fake_account_kb.jsonl, fake_account_column_meaning_base.json, fake_account_schema.txt, fake_account.duckdb
metrics:
- name: account_activity_frequency_aaf
  description: 'Measures how frequently an account engages in platform activities relative to its age.


    It is defined as: AAF = session countthe age of an account.


    Compiler note: session_count extracted from session_telemetry->session_stats->session_count; account
    age from accounts.AGE_D via unique FK match; verified no zero/null AGE_D values that would cause division
    issues.'
  sql_expression: (session_telemetry->'session_stats'->>'session_count')::numeric / (SELECT a.AGE_D FROM
    accounts a WHERE a.acct_ref = security_sessions.acct_gate)
  source_model: main.security_sessions
  domains:
  - calculations
- name: content_authenticity_score_cas
  description: 'Aggregates multiple authenticity indicators into a single score.


    It is computed as 0.3 * authenticity score + 0.3 * content uniqueness score + 0.4 * conversation naturalness
    value; all three components are first scaled to the 0 to 1 range.


    Compiler note: authenticity_score (risk_profile.risk_scores.authenticity_score), content_uniqueness
    (content_metrics.content_quality.content_uniqueness), and ConvNat are all already stored in the 0-1
    range (verified min/max for authenticity_score), so no additional scaling applied. Joined via scalar
    subqueries since each account has exactly one row in each related table (1:1 PK/FK).'
  sql_expression: '0.3 * (SELECT (r.risk_profile->''risk_scores''->>''authenticity_score'')::float FROM
    risk_and_moderation r WHERE r.acct_risk = acct_ref)

    + 0.3 * (SELECT (c.content_metrics->''content_quality''->>''content_uniqueness'')::float FROM content_activity
    c WHERE c.acct_slot = acct_ref)

    + 0.4 * (SELECT i."ConvNat" FROM interaction_metrics i WHERE i.acct_dm = acct_ref)'
  source_model: main.accounts
  domains:
  - calculations
- name: network_growth_velocity_ngv
  description: 'Measures the rate of network growth considering both followers and following.


    It is the Euclidean length of an account''s growth vector, calculated as the square root of (follower
    growth rate² + following growth rate²).


    Compiler note: FollGrow = follower growth rate, FingGrow = following growth rate; NGV = Euclidean
    norm of these two.'
  sql_expression: sqrt(power("FollGrow", 2) + power("FingGrow", 2))
  source_model: main.network_metrics
  domains:
  - calculations
- name: bot_behavior_index_bbi
  description: 'Combines multiple bot-detection metrics into a single score.


    BBI = 0.4 * bot likelihood score + 0.3 * automated behavior score + 0.3 * (1 - conversation naturalness
    value)


    Compiler note: bot_likelihood and automated_behavior taken from behavioral_anomaly_scores->automation_spam
    JSON (0-1 scale); conversation naturalness value is interaction_metrics.ConvNat, joined via acct_dm
    = acct_beh (1:1 PK-FK relationship).'
  sql_expression: 0.4 * (behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double + 0.3
    * (behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double + 0.3 * (1 - (SELECT
    ConvNat FROM interaction_metrics WHERE acct_dm = acct_beh))
  source_model: main.behavioral_scores
  domains:
  - calculations
- name: security_risk_score_srs
  description: 'Calculates overall security risk based on multiple factors.


    SRS = 0.4 * risk value + 0.3 * (1 - trust value) + 0.3 * impact value


    Compiler note: SRS = 0.4*risk_value + 0.3*(1-trust_score) + 0.3*impact_score, all sourced from risk_profile->risk_scores
    JSON fields in risk_and_moderation table.'
  sql_expression: 0.4 * (risk_profile->'risk_scores'->>'risk_value')::double + 0.3 * (1 - (risk_profile->'risk_scores'->>'trust_score')::double)
    + 0.3 * (risk_profile->'risk_scores'->>'impact_score')::double
  source_model: main.risk_and_moderation
  domains:
  - calculations
- name: profile_credibility_index_pci
  description: 'Evaluates overall profile credibility.


    PCI = 0.3 * credibility score + 0.3 * reputation score + 0.4 * profile completeness'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: PCI requires a "profile completeness" component. The knowledge base (entry 26) only describes
    the qualitative meaning/range of profile completeness, not a formula or stored column, and no table
    holds a precomputed completeness value. Without a defined computation (e.g., which profile fields
    count toward completeness and how), this cannot be encoded over the database.
- name: coordinated_activity_score_cas
  description: 'Measures the likelihood that a set of accounts are acting in a coordinated manner by combining
    structural coordination and influence.


    CAS = 0.5 * coordination score + 0.3 * network influence centrality + 0.2 * cluster size


    Compiler note: Computed at cluster level: CoordScore maps to coordination score, NetInfl maps to network
    influence (used directly as the cluster-level influence measure, since NIC''s account-level formula
    does not apply to a cluster), ClusterQty maps to cluster size. No normalization applied beyond raw
    stored values, as none of these fields documented a different scale.'
  sql_expression: 0.5 * CoordScore + 0.3 * NetInfl + 0.2 * ClusterQty
  source_model: main.cluster_analysis
  domains:
  - calculations
- name: technical_evasion_index_tei
  description: 'Quantifies attempts to evade detection.


    TEI = 0.4 * VPN ratio + 0.3 * proxy count divided by 10 + 0.3 * login country count divided by 20


    Compiler note: vpn_usage_pct stored as text percentage string (e.g. ''0.00%''); stripped ''%'' and
    divided by 100 to get ratio. proxy_hits and country_count read from ip_reputation sub-object as numbers.'
  sql_expression: 0.4 * (REPLACE(session_telemetry->'vpn_usage_pct'->>0, '%','')::double / 100) + 0.3
    * ((session_telemetry->'ip_reputation'->>'proxy_hits')::double / 10) + 0.3 * ((session_telemetry->'ip_reputation'->>'country_count')::double
    / 20)
  source_model: main.security_sessions
  domains:
  - calculations
- name: content_manipulation_score_cms
  description: 'Evaluates content manipulation patterns.


    CMS = 0.4 * (1 - content uniqueness score) + 0.3 * media reuse ratio + 0.3 * (1 - text uniqueness)


    Compiler note: CMS = 0.4*(1-content_uniqueness) + 0.3*media_reuse_rate + 0.3*(1-text_uniqueness).
    content_uniqueness and media_reuse_rate taken from content_activity.content_metrics JSON; text_uniqueness
    (TxtUniq) taken from interaction_metrics via scalar subquery on acct_dm (PK, 1:1 match with acct_slot).'
  sql_expression: 0.4 * (1 - CAST(content_metrics->'content_quality'->>'content_uniqueness' AS DOUBLE))
    + 0.3 * CAST(content_metrics->'link_media'->>'media_reuse_rate' AS DOUBLE) + 0.3 * (1 - (SELECT TxtUniq
    FROM interaction_metrics WHERE acct_dm = acct_slot))
  source_model: main.content_activity
  domains:
  - calculations
- name: moderation_priority_score_mps
  description: 'Calculates priority for moderation review.


    MPS = 0.3 * abuse report count divided by 1000 + 0.4 * impact value + 0.3 * risk value


    Compiler note: abuse_count, impact_score, risk_value extracted from risk_profile JSON fields violation_history.abuse_count,
    risk_scores.impact_score, risk_scores.risk_value respectively.'
  sql_expression: 0.3 * (risk_profile->'violation_history'->>'abuse_count')::numeric / 1000 + 0.4 * (risk_profile->'risk_scores'->>'impact_score')::numeric
    + 0.3 * (risk_profile->'risk_scores'->>'risk_value')::numeric
  source_model: main.risk_and_moderation
  domains:
  - calculations
- name: high_risk_account
  description: 'Identifies accounts requiring immediate attention.


    An account with SRS > 0.8 and at least one active security detection with threatlvl = ''Critical''


    Built on: security_risk_score_srs.


    Compiler note: SRS computed inline from risk_profile JSON per the given formula. ''active security
    detection'' interpreted as existence of a monitoring record with InvestState=''Active'' for the account
    (monitoring is the only table representing security detections); threatlvl=''Critical'' matched to
    risk_profile.risk_scores.threat_level, the only threat-level field in the schema. Table alias used
    to avoid ambiguous column resolution in correlated EXISTS.'
  sql_expression: '(0.4 * (risk_profile->''risk_scores''->>''risk_value'')::double + 0.3 * (1 - (risk_profile->''risk_scores''->>''trust_score'')::double)
    + 0.3 * (risk_profile->''risk_scores''->>''impact_score'')::double) > 0.8

    AND (risk_profile->''risk_scores''->>''threat_level'') = ''Critical''

    AND EXISTS (SELECT 1 FROM monitoring m WHERE m.acct_mon = risk_and_moderation.acct_risk AND m.InvestState
    = ''Active'')'
  source_model: main.risk_and_moderation
  domains:
  - definitions
- name: bot_network
  description: 'Identifies coordinated bot activity.


    A cluster where clustsize > 10 and average BBI > 0.7 for all accounts in cluster


    Built on: bot_behavior_index_bbi.


    Compiler note: Cluster size taken as ClusterQty column; "average BBI for all accounts in cluster"
    computed as mean of per-account BBI (per entry [3] definition) over accounts linked via account_clusters
    to this cluster, joining behavioral_scores and interaction_metrics (for ConvNat) by account id.'
  sql_expression: "ClusterQty > 10 AND (\n  SELECT AVG(\n    0.4 * (bs.behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double\
    \ precision\n    + 0.3 * (bs.behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double\
    \ precision\n    + 0.3 * (1 - im.ConvNat)\n  )\n  FROM account_clusters ac\n  JOIN behavioral_scores\
    \ bs ON bs.acct_beh = ac.acct_bridge\n  JOIN interaction_metrics im ON im.acct_dm = ac.acct_bridge\n\
    \  WHERE ac.clu_ref = CLSTR_PIN\n) > 0.7"
  source_model: main.cluster_analysis
  domains:
  - definitions
- name: trusted_account
  description: 'Identifies highly trustworthy accounts.


    An account with PCI > 0.8 and no security detections in the past 180 days


    Built on: profile_credibility_index_pci.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: Trusted Account requires PCI > 0.8, but PCI needs a "profile completeness" component (entry
    26) that is only described qualitatively (range/meaning), with no formula or stored column defining
    how to compute it from the schema. Without that, PCI cannot be computed, so Trusted Account cannot
    be encoded either.
- name: content_farm
  description: 'Identifies accounts mass-producing similar content.


    An account with CMS > 0.7 and post over 50 posts per day


    Built on: content_manipulation_score_cms.


    Compiler note: CMS computed inline from content_metrics JSON (content_uniqueness, media_reuse_rate)
    and interaction_metrics.TxtUniq (unique match on acct_dm=acct_slot). Posts per day read from content_metrics->posting->posts_per_day.'
  sql_expression: (0.4 * (1 - CAST(content_metrics->'content_quality'->>'content_uniqueness' AS DOUBLE))
    + 0.3 * CAST(content_metrics->'link_media'->>'media_reuse_rate' AS DOUBLE) + 0.3 * (1 - (SELECT TxtUniq
    FROM interaction_metrics WHERE acct_dm = acct_slot))) > 0.7 AND CAST(content_metrics->'posting'->>'posts_per_day'
    AS DOUBLE) > 50
  source_model: main.content_activity
  domains:
  - definitions
- name: sockpuppet_network
  description: 'Identifies related accounts used for manipulation.


    A group of accounts where the number of linked accounts is greater than 5 and the coordinated activity
    score is above 0.8


    Built on: coordinated_activity_score_cas.


    Compiler note: Interpreted ''linked accounts'' as ClusterQty (cluster size) and ''coordinated activity
    score'' using the CAS formula from cluster_analysis (0.5*CoordScore + 0.3*NetInfl + 0.2*ClusterQty),
    evaluated per cluster row.'
  sql_expression: ClusterQty > 5 AND (0.5 * CoordScore + 0.3 * NetInfl + 0.2 * ClusterQty) > 0.8
  source_model: main.cluster_analysis
  domains:
  - definitions
- name: dormant_bot
  description: 'Identifies inactive bot accounts.


    An account with account status = ''Dormant''.


    Built on: bot_behavior_index_bbi.


    Compiler note: "Dormant Bot" is defined purely by account status = ''Dormant'', mapped to accounts.StateFlag
    column.'
  sql_expression: StateFlag = 'Dormant'
  source_model: main.accounts
  domains:
  - definitions
- name: vpn_abuser
  description: 'Identifies accounts systematically using VPNs.


    An account with TEI > 0.8 and at least 3 different countries in login locations


    Built on: technical_evasion_index_tei.


    Compiler note: TEI computed inline per its definition over session_telemetry fields; condition requires
    TEI > 0.8 and country_count >= 3 (at least 3 different countries).'
  sql_expression: (0.4 * (REPLACE(session_telemetry->'vpn_usage_pct'->>0, '%','')::double / 100) + 0.3
    * ((session_telemetry->'ip_reputation'->>'proxy_hits')::double / 10) + 0.3 * ((session_telemetry->'ip_reputation'->>'country_count')::double
    / 20)) > 0.8 AND (session_telemetry->'ip_reputation'->>'country_count')::bigint >= 3
  source_model: main.security_sessions
  domains:
  - definitions
- name: engagement_manipulator
  description: 'Identifies artificial engagement patterns.


    An account where engagement authenticity < 0.3 and temporal interaction pattern = ''Automated''


    Compiler note: engagement authenticity maps to network_metrics.EngAuth; temporal interaction pattern
    maps to network_metrics.TempIntPtn.'
  sql_expression: '"EngAuth" < 0.3 AND "TempIntPtn" = ''Automated'''
  source_model: main.network_metrics
  domains:
  - definitions
- name: serial_violator
  description: 'Identifies repeat policy violators.


    An account with suspicious history count > 2 and warning count > 5


    Compiler note: Interpreted "suspicious history count" as risk_profile.violation_history.suspension_history_json,
    which is stored as a scalar integer (0-5) rather than a list; "warning count" is violation_history.warning_count.
    Both cast from jsonb text to integer.'
  sql_expression: CAST(risk_profile->'violation_history'->>'suspension_history_json' AS INTEGER) > 2 AND
    CAST(risk_profile->'violation_history'->>'warning_count' AS INTEGER) > 5
  source_model: main.risk_and_moderation
  domains:
  - definitions
- name: amplification_network
  description: 'Identifies coordinated content amplification.


    A cluster where cluster role = ''Amplifier'' and coordination score > 0.8'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: The entry requires cluster role = 'Amplifier', but cluster_analysis.CluRole has no such
    value (only Botnet, Community, InfluenceNetwork, SocialGroup, SpamRing exist in the data). The condition
    cannot be satisfied/encoded as stated.
- name: cross_platform_risk_index_cpri
  description: 'Evaluates risk across multiple platform types for the same account.


    It is defined as: CPRI = SRS * (1 + 0.2 *  login country count).


    Built on: security_risk_score_srs.


    Compiler note: CPRI = SRS * (1 + 0.2 * login country count). SRS computed inline per its definition
    using risk_profile fields. Login country count taken from security_sessions.session_telemetry->ip_reputation->country_count,
    matched via acct_gate = acct_risk (1:1 relationship verified).'
  sql_expression: (0.4 * (risk_profile->'risk_scores'->>'risk_value')::double + 0.3 * (1 - (risk_profile->'risk_scores'->>'trust_score')::double)
    + 0.3 * (risk_profile->'risk_scores'->>'impact_score')::double) * (1 + 0.2 * (SELECT (s.session_telemetry->'ip_reputation'->>'country_count')::double
    FROM security_sessions s WHERE s.acct_gate = acct_risk))
  source_model: main.risk_and_moderation
  domains:
  - calculations
- name: network_manipulation_index_nmi
  description: 'Measures the extent of network manipulation considering bot behavior and coordination.


    It is defined as: NMI = 0.6 * BBI + 0.4 * CAS.


    Built on: bot_behavior_index_bbi, coordinated_activity_score_cas.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: NMI combines BBI (per-account, from behavioral_scores) with CAS (per-cluster, from cluster_analysis).
    Accounts belong to multiple clusters (e.g. up to 3 each in account_clusters), and the entry gives
    no rule for selecting or aggregating which cluster's CAS to use for a given account, so the join cannot
    be made unique and NMI cannot be encoded as a single-row scalar expression per account.
- name: enhanced_trust_score_ets
  description: 'Calculates trust score considering both profile credibility and content authenticity.


    It is defined as: ETS = 0.5 * PCI + 0.5 * CAS.


    Built on: profile_credibility_index_pci, content_authenticity_score_cas.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: ETS = 0.5*PCI + 0.5*CAS depends on PCI, which cannot be encoded (PCI requires a "profile
    completeness" component with no defined formula or stored column in the database). Since ETS requires
    PCI, it cannot be encoded either.
- name: coordinated_bot_risk_cbr
  description: 'Assesses risk from coordinated bot networks.


    It is defined as: CBR = BBI * CAS * cluster size.


    Built on: bot_behavior_index_bbi, coordinated_activity_score_cas.


    Compiler note: CBR = BBI(account) * CAS(cluster) * cluster size, evaluated per account-cluster membership
    row (account_clusters PK (acct_bridge, clu_ref) is unique). BBI uses behavioral_scores (PK acct_beh,
    unique) and interaction_metrics (PK acct_dm, unique) for the given account; CAS and cluster size (=ClusterQty)
    use cluster_analysis (PK CLSTR_PIN, unique) for the given cluster.'
  sql_expression: "(0.4 * (SELECT (bs.behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double\
    \ FROM behavioral_scores bs WHERE bs.acct_beh = account_clusters.acct_bridge)\n + 0.3 * (SELECT (bs.behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double\
    \ FROM behavioral_scores bs WHERE bs.acct_beh = account_clusters.acct_bridge)\n + 0.3 * (1 - (SELECT\
    \ im.ConvNat FROM interaction_metrics im WHERE im.acct_dm = account_clusters.acct_bridge)))\n*\n(0.5\
    \ * (SELECT ca.CoordScore FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref)\n\
    \ + 0.3 * (SELECT ca.NetInfl FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref)\n\
    \ + 0.2 * (SELECT ca.ClusterQty FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref))\n\
    *\n(SELECT ca.ClusterQty FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref)"
  source_model: main.account_clusters
  domains:
  - calculations
- name: content_security_index_csi
  description: 'Evaluates content security considering manipulation and authenticity.


    It is defined as: CSI = 0.7 * (1 - CMS) + 0.3 * CAS.


    Built on: content_manipulation_score_cms, content_authenticity_score_cas.


    Compiler note: CSI = 0.7*(1-CMS) + 0.3*CAS, computed over content_activity (acct_slot) since both
    CMS and CAS reference content_metrics for the same account; CAS''s content_uniqueness term reused
    directly from content_metrics instead of a redundant self-join subquery. interaction_metrics and risk_and_moderation
    joined via unique PK (acct_dm/acct_risk = acct_slot).'
  sql_expression: "0.7 * (1 - (\n    0.4 * (1 - CAST(content_metrics->'content_quality'->>'content_uniqueness'\
    \ AS DOUBLE))\n  + 0.3 * CAST(content_metrics->'link_media'->>'media_reuse_rate' AS DOUBLE)\n  + 0.3\
    \ * (1 - (SELECT i.\"TxtUniq\" FROM interaction_metrics i WHERE i.acct_dm = acct_slot))\n)) + 0.3\
    \ * (\n    0.3 * (SELECT (r.risk_profile->'risk_scores'->>'authenticity_score')::DOUBLE FROM risk_and_moderation\
    \ r WHERE r.acct_risk = acct_slot)\n  + 0.3 * CAST(content_metrics->'content_quality'->>'content_uniqueness'\
    \ AS DOUBLE)\n  + 0.4 * (SELECT i.\"ConvNat\" FROM interaction_metrics i WHERE i.acct_dm = acct_slot)\n\
    )"
  source_model: main.content_activity
  domains:
  - calculations
- name: automated_behavior_score_abs
  description: 'Measures degree of automation in account behavior.


    It is defined as: ABS = 0.4 * BBI + 0.3 * TEI + 0.3 * (1 - CAS).


    Built on: bot_behavior_index_bbi, technical_evasion_index_tei, content_authenticity_score_cas.


    Compiler note: ABS = 0.4*BBI + 0.3*TEI + 0.3*(1-CAS), computed via scalar subqueries from accounts,
    reusing the BBI, TEI, and CAS definitions from the knowledge base. Verified each join (behavioral_scores.acct_beh,
    security_sessions.acct_gate, risk_and_moderation.acct_risk, content_activity.acct_slot, interaction_metrics.acct_dm)
    is 1:1 with accounts.acct_ref.'
  sql_expression: "0.4 * (\n  (SELECT 0.4 * (b.behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double\n\
    \        + 0.3 * (b.behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double\n\
    \        + 0.3 * (1 - (SELECT i.ConvNat FROM interaction_metrics i WHERE i.acct_dm = accounts.acct_ref))\n\
    \   FROM behavioral_scores b WHERE b.acct_beh = accounts.acct_ref)\n) + 0.3 * (\n  (SELECT 0.4 * (REPLACE(s.session_telemetry->'vpn_usage_pct'->>0,\
    \ '%','')::double / 100)\n        + 0.3 * ((s.session_telemetry->'ip_reputation'->>'proxy_hits')::double\
    \ / 10)\n        + 0.3 * ((s.session_telemetry->'ip_reputation'->>'country_count')::double / 20)\n\
    \   FROM security_sessions s WHERE s.acct_gate = accounts.acct_ref)\n) + 0.3 * (\n  1 - (\n    0.3\
    \ * (SELECT (r.risk_profile->'risk_scores'->>'authenticity_score')::float FROM risk_and_moderation\
    \ r WHERE r.acct_risk = accounts.acct_ref)\n    + 0.3 * (SELECT (c.content_metrics->'content_quality'->>'content_uniqueness')::float\
    \ FROM content_activity c WHERE c.acct_slot = accounts.acct_ref)\n    + 0.4 * (SELECT i.\"ConvNat\"\
    \ FROM interaction_metrics i WHERE i.acct_dm = accounts.acct_ref)\n  )\n)"
  source_model: main.accounts
  domains:
  - calculations
- name: network_trust_score_nts
  description: 'Evaluates trustworthiness of account''s network connections.


    It is defined as: NTS = PCI * (1 - NGV) * (1 - CBR).


    Built on: profile_credibility_index_pci, network_growth_velocity_ngv, coordinated_bot_risk_cbr.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: NTS depends on PCI, which cannot be encoded (requires a "profile completeness" component
    with no defined formula or stored column in the database). Since NTS = PCI * (1 - NGV) * (1 - CBR)
    requires PCI, NTS cannot be encoded either.
- name: content_impact_score_cis
  description: 'Estimates the potential impact of manipulated content by blending manipulation intensity,
    moderation priority, and account influence.


    It is defined as: CIS = cms * mps * network influence centrality nic.


    Built on: content_manipulation_score_cms, moderation_priority_score_mps.


    Compiler note: CIS = CMS * MPS * NIC. CMS and MPS reused from given dependency formulas, reaching
    content_activity/interaction_metrics/risk_and_moderation via unique acct_ref scalar subqueries. NIC
    = 0.4*ConnQual + 0.3*network influence score + 0.3*IntDiv (network_metrics, unique per account); ''network
    influence score'' is taken as cluster_analysis.NetInfl (column documented as ''Network influence score''),
    averaged across all clusters an account belongs to via account_clusters, since an account can link
    to multiple clusters.'
  sql_expression: "(\n  0.4 * (1 - CAST((SELECT content_metrics->'content_quality'->>'content_uniqueness'\
    \ FROM content_activity WHERE acct_slot = acct_ref) AS DOUBLE))\n  + 0.3 * CAST((SELECT content_metrics->'link_media'->>'media_reuse_rate'\
    \ FROM content_activity WHERE acct_slot = acct_ref) AS DOUBLE)\n  + 0.3 * (1 - (SELECT TxtUniq FROM\
    \ interaction_metrics WHERE acct_dm = acct_ref))\n)\n*\n(\n  0.3 * (SELECT (risk_profile->'violation_history'->>'abuse_count')::numeric\
    \ FROM risk_and_moderation WHERE acct_risk = acct_ref) / 1000\n  + 0.4 * (SELECT (risk_profile->'risk_scores'->>'impact_score')::numeric\
    \ FROM risk_and_moderation WHERE acct_risk = acct_ref)\n  + 0.3 * (SELECT (risk_profile->'risk_scores'->>'risk_value')::numeric\
    \ FROM risk_and_moderation WHERE acct_risk = acct_ref)\n)\n*\n(\n  0.4 * (SELECT ConnQual FROM network_metrics\
    \ WHERE acct_node = acct_ref)\n  + 0.3 * (SELECT AVG(ca.NetInfl) FROM account_clusters ac JOIN cluster_analysis\
    \ ca ON ac.clu_ref = ca.CLSTR_PIN WHERE ac.acct_bridge = acct_ref)\n  + 0.3 * (SELECT IntDiv FROM\
    \ network_metrics WHERE acct_node = acct_ref)\n)"
  source_model: main.accounts
  domains:
  - calculations
- name: authentication_risk_score_ars
  description: 'Assesses authentication-related risks.


    It is defined as: ARS = 0.5 * TEI + 0.3 * (1 - PCI) + 0.2 * SRS.


    Built on: technical_evasion_index_tei, profile_credibility_index_pci, security_risk_score_srs.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: ARS depends on PCI (0.3 * (1-PCI) term), and PCI itself cannot be encoded because it requires
    a "profile completeness" component that has no defined formula or stored column in this database (per
    entry 26, only qualitative meaning is given). Since PCI cannot be computed, ARS cannot be computed
    either.
- name: behavioral_anomaly_score_bas
  description: 'Quantifies unusual behavior patterns.


    It is defined as: BAS = 0.4 * BBI + 0.4 * AAF + 0.2 * NGV.


    Built on: bot_behavior_index_bbi, account_activity_frequency_aaf, network_growth_velocity_ngv.


    Compiler note: BAS = 0.4*BBI + 0.4*AAF + 0.2*NGV, computed over accounts (acct_ref) joining scalar
    subqueries to behavioral_scores, interaction_metrics, security_sessions, network_metrics (each verified
    to have at most one matching row per account). AAF uses accounts.AGE_D as the age denominator per
    its definition.'
  sql_expression: "0.4 * (\n  0.4 * (SELECT (b.behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double\
    \ FROM behavioral_scores b WHERE b.acct_beh = accounts.acct_ref)\n  + 0.3 * (SELECT (b.behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double\
    \ FROM behavioral_scores b WHERE b.acct_beh = accounts.acct_ref)\n  + 0.3 * (1 - (SELECT i.ConvNat\
    \ FROM interaction_metrics i WHERE i.acct_dm = accounts.acct_ref))\n) + 0.4 * (\n  (SELECT (s.session_telemetry->'session_stats'->>'session_count')::numeric\
    \ FROM security_sessions s WHERE s.acct_gate = accounts.acct_ref)\n  / accounts.AGE_D\n) + 0.2 * (\n\
    \  SELECT sqrt(power(n.FollGrow,2) + power(n.FingGrow,2)) FROM network_metrics n WHERE n.acct_node\
    \ = accounts.acct_ref\n)"
  source_model: main.accounts
  domains:
  - calculations
- name: high_risk_bot_network
  description: 'Identifies dangerous coordinated bot networks.


    A Bot Network with CBR > 0.8 and SRS > 0.7


    Built on: coordinated_bot_risk_cbr, security_risk_score_srs.


    Compiler note: Evaluated per account_clusters row (an account-cluster membership). Bot Network check
    uses ClusterQty>10 for the cluster plus avg BBI (0.4*bot_likelihood+0.3*automated_behavior+0.3*(1-ConvNat))
    over all member accounts of that cluster >0.7. CBR and SRS reuse the formulas from the knowledge base;
    CBR uses the row''s own acct_bridge/clu_ref pairing and SRS uses the account''s risk_and_moderation
    record. Verified account_clusters.clu_ref groups match cluster_analysis.ClusterQty counts.'
  sql_expression: "-- Bot Network condition on the cluster this row belongs to: ClusterQty > 10 and average\
    \ BBI across all member accounts > 0.7\n(SELECT ca.ClusterQty FROM cluster_analysis ca WHERE ca.CLSTR_PIN\
    \ = account_clusters.clu_ref) > 10\nAND\n(SELECT AVG(\n    0.4 * (bs.behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double\n\
    \    + 0.3 * (bs.behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double\n  \
    \  + 0.3 * (1 - (SELECT im.ConvNat FROM interaction_metrics im WHERE im.acct_dm = ac2.acct_bridge))\n\
    \  )\n  FROM account_clusters ac2\n  JOIN behavioral_scores bs ON bs.acct_beh = ac2.acct_bridge\n\
    \  WHERE ac2.clu_ref = account_clusters.clu_ref\n) > 0.7\nAND\n-- CBR for this specific account-cluster\
    \ row > 0.8\n(\n  (0.4 * (SELECT (bs.behavioral_anomaly_scores->'automation_spam'->>'bot_likelihood')::double\
    \ FROM behavioral_scores bs WHERE bs.acct_beh = account_clusters.acct_bridge)\n   + 0.3 * (SELECT\
    \ (bs.behavioral_anomaly_scores->'automation_spam'->>'automated_behavior')::double FROM behavioral_scores\
    \ bs WHERE bs.acct_beh = account_clusters.acct_bridge)\n   + 0.3 * (1 - (SELECT im.ConvNat FROM interaction_metrics\
    \ im WHERE im.acct_dm = account_clusters.acct_bridge)))\n  *\n  (0.5 * (SELECT ca.CoordScore FROM\
    \ cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref)\n   + 0.3 * (SELECT ca.NetInfl\
    \ FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref)\n   + 0.2 * (SELECT ca.ClusterQty\
    \ FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref))\n  *\n  (SELECT ca.ClusterQty\
    \ FROM cluster_analysis ca WHERE ca.CLSTR_PIN = account_clusters.clu_ref)\n) > 0.8\nAND\n-- SRS for\
    \ the account in this row > 0.7\n(\n  0.4 * (SELECT (rm.risk_profile->'risk_scores'->>'risk_value')::double\
    \ FROM risk_and_moderation rm WHERE rm.acct_risk = account_clusters.acct_bridge)\n  + 0.3 * (1 - (SELECT\
    \ (rm.risk_profile->'risk_scores'->>'trust_score')::double FROM risk_and_moderation rm WHERE rm.acct_risk\
    \ = account_clusters.acct_bridge))\n  + 0.3 * (SELECT (rm.risk_profile->'risk_scores'->>'impact_score')::double\
    \ FROM risk_and_moderation rm WHERE rm.acct_risk = account_clusters.acct_bridge)\n) > 0.7"
  source_model: main.account_clusters
  domains:
  - definitions
