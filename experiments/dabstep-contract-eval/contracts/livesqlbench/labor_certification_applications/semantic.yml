    description: 'TEXT. Secondary address line of the worksite. **NULL means no secondary address provided.**.
      Example: 800.'
  - name: wcnty
    type: VARCHAR
    description: 'TEXT. County of the worksite. **NULL means no county specified.**. Example: YELLOWSTONE.'
