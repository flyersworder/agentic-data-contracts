      ''PERMANENT''. Contains noise with mixed case variations like ''PeNDinG'', ''PeNDING'', ''TEmpOrarY'',
      ''PERmAnent'', ''PeRmanENT''. Contains NULL when disability status assessment is not completed.'
  - name: house_stable
    type: VARCHAR
    description: 'Stability and security of the patient''s housing situation. Contains values: ''Stable'',
      ''Homeless'', ''At Risk'', ''Temporary''.'
  - name: cult_factor
    type: VARCHAR
    description: 'Cultural factors that may impact the patient''s mental health treatment. Contains values:
      ''Language'', ''beliefs'', ''Family'', ''multiple''. Contains noise with mixed case variations like
      ''LANGUAGE'', ''mUlTiplE'', ''FAMILy'', ''BELIefs'', ''BELIEFS'', ''MULTIPLE'', ''FAMILY''. Contains
      NULL when cultural assessment is not conducted.'
  - name: stigma_imp
    type: VARCHAR
    description: 'Impact of mental health stigma on the patient''s treatment engagement. Contains values:
      ''moderate'', ''Mild'', ''severe''. Contains noise with mixed case variations like ''mODErATe'',
      ''mILd'', ''MOdERatE'', ''seVERe'', ''SEVERE'', ''MODERATE'', ''MILD''. Contains NULL when stigma
      impact is not evaluated.'
  - name: fin_stress
    type: VARCHAR
    description: 'Level of financial stress experienced by the patient. Contains values: ''Severe'', ''Moderate'',
      ''Mild''. Contains NULL when financial stress assessment is not performed.'
  - name: clin_lead_ref
    type: VARCHAR
    description: Foreign key referencing Clinicians(Clin_Key), identifying the patient's primary clinician.
- schema: main
  table: treatmentbasics
  columns:
  - name: tx_key
    type: BIGINT
    description: A BIGSERIAL primary key auto-incrementing identifier for treatment records.
  - name: enc_ref
    type: VARCHAR
    description: Foreign key referencing Encounters(Enc_Key), linking treatment to specific clinical encounters.
  - name: cur_med
    type: VARCHAR
    description: Current medications prescribed to the patient. Free-text field containing medication
      combinations like 'Antidepressant,Antipsychotic', 'None,Antipsychotic,Mood Stabilizer'. Contains
      NULL when medication information is not documented.
  - name: med_adh
    type: VARCHAR
    description: 'Medication adherence level. Contains values: ''Medium'', ''Low'', ''High''.'
  - name: med_side
    type: VARCHAR
    description: 'Medication side effects experienced. Contains values: ''Mild'', ''Moderate'', ''Severe''.
      Contains NULL when side effects are not monitored.'
  - name: med_chg
    type: VARCHAR
    description: 'Recent medication changes made. Contains values: ''Dose Adjustment'', ''Augmentation'',
      ''Switch''. Contains NULL when medication changes are not tracked.'
  - name: th_type
    type: VARCHAR
    description: 'Type of therapy being provided. Contains values: ''CBT'', ''Group'', ''Individual'',
      ''Family''. Contains NULL when therapy type is not specified.'
  - name: th_freq
    type: VARCHAR
    description: 'Frequency of therapy sessions. Contains values: ''Biweekly'', ''Monthly'', ''Weekly'',
      ''Quarterly''. Contains NULL when therapy frequency is not documented.'
  - name: th_dur_m
    type: BIGINT
    description: Duration of therapy treatment in months.
  - name: th_eng
    type: VARCHAR
    description: 'Level of patient engagement in therapy. Contains values: ''Medium'', ''High'', ''Low''.


      Therapy Engagement: Illustrates the value of therapy engagement levels.


      Ranges from Low to High. Low indicates minimal participation, Medium indicates regular participation,
      and High indicates active engagement.


      Compiler note: th_eng contains values High/Medium/Low (plus Non-compliant) matching the described
      Low-Medium-High therapy engagement scale.'
  - name: th_chg
    type: VARCHAR
    description: 'Recent therapy changes made to the treatment plan. Contains values: ''Frequency Change'',
      ''Modality Change'', ''No Change''. Contains NULL when therapy changes are not tracked.'
  - name: crisis_int
    type: FLOAT
    description: 'Number of crisis interventions required during the treatment period.


      Crisis Intervention Count: Illustrates the value of the crisis intervention count.


      A numeric value indicating the number of crisis interventions. A value of 0 indicates no interventions,
      while higher values (e.g., 3) indicate frequent interventions.


      Compiler note: Describes the value semantics of crisis_int: numeric count of crisis interventions,
      observed range 0-5 in data, 0=no interventions, higher=more frequent.'
- schema: main
  table: treatmentoutcomes
  columns:
  - name: tx_out_key
