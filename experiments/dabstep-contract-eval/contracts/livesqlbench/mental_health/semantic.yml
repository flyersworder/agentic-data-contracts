    description: 'Patient''s ethnicity or racial background. Contains values: ''Other'', ''Hispanic'',
      ''White'', ''Black'', ''Asian''.'
  - name: edu_level
    type: VARCHAR
    description: 'Patient''s highest level of education completed. Contains values: ''High School'', ''College'',
      ''Graduate'', ''Less than High School''.'
  - name: emp_stat
    type: VARCHAR
    description: 'Patient''s current employment status. Contains values: ''Retired'', ''Employed'', ''Unemployed'',
      ''Student'', ''Disabled''.'
  - name: mari_stat
    type: VARCHAR
    description: 'Patient''s marital or relationship status. Contains values: ''Widowed'', ''Married'',
      ''Single'', ''Divorced'', ''Separated''.'
  - name: living_arr
    type: VARCHAR
    description: 'Patient''s current living arrangement. Contains values: ''Alone'', ''Partner'', ''Family'',
      ''Group Home''.'
  - name: insur_type
    type: VARCHAR
    description: 'Type of health insurance coverage held by the patient. Contains values: ''Medicaid'',
      ''Medicare'', ''Private'', ''None'', ''Military''. Contains NULL when insurance information is not
      available.'
  - name: insur_stat
    type: VARCHAR
    description: 'Current status of the patient''s insurance coverage. Contains values: ''Pending'', ''Approved'',
      ''Denied'', ''Active''.'
  - name: disab_stat
    type: VARCHAR
    description: 'Patient''s disability status and accommodations needed. Contains values: ''PENDING'',
