    description: 'Recovery goals achievement status. Contains values: ''Not Started'', ''In Progress'',
      ''Achieved'', ''Partially Met''.'
  - name: txprogmet
    type: JSON
    description: 'JSONB column. Combines treatment progress metrics including therapy progress, treatment
