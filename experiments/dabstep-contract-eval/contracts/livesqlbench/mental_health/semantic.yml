      ''Poor'', ''Excellent''. Contains NULL when therapy progress is not evaluated.", "Tx_Adh": "Treatment
      adherence level. Contains values: ''Non-compliant'', ''Medium'', ''High'', ''Compliant''.", "Tx_Resp":
      "Treatment response assessment. Contains values: ''Poor'', ''Partial'', ''Good'', ''Excellent''.
      Contains NULL when treatment response is not evaluated.", "Side_Burd": "Side effect burden experienced
      by the patient. Contains values: ''Mild'', ''Moderate'', ''Good'', ''Severe''. Contains NULL when
      side effect burden is not assessed.", "Symp_Imp": "Symptom improvement assessment. Contains values:
      ''MODERATE'', ''minimal'', ''Significant'', ''moderate''. Contains noise with mixed case variations
      like ''MODeRatE'', ''MoDERATe'', ''miNiMAL'', ''SignIFIcaNT'', ''MINIMAL'', ''SIGNIFICANT''. Contains
      NULL when symptom improvement is not evaluated.", "Func_Impv": "Functional improvement assessment.
      Contains values: ''MODERATE'', ''moDeraTe'', ''Moderate'', ''MINIMAL'', ''Minimal'', ''siGnIfiCAnT'',
      ''moderate'', ''significant''. Contains noise with mixed case variations like ''moDEraTE'', ''MINimAL'',
      ''signiFIcant'', ''SignIFicAnT''. Contains NULL when functional improvement is not assessed.", "Work_Stat_Chg":
      "Work status changes during treatment. Contains values: ''Leave'', ''reduced hours'', ''Terminated''.
      Contains noise with mixed case variations like ''REDUCED HOURS'', ''LEAVE'', ''termINaTEd'', ''TeRMINaTed'',
      ''TERMINATED'', ''REduCeD HOURS''. Contains NULL when work status changes are not tracked.", "Sat_Scr":
      "Patient satisfaction score typically ranging from 1 to 10.", "Ther_Alliance": "Therapeutic alliance
      quality assessment. Contains values: ''poor'', ''StROng'', ''moderate'', ''strong'', ''MODERATE'',
      ''POOR'', ''Weak'', ''Strong''. Contains noise with mixed case variations like ''stroNG'', ''sTRONg'',
      ''mODERAte'', ''weAk'', ''STRONG'', ''WEAK''. Contains NULL when therapeutic alliance is not assessed.",
      "Tx_Eng": "Treatment engagement level. Contains values: ''High'', ''Medium'', ''Low'', ''Non-compliant''.",
      "Tx_Sat": "Treatment satisfaction level. Contains values: ''meDiUm'', ''DisSAtISFieD'', ''Dissatisfied'',
      ''lOw'', ''Low'', ''DISSATISFIED'', ''HIGH'', ''High'', ''Medium''. Contains noise with mixed case
      variations like ''medIUm'', ''DISsATISFied'', ''MEdiuM'', ''HIGh'', ''MEDIUM''. Contains NULL when
      treatment satisfaction is not assessed."}'
