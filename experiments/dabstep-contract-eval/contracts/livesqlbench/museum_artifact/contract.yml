  - name: reference
    summary: Value explanations that belong to no single table or column
    description: 'Explanations of values from the knowledge base.


      Sensitivity Weight Values: Numerical weights for sensitivity calculations.


      A mapping of qualitative sensitivity ratings to numerical values for calculation purposes. For example:
      Low=1, Medium=5, High=10 for various environmental factors like light, temperature, and humidity.


      Compiler note: This is a general-purpose numeric mapping (Low/Medium/High -> 1/5/10) used by multiple
      derived metrics (ERF, DSD, LER, etc.) across several JSONB sensitivity fields (e.g., SensitivityData.env_handling_sensitivity).
      It is not itself a table or column in the schema - it''s a reusable lookup/weighting scheme referenced
      by other calculations, so it cannot be encoded as a single table/column target.'
  - name: definitions
    summary: Business conditions defined in the knowledge base
    description: Definitions from the knowledge base, each a metric whose SQL is a boolean condition over
      the rows of its table.
  rules:
