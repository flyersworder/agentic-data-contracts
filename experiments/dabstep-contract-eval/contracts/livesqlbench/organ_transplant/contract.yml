version: '1.0'
name: livesqlbench-organ_transplant
semantic:
  source:
    type: yaml
    path: ./semantic.yml
    expected_extras: []
  allowed_tables:
  - schema: main
    preferred: true
    tables:
    - administrative_and_review
    - allocation_details
    - clinical
    - compatibility_metrics
    - data_source_and_quality
    - demographics
    - function_and_recovery
    - hla_info
    - logistics
