  - name: allc_seq_num
    type: SMALLINT
    description: 'SMALLINT. Sequence number in allocation ranking. Example: 24.'
  - name: allc_region
    type: VARCHAR
    description: 'TEXT. Geographic region for organs allocation. Possible values: Region_1, Region_10,
      Region_2, Region_3, Region_4, Region_5, Region_6, Region_7, Region_8, Region_9.'
  - name: allc_pol_vers
    type: VARCHAR
    description: 'TEXT. Allocation policy version used. Example: v2.7.'
  - name: donor_ref_reg
    type: VARCHAR
    description: TEXT. Reference to donor demographics record. FK to Demographics.
  - name: recip_ref_reg
    type: VARCHAR
    description: TEXT. Reference to recipient demographics record. FK to Recipients_Demographics.
- schema: main
  table: clinical
  columns:
  - name: clin_recip_registry
    type: VARCHAR
    description: TEXT. Primary key linking to recipient demographics for clinical data. PK = Clinical(Clin_Recip_Registry),
      FK to Recipients_Demographics.
  - name: diag_detail
    type: VARCHAR
    description: 'TEXT. Primary diagnosis and medical condition requiring transplant. Possible values:
      Acute failure, immediate transplant required.'
  - name: wait_time
    type: VARCHAR
    description: 'TEXT. Number of days recipient has been on transplant waiting list. Example: 104 days'
  - name: med_urgency
    type: VARCHAR
    description: 'TEXT. Medical urgency status classification for transplant priority. **DATA NOISE: ''Status
      2'' partially replaced with ''2'', ''Status 3'' partially replaced with ''3'', etc.** Possible values:
      2, 3, Status 1A, Status 1B, Status 2, Status 3.


      Medical Urgency Tiers: Illustrates the hierarchy of transplant urgency statuses.


      Patients are prioritized based on their risk of dying while on the waitlist. Status 1A is the highest
      urgency, reserved for critically ill patients in the ICU. Status 1B is a lower, but still urgent,
      category. Lower statuses (e.g., Status 2) are for more stable patients.


      Compiler note: Explains the meaning/hierarchy of med_urgency status values (Status 1A highest, 1B
      next, Status 2/3 lower) - a value explanation, not a new computation.'
  - name: prev_tx_count
    type: VARCHAR
    description: 'TEXT. Number of previous transplants recipient has received. Possible values: 0 previous
      transplants, first-time recipient.'
  - name: dial_status
    type: VARCHAR
    description: 'TEXT. Current dialysis status and treatment regimen. **NULL means dialysis status is
      not applicable or not documented.**. Possible values: Hemodialysis, standard renal replacement therapy.'
  - name: dial_duration
    type: VARCHAR
    description: 'TEXT. Duration of dialysis treatment in months. Example: 45 months'
  - name: comorbid_detail
    type: VARCHAR
    description: 'TEXT. Comorbid conditions and secondary medical issues. **NULL means comorbidity assessment
      is incomplete or not available.**. Example: Hypertension,Heart Disease,Diabetes.'
- schema: main
  table: compatibility_metrics
  columns:
  - name: match_comp_registry
    type: VARCHAR
    description: TEXT. Primary key linking to transplant matching record. PK = Compatibility_Metrics(Match_Comp_Registry),
      FK to Transplant_Matching.
  - name: hla_mis_count
    type: BIGINT
    description: 'BIGINT. Number of HLA antigen mismatches between donor and recipient. Possible values:
      0'
  - name: blood_compat
    type: VARCHAR
    description: 'TEXT. Blood type compatibility assessment result. **NULL means blood compatibility assessment
      is pending or unavailable.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
      mixed case).** Example: incompatible.'
  - name: distance
    type: VARCHAR
    description: 'TEXT. Geographic distance between donor and recipient in kilometers. Example: 1815 miles'
  - name: exp_isch_time
    type: VARCHAR
    description: 'TEXT. Expected cold ischemia time in minutes. Example: 539 minutes ischemia.'
  - name: exp_time
    type: VARCHAR
    description: 'TEXT. Expected transport time in minutes. Example: 45 minutes transport.'
  - name: cost_est
    type: VARCHAR
    description: 'TEXT. Estimated cost for transplant procedure and logistics. Example: US$5210.53'
  - name: donor_ref_reg
    type: VARCHAR
    description: TEXT. Reference to donor demographics record. FK to Demographics.
  - name: recip_ref_reg
    type: VARCHAR
    description: TEXT. Reference to recipient demographics record. FK to Recipients_Demographics.
  - name: compatscores
    type: JSON
    description: 'JSONB column. Aggregates compatibility scoring metrics including HLA, size, and age
      compatibility assessments for donor-recipient matching. Fields: {"Hla_Score": "REAL. HLA compatibility
      score based on antigen matching. Example: 0.522.", "Size_Score": "REAL. Size compatibility score
      based on donor-recipient measurements. Example: 0.228.", "Age_Score": "REAL. Age compatibility score
      for optimal matching. Example: 0.327."}'
- schema: main
  table: data_source_and_quality
  columns:
  - name: q_match_registry
    type: VARCHAR
    description: TEXT. Primary key linking to transplant matching record. PK = Data_Source_and_Quality(Q_Match_Registry),
      FK to Transplant_Matching.
  - name: data_src_val
    type: VARCHAR
    description: 'TEXT. Data source identification and origin. **NULL means data source information is
      not documented or unknown.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
      mixed case).** Example: uNoS.'
  - name: dq_score_val
    type: FLOAT
    description: 'REAL. Data quality assessment score. Example: 0.966.'
  - name: dc_score_val
    type: FLOAT
    description: 'REAL. Data completeness assessment score. Example: 0.78.'
  - name: verif_stat_val
    type: VARCHAR
    description: 'TEXT. Data verification status assessment. **NULL means data verification is pending
      or not performed.** **DATA NOISE: Values have random case variations (lowercase, uppercase, mixed
      case).** Example: verified.'
  - name: last_up_ts
    type: VARCHAR
    description: 'TIMESTAMP. Timestamp of last data update. **DATA NOISE: Date format converted to yyyy/mm/dd.**
      Possible values: 2025/02/19.'
  - name: next_rev_dt
    type: VARCHAR
    description: 'DATE. Next scheduled review date for data validation. **DATA NOISE: Date format converted
      to dd/mm/yyyy.** Example: 04/03/2025.'
  - name: q_don_ref
    type: VARCHAR
    description: TEXT. Quality reference to donor demographics record. FK to Demographics.
  - name: q_rec_ref
    type: VARCHAR
    description: TEXT. Quality reference to recipient demographics record. FK to Recipients_Demographics.
- schema: main
  table: demographics
  columns:
  - name: contrib_registry
    type: VARCHAR
    description: 'TEXT. Primary key uniquely identifying each organs donor in the transplant matching
      system. PK = Demographics(Contrib_Registry). Example: D812743.'
  - name: age_count
    type: VARCHAR
    description: 'TEXT. Donor''s age in years at time of organs recovery. Example: 57 years, mature donor.'
  - name: blood_class
    type: VARCHAR
    description: 'TEXT. Donor''s ABO blood type classification for compatibility matching. Possible values:
      AB- rare negative type.'
  - name: nation_ref
    type: VARCHAR
    description: 'TEXT. Donor''s country of origin or nationality reference. Example: Seychelles.'
  - name: physicalstats
    type: JSON
    description: 'JSONB column. Groups physical measurements and characteristics including height, weight,
      BMI, and demographic information for donor assessment. Fields: {"Height_Cm": "SMALLINT. Donor''s
      height measurement in centimeters. Example: 171.", "Weight_Kg": "SMALLINT. Donor''s weight measurement
      in kilograms. Example: 55.", "Bmi_Value": "REAL. Donor''s calculated body mass index value. Example:
      18.8.", "Gender_Type": "TEXT. Donor''s gender classification code. Possible values: F, M.", "Ethnicity":
      "TEXT. Donor''s ethnic or racial background classification. Possible values: African, Asian, Caucasian,
      Hispanic, Other."}'
- schema: main
  table: function_and_recovery
  columns:
  - name: recov_don_registry
    type: VARCHAR
    description: TEXT. Primary key linking to donor demographics for organs function data. PK = Function_and_Recovery(Recov_Don_Registry),
      FK to Demographics.
  - name: don_crtn_val
    type: VARCHAR
    description: 'TEXT. Donor''s serum creatinine level indicating kidney function. Example: 1.62 mg/dL.


      Serum Creatinine Levels: Illustrates how serum creatinine levels reflect kidney function.


      A waste product from muscle metabolism, cleared by the kidneys. Normal values are typically 0.7-1.3
      mg/dL. A high value, such as 2.5 mg/dL, suggests impaired kidney function, which is a key component
      of the Renal Function Score.


      Compiler note: Describes interpretation of serum creatinine values (don_crtn_val, e.g. ''1.62 mg/dL'');
      illustrative explanation only, not a separate computation.'
  - name: don_gfr_val
    type: VARCHAR
    description: 'REAL. Donor''s glomerular filtration rate measuring kidney function. Example: 103.4
      mL/min/1.73m².


      Glomerular Filtration Rate (GFR) Values: Illustrates the stages of kidney function based on GFR
      values.


      GFR measures how well the kidneys are filtering blood. A GFR > 90 mL/min/1.73m² is considered normal.
      A GFR of 30-59 indicates moderate kidney disease, and a GFR < 15 signifies kidney failure.


      Compiler note: Describes interpretation ranges for GFR values stored in function_and_recovery.don_gfr_val
      (donor glomerular filtration rate, text with unit mL/min/1.73m²). This is explanatory/illustrative
      knowledge, not a computation or predicate to encode as SQL.'
  - name: don_co_desc
    type: VARCHAR
    description: 'TEXT. Description of donor''s cause of death. Possible values: Anoxia, oxygen deprivation
      may affect organ quality.'
  - name: org_recov_dt
    type: VARCHAR
    description: 'TEXT. Date and time when organss were recovered from donor.** Possible values: 02-18-2025
      HKT.'
  - name: org_presv_meth
    type: VARCHAR
    description: 'TEXT. Method used for organs preservation during transport. Possible values: Static
      cold storage, standard preservation method.'
  - name: org_isch_time
    type: VARCHAR
    description: 'TEXT. Cold ischemia time in minutes from recovery to transplant. Example: 702 mins.'
  - name: organfuncassess
    type: JSON
    description: 'JSONB column. Groups organ function assessment data including liver, cardiac, and pulmonary
      function evaluations for multi-organ status review. Fields: {"Liv_Func": "TEXT. Assessment of donor''s
      liver function status. Possible values: Mild, Moderate, Normal, Severe.", "Card_Func": "TEXT. Assessment
      of donor''s cardiac function status. Possible values: Mild, Moderate, Normal, Severe.", "Pulm_Func":
      "TEXT. Assessment of donor''s pulmonary function status. Possible values: Mild, Moderate, Normal,
      Severe."}'
