- schema: main
  table: recipients_immunology
  columns:
  - name: immu_recip_registry
    type: VARCHAR
    description: TEXT. Primary key linking to recipient demographics for immunological data. PK = Recipients_Immunology(Immu_Recip_Registry),
      FK to Recipients_Demographics.
  - name: pra_score
    type: FLOAT
    description: 'REAL. Panel reactive antibody score indicating sensitization level. Example: 6.'
  - name: dsa_state
    type: VARCHAR
    description: 'TEXT. Donor-specific antibody presence status. Possible values: Negative, Positive.'
  - name: cross_result
    type: VARCHAR
    description: 'TEXT. Crossmatch test result for donor-recipient compatibility. Possible values: Negative,
      Pending, Positive.


      Crossmatch Results: Illustrates the critical outcomes of a crossmatch test.


      A ''Negative'' result means no pre-formed donor-specific antibodies were detected, and the transplant
      can proceed. A ''Positive'' result indicates the presence of these antibodies, making transplant
      highly risky or contraindicated due to the high chance of hyperacute rejection.


      Compiler note: Describes the meaning of ''Negative''/''Positive'' values in recipients_immunology.cross_result;
      a values-explanation, not a new computation/condition.'
  - name: cmv_state
    type: VARCHAR
    description: 'TEXT. Recipient''s cytomegalovirus infection status. Possible values: Negative, Positive.'
  - name: ebv_state
    type: VARCHAR
    description: 'TEXT. Recipient''s Epstein-Barr virus infection status. Possible values: Negative, Positive.'
  - name: func_status
    type: VARCHAR
    description: 'TEXT. Recipient''s functional status assessment. Possible values: Mild Impairment, Moderate
      Impairment, Normal, Severe Impairment.'
  - name: life_support
    type: VARCHAR
    description: 'TEXT. Life support requirements and status. **NULL means life support status is not
      applicable or not documented.**. Possible values: ECMO, Mechanical Ventilation, VAD.'
  - name: hlaprofile
    type: JSON
    description: 'JSONB column. Stores complete HLA typing profile including A, B, DR, and DQ values for
      immunological compatibility matching. Fields: {"Hla_A_Val": "REAL. Recipient''s HLA-A antigen typing
      value for compatibility matching. Example: 89,11.", "Hla_B_Val": "REAL. Recipient''s HLA-B antigen
      typing value for compatibility matching. Example: 22,60.", "Hla_Dr_Val": "REAL. Recipient''s HLA-DR
      antigen typing value for compatibility matching. Example: 59,9.", "Hla_Dq_Val": "REAL. Recipient''s
      HLA-DQ antigen typing value for compatibility matching. Example: 8,1."}'
