      "TEXT. Donor''s hepatitis B virus infection status. Possible values: Negative, Positive.", "Hcv_State":
      "TEXT. Donor''s hepatitis C virus infection status. Possible values: Negative, Positive.", "Hiv_State":
      "TEXT. Donor''s human immunodeficiency virus infection status. Possible values: Negative, Positive."}'
