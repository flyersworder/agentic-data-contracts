# Compiled by dce.compile -- do not edit; recompile instead.
# benchmark: livesqlbench, database: organ_transplant, compiler: claudesonnet5
# inputs: organ_transplant_kb.jsonl, organ_transplant_column_meaning_base.json, organ_transplant_schema.txt, organ_transplant.duckdb
metrics:
- name: body_mass_index_bmi
  description: 'Calculates a person''s body mass index from their weight and height.


    BMI is calculated as weight in kilograms divided by the square of height in meters. Formula: $BMI
    = \frac{weight_{kg}}{height_m^2}$


    Compiler note: Computed as weight_kg divided by (height_cm/100)^2 to convert height to meters; verified
    against stored bmi_val for close match.'
  sql_expression: wt_kg / POWER(ht_cm / 100.0, 2)
  source_model: main.recipients_demographics
  domains:
  - calculations
- name: donor_recipient_age_difference
  description: 'Calculates the absolute age difference between an organ donor and a recipient.


    The absolute difference between the recipient''s age and the donor''s age. Formula: $|Age_{recipient}
    - Age_{donor}|$.


    Compiler note: Donor age stored as text like ''57 years, mature donor''; extracted leading integer
    via split on space. Recipient age is smallint in recipients_demographics. Joined donor/recipient via
    transplant_matching''s donor_ref_reg/recip_ref_reg (each a unique match to demographics/recipients_demographics
    PK).'
  sql_expression: ABS((SELECT age_count FROM recipients_demographics WHERE recip_registry = transplant_matching.recip_ref_reg)
    - CAST(SPLIT_PART((SELECT age_count FROM demographics WHERE contrib_registry = transplant_matching.donor_ref_reg),
    ' ', 1) AS INTEGER))
  source_model: main.transplant_matching
  domains:
  - calculations
- name: total_ischemia_time
  description: 'Measures the total time an organ is without blood supply, from recovery to transplant.


    The sum of the time from organ recovery to preservation and the time from preservation to transplant.
    Formula: $T_{ischemia} = T_{cold} + T_{warm}$


    Compiler note: Interpreted T_cold as the expected cold ischemia time (exp_isch_time, recovery to preservation)
    and T_warm as the expected transport time (exp_time, preservation to transplant), both stored as text
    with units suffix; extracted numeric minutes via regex and summed.'
  sql_expression: CAST(regexp_extract(exp_isch_time, '\d+') AS INT) + CAST(regexp_extract(exp_time, '\d+')
    AS INT)
  source_model: main.compatibility_metrics
  domains:
  - calculations
- name: estimated_glomerular_filtration_rate_egfr
  description: 'Estimates the kidney''s filtration capacity, a key indicator of renal function.


    A calculated rate based on serum creatinine level, age, and gender. A simplified estimation formula
    is: $eGFR = 141 \times (\frac{Cr}{0.9})^{-0.411} \times 0.993^{Age}$ (for males, where Cr is serum
    creatinine). The actual formula can be more complex.


    Compiler note: Parsed numeric creatinine from don_crtn_val (e.g. ''1.62 mg/dL'') via regex, and numeric
    age from demographics.age_count (e.g. ''57 years, mature donor'') via regex, joined by recov_don_registry
    = contrib_registry (1:1 FK). Applied the male formula given in the definition (eGFR = 141*(Cr/0.9)^-0.411*0.993^Age);
    the entry only specifies the formula for males and notes the actual formula can be more complex (e.g.
    gender-adjusted), which is not encoded here.'
  sql_expression: 141 * pow(CAST(regexp_extract(don_crtn_val, '[0-9.]+') AS DOUBLE) / 0.9, -0.411) * pow(0.993,
    CAST(regexp_extract((SELECT d.age_count FROM demographics d WHERE d.contrib_registry = recov_don_registry),
    '[0-9]+') AS DOUBLE))
  source_model: main.function_and_recovery
  domains:
  - calculations
- name: hla_mismatch_score
  description: 'Quantifies the degree of immunological difference between a donor and recipient based
    on Human Leukocyte Antigens (HLA).


    A count of the mismatched HLA antigens (A, B, DR) between the donor and recipient. Formula: $S_{mismatch}
    = \sum_{i \in \{A, B, DR\}} (HLA_i^{donor} \neq HLA_i^{recipient})$


    Compiler note: Computed as sum of mismatches across HLA-A, HLA-B, HLA-DR loci only (DQ excluded per
    formula), comparing donor''s hla_info table values to recipient''s hlaprofile JSON fields (Hla_A_Val,
    Hla_B_Val, Hla_Dr_Val), joined via transplant_matching''s donor_ref_reg/recip_ref_reg which uniquely
    match each donor/recipient PK.'
  sql_expression: '(CASE WHEN (SELECT h.hla_a_val FROM hla_info h WHERE h.immu_don_registry = donor_ref_reg)
    <> (SELECT (r.hlaprofile->>''Hla_A_Val'')::real FROM recipients_immunology r WHERE r.immu_recip_registry
    = recip_ref_reg) THEN 1 ELSE 0 END)

    + (CASE WHEN (SELECT h.hla_b_val FROM hla_info h WHERE h.immu_don_registry = donor_ref_reg) <> (SELECT
    (r.hlaprofile->>''Hla_B_Val'')::real FROM recipients_immunology r WHERE r.immu_recip_registry = recip_ref_reg)
    THEN 1 ELSE 0 END)

    + (CASE WHEN (SELECT h.hla_dr_val FROM hla_info h WHERE h.immu_don_registry = donor_ref_reg) <> (SELECT
    (r.hlaprofile->>''Hla_Dr_Val'')::real FROM recipients_immunology r WHERE r.immu_recip_registry = recip_ref_reg)
    THEN 1 ELSE 0 END)'
  source_model: main.transplant_matching
  domains:
  - calculations
- name: recipient_wait_time_ratio
  description: 'Calculates the ratio of a recipient''s waiting time to the average waiting time for their
    specific organ and blood type.


    The recipient''s wait time in days converted to years. Formula: $R_{wait} = \frac{T_{recipient_wait_days}}{365.0}$


    Compiler note: wait_time stored as text like ''104 days''; extracted the leading numeric day count
    and divided by 365.0 per the stated formula. Despite the entry''s description mentioning a ratio to
    average wait time for organ/blood type, the formula given only computes wait time in years, so that
    is what is encoded.'
  sql_expression: CAST(split_part(wait_time, ' ', 1) AS DOUBLE) / 365.0
  source_model: main.clinical
  domains:
  - calculations
- name: size_compatibility_score
  description: 'A score that assesses the physical size match between a donor and recipient, primarily
    using Body Mass Index (BMI).


    A score derived from the ratio of donor and recipient BMI. Formula: $S_{size} = 1 - |\frac{BMI_{donor}}{BMI_{recipient}}
    - 1|$.


    Built on: body_mass_index_bmi.


    Compiler note: Donor BMI taken from demographics.physicalstats->>''Bmi_Value'' (cast to real), recipient
    BMI from recipients_demographics.bmi_val. Joins via compatibility_metrics.donor_ref_reg -> demographics.contrib_registry
    and recip_ref_reg -> recipients_demographics.recip_registry, both unique PKs.'
  sql_expression: 1 - ABS( ((SELECT (physicalstats->>'Bmi_Value')::real FROM demographics d WHERE d.contrib_registry
    = compatibility_metrics.donor_ref_reg) / (SELECT bmi_val FROM recipients_demographics r WHERE r.recip_registry
    = compatibility_metrics.recip_ref_reg)) - 1 )
  source_model: main.compatibility_metrics
  domains:
  - calculations
- name: age_compatibility_score
  description: 'A score evaluating the suitability of a donor''s age relative to the recipient''s, considering
    the Donor-Recipient Age Difference.


    A normalized score based on the Donor-Recipient Age Difference. Formula: $S_{age} = e^{-0.03 \times
    |Age_{recipient} - Age_{donor}|}$, using a standard scaling factor.


    Built on: donor_recipient_age_difference.


    Compiler note: Uses donor_recipient_age_difference subquery pattern (recipient age_count minus donor
    age parsed from leading integer in age_count text), applied in exponential decay formula with scaling
    factor 0.03.'
  sql_expression: EXP(-0.03 * ABS((SELECT age_count FROM recipients_demographics WHERE recip_registry
    = transplant_matching.recip_ref_reg) - CAST(SPLIT_PART((SELECT age_count FROM demographics WHERE contrib_registry
    = transplant_matching.donor_ref_reg), ' ', 1) AS INTEGER)))
  source_model: main.transplant_matching
  domains:
  - calculations
- name: logistical_feasibility_index
  description: 'Calculates an index representing the logistical viability of a transplant, considering
    distance and expected organ preservation time.


    A score combining geographic distance and Total Ischemia Time. Formula: $I_{logistics} = (\frac{700}{Distance_{km}})
    + (\frac{300}{T_{ischemia\_mins}})$


    Built on: total_ischemia_time.


    Compiler note: Distance is stored as ''X miles'' and ischemia/transport times as ''X minutes ...'';
    extracted numeric values via regexp. Note: distance column is in miles though formula names it Distance_km;
    no unit conversion is specified in the documentation so the raw stored numeric value is used as-is.
    Total ischemia time is the sum of exp_isch_time and exp_time numeric values per the total_ischemia_time
    definition.'
  sql_expression: (700.0 / CAST(regexp_extract(distance, '\d+') AS INT)) + (300.0 / (CAST(regexp_extract(exp_isch_time,
    '\d+') AS INT) + CAST(regexp_extract(exp_time, '\d+') AS INT)))
  source_model: main.compatibility_metrics
  domains:
  - calculations
- name: renal_function_score
  description: 'A composite score to evaluate a donor''s kidney health based on key indicators.


    A score calculated from the donor''s Estimated Glomerular Filtration Rate (eGFR) and serum creatinine
    (Cr) level. Formula: $S_{renal} = (1.0 \times eGFR) - (10.0 \times Cr)$.


    Built on: estimated_glomerular_filtration_rate_egfr.


    Compiler note: Renal Function Score = eGFR - 10*Cr. Cr parsed as numeric prefix of don_crtn_val (e.g.
    ''1.62 mg/dL''); donor age parsed as numeric prefix of demographics.age_count (e.g. ''57 years, mature
    donor'') via scalar subquery matched 1:1 on contrib_registry PK. eGFR formula reuses the provided
    estimated_glomerular_filtration_rate_egfr expression.'
  sql_expression: (141 * pow(CAST(regexp_extract(don_crtn_val, '[0-9.]+') AS DOUBLE) / 0.9, -0.411) *
    pow(0.993, CAST(regexp_extract((SELECT d.age_count FROM demographics d WHERE d.contrib_registry =
    function_and_recovery.recov_don_registry), '[0-9]+') AS DOUBLE))) - (10.0 * CAST(regexp_extract(don_crtn_val,
    '[0-9.]+') AS DOUBLE))
  source_model: main.function_and_recovery
  domains:
  - calculations
- name: immunological_compatibility_score
  description: 'A comprehensive score assessing the immunological match, factoring in blood type and HLA
    differences.


    A weighted score based on ABO blood type compatibility status and the HLA Mismatch Score. Formula:
    $S_{immune} = 0.6 \times I_{ABO} + 0.4 \times (1 - \frac{S_{mismatch}}{6})$, where $I_{ABO}$ is 1
    for compatible, 0 otherwise.


    Built on: hla_mismatch_score, abo_blood_type_compatibility.


    Compiler note: Combines ABO Blood Type Compatibility (I_ABO: 1 if compatible per O-universal-donor/AB-universal-recipient/matching-type
    rules, else 0) and HLA Mismatch Score (count of mismatches across A, B, DR loci between donor hla_info
    and recipient hlaprofile JSON) using compatibility_metrics.donor_ref_reg/recip_ref_reg as the join
    keys, since match_comp_registry corresponds 1:1 to transplant_matching.match_rec_registry.'
  sql_expression: "0.6 * (CASE WHEN (\n    CASE\n      WHEN left((SELECT d.blood_class FROM demographics\
    \ d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),2) = 'AB' THEN TRUE\n      WHEN\
    \ left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1)\
    \ = 'O' THEN TRUE\n      WHEN left((SELECT r.blood_class FROM recipients_demographics r WHERE r.recip_registry\
    \ = compatibility_metrics.recip_ref_reg),2) = 'AB' THEN TRUE\n      WHEN left((SELECT r.blood_class\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg),1)\
    \ =\n           left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1)\
    \ THEN TRUE\n      ELSE FALSE\n    END\n) THEN 1 ELSE 0 END)\n+ 0.4 * (1 - (\n    (CASE WHEN (SELECT\
    \ h.hla_a_val FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg) <>\
    \ (SELECT (r.hlaprofile->>'Hla_A_Val')::real FROM recipients_immunology r WHERE r.immu_recip_registry\
    \ = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n  + (CASE WHEN (SELECT h.hla_b_val FROM\
    \ hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_B_Val')::real\
    \ FROM recipients_immunology r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg)\
    \ THEN 1 ELSE 0 END)\n  + (CASE WHEN (SELECT h.hla_dr_val FROM hla_info h WHERE h.immu_don_registry\
    \ = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_Dr_Val')::real FROM recipients_immunology\
    \ r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n  ) / 6.0)"
  source_model: main.compatibility_metrics
  domains:
  - calculations
- name: quality_adjusted_life_year_qaly
  description: 'A measure of disease burden, including both the quality and the quantity of life lived.


    Calculated by multiplying the years of life by a quality-of-life score. Formula: $QALY = Years_{life}
    \times Quality_{score}$'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: The formula requires "Years of life" (a projected life expectancy/remaining years figure),
    which is not present anywhere in the database. Tables only contain current ages (recipients_demographics.age_count,
    demographics.age_count) and a quality-of-life score (risk_evaluation.qol_val), but no computed or
    projected years-of-life value to multiply by the quality score.
- name: cost_effectiveness_ratio_cer
  description: 'Calculates the cost per unit of health outcome, often using Quality-Adjusted Life Year
    (QALY).


    The ratio of the net cost of an intervention to its net health gain. Formula: $CER = \frac{Cost_{net}}{QALY_{gained}}$


    Built on: quality_adjusted_life_year_qaly.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: CER requires QALY_gained, which depends on "Years of life" (projected remaining life expectancy).
    This value is not present in the database - only current ages exist, no projected/remaining life expectancy
    figures. Since QALY cannot be computed, CER = Cost_net / QALY_gained cannot be encoded either.
- name: expected_graft_survival_egs_score
  description: 'Predicts the probability of a transplanted organ functioning successfully over a specific
    period.


    A predictive score based on factors like the Immunological Compatibility Score and donor age. Formula:
    $EGS = \frac{1}{1 + e^{-(-0.5 + 1.5 S_{immune} - 0.02 Age_{donor})}}$


    Built on: immunological_compatibility_score.


    Compiler note: EGS = 1/(1+exp(-(-0.5+1.5*S_immune-0.02*Age_donor))), reusing Immunological Compatibility
    Score formula from compatibility_metrics; donor age parsed as leading integer from demographics.age_count
    text (e.g. ''57 years, mature donor'' -> 57).'
  sql_expression: "1.0 / (1.0 + exp(-(\n  -0.5\n  + 1.5 * (\n      0.6 * (CASE WHEN (\n          CASE\n\
    \            WHEN left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),2)\
    \ = 'AB' THEN TRUE\n            WHEN left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry\
    \ = compatibility_metrics.donor_ref_reg),1) = 'O' THEN TRUE\n            WHEN left((SELECT r.blood_class\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg),2)\
    \ = 'AB' THEN TRUE\n            WHEN left((SELECT r.blood_class FROM recipients_demographics r WHERE\
    \ r.recip_registry = compatibility_metrics.recip_ref_reg),1) =\n                 left((SELECT d.blood_class\
    \ FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1) THEN TRUE\n\
    \            ELSE FALSE\n          END\n      ) THEN 1 ELSE 0 END)\n      + 0.4 * (1 - (\n       \
    \   (CASE WHEN (SELECT h.hla_a_val FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg)\
    \ <> (SELECT (r.hlaprofile->>'Hla_A_Val')::real FROM recipients_immunology r WHERE r.immu_recip_registry\
    \ = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n        + (CASE WHEN (SELECT h.hla_b_val\
    \ FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_B_Val')::real\
    \ FROM recipients_immunology r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg)\
    \ THEN 1 ELSE 0 END)\n        + (CASE WHEN (SELECT h.hla_dr_val FROM hla_info h WHERE h.immu_don_registry\
    \ = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_Dr_Val')::real FROM recipients_immunology\
    \ r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n      \
    \  ) / 6.0)\n  )\n  - 0.02 * (SELECT CAST(split_part(d.age_count, ' ', 1) AS INT) FROM demographics\
    \ d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg)\n)))"
  source_model: main.compatibility_metrics
  domains:
  - calculations
- name: patient_urgency_score
  description: 'A score that quantifies the urgency of a recipient''s need for a transplant.


    A composite score based on the recipient''s medical urgency status and their Recipient Wait Time Ratio.
    Formula: $S_{urgency} = 0.7 \times Status_{medical} + 0.3 \times R_{wait}$


    Built on: recipient_wait_time_ratio, medical_urgency_status.


    Compiler note: Combines medical_urgency_status mapping and recipient_wait_time_ratio (wait_time first
    token parsed as days / 365).'
  sql_expression: 0.7 * (CASE WHEN med_urgency = 'Status 1A' THEN 5 WHEN med_urgency = 'Status 1B' THEN
    4 WHEN med_urgency IN ('Status 2','2') THEN 3 WHEN med_urgency IN ('Status 3','3') THEN 2 ELSE 1 END)
    + 0.3 * (CAST(split_part(wait_time, ' ', 1) AS DOUBLE) / 365.0)
  source_model: main.clinical
  domains:
  - calculations
- name: center_performance_score
  description: 'A score evaluating a transplant center''s performance based on its experience and patient
    outcomes.


    A weighted average of a center''s transplant volume and its post-transplant success rates. Formula:
    $S_{center} = 0.6 \times V_{transplants} + 0.4 \times R_{success}$


    Compiler note: Mapped V_transplants to cntr_vol_val (center volume score) and R_success to cntr_out_val
    (center outcomes score), both present in risk_evaluation.'
  sql_expression: 0.6 * cntr_vol_val + 0.4 * cntr_out_val
  source_model: main.risk_evaluation
  domains:
  - calculations
- name: surgical_risk_score
  description: 'A score assessing the risk associated with the transplant surgery itself.


    A composite score derived from the recipient''s comorbidities and the inherent complexity of the surgical
    procedure. Formula: $S_{surgical} = 0.6 \times N_{comorbidities} + 0.4 \times C_{procedure}$, where
    components are normalized.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: The formula requires N_comorbidities (count of recipient comorbidities) and C_procedure
    (surgical complexity) to be 'normalized', but the database/documentation gives no defined normalization
    scheme (e.g., max comorbidity count or scale) to convert the raw comorbid_detail count into a normalized
    component. surg_cmpl_val appears to already be a normalized complexity score, but without a defined
    normalization for comorbidity count, the formula cannot be reliably encoded.
- name: composite_allocation_score
  description: 'A comprehensive score used to rank recipients for organ allocation, integrating multiple
    key factors.


    A weighted sum of the Patient Urgency Score, Immunological Compatibility Score, and Expected Graft
    Survival (EGS) Score. Formula: $S_{allocation} = 0.5 S_{urgency} + 0.25 S_{immune} + 0.25 EGS$


    Built on: patient_urgency_score, immunological_compatibility_score, expected_graft_survival_egs_score.


    Compiler note: Composite = 0.5*patient_urgency_score (joined via clinical on recip_ref_reg, unique
    per recipient; wait_time parsed as leading number of days) + 0.25*immunological_compatibility_score
    + 0.25*expected_graft_survival_egs_score, reusing the sub-metrics'' definitions exactly as previously
    encoded over compatibility_metrics/clinical/demographics/hla_info/recipients_immunology/recipients_demographics.
    Recipients lacking a clinical row yield NULL urgency and hence NULL composite.'
  sql_expression: "0.5 * (\n  (SELECT 0.7 * (CASE WHEN cl.med_urgency = 'Status 1A' THEN 5\n         \
    \             WHEN cl.med_urgency = 'Status 1B' THEN 4\n                      WHEN cl.med_urgency\
    \ IN ('Status 2','2') THEN 3\n                      WHEN cl.med_urgency IN ('Status 3','3') THEN 2\n\
    \                      ELSE 1 END)\n          + 0.3 * (CAST(split_part(cl.wait_time, ' ', 1) AS DOUBLE)\
    \ / 365.0)\n     FROM clinical cl WHERE cl.clin_recip_registry = compatibility_metrics.recip_ref_reg)\n\
    )\n+ 0.25 * (\n  0.6 * (CASE WHEN (\n      CASE\n        WHEN left((SELECT d.blood_class FROM demographics\
    \ d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),2) = 'AB' THEN TRUE\n        WHEN\
    \ left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1)\
    \ = 'O' THEN TRUE\n        WHEN left((SELECT r.blood_class FROM recipients_demographics r WHERE r.recip_registry\
    \ = compatibility_metrics.recip_ref_reg),2) = 'AB' THEN TRUE\n        WHEN left((SELECT r.blood_class\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg),1)\
    \ =\n             left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1)\
    \ THEN TRUE\n        ELSE FALSE\n      END\n  ) THEN 1 ELSE 0 END)\n  + 0.4 * (1 - (\n      (CASE\
    \ WHEN (SELECT h.hla_a_val FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg)\
    \ <> (SELECT (r.hlaprofile->>'Hla_A_Val')::real FROM recipients_immunology r WHERE r.immu_recip_registry\
    \ = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n    + (CASE WHEN (SELECT h.hla_b_val\
    \ FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_B_Val')::real\
    \ FROM recipients_immunology r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg)\
    \ THEN 1 ELSE 0 END)\n    + (CASE WHEN (SELECT h.hla_dr_val FROM hla_info h WHERE h.immu_don_registry\
    \ = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_Dr_Val')::real FROM recipients_immunology\
    \ r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n    ) /\
    \ 6.0)\n)\n+ 0.25 * (\n  1.0 / (1.0 + exp(-(\n    -0.5\n    + 1.5 * (\n        0.6 * (CASE WHEN (\n\
    \            CASE\n              WHEN left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry\
    \ = compatibility_metrics.donor_ref_reg),2) = 'AB' THEN TRUE\n              WHEN left((SELECT d.blood_class\
    \ FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1) = 'O' THEN\
    \ TRUE\n              WHEN left((SELECT r.blood_class FROM recipients_demographics r WHERE r.recip_registry\
    \ = compatibility_metrics.recip_ref_reg),2) = 'AB' THEN TRUE\n              WHEN left((SELECT r.blood_class\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg),1)\
    \ =\n                   left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry =\
    \ compatibility_metrics.donor_ref_reg),1) THEN TRUE\n              ELSE FALSE\n            END\n \
    \       ) THEN 1 ELSE 0 END)\n        + 0.4 * (1 - (\n            (CASE WHEN (SELECT h.hla_a_val FROM\
    \ hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_A_Val')::real\
    \ FROM recipients_immunology r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg)\
    \ THEN 1 ELSE 0 END)\n          + (CASE WHEN (SELECT h.hla_b_val FROM hla_info h WHERE h.immu_don_registry\
    \ = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_B_Val')::real FROM recipients_immunology\
    \ r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n      \
    \    + (CASE WHEN (SELECT h.hla_dr_val FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg)\
    \ <> (SELECT (r.hlaprofile->>'Hla_Dr_Val')::real FROM recipients_immunology r WHERE r.immu_recip_registry\
    \ = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n          ) / 6.0)\n    )\n    - 0.02\
    \ * (SELECT CAST(split_part(d.age_count, ' ', 1) AS INT) FROM demographics d WHERE d.contrib_registry\
    \ = compatibility_metrics.donor_ref_reg)\n  )))\n)"
  source_model: main.compatibility_metrics
  domains:
  - calculations
- name: resource_utilization_index
  description: 'An index that estimates the expected consumption of medical resources for a transplant
    case.


    A calculated index based on the Surgical Risk Score and expected length of hospital stay. Formula:
    $I_{resource} = S_{surgical} \times Days_{stay}$


    Built on: surgical_risk_score.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: Depends on Surgical Risk Score, which itself cannot be encoded because the normalization
    scheme for N_comorbidities and C_procedure is not defined in the data/documentation. Also "expected
    length of hospital stay" (Days_stay) has no corresponding column in the schema. Without both components
    defined, this index cannot be computed.
- name: readmission_risk_index
  description: 'A predictive index for the likelihood of a patient being readmitted to the hospital post-transplant.


    A risk index calculated from the number of pre-existing medical conditions and the Surgical Risk Score.
    Formula: $I_{readmission} = 0.1 + (0.05 \times N_{conditions}) + (0.2 \times S_{surgical})$


    Built on: surgical_risk_score.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: This metric depends on Surgical Risk Score (S_surgical), which itself cannot be encoded
    because the database/documentation gives no defined normalization scheme for N_comorbidities and C_procedure.
    Since Readmission Risk Index requires this unencodable sub-component, it cannot be encoded either.
- name: abo_blood_type_compatibility
  description: 'Defines the rules for matching blood types between an organ donor and recipient to prevent
    hyperacute rejection.


    A fundamental matching rule where recipient blood type determines acceptable donor types. Type O is
    the universal donor; Type AB is the universal recipient. Type A can receive from A and O. Type B can
    receive from B and O.


    Compiler note: ABO letter extracted from the leading token of demographics.blood_class (text like
    ''O+ universal donor compatible'') via left(...,1) or left(...,2) for ''AB'', and from recipients_demographics.blood_class
    directly (already clean ''A+'',''O-'' etc). Rule: O donor compatible with all; AB recipient accepts
    all; A recipient accepts A or O; B recipient accepts B or O. Donor/recipient uniquely resolved via
    FK to demographics/recipients_demographics by registry.'
  sql_expression: "CASE\n  WHEN left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry\
    \ = compatibility_metrics.donor_ref_reg),2) = 'AB'\n    THEN TRUE\n  WHEN left((SELECT d.blood_class\
    \ FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1) = 'O'\n \
    \   THEN TRUE\n  WHEN left((SELECT r.blood_class FROM recipients_demographics r WHERE r.recip_registry\
    \ = compatibility_metrics.recip_ref_reg),2) = 'AB'\n    THEN TRUE\n  WHEN left((SELECT r.blood_class\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg),1)\
    \ =\n       left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1)\n\
    \    THEN TRUE\n  ELSE FALSE\nEND"
  source_model: main.compatibility_metrics
  domains:
  - definitions
- name: cold_ischemia
  description: 'The period during which a harvested organ is kept cold to preserve it, starting from when
    its blood supply is cut off until it is transplanted.


    A state of organ preservation where metabolic activity is slowed by cooling, typically to around 4°C,
    to minimize tissue damage while outside the body. This is a critical factor in transplant success.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This describes a physical/process concept (organ preservation state via cooling) rather
    than a boolean condition, computation, or stored value over any table's rows. No column captures temperature
    or this preservation state; related fields like org_isch_time/org_presv_meth describe duration and
    method text, not this definitional state.
- name: human_leukocyte_antigen_hla_typing
  description: 'The process of identifying specific HLA protein markers on a person''s cells to match
    a donor with a recipient for transplantation.


    A genetic test that identifies a person''s unique HLA markers. A closer HLA match between a donor
    and recipient reduces the risk of the recipient''s immune system attacking, or rejecting, the transplanted
    organ.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This describes a laboratory testing process (HLA typing) and a general qualitative statement
    about match quality reducing rejection risk, not a boolean condition or computation over any table's
    rows.
- name: panel_reactive_antibody_pra
  description: 'A test that measures the level of pre-existing antibodies in a recipient''s blood against
    common HLA antigens, indicating their sensitization level.


    A measure of a recipient''s sensitization to foreign HLA antigens, represented by the `pra_score`[cite:
    36]. For matching purposes, a recipient with a `pra_score` of 80 or higher is defined as having a
    ''high PRA score'', indicating a state of high immunological sensitization.


    Built on: human_leukocyte_antigen_hla_typing.


    Compiler note: High PRA score defined as pra_score >= 80, per definition.'
  sql_expression: pra_score >= 80
  source_model: main.recipients_immunology
  domains:
  - definitions
- name: crossmatch_test
  description: 'A final compatibility test performed just before transplant surgery to ensure the recipient
    has no pre-formed antibodies against the specific donor''s tissues.


    A laboratory test that directly mixes the recipient''s serum with the donor''s lymphocytes. A ''positive''
    Crossmatch Test indicates the presence of donor-specific antibodies and is a contraindication to transplantation,
    as it predicts immediate organ rejection.


    Compiler note: Crossmatch positivity is stored in recipients_immunology.cross_result with values Negative/Pending/Positive;
    a ''Positive'' result indicates donor-specific antibodies present (contraindication).'
  sql_expression: cross_result = 'Positive'
  source_model: main.recipients_immunology
  domains:
  - definitions
- name: medical_urgency_status
  description: 'A classification system used to prioritize patients on the transplant waiting list based
    on their immediate need and risk of mortality.


    A tiered system that reflects how critically ill a patient is. For calculation purposes, statuses
    are mapped to numerical values: Status 1A is assigned a value of 5, Status 1B is 4, Status 2 is 3,
    and Status 3 is 2. All other statuses are assigned a value of 1.


    Compiler note: med_urgency values observed: ''Status 1A'',''Status 1B'',''Status 2'',''2'',''Status
    3'',''3''. Mapped per definition: Status 1A=5, Status 1B=4, Status 2 (incl. noisy ''2'')=3, Status
    3 (incl. noisy ''3'')=2, all else=1.'
  sql_expression: CASE WHEN med_urgency = 'Status 1A' THEN 5 WHEN med_urgency = 'Status 1B' THEN 4 WHEN
    med_urgency IN ('Status 2','2') THEN 3 WHEN med_urgency IN ('Status 3','3') THEN 2 ELSE 1 END
  source_model: main.clinical
  domains:
  - definitions
- name: donor_specific_antibodies_dsa
  description: 'Antibodies in a recipient''s blood that are specifically directed against a particular
    donor''s HLA antigens.


    The presence of these antibodies is identified by a positive Crossmatch Test. They pose a significant
    risk for antibody-mediated rejection of the transplanted organ.


    Built on: human_leukocyte_antigen_hla_typing, crossmatch_test.


    Compiler note: DSA presence is identified by a positive Crossmatch Test, encoded as cross_result =
    ''Positive'' on recipients_immunology.'
  sql_expression: cross_result = 'Positive'
  source_model: main.recipients_immunology
  domains:
  - definitions
- name: high_risk_donor
  description: 'An organ donor who has a history of certain medical conditions or behaviors that may increase
    the risk of disease transmission or poorer graft function in the recipient.


    A donor category defined by criteria such as a history of communicable diseases (e.g., Hepatitis C,
    HIV), malignancy, or high-risk social behaviors (e.g., intravenous drug use). The use of organs from
    a High-Risk Donor requires careful evaluation and informed consent.


    Compiler note: Encoded High-Risk Donor as: malignancy (med_history containing ''Cancer''), high-risk
    social behavior (drug_cond = ''Current use, high risk assessment''), or communicable disease (Hepatitis
    C or HIV positive status from viralstatinfo JSON). Hepatitis B not included per entry''s explicit
    examples (Hepatitis C, HIV). Checked distinct values of med_history and drug_cond, and viralstatinfo
    JSON structure to confirm field names/values.'
  sql_expression: med_history LIKE '%Cancer%' OR drug_cond = 'Current use, high risk assessment' OR json_extract_string(viralstatinfo,
    'Hcv_State') = 'Positive' OR json_extract_string(viralstatinfo, 'Hiv_State') = 'Positive'
  source_model: main.medical_history
  domains:
  - definitions
- name: graft_survival
  description: 'Refers to the period of time a transplanted organ continues to function properly within
    the recipient''s body.


    A key outcome measure in transplantation. Successful Graft Survival means the organ is performing
    its intended biological functions without signs of rejection or failure.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: The database has no table or column tracking post-transplant organ function, rejection,
    or failure status over time. Graft Survival is an outcome measure requiring longitudinal clinical
    follow-up data that is not present in this schema (which only covers pre-transplant matching, demographics,
    risk scores, and administrative data).
- name: immunological_sensitization
  description: 'A state where a recipient has a high level of pre-formed antibodies, making it difficult
    to find a compatible donor.


    A clinical state where a recipient is considered highly sensitized to potential donors. This condition
    is formally defined as having a Panel Reactive Antibody (PRA) score of 80 or greater. This high level
    of sensitization significantly complicates the matching process by severely limiting the number of
    compatible donors.


    Built on: panel_reactive_antibody_pra.


    Compiler note: Immunological Sensitization is defined as PRA score >= 80, applied directly on recipients_immunology.pra_score.'
  sql_expression: pra_score >= 80
  source_model: main.recipients_immunology
  domains:
  - definitions
- name: static_cold_storage
  description: 'The most common method of organ preservation, where the organ is flushed with a cold preservation
    solution and stored on ice.


    A preservation technique that relies on hypothermia to reduce the organ''s metabolic rate and oxygen
    demand during transport, minimizing tissue damage during Cold Ischemia.


    Built on: cold_ischemia.


    Compiler note: Encoded as exact match on org_presv_meth value ''Static cold storage, standard preservation
    method'', the only value in this column corresponding to the Static Cold Storage preservation technique.'
  sql_expression: org_presv_meth = 'Static cold storage, standard preservation method'
  source_model: main.function_and_recovery
  domains:
  - definitions
- name: optimal_donor_recipient_match
  description: 'An ideal pairing of a donor and recipient that meets a strict set of criteria to maximize
    the probability of long-term transplant success.


    An ideal match defined by meeting three specific, stringent criteria simultaneously: 1) Full ABO Blood
    Type Compatibility. 2) An HLA Mismatch Score of exactly 0. 3) A Size Compatibility Score within the
    inclusive range of [0.9, 1.1]. A pairing that satisfies all three conditions is classified as an Optimal
    Donor-Recipient Match.


    Built on: abo_blood_type_compatibility, hla_mismatch_score, size_compatibility_score.


    Compiler note: Combines ABO compatibility (universal donor/recipient rules on blood_class), HLA Mismatch
    Score computed as sum of mismatches on A/B/DR loci between hla_info and recipients_immunology.hlaprofile
    (must equal 0), and Size Compatibility Score from donor/recipient BMI (physicalstats->>''Bmi_Value''
    vs recipients_demographics.bmi_val) within [0.9,1.1]. All three subqueries verified unique per donor/recipient
    via PK joins.'
  sql_expression: "(\n  CASE\n    WHEN left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry\
    \ = compatibility_metrics.donor_ref_reg),2) = 'AB' THEN TRUE\n    WHEN left((SELECT d.blood_class\
    \ FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1) = 'O' THEN\
    \ TRUE\n    WHEN left((SELECT r.blood_class FROM recipients_demographics r WHERE r.recip_registry\
    \ = compatibility_metrics.recip_ref_reg),2) = 'AB' THEN TRUE\n    WHEN left((SELECT r.blood_class\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg),1)\
    \ =\n         left((SELECT d.blood_class FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg),1)\
    \ THEN TRUE\n    ELSE FALSE\n  END\n)\nAND\n(\n  (CASE WHEN (SELECT h.hla_a_val FROM hla_info h WHERE\
    \ h.immu_don_registry = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_A_Val')::real\
    \ FROM recipients_immunology r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg)\
    \ THEN 1 ELSE 0 END)\n  + (CASE WHEN (SELECT h.hla_b_val FROM hla_info h WHERE h.immu_don_registry\
    \ = compatibility_metrics.donor_ref_reg) <> (SELECT (r.hlaprofile->>'Hla_B_Val')::real FROM recipients_immunology\
    \ r WHERE r.immu_recip_registry = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n  + (CASE\
    \ WHEN (SELECT h.hla_dr_val FROM hla_info h WHERE h.immu_don_registry = compatibility_metrics.donor_ref_reg)\
    \ <> (SELECT (r.hlaprofile->>'Hla_Dr_Val')::real FROM recipients_immunology r WHERE r.immu_recip_registry\
    \ = compatibility_metrics.recip_ref_reg) THEN 1 ELSE 0 END)\n) = 0\nAND\n(\n  1 - ABS( ((SELECT (physicalstats->>'Bmi_Value')::real\
    \ FROM demographics d WHERE d.contrib_registry = compatibility_metrics.donor_ref_reg) / (SELECT bmi_val\
    \ FROM recipients_demographics r WHERE r.recip_registry = compatibility_metrics.recip_ref_reg)) -\
    \ 1 )\n) BETWEEN 0.9 AND 1.1"
  source_model: main.compatibility_metrics
  domains:
  - definitions
- name: anoxia
  description: 'A donor''s cause of death due to complete oxygen deprivation, which can affect organ quality.


    A donor''s cause of death resulting from a complete lack of oxygen. [cite_start]Within the database,
    this specific cause is recorded as ''Anoxia'' in the donor''s cause of death description (`don_co_desc`
    [cite: 15]). This factor is critical for assessing the viability of oxygen-sensitive organs, such
    as the heart and kidneys.


    Compiler note: don_co_desc stores cause of death as a description string; ''Anoxia, oxygen deprivation
    may affect organ quality'' is the exact value used for anoxia cases, matched via prefix.'
  sql_expression: don_co_desc LIKE 'Anoxia%'
  source_model: main.function_and_recovery
  domains:
  - definitions
- name: comorbidity
  description: 'The presence of one or more additional diseases or conditions co-occurring with a primary
    disease or condition.


    In transplantation, a recipient''s pre-existing conditions (e.g., diabetes, heart disease) are considered
    comorbidities. They can increase the complexity and risk of the transplant procedure.


    Compiler note: Comorbidity presence is encoded as the recipient having at least one recorded pre-existing
    condition in comorbid_detail (a comma-separated list such as ''Diabetes,COPD''); NULL in this column
    denotes incomplete/unavailable comorbidity assessment per documentation, not absence of comorbidities,
    so presence is approximated by non-null value.'
  sql_expression: comorbid_detail IS NOT NULL
  source_model: main.clinical
  domains:
  - definitions
- name: allocation_policy
  description: 'The specific versioned set of rules governing organ distribution, used to prioritize recipients.


    The precise set of rules used for organ distribution, identified by a unique version string in the
    `allc_pol_vers` field, such as ''v2.7''[cite: 73]. Each policy embodies a strict hierarchy of rules.
    As a formal example, a given policy stipulates that Medical Urgency Status is the primary sorting
    criterion; for recipients with an identical urgency status, the one with a lower HLA Mismatch Score
    receives higher priority.


    Built on: medical_urgency_status, hla_mismatch_score.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This entry describes the Allocation Policy as a versioned, hierarchical set of sorting/prioritization
    rules (identified by allc_pol_vers) used to rank recipients - it is a policy/ranking procedure, not
    a yes/no condition or computation over rows of one table. It cannot be expressed as a boolean predicate
    or scalar SQL expression.
- name: informed_consent
  description: 'The process by which a patient, after understanding the risks and benefits, voluntarily
    agrees to a medical procedure.


    A critical ethical and legal requirement in transplantation where the recipient (or their proxy) must
    be fully informed about all aspects of the surgery, including the use of organs from a High-Risk Donor,
    before giving permission.


    Built on: high_risk_donor.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This entry describes a legal/ethical process (informed consent) rather than a computable
    condition over rows. While administrative_and_review.cons_stat_val records a consent status, the entry
    itself defines a procedural requirement, not a boolean predicate derivable from data; no column encodes
    "patient was informed about high-risk donor use" distinctly from general consent status.
- name: regional_allocation_priority
  description: 'A core principle within transplant allocation that prioritizes local matches to enhance
    fairness and clinical outcomes.


    A core rule embedded within an Allocation Policy that gives priority to recipients located in the
    same geographic region as the donor. [cite_start]This principle is implemented by matching the donor''s
    region with the recipient''s `allc_region`[cite: 72]. The primary goals are to ensure equitable organ
    access for the local community and to improve medical outcomes by minimizing the Cold Ischemia time
    associated with long-distance transport.


    Built on: allocation_policy, cold_ischemia.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: The database has no field recording the donor's geographic region. demographics only stores
    nation_ref (country name, e.g. 'Seychelles'), and allocation_details only stores the recipient's allc_region
    (e.g. 'Region_9') with no corresponding donor region column to compare it against. Without a donor-side
    region value, the "donor's region matches recipient's allc_region" condition cannot be computed over
    any table in this database.
- name: multi_organ_transplant
  description: 'A complex surgical procedure where a recipient receives two or more organs from a single
    donor.


    A transplant involving multiple organs (e.g., heart-lung, kidney-pancreas). Prioritization and allocation
    for these cases are highly complex, considering the significant need of the recipient and the impact
    on the organ pool for other patients.


    Compiler note: Encoded a multi-organ transplant as a match record whose donor-recipient pair (donor_ref_reg,
    recip_ref_reg) appears with more than one distinct org_spec elsewhere in transplant_matching, i.e.
    the same donor supplied multiple organ types to the same recipient. Verified such pairs exist (e.g.
    D187713/R952254 with Pancreas and Liver).'
  sql_expression: (SELECT count(DISTINCT tm2.org_spec) FROM transplant_matching tm2 WHERE tm2.donor_ref_reg
    = transplant_matching.donor_ref_reg AND tm2.recip_ref_reg = transplant_matching.recip_ref_reg) > 1
  source_model: main.transplant_matching
  domains:
  - definitions
- name: post_transplant_monitoring
  description: 'The ongoing medical surveillance of a recipient after receiving a transplant to ensure
    graft survival and manage complications.


    A comprehensive care plan that includes regular lab tests, imaging, and clinical assessments to monitor
    organ function, detect early signs of rejection, and manage immunosuppressive medications.


    Built on: graft_survival.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: Post-Transplant Monitoring describes an ongoing clinical process (lab tests, imaging,
    assessments) occurring after transplant, not a condition or computation over stored rows. The database
    contains only pre-transplant matching, demographic, risk-scoring, and administrative data; it has
    no table tracking post-transplant follow-up, monitoring events, or organ function over time, so this
    cannot be encoded.
- name: viral_infection_status
  description: 'Screening of donors and recipients for key viral infections that can be transmitted or
    reactivated during transplantation.


    Testing for viruses such as Cytomegalovirus (CMV), Epstein-Barr Virus (EBV), and Hepatitis. The Viral
    Infection Status of both donor and recipient is critical for assessing infection risk and planning
    post-transplant prophylactic treatment.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This entry describes a general concept (viral infection screening covering CMV, EBV, Hepatitis,
    HIV for both donors and recipients) rather than a single boolean condition over one table's rows.
    There is no single predicate implied; the data for this spans multiple fields across medical_history.viralstatinfo
    (donor) and recipients_immunology (recipient, which only has CMV/EBV, not Hepatitis/HIV), with no
    unified "status" value or threshold defined to encode as a yes/no condition.
- name: comprehensive_match_quality_score
  description: 'A holistic meta-score that aggregates various sub-scores to represent the overall quality
    of a potential donor-recipient match.


    A weighted composite index integrating multiple factors. The score is calculated as: $S_{match} =
    0.4 S_{immune} + 0.2 S_{age} - 0.3 S_{surgical} + 0.1 I_{logistics}$, using the Immunological Compatibility
    Score, Age Compatibility Score, Surgical Risk Score, and Logistical Feasibility Index.


    Built on: immunological_compatibility_score, age_compatibility_score, surgical_risk_score, logistical_feasibility_index.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: 'This metric depends on the Surgical Risk Score (S_surgical), which cannot be encoded:
    its formula requires N_comorbidities (count of recipient comorbidities) and C_procedure (surgical
    complexity) to be "normalized", but no normalization scheme is defined for the comorbidity count component.
    Since Comprehensive Match Quality Score requires -0.3*S_surgical as a term, it cannot be computed
    either.'
- name: antibody_mediated_rejection_amr_risk_stratification
  description: 'A system for categorizing a recipient''s risk of developing antibody-mediated rejection
    based on their immunological profile.


    A risk classification system. For recipients who have a ''Positive'' crossmatch result, the ''High
    Risk'' category is defined by meeting two concurrent criteria: having a Panel Reactive Antibody (PRA)
    score of 80 or greater AND having a ''Positive'' donor-specific antibody (DSA) status. Recipients
    not meeting these criteria are considered ''Standard Risk''.


    Built on: donor_specific_antibodies_dsa, panel_reactive_antibody_pra, crossmatch_test.


    Compiler note: AMR risk stratification applies only to recipients with Positive crossmatch result;
    among those, High Risk requires PRA>=80 and DSA Positive, else Standard Risk. Rows without Positive
    crossmatch are outside this classification''s defined scope, encoded as NULL.'
  sql_expression: CASE WHEN cross_result = 'Positive' AND pra_score >= 80 AND dsa_state = 'Positive' THEN
    'High Risk' WHEN cross_result = 'Positive' THEN 'Standard Risk' ELSE NULL END
  source_model: main.recipients_immunology
  domains:
  - definitions
- name: net_health_benefit_score
  description: 'Calculates the overall expected health gain for a recipient from a transplant, balancing
    survival benefits against procedural risks and quality of life.


    A score representing the projected net outcome, calculated by offsetting the anticipated Quality-Adjusted
    Life Year (QALY) gain with the risks. The formula is: $S_{NHB} = (EGS \times QALY_{gain}) - (S_{surgical}
    \times 0.2)$, where EGS is the Expected Graft Survival score.


    Built on: expected_graft_survival_egs_score, quality_adjusted_life_year_qaly, surgical_risk_score.'
  sql_expression: ''
  source_model: ''
  domains:
  - calculations
  untranslated: 'This metric requires QALY_gain and S_surgical, both of which cannot be encoded over this
    database (see their respective entries): QALY needs a "years of life" projection not present in the
    data, and Surgical Risk Score needs a normalization scheme for comorbidity count that is not defined
    anywhere in the documentation or data. Without these two components, the Net Health Benefit Score
    formula (EGS × QALY_gain) − (S_surgical × 0.2) cannot be computed.'
- name: marginal_donor_acceptance_criteria
  description: 'A set of clinical guidelines for evaluating and accepting organs from donors who do not
    meet ideal criteria but are not classified as standard High-Risk Donors.


    A nuanced decision framework applied to ''extended criteria'' donors. These donors may exhibit factors
    like advanced age (significant Donor-Recipient Age Difference), borderline organ function (sub-optimal
    Renal Function Score), or certain comorbidities. Acceptance is based on a risk-benefit analysis, weighing
    the organ''s imperfections against the recipient''s urgent medical need and the scarcity of ideal
    organs.


    Built on: high_risk_donor, renal_function_score, donor_recipient_age_difference.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: The definition does not specify concrete thresholds or a precise rule for classifying
    a donor as "marginal/extended criteria" - it only vaguely references factors like "advanced age",
    "sub-optimal" renal function, or "certain comorbidities" without defining cutoffs, and states acceptance
    is based on a qualitative "risk-benefit analysis" weighing organ imperfections against recipient urgency
    and organ scarcity. This is a decision framework/action, not a computable condition over rows.
- name: immunosuppression_protocol_tiers
  description: 'Illustrates how a patient''s immunological risk profile dictates the intensity of the
    required post-transplant immunosuppressive drug regimen.


    A tiered therapeutic strategy based on risk. A patient with a high Immunological Compatibility Score
    and low AMR risk (as per Antibody-Mediated Rejection (AMR) Risk Stratification) might receive a standard
    ''Maintenance Therapy'' (e.g., a three-drug cocktail). Conversely, a patient with a low compatibility
    score and high AMR risk would require aggressive ''Induction Therapy'' (e.g., using potent biologic
    agents) followed by intensive maintenance.


    Built on: antibody_mediated_rejection_amr_risk_stratification, immunological_compatibility_score.'
  sql_expression: ''
  source_model: ''
  domains:
  - definitions
  untranslated: This entry describes a qualitative tiered therapeutic strategy (Maintenance vs Induction
    Therapy) based on vague, undefined thresholds ("high" compatibility score, "low" AMR risk) rather
    than a precise computable condition. It does not define numeric cutoffs for "high"/"low", and the
    outcome is a drug regimen choice, not a boolean fact about the data. Cannot be encoded as a SQL predicate.
tables:
- schema: main
  table: administrative_and_review
  columns:
  - name: adm_rev_registry
    type: VARCHAR
    description: TEXT. Primary key linking to transplant matching record. PK = Administrative_and_Review(Adm_Rev_Registry),
      FK to Transplant_Matching.
  - name: exp_rev_stat_val
    type: VARCHAR
    description: 'TEXT. Expert review status value. **NULL means expert review is pending or not required.**
      **DATA NOISE: Values have random case variations (lowercase, uppercase, mixed case).** Example:
      RejECted.'
  - name: exp_rev_notes
    type: VARCHAR
    description: 'TEXT. Expert review comments and notes. **NULL means expert review comments are not
      provided or review is incomplete.** **DATA NOISE: Values have random case variations (lowercase,
      uppercase, mixed case).** Example: accEptABlE mAtCH.'
  - name: ec_appro_val
    type: VARCHAR
    description: 'TEXT. Ethics committee approval status. **NULL means ethics committee approval is pending
      or not applicable.** **DATA NOISE: Values have random case variations (lowercase, uppercase, mixed
      case).** Example: approved.'
  - name: reg_comp_val
    type: VARCHAR
    description: 'TEXT. Regulatory compliance status assessment. **NULL means regulatory compliance review
      is pending or incomplete.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
      mixed case).** Example: under review.'
  - name: docu_stat_val
    type: VARCHAR
    description: 'TEXT. Documentation status completeness assessment. **NULL means documentation status
      review is incomplete or pending.** **DATA NOISE: Values have random case variations (lowercase,
      uppercase, mixed case).** Example: InCoMpLeTe.'
  - name: cons_stat_val
    type: VARCHAR
    description: 'TEXT. Consent status from patient and family. **NULL means consent documentation is
      incomplete or pending.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
      mixed case).** Example: OBTAINED.'
  - name: fin_clear_val
    type: VARCHAR
    description: 'TEXT. Financial clearance status for transplant procedure. **NULL means financial clearance
      is pending or under review.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
      mixed case).** Example: rejected.'
  - name: ins_appro_val
    type: VARCHAR
    description: 'TEXT. Insurance approval status for transplant coverage. **NULL means insurance approval
      is pending or under review.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
