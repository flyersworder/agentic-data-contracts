      Liver, Lung, Pancreas.'
  - name: match_status
    type: VARCHAR
    description: 'TEXT. Current status of the matching process. Possible values: Completed, Failed, In
      Progress, Matched, Pending.'
  - name: score_val
    type: FLOAT
    description: 'REAL. Overall matching score for donor-recipient compatibility. Example: 0.005.'
  - name: level_val
    type: VARCHAR
    description: 'TEXT. Matching level classification. Possible values: Acceptable, High Risk, Marginal,
      Optimal.'
  - name: alg_vers
    type: VARCHAR
    description: 'TEXT. Version of matching algorithm used. Example: v2.5.'
  - name: run_registry
    type: VARCHAR
    description: 'TEXT. Matching run identifier for batch processing. Example: MR324767.'
  - name: match_ts
    type: VARCHAR
    description: 'TIMESTAMP. Timestamp when matching algorithm was executed. ** Possible values: 2025.02.19
      08:31:22.'
  - name: dur_sec
    type: BIGINT
    description: 'BIGINT. Duration of matching process in seconds. Example: 128.'
  - name: conf_val
    type: FLOAT
    description: 'REAL. Confidence value for matching result. Example: 0.056.'
  - name: dss_val
    type: FLOAT
    description: 'REAL. Decision support system score. Example: 0.68.'
