  - name: alloc_prio_val
    type: FLOAT
    description: 'REAL. Allocation priority score for organs distribution. Example: 0.917.'
  - name: donor_ref_reg
    type: VARCHAR
    description: TEXT. Reference to donor demographics record. FK to Demographics.
  - name: recip_ref_reg
    type: VARCHAR
    description: TEXT. Reference to recipient demographics record. FK to Recipients_Demographics.
