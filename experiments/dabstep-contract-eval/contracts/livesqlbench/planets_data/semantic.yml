      Apparent Magnitude Value: Illustrates the value for a star''s brightness as seen from Earth.


      This is a logarithmic scale where smaller numbers are brighter. A magnitude of 1.0 is 100 times
      brighter than a magnitude of 6.0. The brightest stars have negative magnitudes (e.g., Sirius is
      -1.46).


      Compiler note: Describes the Opt_Mag field within stellarprops.photometry JSON (st_optmag), the
      star''s apparent magnitude as seen from Earth.


      Stellar Temperature Value: Illustrates the value for a star''s effective surface temperature.


      Measured in Kelvin (K). Cool red dwarfs can be around 3,000 K, a Sun-like star is about 5,800 K,
      and very hot blue stars can exceed 30,000 K.


      Compiler note: Value is stored at stellarprops->''physical''->''Temp_Value'' (Kelvin), as confirmed
      by sample query.


      Stellar Mass Value: Illustrates the value for a star''s mass.


      Measured in solar masses ($M_{\odot}$), where 1 is the mass of our Sun. Most known host stars range
      from low-mass red dwarfs (~0.1 $M_{\odot}$) to stars several times more massive than the Sun.


      Compiler note: Describes the Mass_Value field nested under stellarprops.physical.Mass_Value, representing
      stellar mass in solar masses (M☉).


      Stellar Radius Value: Illustrates the value for a star''s radius.


      Measured in solar radii ($R_{\odot}$), where 1 is the radius of our Sun. Values range from small
      neutron stars to giant stars like Betelgeuse, which would extend beyond the orbit of Mars if in
      our solar system.


      Compiler note: Maps to stellarprops->physical->Radius_Value, the star''s radius in solar radii (R_sun),
      stored as JSON field within stars.stellarprops.'
