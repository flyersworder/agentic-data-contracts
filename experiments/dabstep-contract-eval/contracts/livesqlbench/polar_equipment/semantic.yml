- schema: main
  table: OperationMaintenance
  columns:
  - name: OP_MAINT_ID
    type: BIGINT
    description: BIGSERIAL. Unique identifier for operation and maintenance record. PK.
  - name: equipRef
    type: VARCHAR
    description: TEXT. Reference to the equipment. FK to Equipment.EQUIP_CODE.
  - name: OPER_hours
    type: FLOAT
    description: 'REAL. Total operational hours of the equipment. Example: 17843.


      operationhours: Illustrates the meaning and importance of equipment operation hours.


      Operation hours represent the cumulative time an equipment has been in active use. New equipment
      typically has low hours (0-100), mid-life equipment shows moderate hours (100-1000), while equipment
      approaching maintenance or replacement typically exceeds 1000 hours. The ratio of operation hours
      to maintenance cycle hours is critical for preventative maintenance scheduling.


      Compiler note: Describes the meaning/typical ranges of OperationMaintenance.OPER_hours (cumulative
      operational hours), used alongside maintCycleHrs for maintenance scheduling.'
  - name: maintCycleHrs
    type: FLOAT
    description: 'REAL. Maintenance cycle hours. **NULL means no maintenance cycle defined.**. Example:
      2047.0.'
  - name: LAST_maint_date
    type: DATE
    description: 'DATE. Date of the last maintenance. **NULL means no maintenance date provided.**. Example:
      25-Feb-24.'
  - name: NEXT_due_date
    type: DATE
    description: 'DATE. Date of the next scheduled maintenance. **NULL means no next maintenance date
      provided.**. Example: 2025/11/16.'
  - name: OPER_status
    type: VARCHAR
    description: 'TEXT. Operational status of the equipment. Possible values: Active, Maintenance, Repair,
      Standby, Storage.'
  - name: MAINT_COST_usd
    type: FLOAT
    description: 'REAL. Maintenance cost in USD. Example: 7632.51.'
  - name: repairCostUsd
    type: FLOAT
    description: 'REAL. Repair cost in USD. Example: 3297.13.'
  - name: operating_cost_usd
    type: FLOAT
    description: 'REAL. Operating cost in USD. **NULL means no operating cost recorded.**. Example: 338.79.'
  - name: crewCertStatus
    type: VARCHAR
    description: 'TEXT. Certification status of the crew. Possible values: Expired, Pending, Valid.'
  - name: inspect_status
    type: VARCHAR
    description: 'TEXT. Inspection status of the equipment. Possible values: Failed, Passed, Pending.'
  - name: COMPLIANCE_state
    type: VARCHAR
    description: 'TEXT. Compliance state of the equipment. **NULL means no compliance state recorded.**.
      Possible values: Compliant, Non-compliant, Review.'
  - name: docu_status
    type: VARCHAR
    description: 'TEXT. Documentation status for the equipment. Possible values: Complete, Incomplete,
      Updated.'
  - name: comm_link
    type: BIGINT
    description: BIGINT. Optional reference to communication link.
- schema: main
  table: PowerBattery
  columns:
  - name: PWR_BATT_ID
    type: BIGINT
    description: BIGSERIAL. Unique identifier for the power battery. PK.
  - name: equip_ref
    type: VARCHAR
    description: TEXT. Reference to the equipment. FK to Equipment.EQUIP_CODE.
  - name: battery_telemetry
    type: JSON
    description: 'JSONB column. Captures the full real-time power and battery state of a unit (operating
      mode, SOC, health, charge parameters, consumption, efficiency) as a single JSONB blob. Fields: {"power_state":
      {"system_state": "TEXT. Power status of the battery. Possible values: Charging, Off, On, Sleep.",
      "primary_source": "TEXT. Source of the power for the battery. Possible values: Battery, Diesel,
      Hybrid, Solar, Wind.", "instant_consumption_w": "REAL. Power consumption in watts. Example: 4383.2.",
      "conversion_eff_pct": "REAL. Energy efficiency percentage of the battery. Example: 81.8."}, "battery_pack":
      {"soc_pct": "REAL. Battery level percentage. Example: 19.", "health_pct": "REAL. Battery health
      percentage. Example: 93.", "cycle_count": "BIGINT. Number of cycles the battery has undergone. Example:
      79.", "temperature_c": "REAL. Battery temperature in Celsius. Example: -22.9."}, "charging": {"charge_state":
      "TEXT. Charging status of the battery. Possible values: Charging, Error, Full, Not Charging.", "current_a":
      "REAL. Charging current in amperes. **NULL means no current recorded.**. Example: 24.12.", "voltage_v":
      "REAL. Charging voltage in volts. Example: 26.5."}}


      powerconsumptionw: Illustrates the significance of power consumption measurements in energy management.


      Power consumption measured in watts varies by equipment type. Small scientific instruments typically
      consume 5-50W, communication equipment 20-200W, heating systems 500-5000W, and vehicle systems 1000-10000W.
      Understanding consumption patterns is crucial for power budgeting and determining appropriate power
      source sizing in isolated polar environments.


      Compiler note: Describes value ranges for instant_consumption_w field within battery_telemetry.power_state
      JSON path, not a computation; included as explanatory note on that column''s values.'
