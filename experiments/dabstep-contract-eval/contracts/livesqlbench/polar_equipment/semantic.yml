  - name: sat_conn_stat
    type: VARCHAR
    description: 'TEXT. Satellite connection status. **NULL means no satellite connection status recorded.**.
      Possible values: Connected, Disconnected, Limited.'
  - name: radioSignal_dBm
    type: FLOAT
    description: 'REAL. Radio signal strength in dBm. Example: -97.8.'
  - name: radioFreq_mhz
    type: FLOAT
    description: 'REAL. Radio frequency in MHz. Example: 731.2.'
  - name: antenna_stat
    type: VARCHAR
    description: 'TEXT. Antenna status. Possible values: Error, Normal, Warning.'
  - name: netLatency_ms
