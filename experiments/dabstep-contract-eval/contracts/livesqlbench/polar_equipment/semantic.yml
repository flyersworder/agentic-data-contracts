- schema: main
  table: EngineAndFluids
  columns:
  - name: ENGINE_ID
    type: BIGINT
    description: BIGSERIAL. Unique identifier for the engine and fluids record. PK.
  - name: equipRef
    type: VARCHAR
    description: TEXT. Reference to the equipment. FK to Equipment.EQUIP_CODE.
  - name: batt_link
    type: BIGINT
    description: BIGINT. Reference to the battery. FK to PowerBattery.PWR_BATT_ID.
  - name: opmaint_link
    type: BIGINT
    description: BIGINT. Reference to the operation and maintenance record. FK to OperationMaintenance.OP_MAINT_ID.
  - name: engine_fluids_snapshot
    type: JSON
    description: 'JSONB column. Consolidates engine operating metrics together with the levels, temperatures
      and pressures of all key fluids (fuel, oil, coolant, hydraulics) for easier telemetry ingestion.
      Fields: {"fuel": {"level_pct": "REAL. Fuel level percentage. Example: 49.", "consumption_lph": "REAL.
      Fuel consumption in liters per hour. Example: 44.48.", "rail_pressure_kpa": "BIGINT. Fuel pressure
      in kPa. **NULL means no fuel pressure data recorded.**. Example: 89.9.", "temperature_c": "REAL.
      Fuel temperature in Celsius. Example: -37.2."}, "oil": {"level_pct": "REAL. Oil level percentage.
      Example: 49.", "pressure_kpa": "BIGINT. Oil pressure in kPa. Example: 331.4.", "temperature_c":
      "REAL. Oil temperature in Celsius. Example: 6.6."}, "coolant": {"level_pct": "REAL. Coolant level
      percentage. Example: 64.", "temperature_c": "REAL. Coolant temperature in Celsius. Example: 69.3.",
      "pressure_kpa_or_code": "TEXT. Coolant pressure in kPa. Example: 88.9 hPa."}, "hydraulic": {"pressure_kpa":
      "REAL. Hydraulic pressure in kPa. Example: 19647.2.", "temperature_c": "REAL. Hydraulic temperature
      in Celsius. Example: 39.2.", "fluid_level_pct": "REAL. Hydraulic fluid percentage. Example: 59."},
      "engine_core": {"rpm": "BIGINT. Engine RPM. **NULL means no engine RPM data recorded.**. Example:
      3133.0.", "load_pct": "REAL. Engine load percentage. Example: 61.", "block_temp_c": "REAL. Engine
      temperature in Celsius. Example: 4.1.", "lifetime_hours": "REAL. Total engine hours. Example: 31452."}}'
- schema: main
  table: Equipment
  columns:
  - name: EQUIP_CODE
    type: VARCHAR
    description: 'TEXT. Unique identifier for the equipment. PK. Example: PE593707.'
  - name: EquipType
    type: VARCHAR
    description: TEXT. Reference to the equipment type. FK to EquipmentType.EquipType.
  - name: model_name
    type: VARCHAR
    description: 'TEXT. Model name of the equipment. **NULL means no model name provided.**. Example:
      Model-925.'
  - name: MakerName
    type: VARCHAR
    description: 'TEXT. Name of the equipment manufacturer. **NULL means no manufacturer provided.**.
      Example: Lee, Meyers and Hamilton.'
  - name: SERVICE_YRS
    type: BIGINT
    description: 'BIGINT. Number of years the equipment has been in service. Example: 4.'
  - name: utilPercent
    type: FLOAT
    description: 'REAL. Utilization percentage of the equipment. Example: 53.'
  - name: RELIAB_IDX
    type: FLOAT
    description: 'REAL. Reliability index of the equipment. Example: 97.8.


      reliabilityindex: Illustrates the significance of reliability index measurements in equipment durability.


      The reliability index typically ranges from 0 to 1, where values below 0.5 indicate equipment that
      fails frequently and requires constant maintenance, values between 0.5-0.8 represent equipment with
      occasional failures that require regular maintenance, and values above 0.8 indicate highly reliable
      equipment with minimal downtime.


      Compiler note: Describes RELIAB_IDX; data is stored on a 0-100 scale (observed min 0, max ~99.7)
      rather than the 0-1 scale mentioned in the text, but it is the same metric (reliability index) scaled
      by 100.'
- schema: main
  table: EquipmentType
  columns:
  - name: EquipType
    type: VARCHAR
    description: TEXT. Unique identifier for the equipment type. PK.
  - name: type_indices
    type: JSON
    description: 'JSONB column. Bundles the various performance-, efficiency-, safety- and sustainability-related
      indices that characterise an equipment family. Fields: {"performance_score": "REAL. Performance
      index for the equipment type. Example: 72.8.", "energy_efficiency_idx": "REAL. Efficiency index
      for the equipment type. Example: 47.1.", "safety_idx": "REAL. Safety index for the equipment type.
      Example: 75.9.", "environmental_impact_idx": "REAL. Environmental impact index for the equipment
      type. Example: 36.7."}


      safetyindex: Illustrates the significance of safety index ratings for operational risk assessment.


      Safety index typically ranges from 0 to 1, where values below 0.5 indicate equipment with significant
      safety concerns requiring immediate attention or limited operation, values between 0.5-0.7 represent
      equipment with acceptable safety for normal operations with appropriate precautions, and values
      above 0.7 indicate equipment with excellent safety features suitable for all operational conditions
      including those with elevated risks.


      Compiler note: Describes safety_idx field within type_indices JSON. Note: actual stored values range
      ~0-100 (e.g., 75.9, 35.9), not 0-1 as the entry''s thresholds assume; entry''s scale appears off
      by factor of 100 relative to stored data.'
