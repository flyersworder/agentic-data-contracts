- schema: main
  table: ThermalSolarWindAndGrid
  columns:
  - name: THERMAL_ID
    type: BIGINT
    description: BIGSERIAL. Unique identifier for the thermal, solar, wind, and grid record. PK.
  - name: comm_link
    type: BIGINT
    description: BIGINT. Reference to the communication record. FK to Communication.COMM_ID.
  - name: batt_link
    type: BIGINT
    description: BIGINT. Reference to the battery record. FK to PowerBattery.PWR_BATT_ID.
  - name: thermalImgStat
    type: VARCHAR
    description: 'TEXT. Thermal image status. Possible values: Critical, Normal, Warning.'
  - name: insulationStat
    type: VARCHAR
    description: 'TEXT. Insulation status. Possible values: Fair, Good, Poor.'
  - name: heatLoss_kwh
    type: FLOAT
    description: 'REAL. Heat loss in kilowatt-hours. **NULL means no heat loss data recorded.**. Example:
      1.11.'
  - name: solarPanelStat
    type: VARCHAR
    description: 'TEXT. Solar panel status. Possible values: Active, Fault, Inactive.'
  - name: solarOutput_w
    type: FLOAT
    description: 'REAL. Solar panel output in watts. Example: 746.1.'
  - name: solarEffPct
    type: FLOAT
    description: 'REAL. Solar efficiency percentage. Example: 2.0.


      energyefficiencypercent: Illustrates the meaning and importance of energy efficiency percentages.


      Energy efficiency percentage typically ranges from 10% to 99%. Values below 30% indicate inefficient
      systems typical of older equipment, 30-60% represent standard efficiency for conventional equipment,
      60-80% indicate high-efficiency modern systems, while values above 80% represent cutting-edge technology
      with optimal efficiency that minimizes energy waste and operational costs.


      Compiler note: Checked value ranges across candidate "efficiency percent" columns: EquipmentType.energy_efficiency_idx
      (17.9-72.2), PowerBattery conversion_eff_pct (70-95), fuelCellEffPct (40-60), and ThermalSolarWindAndGrid.solarEffPct
      (0.1-99.7). Only solarEffPct matches the stated 10%-99% range described in the entry, so it is the
      described column.'
  - name: solarTempC
    type: FLOAT
    description: 'REAL. Solar panel temperature in Celsius. Example: -14.9.'
  - name: windTurbineStat
    type: VARCHAR
    description: 'TEXT. Wind turbine status. Possible values: Fault, Operating, Stopped.'
  - name: windOutput_w
    type: FLOAT
    description: 'REAL. Wind turbine output in watts. **NULL means no wind output data recorded.**. Example:
      656.8.'
  - name: windRPM
    type: BIGINT
    description: 'BIGINT. Wind turbine RPM. Example: 130.3.'
  - name: powerGridStat
    type: VARCHAR
    description: 'TEXT. Power grid status. Possible values: Connected, Disconnected, Island Mode.'
  - name: powerQualIdx
    type: FLOAT
    description: 'REAL. Power quality index. Example: 95.'
  - name: backupPowerStat
    type: VARCHAR
    description: 'TEXT. Backup power status. **NULL means no backup power status recorded.**. Possible
      values: Active, Fault, Standby.'
  - name: fuelCellStat
    type: VARCHAR
    description: 'TEXT. Fuel cell status. Possible values: Fault, Operating, Standby.'
  - name: fuelCellOutput_w
    type: FLOAT
    description: 'REAL. Fuel cell output in watts. Example: 185.0.'
  - name: fuelCellEffPct
    type: FLOAT
    description: 'REAL. Fuel cell efficiency percentage. Example: 48.2.


      fuelcellefficiencypercent: Illustrates the technical significance of fuel cell efficiency ratings.


      Fuel cell efficiency percentages typically range from 40% to 90%. Values below 50% represent older
      or degraded fuel cell technology, 50-70% indicate standard efficiency modern fuel cells suitable
      for general applications, and values above 70% represent high-performance fuel cells with optimal
      conversion of chemical energy to electrical power with minimal waste heat generation.


      Compiler note: Describes fuelCellEffPct values; checked range in data (40-60 observed), matches
      column semantics of fuel cell efficiency percentage.'
  - name: H2LevelPct
    type: FLOAT
    description: 'REAL. Hydrogen level percentage. Example: 95.'
  - name: O2LevelPct
    type: FLOAT
    description: 'REAL. Oxygen level percentage. Example: 82.'
