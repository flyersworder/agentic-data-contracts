- schema: main
  table: WeatherAndStructure
  columns:
  - name: WEATHER_ID
    type: BIGINT
    description: BIGSERIAL. Unique identifier for the weather and structure record. PK.
  - name: loc_link
    type: VARCHAR
    description: TEXT. Reference to the location. FK to Location.STATION_name.
  - name: opmaint_link
    type: BIGINT
    description: BIGINT. Reference to the operation and maintenance record. FK to OperationMaintenance.OP_MAINT_ID.
  - name: extTempC
    type: FLOAT
    description: 'REAL. External temperature in Celsius. Example: -14.9.


      externaltemperaturec: Illustrates the significance of external temperature readings in polar environments.


      External temperature in polar regions typically ranges from -70°C to 10°C. Temperatures below -40°C
      represent extreme cold requiring special equipment protection measures, -20°C to -40°C require standard
      cold weather protocols, while temperatures above -20°C are considered relatively mild for polar
      operations but still require normal cold weather precautions.


      Compiler note: Describes value ranges/zones for external temperature; matches WeatherAndStructure.extTempC
      column.'
  - name: windSpeed_ms
    type: FLOAT
    description: 'REAL. Wind speed in meters per second. Example: 26.5.


      windspeedms: Illustrates the impact of wind speed measurements on operations and safety.


      Wind speeds in polar environments typically range from 0 to 60 m/s. Speeds below 5 m/s represent
      calm conditions, 5-15 m/s indicate moderate winds with minor operational impact, 15-25 m/s represent
      strong winds requiring additional safety measures, and speeds above 25 m/s indicate dangerous conditions
      that may require suspension of outdoor activities and securing of equipment.


      Compiler note: Describes value ranges/interpretation of wind speed measurements, matching WeatherAndStructure.windSpeed_ms
      column.'
  - name: windDir_deg
    type: FLOAT
    description: 'REAL. Wind direction in degrees. **NULL means no wind direction data recorded.**. Example:
      71.4.'
  - name: baroPress_hpa
    type: FLOAT
    description: 'REAL. Barometric pressure in hectopascals. Example: 975.3.'
  - name: solarRad_wm2
    type: FLOAT
    description: 'REAL. Solar radiation in watts per square meter. Example: 541.0.'
  - name: snowDepth_cm
    type: BIGINT
    description: 'BIGINT. Snow depth in centimeters. Example: 143.6.'
  - name: iceThick_cm
    type: FLOAT
    description: 'REAL. Ice thickness in centimeters. Example: 254.4.'
  - name: visibility_km
    type: FLOAT
    description: 'REAL. Visibility in kilometers. Example: 42.8.'
  - name: precipType
    type: VARCHAR
    description: 'TEXT. Type of precipitation (e.g., rain, snow). **NULL means no precipitation type recorded.**.
      Possible values: Blowing Snow, Ice, Snow.'
  - name: precipRate_mmh
    type: FLOAT
    description: 'REAL. Precipitation rate in millimeters per hour. Example: 2.4.'
  - name: snowLoad_kgm2
    type: BIGINT
    description: 'BIGINT. Snow load in kilograms per square meter. Example: 459.7.'
  - name: structLoadPct
    type: FLOAT
    description: 'REAL. Structural load percentage. Example: 62.'
  - name: structIntegrityStat
    type: VARCHAR
    description: 'TEXT. Structural integrity status. **NULL means no structural integrity status recorded.**.
      Possible values: Critical, Normal, Warning.'
  - name: vibrLevel_mms2
    type: FLOAT
    description: 'REAL. Vibration level in millimeters squared. Example: 8.61.'
  - name: noiseLevel_dB
    type: FLOAT
    description: 'REAL. Noise level in decibels. Example: 38.5.'
