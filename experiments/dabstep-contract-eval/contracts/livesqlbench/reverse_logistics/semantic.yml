  columns:
  - name: txnnum
    type: VARCHAR
    description: VARCHAR(50). Unique identifier for the order transaction. PK.
  - name: buyerlink
    type: VARCHAR
    description: 'TEXT. Link to the buyer''s account or details. Example: CUS00181.'
  - name: transaction_value
    type: FLOAT
    description: REAL. Total value of the order transaction.
  - name: txndate
    type: VARCHAR
    description: 'TEXT. Date when the transaction was made. Example: Feb 16, 2025.'
- schema: main
  table: products
  columns:
  - name: itemcode
    type: VARCHAR
    description: VARCHAR(50). Unique identifier for the product. PK.
  - name: itemcategory
    type: VARCHAR
    description: VARCHAR(50). Category of the product (e.g., apparel, electronics, Home Goods, Accessories).
  - name: subcat
    type: VARCHAR
    description: 'VARCHAR(50). Subcategory of the product. Possible values: Laptops, Shirts, Shoes, Smartphones.'
  - name: unit_value
    type: FLOAT
    description: REAL. Unit value/price of the product.
  - name: product_traceability
    type: JSON
    description: 'JSONB column. Encapsulates product traceability and compliance metadata including batch,
      lot, and serial tracking. Fields: {"trace": {"batch_reference": "TEXT. Batch reference for the product.
      example: BT1693, 6730", "lot_reference": "VARCHAR(50). Lot reference for the product. Example: 4119LO.",
      "serial_number": "TEXT. Serial number reference for the product. Example: SN258151.", "manufacture_date":
      "TEXT. Manufacture date of the product."}, "compliance": {"regulatory_compliance": "VARCHAR(50).
      Regulatory compliance status of the product. **NULL means no regulatory compliance status available.**.
      Possible values: Compliant, Non-compliant.", "hazardous_material": "VARCHAR(50). Hazardous material
      information for the product.", "recall_flag": "YesNo_enum. Indicates if the product has been recalled.
      Possible values: No, Yes."}}


      Regulatory Compliance Statuses: Declares adherence of product to applicable regulations.


      ''Compliant'' means meeting all relevant safety/environmental standards; ''Non-compliant'' means
