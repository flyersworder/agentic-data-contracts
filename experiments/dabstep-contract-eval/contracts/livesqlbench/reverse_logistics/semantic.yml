      arranges a courier service for doorstep pickup; ''Mail'' when item is posted through the national
      mail system; ''Locker'' when customer deposits parcel in an automated locker or drop-box; ''Pickup''
      when retailer schedules a home or office collection for oversized or fragile goods.


      Compiler note: Describes the enumerated values of returns.return_channel (Store, Courier, Mail,
      Locker, Pickup).'
