      level for the return. **NULL means no fraud risk level assessed.**", "fraud_flags": "BIGINT. Fraud
      flags indicating potential issues with the return. Possible values: 0, 1, 2, 3, 4, 5."}}


      Fraud Risk Levels: Qualitative grading of suspected fraud severity in a return.


      There are 3 different levels: ''Low'', ''Medium'' and ''High''.


