      Mechanical Wear Score Tiers: Categorizes the Mechanical Wear Score into severity levels.


      A Mechanical Wear Score is ''Low'' if < 0.5, ''Medium'' if 0.5 - 0.8, and ''High'' if > 0.8.


      Compiler note: Mechanical Wear Score is a derived composite metric (not stored in any table/column),
