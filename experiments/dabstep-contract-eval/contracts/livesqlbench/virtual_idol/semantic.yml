      notes recorded or information not available.**
- schema: main
  table: commerceandcollection
  columns:
  - name: commerce_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for commerce and collection record. PK =
      CommerceAndCollection(Commerce_Reg).
  - name: commerce_engage_pivot
    type: BIGINT
    description: BIGINT. Reference to engagement record for commerce behavior analysis. FK to Engagement.
  - name: commerce_member_pivot
