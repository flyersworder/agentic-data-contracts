      Trade Activity Level: Classifies a fan''s engagement in the trading of collectibles.


      Classifies a fan''s engagement in the trading of digital or physical collectibles. ''High'', ''Medium'',
      and ''Low'' levels reflect the frequency and volume of trades.


      Compiler note: Describes the categorical values (''High'',''Medium'',''Low'') stored in commerceandcollection.trade_level,
      which classifies a fan''s trading activity for collectibles.'
- schema: main
  table: engagement
  columns:
  - name: engage_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for engagement metrics record. PK = Engagement(Engage_Reg).
  - name: engage_activity_pivot
    type: VARCHAR
    description: TEXT. Reference to the interaction activity for engagement analysis. FK to Interactions.
  - name: engage_member_pivot
    type: BIGINT
    description: BIGINT. Reference to membership record for engagement correlation. FK to MembershipAndSpending.
  - name: soc_int_score
    type: FLOAT
    description: REAL. Social interaction score measuring fan's community participation level.
  - name: eng_rate
    type: FLOAT
    description: REAL. Overall engagement rate calculated from various interaction metrics.
  - name: act_freq
    type: VARCHAR
    description: TEXT. Frequency classification of fan's activity on the platform.
  - name: peak_time
    type: VARCHAR
    description: TEXT. Time period when fan shows highest activity levels.
  - name: act_days_wk
    type: SMALLINT
    description: SMALLINT. Number of days per week fan is active on platform.
  - name: avg_sess_count
    type: SMALLINT
    description: SMALLINT. Average number of sessions per active day.
  - name: cont_pref
    type: VARCHAR
    description: TEXT. Fan's preferred content type or category.
  - name: lang_pref
    type: VARCHAR
    description: 'TEXT. Fan''s preferred language for content consumption.


      Language Preference Setting: Describes the language settings a fan can choose for content consumption.


      Defines the fan''s preference for content language. ''Original'' means content is shown in the idol''s
      primary language. ''Translated'' means the fan prefers translated versions. ''Both'' indicates a
      willingness to consume content in either form.


      Compiler note: Checked distinct values: engagement.lang_pref has exactly {''Original'',''Translated'',''Both''},
      matching the entry''s description. preferencesandsettings.lang_set has {''Auto'',''Original'',''Translated''}
      which doesn''t match ''Both''.'
  - name: trans_use
    type: VARCHAR
    description: TEXT. Usage pattern of translation features by the fan.
  - name: interaction_efficiency
    type: VARCHAR
    description: 'TEXT. Social interaction frequency and community participation rate. Example: 26.200000762939453
      interactions/hr.'
  - name: session_productivity
    type: VARCHAR
    description: 'TEXT. Platform usage frequency and session completion rate. Example: 21 sessions/week,
      14 sessions/week, 35 sessions/week.'
- schema: main
  table: eventsandclub
  columns:
  - name: events_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for events and fan club record. PK = EventsAndClub(Events_Reg).
  - name: events_social_pivot
    type: BIGINT
    description: BIGINT. Reference to social community record for event participation analysis. FK to
      SocialCommunity.
  - name: events_member_pivot
    type: BIGINT
    description: BIGINT. Reference to membership record for event access correlation. FK to MembershipAndSpending.
  - name: evt_part
    type: VARCHAR
    description: 'TEXT. Level and type of event participation by the fan. **NULL means event participation
      tracking incomplete or no events attended.** **DATA NOISE: Values have random case variations (lowercase,
      uppercase, mixed case) virtual_idol.**'
  - name: camp_part
    type: VARCHAR
    description: TEXT. Participation level in campaigns and promotional activities. **NULL means campaign
      participation tracking incomplete or no campaigns joined.**
  - name: club_stat
    type: VARCHAR
    description: TEXT. Current status within official fan club membership.
  - name: club_j_date
    type: VARCHAR
    description: TEXT. Date when fan joined the official fan club.
  - name: club_contrib
    type: VARCHAR
    description: 'TEXT. Type and level of contribution to fan club activities. **NULL means fan club contribution
      assessment incomplete or minimal participation.** **DATA NOISE: Values have random case variations
      (lowercase, uppercase, mixed case) virtual_idol.**'
  - name: evt_participation
    type: JSON
    description: 'JSONB column. Event participation data including attendance counts for different event
      types and voting behavior Fields: {"Off_Evt_Att": "SMALLINT. Number of offline events attended by
      the fan.", "On_Evt_Att": "SMALLINT. Number of online events attended by the fan.", "Meet_Att": "SMALLINT.
      Number of meet-and-greet events attended.", "Conc_Att": "SMALLINT. Number of concert or performance
      events attended.", "Vote_Part_Rate": "REAL. Participation rate in voting activities as percentage."}'
- schema: main
  table: fans
  columns:
  - name: user_registry
    type: VARCHAR
    description: TEXT. Unique identifier for fan user account registration in the virtual_idol idol platform.
      PK = Fans(User_Registry).
  - name: nick_label
    type: VARCHAR
    description: TEXT. Display nickname or username chosen by the fan for public identification.
  - name: reg_moment
    type: VARCHAR
    description: TEXT. Date and time when the fan account was first registered on the platform.
  - name: tier_step
    type: SMALLINT
    description: SMALLINT. Fan loyalty tier level indicating status progression within the platform hierarchy.
  - name: pts_val
    type: BIGINT
    description: BIGINT. Accumulated loyalty points earned through various platform activities and interactions.
  - name: status_tag
    type: VARCHAR
    description: 'TEXT. Current account status classification for the fan user.


      Fan Status Tiers: Illustrates the meaning of different fan account statuses on the platform.


      Fan status indicates their platform standing. ''Active'' means regular recent activity. ''Inactive''
      means no recent activity. ''VIP'' is a special high-value status granted based on contribution and
      spending.


      Compiler note: Describes meaning of values in fans.status_tag (Active/Inactive/VIP), confirmed via
      sample rows.'
  - name: lang_pref
    type: VARCHAR
    description: 'TEXT. Fan''s preferred language for platform interface and content. **NULL means language
      preference not specified or using platform default.** **DATA NOISE: Values have random case variations
      (lowercase, uppercase, mixed case) virtual_idol.**'
  - name: demo_profile
    type: JSON
    description: 'JSONB column. Demographic profile information including age, gender, location, and personal
      background Fields: {"Age_Count": "SMALLINT. Fan''s age in years for demographic analysis and content
      targeting.", "Gender_Type": "TEXT. Fan''s gender classification for demographic segmentation.",
      "Loc_Nation": "TEXT. Fan''s country of residence for geographic analysis.", "Loc_Town": "TEXT. Fan''s
      city or local area for detailed geographic segmentation.", "Occu_Path": "TEXT. Fan''s occupation
      or professional background. **NULL means occupation information not provided or privacy setting
      enabled.** **DATA NOISE: Values have random case variations (lowercase, uppercase, mixed case) virtual_idol.**",
      "Interest_Set": "TEXT. Fan''s declared interests and hobbies for content personalization. **NULL
      means interest profile incomplete or not disclosed.** **DATA NOISE: Values have random case variations
      (lowercase, uppercase, mixed case) virtual_idol.**"}


      Fan Age Category: Categorizes fans into distinct age groups for demographic analysis.


      Fan age is categorized as: Teen (<=18), Young Adult (19-29), Adult (30-49), Senior (>=50).


      Compiler note: Age Category is derived from the Age_Count field inside fans.demo_profile JSONB (confirmed
      numeric age values present). This entry defines categorical labels (Teen/Young Adult/Adult/Senior)
      based on that field but is not itself a stored column.


      Occupation Path: Categorizes the professional background of fans.


      Represents the declared occupation category of a fan, such as ''Professional'', ''Student'', ''Creative'',
      or ''Technical''.


      Compiler note: Describes the Occu_Path key within the demo_profile JSONB column of fans (values
      like Professional/Student/Creative/Other, with case-variation noise confirmed via query). No separate
      column exists for this; it is a JSON field, so the entry maps to fans.demo_profile as a whole.'
- schema: main
  table: interactions
  columns:
  - name: activity_reg
    type: VARCHAR
    description: TEXT. Unique identifier for individual fan-idol interaction activity session. PK = Interactions(Activity_Reg).
  - name: time_mark
    type: TIMESTAMP
    description: TIMESTAMP. Precise timestamp when the interaction activity occurred.
  - name: interact_fan_pivot
    type: VARCHAR
    description: TEXT. Reference to the fan user participating in this interaction. FK to Fans.
  - name: interact_idol_pivot
    type: VARCHAR
    description: TEXT. Reference to the virtual_idol idol involved in this interaction. FK to virtualidols.
  - name: act_kind
    type: VARCHAR
    description: 'TEXT. Type of interaction activity performed. **NULL means interaction type classification
      failed or is ambiguous.** **DATA NOISE: Values have random case variations (lowercase, uppercase,
      mixed case) virtual_idol.**'
  - name: act_plat
    type: VARCHAR
    description: 'TEXT. Platform where the interaction took place. **NULL means platform identification
      failed or cross-platform activity.** **DATA NOISE: Values have random case variations (lowercase,
      uppercase, mixed case) virtual_idol.**'
  - name: plat_used
    type: VARCHAR
    description: 'TEXT. Specific platform or service used for the interaction. **NULL means platform usage
      tracking incomplete or privacy mode enabled.** **DATA NOISE: Values have random case variations
      (lowercase, uppercase, mixed case) virtual_idol.**'
  - name: dev_type
    type: VARCHAR
    description: 'TEXT. Device type used by fan for the interaction. **NULL means device detection failed
      or privacy settings block tracking.** **DATA NOISE: Values have random case variations (lowercase,
      uppercase, mixed case) virtual_idol.**'
  - name: app_ver
    type: VARCHAR
    description: TEXT. Application version used during the interaction session.
  - name: sess_dur_min
    type: SMALLINT
    description: SMALLINT. Duration of the interaction session in minutes.
  - name: live_att
    type: SMALLINT
    description: SMALLINT. Number of live stream sessions attended during this interaction.
  - name: watch_hrs
    type: FLOAT
    description: REAL. Total hours of content watched during the interaction session.
  - name: gift_metrics
    type: JSON
    description: 'JSONB column. Comprehensive gift-giving behavior metrics including frequency, quantities,
      values, and preferences Fields: {"Gift_Freq": "TEXT. Frequency classification of gift-giving behavior
      during interaction.", "Gift_Tot": "BIGINT. Total number of virtual_idol gifts sent during this interaction.",
      "Gift_Val_Usd": "REAL. Total monetary value in USD of gifts sent during interaction.", "Fav_Gift_Tag":
      "TEXT. Most frequently used or preferred gift type during interaction."}


      Gift Frequency: Clarifies the categories used to classify a fan''s gift-giving behavior.


      Classifies how often a fan gives virtual gifts during interactions. Categories include ''Often'',
      ''Frequently'', ''Occasionally'', and ''Rarely''.


      Compiler note: Describes the categorical values of the Gift_Freq subfield within the gift_metrics
      JSONB column (observed values: Often, Rarely, Never, Frequent - close to but not exact match of
      documented set).'
  - name: chat_activity
    type: JSON
    description: 'JSONB column. Chat and messaging activity data including message counts, language, sentiment,
      and emoji usage Fields: {"Chat_Msg": "BIGINT. Number of chat messages sent by the fan during this
      interaction.", "Chat_Lang": "TEXT. Primary language used in chat messages during the interaction.",
      "Msg_Tone": "TEXT. Sentiment or tone analysis result of messages sent during interaction.", "Emoji_Count":
      "BIGINT. Total number of emojis used in messages during the interaction.", "Stk_Count": "BIGINT.
      Total number of stickers used during the interaction session."}


      Interaction Tone: Explains the sentiment classification of a fan''s chat messages.


      Indicates the overall sentiment of a fan''s chat messages. Common values are ''Positive'', ''Negative'',
      ''Neutral'', or ''Mixed''.


      Compiler note: Describes the Msg_Tone field within the chat_activity JSONB column; confirmed values
      Negative/Neutral/Positive present (Mixed also documented as possible).'
  - name: engagement_rate
    type: VARCHAR
    description: 'TEXT. Fan engagement efficiency per time unit during interaction sessions. Example:
      15 actions/hr.'
  - name: gift_rate
    type: VARCHAR
    description: 'TEXT. Virtual gift-giving frequency and speed during interaction sessions. Example:
      6 gifts/hr.'
  - name: message_rate
    type: VARCHAR
    description: 'TEXT. Chat message sending frequency during interaction sessions. Example: 45 msgs/hr.'
  - name: content_consumption_rate
    type: VARCHAR
    description: 'TEXT. Content viewing and consumption efficiency per session. Example: 489.68182650479406
      mins/session.'
- schema: main
  table: loyaltyandachievements
  columns:
  - name: loyalty_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for loyalty and achievements record. PK =
      LoyaltyAndAchievements(Loyalty_Reg).
  - name: loyalty_events_pivot
    type: BIGINT
    description: BIGINT. Reference to events record for loyalty program correlation. FK to EventsAndClub.
  - name: loyalty_engage_pivot
    type: BIGINT
    description: BIGINT. Reference to engagement record for loyalty calculation. FK to Engagement.
  - name: loy_pts
    type: BIGINT
    description: BIGINT. Total loyalty points accumulated through platform activities.
  - name: rew_tier
    type: VARCHAR
    description: 'TEXT. Current reward tier level in the loyalty program.


      Loyalty Reward Tiers: Explains the progression of tiers within the fan loyalty program.


      Represents the levels in the loyalty program, such as ''Bronze'', ''Silver'', ''Gold'', and ''Platinum'',
      each unlocking different rewards.


      Compiler note: Describes the categorical values stored in loyaltyandachievements.rew_tier (e.g.,
      ''Bronze'', ''Gold'', ''Platinum'' seen in sample data).'
  - name: repute_lv
    type: VARCHAR
    description: 'TEXT. Reputation level classification within the community.


      Reputation Level: Describes the hierarchy of fan reputation and trustworthiness within the community.


      Represents a fan''s standing and trustworthiness in the community. Common levels are ''Respected'',
      ''Established'', and ''Elite''.


      Compiler note: Matches column loyaltyandachievements.repute_lv, which stores values like ''Respected'',
      ''Established'', ''Elite'' observed in sample data.'
  - name: trust_val
    type: FLOAT
    description: REAL. Trust score calculated from community interactions and behavior.
  - name: achiev_stats
    type: JSON
    description: 'JSONB column. Achievement and recognition statistics including counts of achievements,
      badges, titles, and rankings Fields: {"Ach_Count": "BIGINT. Total number of achievements unlocked
      by the fan.", "Badge_Coll": "BIGINT. Number of badges collected through various activities.", "Spec_Titles":
      "BIGINT. Number of special titles earned by the fan.", "Rank_Pos": "BIGINT. Current ranking position
      among all platform users.", "Infl_Score": "REAL. Influence score measuring fan''s impact on community
      and platform."}'
- schema: main
  table: membershipandspending
  columns:
  - name: member_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for membership and spending record. PK =
      MembershipAndSpending(Member_Reg).
  - name: member_fan_pivot
    type: VARCHAR
    description: TEXT. Reference to the fan user for this membership record. FK to Fans.
  - name: memb_kind
    type: VARCHAR
    description: 'TEXT. Type or tier of membership subscription held by the fan.


      Premium Member: Identifies fans who have a paid membership subscription.


      A fan is considered a Premium Member if their membership type is not ''Free''. This includes tiers
      like ''Basic'', ''Elite'', etc.


      Compiler note: Entry describes the meaning of values in membershipandspending.memb_kind (Free vs
      paid tiers like Basic, Premium, Diamond), not a computable predicate/calculation.'
  - name: memb_days
    type: SMALLINT
    description: SMALLINT. Duration of current membership in days since activation.
  - name: spend_usd
    type: FLOAT
    description: REAL. Total amount spent by fan on platform in USD.
  - name: spend_freq
    type: VARCHAR
    description: 'TEXT. Frequency pattern of spending behavior by the fan.


      Spending Frequency: Illustrates the different patterns of fan spending behavior.


      Describes a fan''s purchasing behavior pattern. ''Weekly'' or ''Daily'' indicates consistent spending.
      ''Occasional'' indicates sporadic purchasing.


      Compiler note: Describes categorical values in membershipandspending.spend_freq (e.g., ''Weekly'',
      ''Daily'', ''Occasional'') representing fan purchasing behavior patterns; confirmed via sample rows
      showing these exact values.'
  - name: pay_method
    type: VARCHAR
    description: TEXT. Preferred payment method used for transactions.
  - name: spend_rate
    type: VARCHAR
    description: 'TEXT. Daily spending velocity and financial engagement rate. Example: 32.296185365657216
      USD/day.'
  - name: value_per_day
    type: VARCHAR
    description: 'TEXT. Monthly spending projection based on current patterns. Example: 208.84866536458333
      USD/month.'
  - name: cost_efficiency
    type: VARCHAR
    description: 'TEXT. Value-to-cost ratio for membership and spending efficiency. Example: 85 value/USD.'
- schema: main
  table: moderationandcompliance
  columns:
  - name: mod_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for moderation and compliance record. PK
      = ModerationAndCompliance(Mod_Reg).
  - name: moderation_interact_pivot
    type: VARCHAR
    description: TEXT. Reference to interaction record for moderation context. FK to Interactions.
  - name: moderation_social_pivot
    type: BIGINT
    description: BIGINT. Reference to social community record for moderation analysis. FK to SocialCommunity.
  - name: rpt_count
    type: SMALLINT
    description: SMALLINT. Number of reports filed against this fan's content or behavior.
  - name: warn_count
    type: SMALLINT
    description: SMALLINT. Number of warnings issued to this fan for policy violations.
  - name: viol_hist
    type: VARCHAR
    description: TEXT. History of policy violations committed by the fan. **NULL means no violation history
      recorded or clean conduct record.**
  - name: mod_stat
    type: VARCHAR
    description: 'TEXT. Current moderation status and any active restrictions on the account.


      Moderation Status: Defines the account standings related to compliance with platform rules.


      Reflects a fan''s account standing. ''Good Standing'' means no issues. ''Warning'' indicates a minor
      violation. ''Restricted'' indicates temporary limitations due to a serious violation.


      Compiler note: Column values confirmed to be exactly ''Good Standing'', ''Warning'', ''Restricted''
      as described.'
  - name: cont_comp
    type: VARCHAR
    description: TEXT. Content compliance rating and adherence to platform guidelines.
  - name: age_verif
    type: VARCHAR
    description: TEXT. Age verification status for access to age-restricted content.
  - name: pay_verif
    type: VARCHAR
    description: TEXT. Payment method verification status. **NULL means payment verification not completed
      or not required for current membership tier.**
  - name: id_verif
    type: VARCHAR
    description: TEXT. Identity verification status for enhanced security features. **NULL means identity
      verification not completed or not required for current account type.**
- schema: main
  table: preferencesandsettings
  columns:
  - name: pref_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for preferences and settings record. PK =
      PreferencesAndSettings(Pref_Reg).
  - name: preferences_member_pivot
    type: BIGINT
    description: BIGINT. Reference to membership record for preference correlation. FK to MembershipAndSpending.
  - name: preferences_social_pivot
    type: BIGINT
    description: BIGINT. Reference to social community record for social preference analysis. FK to SocialCommunity.
  - name: priv_set
    type: VARCHAR
    description: 'TEXT. Privacy settings configuration chosen by the fan.


      Privacy Setting Levels: Explains the different profile privacy options available to fans.


      Indicates the level of information a fan chooses to share. ''Public'' allows anyone to see their
      profile. ''Private'' restricts profile visibility to approved connections.


      Compiler note: Describes meaning of priv_set values (''Public'', ''Private'', also ''Friends Only''
      present in data).'
  - name: ds_consent
    type: VARCHAR
    description: TEXT. Data sharing consent status for analytics and personalization.
  - name: notif_pref
    type: VARCHAR
    description: TEXT. Notification preferences for various platform activities. **NULL means notification
      preferences not configured or using platform defaults.**
  - name: comm_pref
    type: VARCHAR
    description: TEXT. Communication preferences for interactions with other users. **NULL means communication
      preferences not specified or using standard settings.**
  - name: mark_pref
    type: VARCHAR
    description: TEXT. Marketing communication preferences and opt-in status.
  - name: lang_set
    type: VARCHAR
    description: TEXT. Language settings for platform interface and content.
  - name: access_set
    type: VARCHAR
    description: TEXT. Accessibility settings and accommodations enabled.
  - name: dev_count
    type: SMALLINT
    description: SMALLINT. Number of devices registered for account access.
  - name: log_freq
    type: VARCHAR
    description: TEXT. Login frequency pattern and regularity classification.
  - name: last_log_dt
    type: VARCHAR
    description: TEXT. Date and time of most recent login to the platform.
  - name: conn_qual
    type: VARCHAR
    description: TEXT. Connection quality classification based on technical performance.
  - name: usage_metrics
    type: JSON
    description: 'JSONB column. Platform usage metrics including session data, time spent, and activity
      consistency measurements Fields: {"Sess_Count": "BIGINT. Total number of login sessions since account
      creation.", "Time_Hrs": "BIGINT. Total time spent online on the platform in hours.", "Avg_Daily_Min":
      "SMALLINT. Average daily time spent on platform in minutes.", "Peak_Sess": "SMALLINT. Maximum concurrent
      sessions recorded for this user.", "Int_Consist": "REAL. Interaction consistency score measuring
      regular engagement patterns.", "Plat_Stable": "REAL. Platform stability score based on session reliability
      and connection quality."}'
- schema: main
  table: retentionandinfluence
  columns:
  - name: ret_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for retention and influence record. PK =
      RetentionAndInfluence(Ret_Reg).
  - name: retain_engage_pivot
    type: BIGINT
    description: BIGINT. Reference to engagement record for retention analysis. FK to Engagement.
  - name: retain_loyalty_pivot
    type: BIGINT
    description: BIGINT. Reference to loyalty record for retention correlation. FK to LoyaltyAndAchievements.
  - name: churn_flag
    type: VARCHAR
    description: 'TEXT. Churn risk classification and prediction status.


      Churn Risk Flag: Defines the predictive flags for a fan''s likelihood of leaving the platform.


      A predictive classification of a fan''s likelihood to stop using the platform. ''High'' indicates
      a strong probability of churning soon. ''Medium'' indicates a moderate risk. ''Low'' indicates a
      loyal and stable user.


      Compiler note: Describes the values of retentionandinfluence.churn_flag (''High''/''Medium''/''Low''),
      confirmed present in sample data.'
  - name: ref_count
    type: SMALLINT
    description: SMALLINT. Number of referrals made by this fan to bring new users.
  - name: infl_impact
    type: JSON
    description: 'JSONB column. User influence and viral impact metrics including content reach, viral
      content, and trending participation Fields: {"Cont_Reach": "BIGINT. Reach and visibility metrics
      for fan-created content.", "Viral_Cont": "SMALLINT. Number of viral content pieces created or shared.",
      "Trend_Part": "SMALLINT. Number of trending topics or events participated in.", "React_Count": "SMALLINT.
      Number of reactivation attempts or successful returns.", "Hash_Use": "SMALLINT. Number of hashtags
      used for content discovery and engagement."}'
- schema: main
  table: socialcommunity
  columns:
  - name: social_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for social community record. PK = SocialCommunity(Social_Reg).
  - name: social_engage_pivot
    type: BIGINT
    description: BIGINT. Reference to engagement record for social behavior analysis. FK to Engagement.
  - name: social_commerce_pivot
    type: BIGINT
    description: BIGINT. Reference to commerce record for social influence on purchasing. FK to CommerceAndCollection.
  - name: comm_contrib
    type: VARCHAR
    description: 'TEXT. Type and level of contribution to community activities. **NULL means contribution
      assessment incomplete or minimal community participation.** **DATA NOISE: Values have random case
      variations (lowercase, uppercase, mixed case) virtual_idol.**


      Community Contribution Level: Defines the different levels of a fan''s positive impact on the community.


      Measures a fan''s positive impact on the community. Levels include ''High'', ''Medium'', and ''Low'',
      often associated with group roles and content creation.


      Compiler note: Column stores exactly ''High''/''Medium''/''Low'' values (with case noise, e.g. ''HIgH'',
      ''low'', empty string) matching the described contribution levels.'
  - name: cont_create_stat
    type: VARCHAR
    description: 'TEXT. Status of content creation activities by the fan. **NULL means content creation
      tracking incomplete or user has not created content.** **DATA NOISE: Values have random case variations
      (lowercase, uppercase, mixed case) virtual_idol.**'
  - name: network_stats
    type: JSON
    description: 'JSONB column. Social network statistics including connections, followers, and community
      involvement Fields: {"Soc_Net_Sz": "BIGINT. Size of fan''s social network within the platform.",
      "Foll_Count": "BIGINT. Number of other users following this fan.", "Fing_Count": "BIGINT. Number
      of users this fan is following.", "Friend_Con": "BIGINT. Number of mutual friend connections within
      the platform.", "Grp_Memb": "SMALLINT. Number of groups or communities the fan belongs to.", "Grp_Role":
      "TEXT. Role or position held within community groups. **NULL means no specific group role assigned
      or participating as regular member.**"}


      Community Role Hierarchy: Defines the various roles a fan can hold within a community group.


      Defines a fan''s position within a community group. ''Member'' is a standard participant. ''Moderator''
      helps enforce rules. ''Leader'' manages the group.


      Compiler note: Describes the Grp_Role field inside the network_stats JSONB column, which takes values
      ''Member'', ''Moderator'', ''Leader'' (and empty string), matching the described role hierarchy.'
  - name: content_creation
    type: JSON
    description: 'JSONB column. User-generated content creation metrics including submissions, performances,
      and quality ratings Fields: {"Art_Subs": "BIGINT. Number of fan art submissions made by the fan.",
      "Fic_Subs": "BIGINT. Number of fan fiction submissions made by the fan.", "Cover_Perf_Cnt": "BIGINT.
      Number of cover performances or tribute content created.", "UGC_Val": "BIGINT. Total user-generated
      content value or count created by fan.", "Cont_Qual_Rate": "REAL. Quality rating of content created
      by the fan.", "Collab_Count": "SMALLINT. Number of collaborative projects participated in by the
      fan."}'
  - name: content_creation_rate
    type: VARCHAR
    description: 'TEXT. User-generated content production frequency and creativity output. Example: 3
      posts/week, 7 posts/week, 1 posts/week.'
  - name: community_growth_rate
    type: VARCHAR
    description: 'TEXT. Social network expansion and follower acquisition rate. Example: 25 followers/month,
      45 followers/month, 12 followers/month.'
  - name: influence_rate
    type: VARCHAR
    description: 'TEXT. Social influence expansion and network connection growth speed. Example: 15 connections/week,
      28 connections/week, 8 connections/week.'
- schema: main
  table: supportandfeedback
  columns:
  - name: support_reg
    type: BIGINT
    description: BIGSERIAL. Auto-generated unique identifier for support and feedback record. PK = SupportAndFeedback(Support_Reg).
  - name: support_interact_pivot
    type: VARCHAR
    description: TEXT. Reference to interaction record for support context. FK to Interactions.
  - name: support_pref_pivot
    type: BIGINT
    description: BIGINT. Reference to preferences record for support correlation. FK to PreferencesAndSettings.
  - name: surv_part
    type: VARCHAR
    description: TEXT. Participation level in surveys and research studies.
  - name: beta_part
    type: VARCHAR
    description: TEXT. Participation status in beta testing programs.
  - name: feedback_data
    type: JSON
    description: 'JSONB column. Support and feedback engagement data including issue reports, submissions,
      and satisfaction ratings Fields: {"Tech_Issue_Rpt": "SMALLINT. Number of technical issues reported
      by the fan.", "Supp_Tix": "SMALLINT. Number of support tickets opened by the fan.", "Fb_Subs": "SMALLINT.
      Number of feedback submissions made by the fan.", "Feat_Req_Subs": "SMALLINT. Number of feature
      requests submitted by the fan.", "Bug_Subs": "SMALLINT. Number of bug reports submitted by the fan.",
      "Sat_Rate": "REAL. Overall satisfaction rating provided by the fan.", "NPS_Val": "SMALLINT. Net
      Promoter Score value indicating likelihood to recommend platform."}


      NPS Score Tiers: Classifies fans into categories based on their Net Promoter Score, indicating their
      likelihood to recommend the platform.


      Net Promoter Score (NPS) is categorized as: Promoters (score 9-10), Passives (score 7-8), and Detractors
      (score 0-6).


      Compiler note: NPS_Val field inside feedback_data jsonb holds the Net Promoter Score (0-10) that
      this entry categorizes into Promoters (9-10), Passives (7-8), Detractors (0-6).'
- schema: main
  table: virtualidols
  columns:
  - name: entity_reg
    type: VARCHAR
    description: TEXT. Unique identifier for virtual_idol idol entity registration. PK = virtualidols(Entity_Reg).
  - name: name_tag
    type: VARCHAR
    description: TEXT. Official name or stage name of the virtual_idol idol character.
  - name: kind_tag
    type: VARCHAR
    description: 'TEXT. Type or category classification of the virtual_idol idol (e.g., vtuber, AI idol).


      Idol Type Classification: Explains the different types of virtual idols on the platform.


      Describes the nature of the virtual idol. ''2D'' refers to traditionally animated characters. ''3D''
      refers to computer-generated models. ''AI Generated'' refers to idols created and/or operated by
      artificial intelligence.


      Compiler note: Describes value meanings (''2D'',''3D'',''AI Generated'') of virtualidols.kind_tag.'
  - name: deb_date
    type: VARCHAR
    description: TEXT. Official debut date when the virtual_idol idol first appeared publicly.
  - name: assoc_group
    type: VARCHAR
    description: TEXT. Associated agency, company, or group managing the virtual_idol idol.
  - name: genre_tag
    type: VARCHAR
    description: TEXT. Primary genre or content category the virtual_idol idol specializes in.
  - name: prim_lang
    type: VARCHAR
    description: TEXT. Primary language used by the virtual_idol idol for content and communication.
