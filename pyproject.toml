[project]
name = "agentic-data-contracts"
version = "0.32.0"
description = "YAML-first, domain-driven data governance for AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qing", email = "qingye779@gmail.com" }]
license = { text = "MIT" }
keywords = [
    "ai-agents",
    "data-contracts",
    "data-governance",
    "domain-driven",
    "sql-validation",
    "llm",
    "claude",
    "semantic-layer",
    "analytics",
    "dbt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = [
    "sqlglot>=23.0",
    "pydantic>=2.0",
    "pyyaml>=6.0.3",
    "thefuzz>=0.22.1",
]

[project.urls]
Homepage = "https://github.com/flyersworder/agentic-data-contracts"
Repository = "https://github.com/flyersworder/agentic-data-contracts"
Issues = "https://github.com/flyersworder/agentic-data-contracts/issues"
Documentation = "https://github.com/flyersworder/agentic-data-contracts/blob/main/docs/architecture.md"

[project.optional-dependencies]
agent-sdk = ["claude-agent-sdk>=0.1.58"]
agent-contracts = ["ai-agent-contracts>=0.3.1"]
langchain = ["langchain-core>=1.3.3", "langchain>=1.2.17", "langgraph>=1.1.10"]
pydantic-ai = ["pydantic-ai-slim[anthropic]>=2.0.0"]
bigquery = ["google-cloud-bigquery"]
snowflake = ["snowflake-connector-python"]
postgres = ["psycopg2-binary"]
duckdb = ["duckdb"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "duckdb",
    "langchain-core>=1.3.3",
    "langchain>=1.2.17",
    "langgraph>=1.1.10",
    "pydantic-ai-slim[anthropic]>=2.0.0",
]
all = [
    "agentic-data-contracts[agent-sdk,agent-contracts,langchain,pydantic-ai,bigquery,snowflake,postgres,duckdb]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_data_contracts"]

[tool.hatch.build.targets.sdist]
# Keep research code, agent/editor config, and process docs out of the published
# source distribution. `experiments/` is a standalone project with its own venv
# and (gitignored) downloaded benchmark data + result logs that must never ship.
exclude = [
    "experiments",
    ".claude",
    "docs/superpowers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Example fixtures have wide SQL INSERTs with aligned columns and long
# demo-query strings; readability outweighs E501 line-length here.
"examples/**" = ["E501"]

[tool.uv]
override-dependencies = [
    "python-dotenv>=1.2.2",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# `experiments/` is a standalone project with its own pyproject.toml, lockfile,
# and venv (openai, scipy). Resolving its imports against the root venv would
# fail, so it is checked from its own directory, not from here. Scoping ty out
# of it is what lets the root project keep `unresolved-import` at error level --
# a typo'd import in src/ must not pass.
exclude = ["experiments/"]

[tool.pyright]
# ty (above) is this project's authoritative type checker and gates CI. This
# block only tunes the pyright LSP so it stops emitting noise ty already vets
# away. Pyright resolves config per project root, so this lives in the repo
# rather than a global file -- and the suppression below is specific to a
# dependency this repo uses, so it must not leak to other projects.
#
# venvPath/venv point the LSP at the uv-managed virtualenv; without them it
# checks against a bare interpreter, cannot resolve sqlglot/pydantic/etc., and
# every downstream type collapses to Unknown (a cascade of false errors).
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
exclude = ["experiments", ".venv"]
# sqlglot re-exports its AST nodes through `exp` without listing them in
# `__all__`, so pyright flags the idiomatic `exp.Expression` (used all over
# validation/) as a private import. No import form avoids it, and ty does not
# flag it. Silence only this one rule -- attribute and type checks stay on.
reportPrivateImportUsage = "none"
