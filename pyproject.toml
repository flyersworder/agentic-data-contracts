[project]
name = "agentic-data-contracts"
version = "0.50.0"
description = "YAML-first, domain-driven data governance for AI agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qing", email = "qingye779@gmail.com" }]
license = { text = "MIT" }
keywords = [
    "ai-agents",
    "data-contracts",
    "data-governance",
    "domain-driven",
    "sql-validation",
    "llm",
    "claude",
    "semantic-layer",
    "analytics",
    "dbt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = [
    # 28.6 is the lowest release the suite passes on. 27.10 is the lowest that
    # *imports* (`exp.Revoke` landed there, `exp.Alter`/`Grant`/`Copy` earlier --
    # and _OPERATION_MAP is a class-body dict, so a missing node is an
    # AttributeError at `import agentic_data_contracts`, not a degraded feature).
    # But `WHERE x IS x` only parses from 28.0, and the tautology-bypass checks
    # depend on it, so 27.10 would declare support for a version failing our own
    # governance tests. 28.6 raises that again: `exp.Localtime`, `Localtimestamp`
    # and `Systimestamp` first exist there, and the relative-time scan in
    # validation/_timewindow.py names them in a module-level tuple -- so on 28.0
    # through 28.5 the package does not import at all.
    #
    # Deliberately not `getattr(exp, ..., None)` with filtering, in either
    # place: that would make what the library enforces depend on the installed
    # sqlglot, so a contract could enforce less in one environment than another
    # -- the exact declared-but-unenforced failure this checker prevents. It is
    # not hypothetical for the time scan. Below 28.6 a bare `LOCALTIMESTAMP`
    # parses as an `exp.Column`, and the name arm matches only function *calls*
    # (so a column named `now_flag` is never flagged) -- so a filtered tuple
    # would not degrade to a fallback, it would silently execute a row whose
    # certified answer is pinned to a decaying window.
    "sqlglot>=28.6",
    # 2.11 is the lowest release that both ships wheels for every interpreter
    # this package supports AND works with the other declared floors. The old
    # `>=2.0` was untrue twice over: pydantic 2.0 pins pydantic-core==2.0.1,
    # whose wheels stop at cp311 (a PyO3 source build on 3.12 and 3.13), and
    # anything below 2.11 fails against pydantic-ai-slim 2.0 with a
    # `GenerateSchema.__init__()` signature mismatch. It went unnoticed because
    # uv resolves the project universally, so transitive requirements float
    # pydantic above its own floor and test-lowest-floors never exercised it --
    # hence the explicit wheel-and-floor check in that job.
    "pydantic>=2.11",
    "pyyaml>=6.0.3",
    "thefuzz>=0.22.1",
]

[project.urls]
Homepage = "https://github.com/flyersworder/agentic-data-contracts"
Repository = "https://github.com/flyersworder/agentic-data-contracts"
Issues = "https://github.com/flyersworder/agentic-data-contracts/issues"
Documentation = "https://github.com/flyersworder/agentic-data-contracts/blob/main/docs/architecture.md"

[project.optional-dependencies]
# `mcp` is a DIRECT dependency, not just claude-agent-sdk's: sdk.py imports
# `mcp.types.ToolAnnotations` at runtime. Declaring it is the actual fix -- an
# undeclared import is how this extra inherited an upstream constraint bug it
# could have owned. The UPPER bound stays with claude-agent-sdk deliberately:
# the `Server.list_tools` call mcp 2.0 changed is the SDK's, not ours, so
# duplicating someone else's ceiling here would go stale. It since did: the SDK
# adapted and widened to `mcp<3.0.0,>=1.23.0` in 0.2.144, and this extra picked
# mcp 2.0 up with no edit. 0.2.96 is the first release to declare mcp at all
# (then `<2.0.0,>=1.23.0`); 0.1.x left it unbounded.
#
# Our own floor stays at 1.23.0 and unbounded above, so `mcp.types` must be used
# in the one form valid across the 1.x/2.0 attribute rename -- see
# `_annotations_for` in tools/sdk.py.
agent-sdk = ["claude-agent-sdk>=0.2.96", "mcp>=1.23.0"]
agent-contracts = ["ai-agent-contracts>=0.3.1"]
langchain = ["langchain-core>=1.3.3", "langchain>=1.2.17", "langgraph>=1.1.10"]
pydantic-ai = ["pydantic-ai-slim[anthropic]>=2.0.0"]
bigquery = ["google-cloud-bigquery>=3.7.0"]
snowflake = ["snowflake-connector-python>=3.14.1"]
postgres = ["psycopg2-binary>=2.9.10"]
duckdb = ["duckdb>=1.1.1"]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "agentic-data-contracts[duckdb]",
    "langchain-core>=1.3.3",
    "langchain>=1.2.17",
    "langgraph>=1.1.10",
    "pydantic-ai-slim[anthropic]>=2.0.0",
]
all = [
    "agentic-data-contracts[agent-sdk,agent-contracts,langchain,pydantic-ai,bigquery,snowflake,postgres,duckdb]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_data_contracts"]

[tool.hatch.build.targets.sdist]
# Keep research code, agent/editor config, and process docs out of the published
# source distribution. `experiments/` is a standalone project with its own venv
# and (gitignored) downloaded benchmark data + result logs that must never ship.
exclude = [
    "experiments",
    ".claude",
    "docs/superpowers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py312"
# Vendored third-party code is a VERBATIM copy at a pinned upstream revision,
# and its sha256 is asserted by tests/test_vendored_scorer.py. Letting the
# formatter touch it forks it from upstream and fails that test -- which is
# the point of the test. Never reformat; re-vendor instead.
extend-exclude = ["experiments/dabstep-contract-eval/vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Example fixtures have wide SQL INSERTs with aligned columns and long
# demo-query strings; readability outweighs E501 line-length here.
"examples/**" = ["E501"]

[tool.uv]
override-dependencies = [
    "python-dotenv>=1.2.2",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# `experiments/` is a standalone project with its own pyproject.toml, lockfile,
# and venv (openai, scipy). Resolving its imports against the root venv would
# fail, so it is checked from its own directory, not from here. Scoping ty out
# of it is what lets the root project keep `unresolved-import` at error level --
# a typo'd import in src/ must not pass.
exclude = ["experiments/"]

[tool.pyright]
# ty (above) is this project's authoritative type checker and gates CI. This
# block only tunes the pyright LSP so it stops emitting noise ty already vets
# away. Pyright resolves config per project root, so this lives in the repo
# rather than a global file -- and the suppression below is specific to a
# dependency this repo uses, so it must not leak to other projects.
#
# venvPath/venv point the LSP at the uv-managed virtualenv; without them it
# checks against a bare interpreter, cannot resolve sqlglot/pydantic/etc., and
# every downstream type collapses to Unknown (a cascade of false errors).
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
exclude = ["experiments", ".venv"]
# sqlglot re-exports its AST nodes through `exp` without listing them in
# `__all__`, so pyright flags the idiomatic `exp.Expression` (used all over
# validation/) as a private import. No import form avoids it, and ty does not
# flag it. Silence only this one rule -- attribute and type checks stay on.
reportPrivateImportUsage = "none"
